---
# Provision rogue-trader: a persistent Hetzner cx33 in the emmas-edit project,
# joined to the home VPN. Its cloud firewall lives in terraform/
# (firewall-rogue-trader.tf), not here. cloud-init installs the tooling only —
# the tunnel config is placed by hand afterwards (see below), because Hetzner
# serves user_data from the metadata endpoint for the life of the server, so a
# private key written there stays readable by every process and every container
# on the box forever, with no way to revoke it short of a rebuild. It is a split
# tunnel (AllowedIPs 192.168.0.0/16), so only home-network traffic uses the VPN
# and the public interface stays up. Provision-once: user_data applies only at
# first boot, so re-running is a no-op (ssh_key and server state=started are
# idempotent). Run from the repo root:
#   ansible-playbook bootstrap/rogue-trader.yml \
#     -e @inventory/group_vars/all/vault.yml --vault-password-file .vault_pass
#
# Then, over the Hetzner console, write rogue_trader_wireguard_conf to
# /etc/wireguard/wg0.conf (0600 root:root) and `systemctl enable --now
# wg-quick@wg0`. The closing wait_for below is the confirmation that landed.
- name: Provision rogue-trader
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    rogue_trader_name: rogue-trader
    rogue_trader_server_type: cx33
    rogue_trader_location: hel1
    rogue_trader_image: opensuse-16
    rogue_trader_vpn_address: 192.168.3.3
    # openresolv backs wg-quick's DNS= line; python3 lets Ansible drive the box
    # over the VPN afterwards. No write_files and no runcmd: nothing secret may
    # enter user_data, and wg-quick is left disabled so it cannot fail at boot
    # against a config that is not there yet.
    rogue_trader_cloud_config:
      packages:
        - python3
        - wireguard-tools
        - openresolv
  # hcloud_token_emmas_edit comes from the vault, supplied at run time:
  # -e @inventory/group_vars/all/vault.yml. Kept out of vars_files so
  # ansible-lint (no vault password in CI) need not decrypt it.
  tasks:
    - name: Upload the SSH key to Hetzner
      hetzner.hcloud.ssh_key:
        api_token: "{{ hcloud_token_emmas_edit }}"
        name: "{{ rogue_trader_name }}-key"
        public_key: "{{ lookup('file', '~/.ssh/id_ed25519.pub') }}"
        state: present

    # no_log keeps the origin IP out of the run log — the whole point of the
    # proxied Cloudflare records; api_token is already redacted by the module
    # spec. firewalls is omitted (unmanaged here) so terraform's apply_to owns
    # the attachment: run
    # `tofu apply` right after a from-zero rebuild, which is otherwise
    # firewall-less (all inbound open) until it does.
    - name: Create the server
      hetzner.hcloud.server:
        api_token: "{{ hcloud_token_emmas_edit }}"
        name: "{{ rogue_trader_name }}"
        server_type: "{{ rogue_trader_server_type }}"
        image: "{{ rogue_trader_image }}"
        location: "{{ rogue_trader_location }}"
        ssh_keys:
          - "{{ rogue_trader_name }}-key"
        user_data: "#cloud-config\n{{ rogue_trader_cloud_config | to_nice_yaml }}"
        state: started
      no_log: true

    # Post-provision smoke test: a connect over the VPN confirms the tunnel
    # config was placed and the router already has its peer. It depends on both
    # the hand-placed wg0.conf and router-side state this play does not own, so
    # it times out until those are done even though provisioning succeeded.
    - name: Wait for rogue-trader to come up on the VPN
      ansible.builtin.wait_for:
        host: "{{ rogue_trader_vpn_address }}"
        port: 22
        delay: 15
        timeout: 420
