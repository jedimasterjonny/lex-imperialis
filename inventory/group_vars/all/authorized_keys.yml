---
# Fleet SSH access — see roles/common/README.md for what the lists mean and why
# they split this way. Public keys, so plaintext and not the vault.
#
# Authoritative: a key absent from a list below is removed from that account on
# the next converge. Both were additive until every declared key was proven live
# on every host — the ansible account's by a full reconcile running under them,
# the owner's by a session opened with them.
#
# Not the only place fleet keys are written. Three bootstrap seeds inline copies
# of these lists: bootstrap/host.sh both ansible keys, auspex-user-data.yaml both
# lists whole, and rogue-trader.bu the control host's and arbites'. None reaches
# past what is declared here, so a converge narrows nothing — the cost runs the
# other way: a rotation that misses a copy leaves the next rebuilt or reflashed
# host holding a key the control host no longer offers.
common_authorized_keys_exclusive: true
common_ansible_authorized_keys_exclusive: true
common_authorized_keys:
  # Personal MacBook. Also Hetzner's jonny-mbp, injected into new cloud servers.
  - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBisd2MYLbDmcgdaIUEpGK90EV29GRj4MJmLCkSoPSEH jonny@Jonnys-MacBook-Pro.local
  # Corporate MacBook. Employer-controlled hardware, so deliberately owner-only:
  # it reaches a host as jonny and sudo asks for a password.
  - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJOC/Z1aIrzRbU38qVF86ppQUEETHfd/w0ddjTnGjHUD jonnyoc@corp-mb
  # The control host itself.
  - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDHpcn9yrjN0+bAFrmfGo7X4qMdklxvJ3bqdSiyJf5ju jonny@scholam

common_ansible_authorized_keys:
  # The control host: what an operator-run play connects with.
  - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDHpcn9yrjN0+bAFrmfGo7X4qMdklxvJ3bqdSiyJf5ju jonny@scholam
  # arbites, held root-only at /etc/arbites/ssh/id_arbites. Authorised here
  # before the reconciler is pointed at it, or it would lock itself out of the
  # first host it reached; until that switch it opens the account and goes
  # unused, and roles/arbites still connects with the operator's key.
  - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDzG7xvJdEAAFfdkOLh1JQT4tRTV3VgUOpoYJqjTl9qk arbites@scholam
