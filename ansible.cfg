[defaults]
inventory = inventory
roles_path = roles
# Pinned, not discovered: ansible-core's fallback list is ordered newest-first, so
# a hand-installed python3.14 silently took this host's interpreter off the system
# default, re-flavouring every generic python3-* package the roles install.
# /usr/bin/python3 follows the distro's own promotion instead. A per-host
# ansible_python_interpreter still wins, though no host needs one now that the
# NAS and its DSM python3.9 have left the inventory.
interpreter_python = /usr/bin/python3
# Unset globally: CI has no .vault_pass and a missing file fails every command.
# No molecule tier sets it either — hetzner takes its API token as HCLOUD_TOKEN
# from the environment, sourced from the vault by the Makefile locally and
# injected by CI. Pass --vault-password-file for live plays.
# vault_password_file = .vault_pass

[ssh_connection]
pipelining = True
