[defaults]
inventory = inventory
roles_path = roles
# Pinned, not discovered: ansible-core's fallback list is ordered newest-first, so
# a hand-installed python3.14 silently took this host's interpreter off the system
# default, re-flavouring every generic python3-* package the roles install.
# /usr/bin/python3 follows the distro's own promotion instead. Per-host overrides
# still win — administratum pins DSM's python3.9 in the inventory.
interpreter_python = /usr/bin/python3
# Unset globally: CI has no .vault_pass and a missing file fails every command.
# The hetzner tier sets it in molecule/hetzner/base.yml, so it stays off the
# other tiers; pass --vault-password-file for live plays.
# vault_password_file = .vault_pass

[ssh_connection]
pipelining = True
