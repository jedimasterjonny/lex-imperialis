---
# pre-commit-hooks stay remote (no venv equivalent to call); yamllint,
# ansible-lint, and shellcheck run as local hooks against the venv-pinned
# tools, so their versions live in exactly one place — requirements-dev.txt.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: check-json
      - id: check-toml
      - id: check-executables-have-shebangs
      - id: detect-private-key
      # The scenario architecture shares converge/verify/prepare via relative
      # symlinks; these guard against a rename leaving a dangler or a symlink
      # being committed as its dereferenced content.
      - id: check-symlinks
      - id: destroyed-symlinks
  # editorconfig-checker enforces .editorconfig — the indent style (tabs vs spaces)
  # per file type, on top of the whitespace/EOL/newline hooks above. A Go binary
  # with no pip-pure equivalent, so it stays remote like gitleaks; the rev is
  # renovate-tracked (:enablePreCommit). Its IndentSize (multiple-of-N) check is
  # off in .editorconfig-checker.json — it fights the intentional Jinja-expression
  # alignment in the YAML, markdown prose, and the vendored LICENSE.
  - repo: https://github.com/editorconfig-checker/editorconfig-checker.python
    rev: 3.6.1
    hooks:
      - id: editorconfig-checker
  # gitleaks backstops detect-private-key, catching tokens, passwords, and
  # cloud credentials the lone key check misses. Stays remote like the other
  # binary hooks.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  # actionlint lints .github/workflows/*.yml for GitHub Actions semantics yamllint
  # can't see (expression types, runs-on labels, cron/glob syntax, action `uses`
  # form) and runs shellcheck over every `run:` step — the local shellcheck hook
  # is typed to standalone shell files, so scripts embedded in workflows were
  # unchecked until now. A Go binary with no pip package, so it stays remote and
  # builds through pre-commit's golang toolchain, like gitleaks; the rev is
  # renovate-tracked (:enablePreCommit). It finds shellcheck on PATH — the
  # venv-pinned one under `make pre-commit` — so embedded and standalone scripts
  # face the same shellcheck.
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
  # markdownlint-cli2 lints every tracked *.md for structure and style yamllint and
  # prose review can't reach — heading levels, fenced-code languages, table and
  # list formatting. A Node tool with no pip equivalent, so it stays remote and
  # builds through pre-commit's node toolchain, like actionlint's and gitleaks'
  # golang; the rev is renovate-tracked (:enablePreCommit). Rules live in
  # .markdownlint-cli2.yaml — every default on, only MD013 line-length relaxed.
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.2
    hooks:
      - id: markdownlint-cli2
  # renovate-config-validator schema-checks renovate.json — its custom regex
  # managers and packageRules fail silently in Renovate itself, so a slip is
  # otherwise invisible until a bump goes missing. --strict promotes warnings
  # (deprecated/unknown options) to errors. A Node tool bundling renovate, so it
  # stays remote and builds through pre-commit's node toolchain like markdownlint;
  # the rev is renovate-tracked (:enablePreCommit).
  - repo: https://github.com/renovatebot/pre-commit-hooks
    rev: 43.285.7
    hooks:
      - id: renovate-config-validator
        args: [--strict]
  - repo: local
    hooks:
      - id: yamllint
        name: yamllint
        # --strict: warnings fail the gate too, not just errors.
        entry: yamllint --strict
        language: system
        types: [yaml]
      - id: ansible-lint
        name: ansible-lint
        # --strict: promote warnings to failures on top of the production profile.
        entry: ansible-lint --strict
        language: system
        pass_filenames: false
        always_run: true
      - id: codespell
        name: codespell
        # Spell-checks prose and comments. Dictionaries, skips, and the
        # check-hidden/-filenames toggles live in .codespellrc.
        entry: codespell
        language: system
        types: [text]
      - id: shellcheck
        name: shellcheck
        entry: shellcheck
        language: system
        types: [shell]
      # identify tags *.sh.j2 as jinja, not shell, so the hook above skips the
      # riskiest scripts. This one strips the Jinja and pipes the result through
      # shellcheck so they get analysed too.
      - id: shellcheck-jinja
        name: shellcheck-jinja
        entry: bin/shellcheck-jinja.sh
        language: script
        files: '(\.sh\.j2$|/(wp|wp-db-dump)\.j2$)'
      # A Jinja syntax error is invisible until Ansible templates the file, so it
      # costs a converge — a full container build in CI — to find, and
      # gitops_reconcile applies as root within ~15 min of a merge. Parse every
      # template here instead. Complements shellcheck-jinja, which rewrites
      # {% %} and {{ }} but not comment tags, so it cannot see an unclosed one.
      - id: jinja-syntax
        name: jinja-syntax
        entry: python3 bin/check-jinja-syntax.py
        language: system
        files: '\.j2$'
      # Every role must ship an incus or libvirt test (libvirt implies hetzner).
      - id: role-test-coverage
        name: role-test-coverage
        entry: bin/check-role-test-coverage.sh
        language: script
        pass_filenames: false
        always_run: true
      # OpenTofu gates for terraform/, mirroring the yamllint/ansible-lint style:
      # local hooks calling the tofu on PATH (zypper-installed; setup-opentofu in CI).
      - id: tofu-fmt
        name: tofu-fmt
        entry: tofu fmt -check -recursive terraform
        language: system
        pass_filenames: false
        files: '\.tf$'
      - id: tofu-validate
        name: tofu-validate
        entry: bin/tofu-validate.sh
        language: script
        pass_filenames: false
        files: '\.tf$'
      - id: tflint
        name: tflint
        entry: tflint --chdir=terraform
        language: system
        pass_filenames: false
        files: '(\.tf$|\.tflint\.hcl$)'
      # Packer gates for packer/, mirroring the tofu pair. Both go through the
      # script that also runs the build, so its binary guard and throwaway
      # keypair are each written once.
      - id: packer-fmt
        name: packer-fmt
        entry: bin/packer.sh fmt-check
        language: script
        pass_filenames: false
        files: '\.pkr\.hcl$'
      # validate, not validate -syntax-only: syntax-only parses the HCL and stops,
      # so it passes a misspelt block name that validate rejects by name. It does
      # not catch runtime defects -- it passed cleanly before every failed build --
      # so treat it as a schema gate, not evidence the build works.
      - id: packer-validate
        name: packer-validate
        entry: bin/packer.sh validate
        language: script
        pass_filenames: false
        files: '^packer/.*\.(pkr\.hcl|yml)$'
      # butane compiles bootstrap/*.bu into the Ignition config rogue-trader boots
      # from. An invalid one is a box nobody can log into, and nothing between here
      # and first boot would say so, which is the same silent-brick class the
      # machine-id handling exists to avoid. --strict fails on warnings too.
      - id: butane
        name: butane
        entry: bin/butane-lint.sh
        language: script
        files: '\.bu$'
      # promtool validates the static Prometheus alert rules (the templated
      # prometheus.yml is left to molecule). --lint=all --lint-fatal makes every
      # lint check — not just the default duplicate-rules — fail the gate. Needs
      # promtool on PATH like tofu/tflint: the lint workflow installs the pinned
      # prometheus release in CI; provision it on the workstation to run locally.
      - id: promtool
        name: promtool
        entry: promtool check rules --lint=all --lint-fatal
        language: system
        files: '^roles/prometheus/files/rules/.*\.ya?ml$'
      # check rules only proves the file parses. These are the behavioural tests:
      # roles/prometheus/tests/ drives the shipped rules through both polarities of
      # the fault each one names, with for:, labels and annotations evaluated. A rule
      # that can never fire — the whole reason ScheduledJobMetricMissing exists —
      # parses perfectly, so the gate above cannot catch it and this one can.
      # pass_filenames is off and the pattern covers the rules as well as the tests,
      # so editing an expression re-runs them rather than only editing a test.
      - id: promtool-test
        name: promtool test
        entry: promtool test rules roles/prometheus/tests/alerts_test.yml
        language: system
        pass_filenames: false
        files: '^roles/prometheus/(files/rules|tests)/.*\.ya?ml$'
