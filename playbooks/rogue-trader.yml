---
- name: Configure rogue-trader
  hosts: rogue-trader
  vars:
    common_hostname: rogue-trader
    # Narrower than the fleet list: the owner account here authorises only the
    # control host. The other two declared keys are laptops, one of them
    # employer-controlled, and this is the public VPS — the one host where a
    # device that never reached it should not start to. Replaces the group_vars
    # list rather than extending it, which is what play vars do.
    common_authorized_keys:
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDHpcn9yrjN0+bAFrmfGo7X4qMdklxvJ3bqdSiyJf5ju jonny@scholam
    # Staggered autoupdate: the public VPS updates mid-week, after solar's canary
    # run, so one bad rolling snapshot can't brick the whole fleet in one night.
    # 06:00 rather than 03:00 because storagebox_gateway below puts this host on
    # the NAS's off-site mirror path: a transactional reboot now severs whatever
    # Hyper Backup is copying, and its windows (Tue 03:00 photos, Wed 02:00
    # podman, Thu 04:00 home — docs/backups.md) are DSM's, invisible from here.
    # With the timer's RandomizedDelaySec=2h the reboot lands 06:00–08:00, so it
    # clears a Wed 02:00 mirror that runs under four hours. A first full mirror
    # can exceed that; pause the timer for that one run rather than schedule
    # around a one-off.
    autoupdate_oncalendar: "Wed *-*-* 06:00:00"
    # The tunnel definition, in wg-quick's format. It stays in that format because
    # the same text is what /etc/wireguard/wg0.conf holds, so re-enabling
    # wg-quick@wg0 remains a working rollback from a NetworkManager that will not
    # bring the tunnel up — and the private key keeps one copy in the vault.
    wireguard_client_conf: "{{ rogue_trader_wireguard_conf }}"
    # podman_backup writes to the astropath share; mount it from the NAS. No arr
    # stack here, so scriptorum stays unmounted. The backup runs as root, which
    # the NAS squashes to the admin uid its astropath ACL grants.
    # Adding a share here also needs its mount point added to packer/ and the
    # image rebuilt — roles/nfs cannot create one on MicroOS's read-only root,
    # and nothing detects the omission.
    nfs_shares:
      # By the NAS's stable LAN IP, not its hostname: rogue-trader resolves LAN
      # names only over the tunnel. NetworkManager now owns that resolver and
      # re-applies it on reload, where wg-quick's openresolv copy was dropped by
      # any reload (e.g. the podman conf.d drop-in) — but the IP still depends on
      # nothing, so it stays.
      - name: astropath
        server: 192.168.1.225
        export: /volume2/astropath
    # caddy + wordpress serve emmasedit.com (apex + www) publicly. The Cloudflare
    # token is scoped to the emmasedit.com zone — distinct from the global caddy
    # token, which is solar's — so override it here. No internal services run, so
    # the wildcard vhost is off; caddy issues the cert over DNS-01, so it is in
    # place before the DNS flip.
    caddy_wildcard: false
    caddy_cloudflare_api_token: "{{ emmasedit_cloudflare_api_token }}"
    wordpress_domains:
      - emmasedit.com
      - www.emmasedit.com
    # Only Cloudflare reaches the site: caddy requires the edge's Authenticated
    # Origin Pulls certificate on the handshake. The Hetzner cloud firewall
    # (terraform's vpc-firewall) already narrows 80/443 to Cloudflare's published
    # ranges, but every Cloudflare account shares them, so the origin IP alone
    # would otherwise buy a way past the zone's WAF challenge and login rate
    # limit. The zone setting that makes the edge send that certificate is
    # terraform's (edge-emmasedit-com.tf) and must already be live — applying
    # this first takes the site down.
    wordpress_origin_pull: true
    wordpress_db_password: "{{ rogue_trader_wordpress_db_password }}"
    wordpress_db_root_password: "{{ rogue_trader_wordpress_db_root_password }}"
    # 80/443 for the public site. SSH is not opened here; a rich rule below
    # scopes it to the LAN subnet instead.
    firewalld_services:
      - http
      - https
    # node_exporter and cadvisor bind the WireGuard address only, so the public
    # interface never exposes them. The scrape rides the WG tunnel but arrives
    # with the LAN source (the router forwards it without NAT), so the ports are
    # permitted from the LAN subnet. Start the units after the tunnel so the bind
    # can't race wg0's address at boot. NetworkManager owns the tunnel now, and it
    # exposes no per-connection unit, so the barrier is the wait-online service:
    # it holds until every autoconnect profile has reached activated state, which
    # is address-configured rather than merely link-present. It has to be a unit
    # that exists — systemd treats After= on an absent unit as a no-op, so an
    # ordering left pointing at wg-quick@wg0.service would fail open silently.
    node_exporter_listen_address: 192.168.3.4:9100
    node_exporter_after: NetworkManager-wait-online.service
    cadvisor_listen_ip: 192.168.3.4
    cadvisor_after: NetworkManager-wait-online.service
    # Home backup after solar (Thu 01:00) and scholam (Thu 02:00), before the
    # off-site mirror (Thu 04:00). rogue-trader already mounts astropath for
    # podman_backup, so no extra NFS setup is needed.
    home_backup_oncalendar: "Thu *-*-* 03:00:00"
    # This host's restic key. One per host, so a host that is compromised can
    # open only its own repos — the astropath export carries every host's, and
    # this is the public box.
    restic_backup_password: "{{ rogue_trader_restic_password }}"
    # The storage box forward. The NAS's Hyper Backup tasks reach the box through
    # this rather than over the public internet, which is what lets the box refuse
    # every source outside Hetzner — it and this host are both in the same
    # location. Bound to the WireGuard address, the only one the NAS reaches it
    # on and never the public interface. The proxy is transparent at the TCP
    # layer, so the NAS's SSH session runs end to end and this host holds none of
    # the box's credentials — which is what makes it safe here rather than on a
    # host of its own.
    storagebox_gateway_listen: 192.168.3.4:23
    # The vault var is the bare host — the port is Hetzner's documented SSH port
    # for a storage box, not a secret, and it reads better beside the rich rule
    # and the probe target that name the same 23.
    storagebox_gateway_target: "{{ rogue_trader_storagebox_endpoint }}:23"
    firewalld_rich_rules:
      # SSH reaches the box only over the tunnel (LAN source), so scope it to the
      # LAN subnet rather than opening 22 on the public interface.
      - rule family="ipv4" source address="192.168.1.0/24" service name="ssh" accept
      - rule family="ipv4" source address="192.168.1.0/24" port port="9100" protocol="tcp" accept
      - rule family="ipv4" source address="192.168.1.0/24" port port="8080" protocol="tcp" accept
      # The storage box forward, for the NAS pushing to it and auspex probing it.
      # Load-bearing exactly as the two rules above are: traffic arriving on the
      # tunnel lands in the public zone and is dropped without it. Binding the
      # socket to the tunnel address keeps the forward off the public interface;
      # it does not admit anything.
      - rule family="ipv4" source address="192.168.1.0/24" port port="23" protocol="tcp" accept
  roles:
    - common
    - sshd
    # WireGuard client: http/https public, SSH scoped to the LAN (rich rule
    # above). The tunnel initiates outbound to the router, so its return traffic
    # rides conntrack — no inbound 51820/udp needed.
    - firewalld
    # The WireGuard tunnel, run by NetworkManager, plus the refresh that keeps it
    # up across a home WAN-IP change. NFS and the metrics binds below ride it.
    - wireguard_client
    # The storage box forward. After wireguard_client for reading order only —
    # the socket free-binds, so it does not need the tunnel address to exist.
    - storagebox_gateway
    - podman
    - autoupdate
    # Materialises the schedule this host has always declared but never
    # generated. The drop-ins are written by the package's path unit when the
    # sysconfig changes, which never happens during a packer image build, so the
    # balance timer has been running the package default of monthly against a
    # sysconfig asking for weekly.
    - btrfsmaintenance
    - nfs
    - caddy
    - wordpress
    - podman_backup
    - home_backup
    - node_exporter
    - cadvisor
    - inquisition
