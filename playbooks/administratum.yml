---
- name: Configure administratum
  hosts: administratum
  # The NAS isn't a fleet openSUSE host, so it gets none of the common/sshd/zypper
  # roles, and sudo needs a password — the deploy runs unprivileged as the
  # docker-group user.
  become: false
  vars:
    docker_prune_project_dir: /volume2/astropath/docker_prune
  roles:
    # All that is left here. Prometheus moved to auspex, which now scrapes, stores
    # and evaluates on one host; blackbox_exporter went with the scraping before
    # it. Dropping the role stops managing the NAS container but does NOT stop it,
    # so the compose project under /volume2/astropath/prometheus was brought down
    # by hand at the cutover, and its data directory kept a while as the rollback.
    #
    # Why stopped and not merely unmanaged, which is the part worth remembering:
    # two Prometheis on this fleet cannot both run. Neither sets external_labels,
    # so both emit an identical {alertname="Watchdog"}, and Alertmanager groups by
    # alertname alone — the two collapse into one alert that either can keep
    # alive. A dead Prometheus on auspex would then be total silence behind a
    # green heartbeat, which is the one failure this whole arrangement rests on
    # being loud.
    - docker_prune
