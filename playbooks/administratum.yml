---
- name: Configure administratum
  hosts: administratum
  # The NAS isn't a fleet openSUSE host, so it gets none of the common/sshd/zypper
  # roles, and sudo needs a password — the deploy runs unprivileged as the
  # docker-group user.
  become: false
  vars:
    # prometheus gets a compose project on a subdir of the NAS's own astropath
    # volume, beside the TSDB data (a local bind mount, not NFS).
    prometheus_project_dir: /volume2/astropath/prometheus
    prometheus_data_dir: /volume2/astropath/prometheus/data
    docker_prune_project_dir: /volume2/astropath/docker_prune
    # Storage and rule evaluation only. Everything is now scraped by the agent on
    # auspex and pushed here, so this Prometheus discovers no targets of its own
    # beyond its hardcoded self-scrape — which stays, because
    # PrometheusRuleEvaluationFailing and PrometheusConfigReloadFailed read it.
    prometheus_remote_write_receiver: true
    # Sized to the agent's prometheus_agent_retention_max_time. The agent buffers
    # to its WAL while this host is unreachable, but the self-scrape above keeps
    # this head advancing and compacting every 2h, so without this window anything
    # replayed from further back is refused as out of bounds and lost silently.
    # Change one and change the other.
    prometheus_out_of_order_time_window: 4h
    # No node_exporter on the NAS itself, by design: CPU/RAM/load stay DSM's
    # domain, its data-volume free space is already scraped via solar/rogue-trader's
    # NFS mounts of the exports (FilesystemSpaceLow covers nfs4), and a total outage
    # trips the Watchdog deadman — Prometheus dies with the host, the heartbeat stops.
    #
    # Where alerts are routed, and only that — the role scrapes nothing but itself,
    # so there is no scrape of Alertmanager here to suppress. The agent beside it on
    # auspex does that; a second scrape from here would give the one Alertmanager
    # two instance labels, and InstanceDown would fire on whichever network path
    # blipped rather than on Alertmanager being down.
    prometheus_alertmanager_targets:
      - auspex:9093
  roles:
    # blackbox_exporter moved to auspex with the scraping: it binds loopback and
    # must sit on the same host as whatever drives its /probe endpoint.
    - prometheus
    # Weekly docker image prune — the reciprocal of the podman role's timer on
    # the podman hosts. Order-independent of the stacks above.
    - docker_prune
