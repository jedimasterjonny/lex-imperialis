---
# Shared across roles; role-agnostic via molecule_yml.platforms.
# libvirt/base.yml wires it in as provisioner.playbooks.create.
- name: Create
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    # community.libvirt needs the libvirt binding, which only the system
    # interpreter has — not the venv molecule runs from.
    ansible_python_interpreter: /usr/bin/python3
    mol_ssh_key: "{{ lookup('env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}/ssh_key"
    mol_ssh_cmd: >-
      ssh -i {{ mol_ssh_key }} -o BatchMode=yes -o StrictHostKeyChecking=no
      -o UserKnownHostsFile=/dev/null
    # The libvirt image store, not a private cache: a run reuses the warm
    # Tumbleweed qcow2 the libvirt role's refresh timer keeps here rather than
    # re-downloading, and populates it on a miss. Writing here unprivileged
    # relies on the libvirt role holding the dir 2771 root:libvirt.
    mol_image_cache: /var/lib/libvirt/images
  tasks:
    - name: Generate an ephemeral SSH key
      ansible.builtin.command: "ssh-keygen -t ed25519 -N '' -f {{ mol_ssh_key }}"
      args:
        creates: "{{ mol_ssh_key }}"

    # The image cache is keyed by filename and validated against upstream's
    # rolling checksum, so a cached qcow2 whose upstream has moved fails the
    # launch until it is refreshed — the libvirt role's timer does that weekly
    # for the Tumbleweed image, and nothing does for any other. Re-pull and
    # retry the platforms that failed, once: what a stale cache needs, and a
    # failure of any other kind is raised by the second attempt with nothing
    # lost but the download.
    - name: Launch instances, re-pulling a stale cached image
      block:
        - name: Launch instances
          community.libvirt.virt_cloud_instance: &mol_launch_args
            name: "{{ item.name }}"
            base_image: "{{ item.image }}"
            image_cache_dir: "{{ mol_image_cache }}"
            image_checksum: "{{ item.image_checksum }}"
            url_timeout: 600
            disks:
              - path: "/var/lib/libvirt/images/{{ item.name }}.qcow2"
                size: 12
                format: qcow2
            memory: 2048
            vcpus: 2
            osinfo:
              name: "{{ item.osinfo | default('opensusetumbleweed') }}"
            # The module only emits --boot when 'boot' is set, so 'boot' is
            # required for boot_opts (UEFI firmware) to reach virt-install.
            boot: hd
            boot_opts:
              firmware: efi
              loader.secure: "no"
            networks:
              - network: default
            cloud_init:
              root_ssh_key: "{{ mol_ssh_key }}.pub"
            wait_for_cloud_init_reboot: false
          loop: "{{ molecule_yml.platforms }}"
          loop_control:
            label: "{{ item.name }}"
          register: mol_launch
      rescue:
        # A failure before the loop ran has no per-platform results to retry.
        - name: Re-raise a launch failure that was not a platform's
          ansible.builtin.fail:
            msg: "{{ mol_launch.msg | default(mol_launch) }}"
          when: mol_launch.results is not defined

        - name: Launch the platforms that failed again, their images re-pulled
          community.libvirt.virt_cloud_instance:
            <<: *mol_launch_args
            force_pull: true
          loop: "{{ mol_launch.results | selectattr('failed', 'defined') | selectattr('failed') | map(attribute='item') | list }}"
          loop_control:
            label: "{{ item.name }}"

    - name: Wait for an IPv4 lease
      ansible.builtin.command: "virsh -c qemu:///system -q domifaddr {{ item.name }}"
      loop: "{{ molecule_yml.platforms }}"
      loop_control:
        label: "{{ item.name }}"
      register: mol_domifaddr
      until: "mol_domifaddr.stdout is search('\\d+\\.\\d+\\.\\d+\\.\\d+')"
      retries: 30
      delay: 4
      changed_when: false

    - name: Build the instance config
      ansible.builtin.set_fact:
        mol_instance_conf: "{{ mol_instance_conf | default([]) + [mol_conf] }}"
      vars:
        mol_conf:
          instance: "{{ item.item.name }}"
          address: "{{ item.stdout | regex_search('\\d+\\.\\d+\\.\\d+\\.\\d+') }}"
          user: root
          port: 22
          identity_file: "{{ mol_ssh_key }}"
      loop: "{{ mol_domifaddr.results }}"
      loop_control:
        label: "{{ item.item.name }}"

    - name: Write the molecule instance config
      ansible.builtin.copy:
        content: "{{ mol_instance_conf | to_nice_yaml }}"
        dest: "{{ molecule_instance_config }}"
        mode: "0600"

    - name: Wait for SSH to accept the key
      ansible.builtin.command: "{{ mol_ssh_cmd }} root@{{ item.address }} true"
      loop: "{{ mol_instance_conf }}"
      loop_control:
        label: "{{ item.instance }}"
      register: mol_ssh
      until: mol_ssh.rc == 0
      retries: 20
      delay: 3
      changed_when: false

    # As the incus tier's create primes its cache, and for its reasons; apt
    # only, since zypper's autorefresh covers the Tumbleweed image itself.
    - name: Prime apt's package lists
      ansible.builtin.command: >-
        {{ mol_ssh_cmd }} root@{{ item.address }}
        'if command -v apt-get >/dev/null 2>&1; then timeout 90 apt-get update; fi'
      loop: "{{ mol_instance_conf }}"
      loop_control:
        label: "{{ item.instance }}"
      register: mol_refresh
      until: mol_refresh.rc == 0
      retries: 3
      delay: 30
      changed_when: false
