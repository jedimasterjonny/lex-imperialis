---
# Shared across roles: the Tumbleweed cloud image ships an `opensuse` user
# holding uid 1000, which common pins for the owner. Scenarios that create the
# owner symlink this in (common, dev); motd also carries it as the harness
# exemplar, so a break here fails CI via the shared-infra proxy.
- name: Prepare
  hosts: all
  tasks:
    - name: Remove the image's cloud user
      ansible.builtin.user:
        name: opensuse
        state: absent
        remove: true
      become: true
