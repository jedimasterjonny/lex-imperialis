---
# Shared across roles: each cloud image ships a user holding uid 1000, which
# common pins for the owner — `opensuse` on Tumbleweed, `debian` on Debian. Both
# are removed unconditionally rather than per image: state=absent on a name the
# image does not carry is a no-op, so the loop stays idempotent either way.
# Scenarios that create the owner symlink this in (dev), or import it (common);
# motd also carries it as the harness exemplar, so a break here fails CI via the
# shared-infra proxy.
- name: Prepare
  hosts: all
  tasks:
    - name: Remove the image's cloud user
      ansible.builtin.user:
        name: "{{ item }}"
        state: absent
        remove: true
      loop:
        - opensuse
        - debian
      become: true
