---
# Shared across roles: drives incus from molecule_yml.platforms, so it is
# role-agnostic. incus/base.yml wires it in as provisioner.playbooks.create.
- name: Create
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    # A platform's optional `config` map renders as -c key=value launch
    # options, e.g. security.nesting for roles that run nested containers.
    - name: Launch instances
      ansible.builtin.command: >-
        incus launch {{ item.image }} {{ item.name }}
        {% for option in item.config | default({}) | dict2items %} -c {{ option.key }}={{ option.value }}{% endfor %}
      loop: "{{ molecule_yml.platforms }}"
      loop_control:
        label: "{{ item.name }}"
      register: mol_launch
      changed_when: mol_launch.rc == 0
      failed_when:
        - mol_launch.rc != 0
        - "'already exists' not in mol_launch.stderr"

    # Network-online implies exec responds; converges that fetch packages
    # otherwise race the boot's DHCP/DNS setup.
    - name: Wait until instances are online
      ansible.builtin.command: "incus exec {{ item.name }} -- systemctl is-active network-online.target"
      loop: "{{ molecule_yml.platforms }}"
      loop_control:
        label: "{{ item.name }}"
      register: mol_online
      until: mol_online.rc == 0
      retries: 30
      delay: 2
      changed_when: false

    # The Tumbleweed mirror CDN intermittently times out serving repo metadata
    # (curl 28), which a converge install reports as "No provider of <pkg> found",
    # and mid-sync serves 403s (curl 22) on files repomd.xml lists — outages that
    # run minutes, so the retry budget sits out a sync, not just a blip. Each
    # attempt is capped: a stalled transfer burns 90s, not the CI job's timeout,
    # and the per-repo refresh is incremental, so a killed attempt resumes.
    # Prime the cache here, retried, so the install reuses fresh metadata within
    # the package manager's refresh window instead of racing a flaky refresh of
    # its own. Both arms are load-bearing, apt's more so: ansible.builtin.package
    # cannot refresh a cache at all, so a Debian platform with this gated off
    # would install against whatever /var/lib/apt/lists the cached image happens
    # to carry. Dispatched on which binary the instance has rather than on the
    # platform's image string, which is free-form and would rot silently.
    - name: Prime the package manager's metadata cache
      ansible.builtin.command:
        argv:
          - incus
          - exec
          - "{{ item.name }}"
          - --
          - sh
          - -c
          - "if command -v zypper >/dev/null 2>&1; then timeout 90 zypper --non-interactive refresh; else timeout 90 apt-get update; fi"
      loop: "{{ molecule_yml.platforms }}"
      loop_control:
        label: "{{ item.name }}"
      register: mol_refresh
      until: mol_refresh.rc == 0
      retries: 10
      delay: 30
      changed_when: false
