---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    # Host network, so Alertmanager answers on the instance's own :9093.
    - name: Wait for alertmanager to be ready
      ansible.builtin.uri:
        url: http://127.0.0.1:9093/-/ready
        status_code: 200
      register: alertmanager_ready
      until: alertmanager_ready.status == 200
      retries: 30
      delay: 2

    - name: Read the loaded runtime config
      ansible.builtin.uri:
        url: http://127.0.0.1:9093/api/v2/status
        return_content: true
      register: alertmanager_status

    # config.original is the raw config Alertmanager parsed; finding the templated
    # route proves the role's config loaded, not the image's baked-in example.
    - name: The templated config is loaded
      ansible.builtin.assert:
        that:
          - "'receiver: default' in alertmanager_status.json.config.original"
        fail_msg: alertmanager did not load the templated config

    # Empty secret vars leave both receivers null and neither *_file gate firing;
    # converge sets dummies, so this proves the production render of both
    # secret-file references.
    - name: The secret-gated receivers are rendered
      vars:
        alertmanager_config: "{{ alertmanager_status.json.config.original }}"
      ansible.builtin.assert:
        that:
          - "'webhook_url_file: /etc/alertmanager/discord_webhook_url' in alertmanager_config"
          - "'url_file: /etc/alertmanager/deadman_url' in alertmanager_config"
        fail_msg: alertmanager did not render the secret-gated receivers
        quiet: true

    # Both secret files are rendered whatever the vars hold, so clearing one in
    # the vault revokes it rather than leaving the last URL on disk. Prove they
    # are there and readable only by the image's nobody (65534), the uid the
    # container's process runs as.
    - name: Stat the secret files
      ansible.builtin.stat:
        path: "/etc/alertmanager/{{ item }}"
      loop:
        - discord_webhook_url
        - deadman_url
      become: true
      register: alertmanager_secret_files

    - name: Each secret file is private to the container's uid
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.mode == '0600'
          - item.stat.uid == 65534
        fail_msg: "/etc/alertmanager/{{ item.item }} is missing or not 0600 uid 65534"
        quiet: true
      loop: "{{ alertmanager_secret_files.results }}"
      loop_control:
        label: "{{ item.item }}"

    # Revocation's other half: an emptied file must be referenced by nothing.
    # Render the config on the controller with both vars cleared — the state a
    # revoked host converges into, which this scenario's armed converge cannot
    # itself reach — and prove both receivers come out null. webhook_url_file
    # ends in url_file, so the one substring covers both references.
    - name: The cleared render references neither secret file
      vars:
        alertmanager_discord_webhook_url: ""
        alertmanager_deadman_ping_url: ""
        alertmanager_cleared: >-
          {{ lookup('template', playbook_dir | dirname | dirname
             ~ '/templates/alertmanager.yml.j2') }}
      ansible.builtin.assert:
        that:
          - "'url_file' not in alertmanager_cleared"
          - (alertmanager_cleared | from_yaml).receivers | map(attribute='name') | sort == ['deadman', 'default']
        fail_msg: clearing the secret vars still leaves a receiver pointed at a revoked secret file
        quiet: true

    # Structural, not substring: both Watchdog routes are unconditional template
    # text, so what can regress is what each leg SAYS — order, matcher, receiver,
    # continue, cadence. Swap the legs, typo a matcher, or drop the 4m override
    # (inheriting the root 4h) and the beat dies or slows past the check's grace
    # while every substring still matches.
    - name: The Watchdog legs are ordered Discord-then-deadman and the inhibition targets the Watchdog
      vars:
        alertmanager_parsed: "{{ alertmanager_status.json.config.original | from_yaml }}"
        alertmanager_routes: "{{ alertmanager_parsed.route.routes }}"
      ansible.builtin.assert:
        that:
          # config.original is Alertmanager's re-marshalled config, not the raw
          # file: durations come back canonicalised (120h would read 5d), which
          # is why the template writes the canonical form.
          - alertmanager_routes[0].matchers == ['alertname="Watchdog"']
          - alertmanager_routes[0].receiver == 'default'
          - alertmanager_routes[0]['continue'] | default(false)
          - alertmanager_routes[0].repeat_interval == '5d'
          - alertmanager_routes[1].matchers == ['alertname="Watchdog"']
          - alertmanager_routes[1].receiver == 'deadman'
          - not (alertmanager_routes[1]['continue'] | default(false))
          - alertmanager_routes[1].repeat_interval == '4m'
          - alertmanager_parsed.inhibit_rules[0].source_matchers == ['alertname="AlertmanagerNotificationsFailing"']
          - alertmanager_parsed.inhibit_rules[0].target_matchers == ['alertname="Watchdog"']
        fail_msg: a Watchdog leg's matcher, order, continue, or cadence — or the deadman inhibition — has regressed
        quiet: true

    # The uplink inhibition is what turns one outage into one page. Located by its
    # source rather than by index, so adding a third rule does not silently move
    # what this reads, and asserted whole: a source that no longer names
    # HomeUplinkDown, or a target regex that has lost one of its two alertnames,
    # restores the eight-message fan-out with nothing else to notice.
    - name: The uplink inhibition suppresses both alerts HomeUplinkDown explains
      vars:
        alertmanager_uplink_inhibition: >-
          {{ (alertmanager_status.json.config.original | from_yaml).inhibit_rules
             | selectattr('source_matchers', 'eq', ['alertname="HomeUplinkDown"']) | list }}
      ansible.builtin.assert:
        that:
          - alertmanager_uplink_inhibition | length == 1
          - >-
            (alertmanager_uplink_inhibition | first).target_matchers
            == ['alertname=~"ProbeDown|WireguardTunnelDown"']
        fail_msg: >-
          the HomeUplinkDown inhibition is missing or no longer names both targets
          — one uplink outage pages once per failing probe again
        quiet: true

    # A non-zero exit fails the task, proving wget resolves in the image and the
    # health endpoint reports healthy.
    - name: The healthcheck passes
      ansible.builtin.command: podman healthcheck run alertmanager
      become: true
      changed_when: false

    # The checks above prove alertmanager works; they can't prove its capability
    # set is minimal. Assert the posture directly so a regression that widens the
    # caps or drops the restriction fails here, not silently in production.
    - name: Read alertmanager's security posture
      ansible.builtin.command: podman inspect alertmanager
      become: true
      register: alertmanager_inspect
      changed_when: false

    # alertmanager runs non-root (nobody, 65534), so EffectiveCaps is always
    # empty — only BoundingCaps reflects DropCapability=all. Assert the bounding set.
    - name: Alertmanager keeps no capabilities and bars privilege escalation
      vars:
        alertmanager: "{{ alertmanager_inspect.stdout | from_json | first }}"
      ansible.builtin.assert:
        that:
          - "alertmanager.BoundingCaps | default([], true) | sort == []"
          - "'no-new-privileges' in (alertmanager.HostConfig.SecurityOpt | default([], true))"
        fail_msg: "alertmanager's capability or no-new-privileges posture has regressed"
        quiet: true
