---
- name: Verify
  hosts: all
  gather_facts: false
  # fixtures.yml comes last: it must outrank the role default it overrides.
  vars_files:
    - ../../defaults/main.yml
    - fixtures.yml
  tasks:
    # One call takes the whole list; its non-zero exit is the assertion.
    - name: Every incus package resolves to an installed provider
      ansible.builtin.command:
        argv: "{{ ['rpm', '--query', '--whatprovides'] + incus_packages }}"
      changed_when: false

    # firewalld and its bindings come from the firewalld role, applied first; the
    # bridge-trust task needs both. Running the import is the only proof the
    # binding is usable.
    - name: The firewalld python bindings are usable
      ansible.builtin.command: python3 -c 'import firewall'
      changed_when: false

    - name: Firewalld is running
      ansible.builtin.command: firewall-cmd --state
      changed_when: false
      become: true

    - name: The incus bridge exists
      ansible.builtin.command: "incus network show {{ incus_bridge }}"
      changed_when: false
      become: true

    - name: The default storage pool exists
      ansible.builtin.command: incus storage show default
      changed_when: false
      become: true

    # --query-interface exits non-zero when absent, so its rc is the assertion.
    # --permanent is the durable guarantee: it survives a firewalld reload and reboot.
    - name: The incus bridge is permanently trusted
      ansible.builtin.command: "firewall-cmd --permanent --zone=trusted --query-interface={{ incus_bridge }}"
      changed_when: false
      become: true

    # show prints only the editable fields, so auto_update comes from it and the
    # alias from the list.
    - name: Show the cached image
      ansible.builtin.command: "incus image show {{ incus_image_alias }}"
      register: incus_image
      changed_when: false
      become: true

    - name: List the local image aliases
      ansible.builtin.command: incus image list --format csv --columns l
      register: incus_images
      changed_when: false
      become: true

    # The alias is the fixture literal, not the var the role read: that proves
    # the var drove the copy. auto_update is what lets the daemon refresh it.
    - name: The fixture image is cached with auto-update
      ansible.builtin.assert:
        that:
          - "'lex-image-test' in incus_images.stdout"
          - (incus_image.stdout | from_yaml).auto_update
        fail_msg: "the fixture image is not cached with auto-update"
        quiet: true

    # Deliberately not mirroring the role's NetworkManager guard: a test that
    # skips on the same probe the task skips on can never catch the guard
    # opening. Both tiers carry NM, so a skip here would be the regression.
    #
    # --print-config expands the merged conf.d, proving NetworkManager reads the
    # drop-in — which the file's own content cannot.
    - name: Expand NetworkManager's configuration
      ansible.builtin.command: NetworkManager --print-config
      register: incus_nm_config
      changed_when: false
      become: true

    - name: NetworkManager leaves instance veths unmanaged
      ansible.builtin.assert:
        that: "'interface-name:veth*' in incus_nm_config.stdout"
        fail_msg: "NetworkManager does not hold instance veths unmanaged"
        quiet: true
