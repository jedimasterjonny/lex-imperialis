---
# One source for the cached image, loaded by both converge and verify. Not the
# scenario's inventory group_vars: verify loads the role's defaults through
# vars_files, which outranks inventory, so the default would shadow it.
#
# A tiny image over the same images: remote exercises the real copy path without
# pulling the 77 MiB Tumbleweed image. The alias is deliberately not the role
# default, which no play overrides — asserting it would prove only that the
# default equals itself, leaving the var's path to the copy untested.
incus_image_source: images:alpine/edge
incus_image_alias: lex-image-test
