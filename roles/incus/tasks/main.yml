---
- name: Install incus
  community.general.zypper:
    name: "{{ incus_packages }}"
    state: present
  become: true

# The bridge need not exist yet: firewalld records the binding and applies it
# when the init below brings the bridge up.
- name: Trust the incus bridge so instances reach host DHCP and DNS
  ansible.posix.firewalld:
    zone: trusted
    interface: "{{ incus_bridge }}"
    permanent: true
    immediate: true
    state: enabled
  become: true

# An instance's interface returns to the host netns when it stops, renamed to
# vethXXXXXXXX. NetworkManager races to claim the orphan and activates a default
# wired connection on it; that activation binds it to the default firewalld zone,
# and the device then vanishes mid-activation, leaving the binding behind. One
# per instance destroyed, cleared only by a reboot.
- name: Detect NetworkManager
  ansible.builtin.stat:
    path: /etc/NetworkManager/conf.d
  register: incus_nm_confd

- name: Leave incus instance veths unmanaged by NetworkManager
  ansible.builtin.template:
    src: networkmanager-incus.conf.j2
    dest: /etc/NetworkManager/conf.d/incus.conf
    owner: root
    group: root
    mode: "0644"
  become: true
  when: incus_nm_confd.stat.exists
  notify: Reload NetworkManager for incus

# Both units: the socket for boot activation, the service so the daemon is up
# now rather than on the first client connection.
- name: Enable and start incus
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - incus.socket
    - incus.service
  become: true

# incus admin init --preseed errors on existing entities, so guard on the bridge:
# its presence means the daemon is already initialised. Run-once, not reconciling.
- name: Check whether incus is initialised
  ansible.builtin.command: "incus network show {{ incus_bridge }}"
  register: incus_initialised
  changed_when: false
  failed_when: false
  check_mode: false
  become: true

- name: Initialise incus from the preseed
  ansible.builtin.command:
    cmd: incus admin init --preseed
    stdin: "{{ lookup('ansible.builtin.template', 'preseed.yaml.j2') }}"
  when: incus_initialised.rc != 0
  changed_when: true
  become: true

# The daemon refreshes an --auto-update image itself on images.auto_update_interval,
# so no timer; an explicit copy is also exempt from images.remote_cache_expiry,
# which evicts a launch-cached image after ten idle days.
- name: Check whether the image is cached
  ansible.builtin.command: "incus image info {{ incus_image_alias }}"
  register: incus_image_cached
  changed_when: false
  failed_when: false
  check_mode: false
  become: true

- name: Cache the image with auto-update
  ansible.builtin.command: >-
    incus image copy {{ incus_image_source }} local:
    --alias {{ incus_image_alias }} --auto-update
  when: incus_image_cached.rc != 0
  changed_when: true
  become: true

# Retire the refresh timer this supersedes; a no-op on any host that never
# carried it. Drop, with its handler, once one apply has landed on scholam.
- name: Stat the retired image refresh timer
  ansible.builtin.stat:
    path: /etc/systemd/system/incus-image-refresh.timer
  register: incus_refresh_timer

- name: Stop the retired image refresh timer
  ansible.builtin.systemd_service:
    name: incus-image-refresh.timer
    state: stopped
    enabled: false
  become: true
  when: incus_refresh_timer.stat.exists

- name: Remove the retired image refresh units and script
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/systemd/system/incus-image-refresh.timer
    - /etc/systemd/system/incus-image-refresh.service
    - /usr/local/sbin/incus-image-refresh.sh
  become: true
  notify: Reload systemd for incus
