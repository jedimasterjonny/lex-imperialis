---
- name: Converge
  hosts: all
  vars:
    nfs_fixture_export: /srv/nfs-fixture
    # The role mounts this loopback export, exercising the real client path
    # without a second host to act as the NAS.
    nfs_shares:
      - name: fixture
        server: 127.0.0.1
        export: "{{ nfs_fixture_export }}"
  pre_tasks:
    # A loopback NFS server gives the role a real export to mount without a
    # second host to act as the NAS — it needs the kernel nfsd module, present
    # on the full-kernel hetzner VM and auto-loaded by the Tumbleweed
    # Minimal-VM — and NetworkManager is whose stock dispatcher script the role
    # shadows: fabricating the dispatcher directory would satisfy the role's
    # probe while leaving nothing to shadow and no way to catch the stock
    # script being renamed. NetworkManager is installed only: on Tumbleweed it
    # is never started, and Debian's package starts it but leaves the booted
    # NIC's configuration alone, so either VM keeps the network it booted with.
    - name: Install the NFS server and NetworkManager (test fixtures)
      ansible.builtin.package:
        name:
          - nfs-kernel-server
          - "{{ 'network-manager' if 'debian' in group_names else 'NetworkManager' }}"
        state: present
      become: true

    - name: Create the export directory
      ansible.builtin.file:
        path: "{{ nfs_fixture_export }}"
        state: directory
        mode: "0777"
      become: true

    - name: Export it to localhost
      ansible.builtin.copy:
        dest: /etc/exports
        content: "{{ nfs_fixture_export }} 127.0.0.1(rw,sync,no_subtree_check,no_root_squash)\n"
        mode: "0644"
      become: true

    - name: Enable and start the NFS server
      ansible.builtin.systemd_service:
        name: nfs-server
        enabled: true
        state: started
      become: true

    # Debian starts the server at package install, before the export above is
    # written, so the start finds it running and re-reads nothing; openSUSE
    # leaves it stopped, and the start is what exports. Re-read either way.
    - name: Export the fixture
      ansible.builtin.command: exportfs -ra
      changed_when: false
      become: true
  roles:
    - role: nfs
