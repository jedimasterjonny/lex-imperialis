---
# Everything wg-quick needed and NetworkManager does not: the re-resolve timer
# that drove `wg set endpoint`, and the SELinux grant and openresolv that only
# wg-quick's DNS= line pulled in. /etc/wireguard/<iface>.conf is deliberately
# left in place -- it is what a rollback re-enables wg-quick against.

- name: Check whether the retired re-resolve timer is still installed
  ansible.builtin.stat:
    path: /etc/systemd/system/wireguard-reresolve.timer
  register: wireguard_client_reresolve_timer
  become: true

- name: Stop and disable the retired re-resolve timer
  ansible.builtin.systemd_service:
    name: wireguard-reresolve.timer
    enabled: false
    state: stopped
  when: wireguard_client_reresolve_timer.stat.exists
  become: true

- name: Remove the retired re-resolve units and script
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/systemd/system/wireguard-reresolve.timer
    - /etc/systemd/system/wireguard-reresolve.service
    - /usr/local/sbin/wireguard-reresolve
  become: true
  notify: Reload systemd for the retired re-resolve units

- name: Read the loaded SELinux policy modules
  ansible.builtin.command:
    cmd: semodule -l
  register: wireguard_client_selinux_modules
  changed_when: false
  when: ansible_selinux.status == 'enabled'
  become: true

# The grant existed so wg-quick's confined wireguard_t domain could run
# openresolv. NetworkManager writes resolv.conf from its own domain, which the
# base policy already allows, so the module has nothing left to permit.
- name: Unload the retired wireguard-reresolve SELinux module
  ansible.builtin.command:
    cmd: semodule -r wireguard-reresolve
  changed_when: true
  when:
    - ansible_selinux.status == 'enabled'
    - "'wireguard-reresolve' in (wireguard_client_selinux_modules.stdout_lines | default([]))"
  become: true

- name: Remove the retired SELinux policy source
  ansible.builtin.file:
    path: /etc/selinux/wireguard-reresolve.cil
    state: absent
  become: true

# Only wg-quick's DNS= line ever called it; NetworkManager writes resolv.conf
# itself once resolvconf is gone, which it decides at reload.
- name: Remove openresolv
  community.general.zypper:
    name: openresolv
    state: absent
  become: true
  notify: Reload NetworkManager
