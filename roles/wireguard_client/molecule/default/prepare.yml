---
# Puts the container into the state the role migrates *from*: the retired
# wireguard_reresolve artefacts installed and its timer running, plus openresolv.
# Planting here rather than in converge keeps the idempotence check honest --
# converge would re-plant them on its second run and report changed forever.
- name: Prepare
  hosts: all
  tasks:
    - name: Install openresolv, which only wg-quick's DNS= line needed
      community.general.zypper:
        name: openresolv
        state: present
      become: true

    - name: Install the retired re-resolve script
      ansible.builtin.copy:
        content: |
          #!/bin/sh
          exit 0
        dest: /usr/local/sbin/wireguard-reresolve
        owner: root
        group: root
        mode: "0755"
      become: true

    - name: Install the retired re-resolve service
      ansible.builtin.copy:
        content: |
          [Unit]
          Description=Re-resolve the WireGuard wg0 endpoint on a WAN-IP change

          [Service]
          Type=oneshot
          ExecStart=/usr/local/sbin/wireguard-reresolve wg0 1.1.1.1 150
        dest: /etc/systemd/system/wireguard-reresolve.service
        owner: root
        group: root
        mode: "0644"
      become: true

    - name: Install the retired re-resolve timer
      ansible.builtin.copy:
        content: |
          [Unit]
          Description=Periodically re-resolve the WireGuard wg0 endpoint

          [Timer]
          OnBootSec=1min
          OnUnitActiveSec=1min

          [Install]
          WantedBy=timers.target
        dest: /etc/systemd/system/wireguard-reresolve.timer
        owner: root
        group: root
        mode: "0644"
      become: true

    - name: Install the retired SELinux policy source
      ansible.builtin.copy:
        content: |
          (allow wireguard_t var_run_t (dir (open read getattr search create write add_name remove_name rmdir setattr)))
        dest: /etc/selinux/wireguard-reresolve.cil
        owner: root
        group: root
        mode: "0644"
      become: true

    # The rollback artefact: verify asserts the retirement leaves it alone. The
    # directory is normally wireguard-tools', which the role installs later.
    - name: Create the wg-quick config directory
      ansible.builtin.file:
        path: /etc/wireguard
        state: directory
        owner: root
        group: root
        mode: "0700"
      become: true

    - name: Install the wg-quick config the rollback depends on
      ansible.builtin.copy:
        content: |
          [Interface]
          PrivateKey = AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          Address = 10.9.9.2/32
        dest: /etc/wireguard/wg0.conf
        owner: root
        group: root
        mode: "0600"
      become: true

    - name: Enable and start the retired re-resolve timer
      ansible.builtin.systemd_service:
        name: wireguard-reresolve.timer
        enabled: true
        state: started
        daemon_reload: true
      become: true
