---
# Makes NetworkManager pick up a rewritten keyfile without touching the running
# tunnel; activation is the handover task's job, not a handler's.
- name: Reload the NetworkManager profiles
  ansible.builtin.command:
    cmd: nmcli connection reload
  changed_when: true
  when: wireguard_client_nm_active
  become: true

# openresolv's removal changes which resolv.conf writer NetworkManager picks, and
# it only re-reads that at reload.
- name: Reload NetworkManager
  ansible.builtin.systemd_service:
    name: NetworkManager
    state: reloaded
  when: wireguard_client_nm_active
  become: true

- name: Reload systemd for the retired re-resolve units
  ansible.builtin.systemd_service:
    daemon_reload: true
  become: true
