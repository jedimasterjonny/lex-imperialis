---
- name: Create the config directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - /etc/grafana
    - /etc/grafana/provisioning/datasources
    - /etc/grafana/provisioning/dashboards
    - /etc/grafana/dashboards
  become: true

- name: Provision the prometheus datasource
  ansible.builtin.template:
    src: datasource.yml.j2
    dest: /etc/grafana/provisioning/datasources/prometheus.yml
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Restart grafana

- name: Provision the dashboard provider
  ansible.builtin.copy:
    src: dashboards.yml
    dest: /etc/grafana/provisioning/dashboards/default.yml
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Restart grafana

# Fetched on the controller and rewritten on the way in: get_url then replace
# would re-download over the rewritten file and report changed every converge.
#
# A grafana.com export names its datasource with an __inputs placeholder —
# "${DS_PROMETHEUS}" on every panel — which the UI's import form substitutes and
# the FILE PROVISIONER does not. Provisioned as published, such a dashboard reaches
# Grafana with a datasource reference naming a variable it does not declare, and
# every panel on it fails to resolve one. The dashboard still lists and still
# opens, so nothing short of reading a panel notices.
#
# This is not only the unpoller dashboards: of the six pinned here, 1860 and 16124
# declare a real templating datasource variable and carry no placeholder, while
# 15798 carries one on all 24 of its panel and target references — so "Docker
# monitoring" has been provisioning broken for as long as it has been deployed,
# and this rewrite is what fixes it.
#
# The pattern is uppercase-only deliberately: 1860's panels reference
# ${ds_prometheus}, which IS a declared variable, and a case-insensitive match
# would break the one family of dashboards that was working.
- name: Provision the dashboards, resolving the export's datasource placeholders
  vars:
    grafana_download: https://grafana.com/api/dashboards/{{ item.id }}/revisions/{{ item.revision }}/download
  ansible.builtin.copy:
    content: >-
      {{ lookup('ansible.builtin.url', grafana_download, split_lines=false)
         | regex_replace('\$\{DS_[A-Z0-9_.-]+\}', grafana_datasource_uid) }}
    dest: /etc/grafana/dashboards/{{ item.file }}
    owner: root
    group: root
    mode: "0644"
  become: true
  loop: "{{ grafana_dashboards }}"
  loop_control:
    label: "{{ item.file }}"
  notify: Restart grafana

# Keeps the password out of the world-readable unit; grafana reads it from the
# environment instead.
- name: Deploy the environment file
  ansible.builtin.template:
    src: env.j2
    dest: /etc/grafana/env
    owner: root
    group: root
    mode: "0600"
  become: true
  no_log: true
  notify: Restart grafana

# The caddy role owns /etc/caddy/sites and imports every sites/*.caddy into the
# wildcard vhost; this snippet routes grafana.<domain> to the container.
- name: Register the caddy reverse-proxy snippet
  ansible.builtin.template:
    src: grafana.caddy.j2
    dest: /etc/caddy/sites/grafana.caddy
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Restart caddy for grafana

- name: Install the grafana container unit
  ansible.builtin.template:
    src: grafana.container.j2
    dest: /etc/containers/systemd/grafana.container
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Restart grafana

- name: Apply pending unit changes
  ansible.builtin.meta: flush_handlers

- name: Start grafana
  ansible.builtin.systemd_service:
    name: grafana
    state: started
  become: true
