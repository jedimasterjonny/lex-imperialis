---
# Debian, not Tumbleweed: auspex is the only host this role runs on, and the role
# branches on nothing — no packages, no OS-conditional defaults — so a second
# platform buys no coverage, only runtime. Same reasoning as the prometheus
# scenario beside it.
#
# podman mounts overlays for its storage, which incus only permits in a
# nested-container-capable instance. The CI runner's AppArmor denies a nested
# runtime's sysctl fd-reopen, so drop the profile — the instance is throwaway.
platforms:
  - name: "lex-unpoller-incus-${MOLECULE_RUN_ID:-local}"
    image: images:debian/13/cloud
    config:
      security.nesting: "true"
      raw.lxc: lxc.apparmor.profile=unconfined
# There is no UniFi controller in a scenario, so the poller is given a sentinel
# key and an unreachable URL. It logs the connection failure and serves /metrics
# anyway, which is what verify asserts on — the plumbing, not a successful poll.
# The sentinel is what proves the 0600 environment file reached the container's
# environment; it authenticates nothing.
provisioner:
  inventory:
    group_vars:
      all:
        unpoller_url: https://unifi.invalid
        unpoller_api_key: sentinel-not-a-real-key
        # Restated at the role's own default so verify has one source for it
        # rather than a literal in two places.
        unpoller_listen_address: 127.0.0.1:9130
