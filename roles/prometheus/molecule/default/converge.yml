---
- name: Converge
  hosts: all
  tasks:
    - name: Apply the podman role
      ansible.builtin.include_role:
        name: podman

    # No vars: the scrape targets come from the scenario's group_vars, so this and
    # side_effect converge the same set and cannot drift apart.
    - name: Apply the prometheus role
      ansible.builtin.include_role:
        name: prometheus
