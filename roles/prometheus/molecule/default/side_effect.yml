---
# Regression guard for the single-file bind-mount trap (mechanism in the role's
# tasks): a config change on an already-running container must recreate it, or the
# stale inode mount keeps the old config. verify asserts the new target took effect.
- name: Change the rendered config on the running prometheus
  hosts: all
  tasks:
    - name: Re-apply prometheus with an added sentinel target
      ansible.builtin.include_role:
        name: prometheus
      # The Alertmanager list is the change under test — since this role stopped
      # scraping the fleet it is the only target list it still has. The rest mirror
      # converge and must stay: defaults would drop the receiver, the out-of-order
      # window, and the apparmor=unconfined the nested incus container needs to
      # start.
      vars:
        prometheus_alertmanager_targets:
          - localhost:9093
          - sentinel-regression:9093
        prometheus_remote_write_receiver: true
        prometheus_out_of_order_time_window: 4h
        prometheus_security_opt_extra:
          - apparmor=unconfined
