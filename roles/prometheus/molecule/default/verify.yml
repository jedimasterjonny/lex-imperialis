---
- name: Verify
  hosts: all
  gather_facts: false
  # Both resolved lazily, at the point of use, so they can name a register set
  # further down. Each is read by two tasks that would otherwise restate it.
  vars:
    prometheus_expected_jobs: ['alertmanager', 'blackbox', 'cadvisor', 'node', 'prometheus']
    prometheus_inspected: "{{ prometheus_inspect.stdout | from_json | first }}"
  tasks:
    - name: Wait for prometheus to be ready
      ansible.builtin.uri:
        url: http://127.0.0.1:9090/-/ready
        status_code: 200
      register: prometheus_ready
      until: prometheus_ready.status == 200
      retries: 30
      delay: 2

    - name: Read prometheus's own metrics
      ansible.builtin.uri:
        url: http://127.0.0.1:9090/metrics
        return_content: true
      register: prometheus_metrics

    # The property a rendered-file check cannot see, and the one this whole role
    # now rests on: the process holds a TSDB. Its predecessor ran the same image
    # with --agent, which keeps no local storage and refuses rule_files outright,
    # so a stray --agent creeping back into Exec= would leave every shipped rule
    # unevaluated while /-/ready still answered 200. Both halves are asserted
    # because either alone is satisfiable by accident.
    - name: The process holds a TSDB and is not running in agent mode
      vars:
        # Double-quoted so YAML turns \n into a real newline, anchoring the match
        # to the sample line: unanchored it would also hit the # HELP line and
        # prometheus_tsdb_head_series_created_total.
        prometheus_head_series_sample: "\nprometheus_tsdb_head_series "
      ansible.builtin.assert:
        that:
          - prometheus_head_series_sample in prometheus_metrics.content
          - "'prometheus_agent_active_series' not in prometheus_metrics.content"
        fail_msg: >-
          No prometheus_tsdb_head_series sample, or prometheus_agent_* series are
          present — this process is not storing samples locally. Without a TSDB
          there is nothing for the shipped rules to evaluate against, and agent
          mode rejects rule_files by name at startup.

    # Poll, not a one-shot read: verify runs right after side_effect recreates the
    # container, and /-/ready goes green before the scrape pools register their
    # targets. Waits for PRESENCE only, deliberately weaker than the assertion
    # below — an extra job would satisfy this, and must fail rather than be waited
    # out.
    - name: Wait for all five scrape jobs to register
      ansible.builtin.uri:
        url: http://127.0.0.1:9090/api/v1/targets
        return_content: true
      register: prometheus_targets
      until:
        - >-
          prometheus_expected_jobs
          | difference(prometheus_targets.json.data.activeTargets
                       | map(attribute='labels.job') | unique | list)
          | length == 0
      retries: 30
      delay: 2

    # Exact equality, where the wait above only demanded presence. Both directions
    # matter: this host is the fleet's only scraper, so a job dropped from the
    # template takes every series it carried with it and no other writer backfills
    # them — and a job arriving twice, or a stray one creeping in, double-writes
    # series that then have two sources. The self-scrape is load-bearing twice
    # over: PrometheusRuleEvaluationFailing and PrometheusConfigReloadFailed read
    # it, and nothing off this host reports on the rule evaluator's health.
    - name: The scraped job set is exactly the five the role renders
      vars:
        prometheus_scraped_jobs: >-
          {{ prometheus_targets.json.data.activeTargets
             | map(attribute='labels.job') | unique | sort }}
      ansible.builtin.assert:
        that:
          - prometheus_scraped_jobs == prometheus_expected_jobs
        fail_msg: >-
          this server scraped {{ prometheus_scraped_jobs }} — the fleet's only
          scraper is missing a job, and nothing else writes those series.
        quiet: true

    # The routing half of the role's boundary, asserted by the until: — the task
    # fails after 30 retries if the alerting block never took, so it needs no
    # separate assert. Polled like the scrape jobs: the static target is
    # discovered shortly after /-/ready, even though nothing listens on 9093.
    - name: Wait for the alertmanager to register
      ansible.builtin.uri:
        url: http://127.0.0.1:9090/api/v1/alertmanagers
        return_content: true
      register: prometheus_alertmanagers
      until:
        - >-
          prometheus_alertmanagers.json.data.activeAlertmanagers
          | selectattr('url', 'search', 'localhost:9093') | list | length > 0
      retries: 30
      delay: 2

    - name: Read the loaded alert rules
      ansible.builtin.uri:
        url: http://127.0.0.1:9090/api/v1/rules
        return_content: true
      register: prometheus_loaded_rules

    # The rule_files glob and the mounted rules directory both have to take effect
    # for these rules to appear. The shipped file is the roster: parsed on the
    # controller and compared as a set against what Prometheus loaded, so a new
    # alert needs no edit here and one that fails to load has nowhere to hide. The
    # two length assertions are not redundant with the set compare — set equality
    # alone passes a duplicated name masking a missing one, and two empty lists are
    # trivially equal, which is the shape this whole assertion exists to refuse.
    - name: The shipped alert rules are loaded
      vars:
        prometheus_shipped_alerts: >-
          {{ (lookup('file', playbook_dir | dirname | dirname ~ '/files/rules/alerts.yml')
              | from_yaml).groups | map(attribute='rules') | flatten
             | selectattr('alert', 'defined') | map(attribute='alert') | list }}
        prometheus_loaded_alerts: >-
          {{ prometheus_loaded_rules.json.data.groups | map(attribute='rules') | flatten
             | selectattr('type', 'eq', 'alerting') | map(attribute='name') | list }}
      ansible.builtin.assert:
        that:
          - prometheus_shipped_alerts | length > 0
          - prometheus_loaded_alerts | length == prometheus_shipped_alerts | length
          - prometheus_loaded_alerts | sort == prometheus_shipped_alerts | sort
        fail_msg: >-
          the loaded alert rules don't match those shipped in alerts.yml — loaded
          {{ prometheus_loaded_alerts | sort }}, shipped {{ prometheus_shipped_alerts | sort }}

    # MicroOSBuildStale reads a fortnight back, so its correctness rests on retention
    # outlasting that window. Retention is set in prometheus.yml rather than as the
    # deprecated CLI flag, so nothing in the container's argv proves it landed. Assert the
    # resolved seconds rather than /status/runtimeinfo's duration string, which is
    # canonicalised on the way out — any exact multiple of a week comes back as weeks, so
    # a retention of 28d reads "4w" and a string equality would red this scenario on a
    # perfectly good config. Seconds also catch the setting being shortened past the
    # window, which an equality against the variable never would.
    #
    # Above 15d rather than the rule's 14d, because 15d is Prometheus's own default: at
    # 14d this would pass with the storage block gone entirely, which is the one thing it
    # is here to notice.
    - name: Read the resolved TSDB retention
      ansible.builtin.uri:
        url: http://127.0.0.1:9090/api/v1/query?query=prometheus_tsdb_retention_limit_seconds
        return_content: true
      register: prometheus_retention_seconds
      until: prometheus_retention_seconds.json.data.result | length > 0
      retries: 30
      delay: 2

    - name: Retention is configured, and outlasts the window MicroOSBuildStale reads
      ansible.builtin.assert:
        that:
          - prometheus_retention_seconds.json.data.result[0].value[1] | float > 15 * 86400
        fail_msg: >-
          prometheus resolved a retention of
          {{ prometheus_retention_seconds.json.data.result[0].value[1] | float / 86400 }}
          days, so either the configured value never reached it or it no longer outlasts
          the 14d window MicroOSBuildStale reads — the rule has no guarantee of the
          history it needs

    # Whether a rule fires on its fault is promtool's job (roles/prometheus/tests).
    # This is the property promtool cannot see: two rules holding the same roster of
    # units in two syntaxes, 200 lines apart. SystemdUnitFailed excludes those units
    # by regex on the grounds that each has a bespoke *Failed rule, and
    # ScheduledJobMetricMissing is what makes that grounds true. Exclude a ninth
    # oneshot there and forget it here and the unit is covered by neither — silently,
    # which is the exact failure this pair exists to prevent. Compare the sets rather
    # than trusting a comment; both queries are already in the register above.
    - name: The two rules that share the oneshot roster agree on it
      vars:
        prometheus_roster_queries: >-
          {{ prometheus_loaded_rules.json.data.groups | map(attribute='rules') | flatten
             | selectattr('name', 'in', ['SystemdUnitFailed', 'ScheduledJobMetricMissing'])
             | items2dict(key_name='name', value_name='query') }}
        # SystemdUnitFailed carries the roster as one alternation inside a name!~
        # matcher, so match each member on the | or ) that follows it — the trailing
        # member has no pipe. ScheduledJobMetricMissing carries one name= per clause.
        prometheus_excluded_units: >-
          {{ prometheus_roster_queries.SystemdUnitFailed
             | regex_findall('([a-z-]+)(?=[|)])') | sort }}
        prometheus_covered_units: >-
          {{ prometheus_roster_queries.ScheduledJobMetricMissing
             | regex_findall('name="([a-z-]+)[.]service"') | sort }}
      ansible.builtin.assert:
        that:
          - prometheus_excluded_units | length == 8
          - prometheus_excluded_units == prometheus_covered_units
        fail_msg: >-
          SystemdUnitFailed excludes {{ prometheus_excluded_units }} but
          ScheduledJobMetricMissing covers {{ prometheus_covered_units }} — a unit
          excluded from the catch-all with no outcome-metric alert behind it is
          monitored by neither rule
        quiet: true

    - name: Read the loaded runtime config
      ansible.builtin.uri:
        url: http://127.0.0.1:9090/api/v1/status/config
        return_content: true
      register: prometheus_loaded_config

    # side_effect added this target after the container was already up. Finding it
    # in the config the PROCESS loaded — not the file on disk — is what proves the
    # restart handler applied the change; without it Prometheus would go on
    # scraping its previous target list with nothing reporting the divergence.
    - name: The side-effect config change reached the running prometheus
      ansible.builtin.assert:
        that:
          - "'sentinel-regression:9100' in prometheus_loaded_config.json.data.yaml"
        fail_msg: >-
          The running prometheus did not pick up the config change, so the restart
          handler did not fire and it is still scraping the previous targets.

    # The group's module has to survive as __param_module into the URL actually
    # scraped, or a target silently falls back to the exporter's default module.
    # Anchor on the parameter boundary: a bare 'module=http_2xx' is also satisfied
    # by 'module=http_2xx_or_401'.
    - name: The blackbox target is scraped with its group's prober module
      vars:
        prometheus_blackbox_scrape_urls: >-
          {{ prometheus_targets.json.data.activeTargets
             | selectattr('labels.job', 'eq', 'blackbox')
             | map(attribute='scrapeUrl') | list }}
      ansible.builtin.assert:
        that:
          - prometheus_blackbox_scrape_urls | select('search', 'module=http_2xx(&|$)') | list | length > 0
          - prometheus_blackbox_scrape_urls | select('search', 'target=https%3A%2F%2Fexample.com') | list | length > 0
        fail_msg: >-
          The blackbox scrape URLs {{ prometheus_blackbox_scrape_urls }} do not carry
          the entry's module and target, so the probe would run the exporter's
          default module against the wrong thing.

    # Both properties of the cadvisor job, parsed and scoped to it rather than
    # substring-matched against the whole document: every other job honours
    # timestamps, and Prometheus renders that default explicitly into the loaded
    # config, so a flat search would pass on any of them. node is asserted
    # alongside to prove the override did not land globally.
    #
    # The relabels are copied from the agent this role absorbed and the Grafana
    # 15798 dashboard depends on them, so dropping either fails here rather than
    # silently as empty panels.
    - name: The cadvisor job stamps at scrape time and rebuilds the container labels
      vars:
        prometheus_loaded_jobs: "{{ (prometheus_loaded_config.json.data.yaml | from_yaml).scrape_configs }}"
        prometheus_cadvisor_job: "{{ prometheus_loaded_jobs | selectattr('job_name', 'eq', 'cadvisor') | first }}"
        prometheus_node_job: "{{ prometheus_loaded_jobs | selectattr('job_name', 'eq', 'node') | first }}"
      ansible.builtin.assert:
        that:
          - prometheus_cadvisor_job.honor_timestamps is defined
          - not prometheus_cadvisor_job.honor_timestamps
          - prometheus_node_job.honor_timestamps
          - >-
            prometheus_cadvisor_job.metric_relabel_configs
            | map(attribute='target_label') | sort == ['container', 'image']
          - >-
            prometheus_cadvisor_job.metric_relabel_configs
            | selectattr('regex', 'search', 'libpod-payload-') | list | length == 2
        fail_msg: >-
          The cadvisor job honours cadvisor's own timestamps, so every idle
          container's repeated sample is dropped as out-of-order and the series
          gains no point — or the override leaked to the other jobs, or the
          metric_relabel_configs that rebuild the dashboard's container and image
          labels from the cgroup id did not reach the loaded config.

    - name: Read prometheus's security posture
      ansible.builtin.command: podman inspect prometheus
      become: true
      register: prometheus_inspect
      changed_when: false

    # BoundingCaps, not EffectiveCaps: this image runs non-root, whose
    # EffectiveCaps are empty whatever the drop says — asserting on those would be
    # a check that cannot fail. Only the bounding set reflects DropCapability=all.
    # The non-root user comes from the image rather than this role, so an upstream
    # change could drop it silently; assert it explicitly.
    - name: Prometheus keeps no capabilities, bars escalation and runs non-root
      ansible.builtin.assert:
        that:
          - prometheus_inspected.BoundingCaps | default([], true) | sort == []
          - "'no-new-privileges' in (prometheus_inspected.HostConfig.SecurityOpt | default([], true))"
          - prometheus_inspected.Config.User == 'nobody'
        fail_msg: >-
          prometheus's posture has regressed: bounding caps
          {{ prometheus_inspected.BoundingCaps | default([], true) }}, security-opt
          {{ prometheus_inspected.HostConfig.SecurityOpt | default([], true) }}, user
          {{ prometheus_inspected.Config.User }}.
        quiet: true

    # The TSDB must outlive the container: every config change recreates it, and a
    # scratch upper layer would take a year of history with it each time.
    - name: The TSDB is a named volume, not the container's writable layer
      vars:
        prometheus_tsdb_mounts: >-
          {{ prometheus_inspected.Mounts | default([], true)
             | selectattr('Destination', 'eq', '/prometheus') | list }}
      ansible.builtin.assert:
        that:
          - prometheus_tsdb_mounts | length == 1
          - prometheus_tsdb_mounts | map(attribute='Name', default='') | list == ['prometheus-data']
        fail_msg: >-
          /prometheus is not backed by the prometheus-data named volume — the TSDB
          would be discarded on the next config change that recreates the container.
        quiet: true

    # The inquisition's `unpinned` class reads exactly this, and a quadlet whose
    # Image lost its digest is a container that silently drifts on the next pull.
    - name: The quadlet pins its image by digest
      ansible.builtin.command: grep -E '^Image=.*@sha256:[0-9a-f]{64}$' /etc/containers/systemd/prometheus.container
      become: true
      register: prometheus_pin
      changed_when: false
      failed_when: prometheus_pin.rc != 0
