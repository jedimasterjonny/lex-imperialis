---
- name: Verify
  hosts: all
  gather_facts: false
  vars_files:
    - ../../defaults/main.yml
  tasks:
    - name: Wait for prometheus to be ready
      ansible.builtin.uri:
        url: http://127.0.0.1:9090/-/ready
        status_code: 200
      register: prometheus_ready
      until: prometheus_ready.status == 200
      retries: 30
      delay: 2

    # Poll, not a one-shot read: verify runs right after side_effect recreates the
    # container, and /-/ready goes green before the scrape pools register their
    # targets.
    - name: Wait for the self-scrape job to register
      ansible.builtin.uri:
        url: http://127.0.0.1:9090/api/v1/targets
        return_content: true
      register: prometheus_targets
      until:
        # The self-scrape backs PrometheusRuleEvaluationFailing and
        # PrometheusConfigReloadFailed; dropping the job would silently strip both
        # alerts of their metrics while every other check here stayed green. It is
        # the only job this role renders — the fleet's targets belong to
        # prometheus_agent, whose own scenario asserts them.
        - >-
          prometheus_targets.json.data.activeTargets
          | selectattr('labels.job', 'eq', 'prometheus') | list | length > 0
      retries: 30
      delay: 2

    # This is the routing half of the role's boundary, asserted by the until: —
    # the task fails after 30 retries if the alerting block never took, so it
    # needs no separate assert. Polled like the scrape job: the static target is
    # discovered shortly after /-/ready, even though nothing listens on 9093.
    - name: Wait for the alertmanager to register
      ansible.builtin.uri:
        url: http://127.0.0.1:9090/api/v1/alertmanagers
        return_content: true
      register: prometheus_alertmanagers
      until:
        - >-
          prometheus_alertmanagers.json.data.activeAlertmanagers
          | selectattr('url', 'search', 'localhost:9093') | list | length > 0
      retries: 30
      delay: 2

    - name: Read the loaded alert rules
      ansible.builtin.uri:
        url: http://127.0.0.1:9090/api/v1/rules
        return_content: true
      register: prometheus_loaded_rules

    # The rule_files glob and its mounted rule both have to take effect for these
    # rules to appear. The shipped file is the roster: parsed on the controller
    # and compared as a set against what Prometheus loaded, so a new alert needs
    # no edit here and one that fails to load has nowhere to hide. The two length
    # assertions are not redundant with the set compare — set equality alone
    # passes a duplicated name masking a missing one, and two empty lists are
    # trivially equal, which is the shape this whole assertion exists to refuse.
    - name: The shipped alert rules are loaded
      vars:
        prometheus_shipped_alerts: >-
          {{ (lookup('file', playbook_dir | dirname | dirname ~ '/files/rules/alerts.yml')
              | from_yaml).groups | map(attribute='rules') | flatten
             | selectattr('alert', 'defined') | map(attribute='alert') | list }}
        prometheus_loaded_alerts: >-
          {{ prometheus_loaded_rules.json.data.groups | map(attribute='rules') | flatten
             | selectattr('type', 'eq', 'alerting') | map(attribute='name') | list }}
      ansible.builtin.assert:
        that:
          - prometheus_shipped_alerts | length > 0
          - prometheus_loaded_alerts | length == prometheus_shipped_alerts | length
          - prometheus_loaded_alerts | sort == prometheus_shipped_alerts | sort
        fail_msg: >-
          the loaded alert rules don't match those shipped in alerts.yml — loaded
          {{ prometheus_loaded_alerts | sort }}, shipped {{ prometheus_shipped_alerts | sort }}

    # MicroOSBuildStale reads a fortnight back, so its correctness rests on retention
    # outlasting that window. Retention is set in prometheus.yml rather than as the
    # deprecated CLI flag, so nothing in the container's argv proves it landed. Assert the
    # resolved seconds rather than /status/runtimeinfo's duration string, which is
    # canonicalised on the way out — any exact multiple of a week comes back as weeks, so
    # a retention of 28d reads "4w" and a string equality would red this scenario on a
    # perfectly good config. Seconds also catch the setting being shortened past the
    # window, which an equality against the variable never would.
    #
    # Above 15d rather than the rule's 14d, because 15d is Prometheus's own default: at
    # 14d this would pass with the storage block gone entirely, which is the one thing it
    # is here to notice.
    - name: Read the resolved TSDB retention
      ansible.builtin.uri:
        url: http://127.0.0.1:9090/api/v1/query?query=prometheus_tsdb_retention_limit_seconds
        return_content: true
      register: prometheus_retention_seconds
      until: prometheus_retention_seconds.json.data.result | length > 0
      retries: 30
      delay: 2

    - name: Retention is configured, and outlasts the window MicroOSBuildStale reads
      ansible.builtin.assert:
        that:
          - prometheus_retention_seconds.json.data.result[0].value[1] | float > 15 * 86400
        fail_msg: >-
          prometheus resolved a retention of
          {{ prometheus_retention_seconds.json.data.result[0].value[1] | float / 86400 }}
          days, so either the configured value never reached it or it no longer outlasts
          the 14d window MicroOSBuildStale reads — the rule has no guarantee of the
          history it needs

    # Whether a rule fires on its fault is promtool's job (roles/prometheus/tests).
    # This is the property promtool cannot see: two rules holding the same roster of
    # units in two syntaxes, 200 lines apart. SystemdUnitFailed excludes those units
    # by regex on the grounds that each has a bespoke *Failed rule, and
    # ScheduledJobMetricMissing is what makes that grounds true. Exclude a ninth
    # oneshot there and forget it here and the unit is covered by neither — silently,
    # which is the exact failure this pair exists to prevent. Compare the sets rather
    # than trusting a comment; both queries are already in the register above.
    - name: The two rules that share the oneshot roster agree on it
      vars:
        prometheus_roster_queries: >-
          {{ prometheus_loaded_rules.json.data.groups | map(attribute='rules') | flatten
             | selectattr('name', 'in', ['SystemdUnitFailed', 'ScheduledJobMetricMissing'])
             | items2dict(key_name='name', value_name='query') }}
        # SystemdUnitFailed carries the roster as one alternation inside a name!~
        # matcher, so match each member on the | or ) that follows it — the trailing
        # member has no pipe. ScheduledJobMetricMissing carries one name= per clause.
        prometheus_excluded_units: >-
          {{ prometheus_roster_queries.SystemdUnitFailed
             | regex_findall('([a-z-]+)(?=[|)])') | sort }}
        prometheus_covered_units: >-
          {{ prometheus_roster_queries.ScheduledJobMetricMissing
             | regex_findall('name="([a-z-]+)[.]service"') | sort }}
      ansible.builtin.assert:
        that:
          - prometheus_excluded_units | length == 8
          - prometheus_excluded_units == prometheus_covered_units
        fail_msg: >-
          SystemdUnitFailed excludes {{ prometheus_excluded_units }} but
          ScheduledJobMetricMissing covers {{ prometheus_covered_units }} — a unit
          excluded from the catch-all with no outcome-metric alert behind it is
          monitored by neither rule
        quiet: true

    - name: Read the loaded runtime config
      ansible.builtin.uri:
        url: http://127.0.0.1:9090/api/v1/status/config
        return_content: true
      register: prometheus_loaded_config

    # side_effect added this target; finding it in the LOADED config proves the
    # recreate applied the change — a stale single-file mount + reload would not.
    - name: The side-effect config change reached the running container
      ansible.builtin.assert:
        that:
          - "'sentinel-regression:9093' in prometheus_loaded_config.json.data.yaml"
        fail_msg: >-
          The running prometheus did not pick up the config change — the container
          was not recreated (stale single-file bind mount).

    # The role's boundary, asserted rather than assumed: it routes to Alertmanager
    # and scrapes nothing but itself. Both halves fail differently — an alerting
    # block that lost its target delivers nothing, while a scrape job creeping back
    # in duplicates what the agent already sends, so one Alertmanager arrives under
    # two instance labels and InstanceDown fires on a blipping network path rather
    # than on Alertmanager being down. The same reasoning holds for node, cadvisor
    # and blackbox: re-add any of them here and every one of those series is
    # ingested twice, once from each writer.
    - name: Nothing but this server is scraped
      vars:
        scraped_jobs: >-
          {{ prometheus_targets.json.data.activeTargets
             | map(attribute='labels.job') | unique | sort }}
      ansible.builtin.assert:
        that:
          - scraped_jobs == ["prometheus"]
        fail_msg: >-
          this server must scrape only itself, but it scraped {{ scraped_jobs }}.
          A job creeping back gives those series two writers — the agent already
          sends them — so every sample is ingested twice.

    # Rendered from prometheus_out_of_order_time_window. Read back from the config
    # Prometheus resolved rather than the file on disk: the point is that it
    # reached the process, since without it an agent's replayed backlog is
    # rejected as out of bounds and lost with no error anyone sees.
    - name: The out-of-order ingestion window reached the running config
      ansible.builtin.assert:
        that:
          - "'out_of_order_time_window: 4h' in prometheus_loaded_config.json.data.yaml"
        fail_msg: >-
          The resolved config carries no out_of_order_time_window, so a writing
          agent's WAL buffer is notional — anything older than the last compacted
          block is dropped on reconnect.

    # A path, not a readable flag: without --web.enable-remote-write-receiver the
    # endpoint 404s, and with it an empty body is a 400. So a non-404 is the only
    # proof the flag reached the process — asserting on the rendered compose file
    # would pass on a container that never took it.
    - name: Probe the remote-write receiver
      ansible.builtin.uri:
        url: http://127.0.0.1:9090/api/v1/write
        method: POST
        body: ""
        status_code: [200, 204, 400, 404, 405, 415]
      register: prometheus_remote_write_probe

    - name: The remote-write receiver accepts pushes
      ansible.builtin.assert:
        that:
          - prometheus_remote_write_probe.status != 404
        fail_msg: >-
          /api/v1/write returned 404, so --web.enable-remote-write-receiver never
          reached the container and an agent writing here would be refused.

    # The checks above prove prometheus works; they can't prove its capability set
    # is minimal. Assert the posture directly so a regression that widens the caps
    # or drops the restriction fails here, not silently in production.
    - name: Read prometheus's security posture
      ansible.builtin.command: docker inspect prometheus
      register: prometheus_inspect
      changed_when: false

    # docker inspect exposes the request (HostConfig), not podman's EffectiveCaps/
    # BoundingCaps: CapDrop == [ALL] with an empty CapAdd is the docker equivalent
    # of "no capabilities" (either half missing widens them). Match no-new-privileges
    # as a substring — docker's rendering of the :true suffix is not guaranteed
    # (podman drops it, docker may not).
    - name: Prometheus keeps no capabilities and bars privilege escalation
      vars:
        prometheus: "{{ prometheus_inspect.stdout | from_json | first }}"
      ansible.builtin.assert:
        that:
          - "prometheus.HostConfig.CapDrop | default([], true) | sort == ['ALL']"
          - "prometheus.HostConfig.CapAdd | default([], true) == []"
          - >-
            prometheus.HostConfig.SecurityOpt | default([], true)
            | select('search', 'no-new-privileges') | list | length > 0
        fail_msg: "prometheus's capability or no-new-privileges posture has regressed"
        quiet: true

    # The container runs as a pinned uid:gid so the TSDB mount is 0755 owned by that
    # user, not world-writable. A regression that drops `user:` reverts Config.User
    # to the image default (a name, nobody), which needs the 0777 dir back.
    - name: Prometheus runs as a pinned uid:gid, not the image-default nobody
      vars:
        prometheus: "{{ prometheus_inspect.stdout | from_json | first }}"
      ansible.builtin.assert:
        that:
          - prometheus.Config.User | default('', true) is match('^[0-9]+:[0-9]+$')
        fail_msg: "prometheus is not pinned to a uid:gid — it may be running as the image-default nobody"
        quiet: true

    - name: Stat the TSDB data directory
      ansible.builtin.stat:
        path: "{{ prometheus_data_dir }}"
      register: prometheus_data_stat

    # 0755 closes the world-writable hole; owned-by-the-container-uid is the other
    # half — a 0755 dir the container cannot write is just as broken. The pinned-uid
    # assert above guarantees Config.User is numeric, so int() here is safe.
    - name: The TSDB data dir is 0755 and owned by the uid the container runs as
      vars:
        prometheus: "{{ prometheus_inspect.stdout | from_json | first }}"
        container_uid: "{{ prometheus.Config.User | regex_replace(':.*$', '') | int }}"
      ansible.builtin.assert:
        that:
          - prometheus_data_stat.stat.exists
          - prometheus_data_stat.stat.isdir
          - prometheus_data_stat.stat.mode == '0755'
          - prometheus_data_stat.stat.uid == container_uid
        fail_msg: >-
          the prometheus data dir is not 0755 owned by the container's uid — the TSDB
          is world-writable or the container cannot write it
        quiet: true
