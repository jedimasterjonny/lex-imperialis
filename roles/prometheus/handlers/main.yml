---
# Uniquely named, never a fleet-shared "Restart …": a duplicate handler name
# whose winning definition lives in a later role is not flushed by this role's
# mid-play flush_handlers, so the restart is lost. daemon_reload regenerates the
# quadlet-derived unit before restarting it.
#
# A restart is what applies a changed config or rule file: Prometheus reads both
# only at start, and the rules ride a directory mount that a hot /-/reload would
# see but nothing here fires.
- name: Restart prometheus
  ansible.builtin.systemd_service:
    name: prometheus
    state: restarted
    daemon_reload: true
  become: true
