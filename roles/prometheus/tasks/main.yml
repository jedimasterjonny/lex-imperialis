---
- name: Create the config directory
  ansible.builtin.file:
    path: "{{ prometheus_config_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Deploy the prometheus config
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: "{{ prometheus_config_dir }}/prometheus.yml"
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Restart prometheus

# Alert rules load only when an alertmanager is configured — rule_files is
# rendered under the same condition, so deploying them otherwise would leave a
# directory nothing reads.
- name: Deploy the alert rules
  when: prometheus_alertmanager_targets | length > 0
  become: true
  block:
    - name: Create the rules directory
      ansible.builtin.file:
        path: "{{ prometheus_config_dir }}/rules"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Deploy the alert rules file
      ansible.builtin.copy:
        src: rules/alerts.yml
        dest: "{{ prometheus_config_dir }}/rules/alerts.yml"
        owner: root
        group: root
        mode: "0644"
      notify: Restart prometheus

- name: Install the prometheus container unit
  ansible.builtin.template:
    src: prometheus.container.j2
    dest: /etc/containers/systemd/prometheus.container
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Restart prometheus

# Restart-on-change runs at flush; this generates the quadlet unit and asserts it
# is up even on a converge where nothing changed and no handler fired.
- name: Apply pending unit changes
  ansible.builtin.meta: flush_handlers

- name: Start prometheus
  ansible.builtin.systemd_service:
    name: prometheus
    state: started
  become: true
