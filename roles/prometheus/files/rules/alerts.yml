# Managed by Ansible (prometheus role).
groups:
  - name: availability
    rules:
      # Excludes the blackbox job: its targets are probe URLs that all scrape the
      # one co-located exporter, so up==0 there means the exporter is unreachable,
      # not that the targets are down. BlackboxExporterDown catches that once, and
      # ProbeDown catches an actually-failing target.
      - alert: InstanceDown
        expr: up{job != "blackbox"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.instance }} ({{ $labels.job }}) is down"
          description: "{{ $labels.instance }} has been unreachable for over 5 minutes."

  - name: probes
    rules:
      # The probe targets all scrape the one co-located exporter, so up==0 across
      # them means the exporter is unreachable, not the targets. Aggregate to a
      # single alert (InstanceDown skips this job). A dead exporter blinds all
      # probing — not just the public sites, but the fleet's containerised services,
      # whose only liveness alert this is — so it is critical.
      - alert: BlackboxExporterDown
        expr: max(up{job="blackbox"}) == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "the blackbox exporter is unreachable — all probing is blind"
          description: "Prometheus cannot scrape the blackbox exporter, so nothing is being probed — not the public sites, not the containerised services."
      # Blackbox probe of a target: probe_success == 0 means it did not answer with a
      # status its prober module accepts — down, DNS broken, or TLS failed. Not just
      # a 2xx: a module may accept others (an auth-walled target answers 401), so key
      # off probe_success, which is the module's own verdict. 5m rides out a transient
      # blip or a deploy.
      - alert: ProbeDown
        expr: probe_success == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "probe of {{ $labels.instance }} is failing"
          description: "The blackbox probe of {{ $labels.instance }} has not answered with an accepted status for over 5 minutes."
      # Every cert here auto-renews well before expiry — the edge ones (Cloudflare,
      # Firebase) and caddy's own DNS-01 wildcard, now that the internal services are
      # probed too. 14 days left means a renewal has silently stalled, with time to
      # intervene by hand. Guarded on the expiry being > 0: blackbox exports 0 both
      # for a failed probe and for a successful non-TLS one (plex is probed over
      # plain HTTP), and 0 - time() is hugely negative — it would satisfy the
      # threshold and fire spuriously. Only warn when a real cert was measured.
      - alert: ProbeSSLCertExpiringSoon
        expr: probe_ssl_earliest_cert_expiry - time() < 14 * 86400 and probe_ssl_earliest_cert_expiry > 0
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "TLS certificate for {{ $labels.instance }} expiring soon"
          description: "The TLS certificate served by {{ $labels.instance }} expires in under 14 days — auto-renewal may have stalled."

  - name: unifi
    rules:
      # up{job="unpoller"} does not cover this. The poller serves /metrics from a
      # snapshot it refreshes in the background, so a revoked API key, a controller
      # reboot or a firmware upgrade that moves an endpoint leaves the scrape green
      # and every unpoller_* series frozen at its last good value — silently wrong,
      # which is worse than absent.
      #
      # cache_age, not unpoller_controller_up: that gauge is only written on a
      # SUCCESSFUL fetch, so it is absent — not 0 — for exactly the failure this
      # alerts on. Confirmed against a running poller with an unreachable
      # controller, which exports no such series at all. -1 is upstream's sentinel
      # for "no refresh has ever succeeded", so it is caught explicitly rather than
      # left to pass a > threshold it never can.
      #
      # 30 missed refreshes at the poller's 60s interval, then 5m: the controller
      # reboots itself for its own auto-updates and the poller picks straight back
      # up, so only a stall that outlasts a firmware update is worth raising.
      - alert: UnpollerPollOverdue
        expr: unpoller_prometheus_cache_age_seconds > 30 * 60 or unpoller_prometheus_cache_age_seconds < 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "unpoller has not polled the UniFi controller in over 30 minutes"
          description: "unpoller is serving a stale snapshot, so the unpoller_* series are frozen at their last values rather than absent."

      # Read from the controller's own health endpoint rather than inferred from
      # the device series. unpoller ships /stat/health as unpoller_site_disconnected,
      # one gauge per subsystem — wlan, wan and lan, alongside the AP, gateway and
      # switch counts for each — so this is the controller stating how many of its
      # adopted devices are not talking to it, which is exactly the fault.
      #
      # The device series cannot answer it. unpoller skips a device only on
      # `!Adopted || Locating`, with no filter on its state, so whether a
      # powered-off AP vanishes from unpoller_device_* or lingers at uptime 0 is
      # upstream's choice and not observable from here — molecule has no controller,
      # and a promtool case only replays whichever assumption it was written with.
      # A rule built on either guess is half a rule.
      #
      # Bounded to one series per subsystem, which is also why it needs no guard on
      # the unpoller scrape: a single site gauge cannot fan out into one alert per
      # device, and when the poller stops the series goes absent and stops matching.
      #
      # Nothing else on the fleet notices this fault: every host is wired and stays
      # up, so Prometheus goes on scraping them happily while the AP serving the
      # house is dead. The cost is naming a subsystem rather than a device.
      #
      # `without (status)` because that label is UniFi's health string, and it
      # changes value on exactly the transition this rule is timing: the second
      # switch to fail moves the series from warning to error, which is a different
      # series — the pending for: would restart, and on partial recovery the firing
      # alert would resolve and re-fire fifteen minutes later. Nothing reads the
      # label, so dropping it from the identity costs nothing.
      - alert: UnifiDeviceDisconnected
        expr: max without (status) (unpoller_site_disconnected) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "{{ $value }} UniFi {{ $labels.subsystem }} device(s) disconnected"
          description: "The controller reports {{ $value }} adopted {{ $labels.subsystem }} device(s) not talking to it — powered off, or the uplink is dead."
      # Uptime resets are reboots. One is a firmware update or a power blip; three
      # in a day is a device power-cycling, which on a PoE-fed AP or switch means
      # the injector, the cable or the supply is failing — a fault that otherwise
      # surfaces only as intermittent WiFi nobody can pin down.
      #
      # No for:. The 24h range is the smoothing — once the third reset lands the
      # expression stays true for a day — so a wait would only add latency. The
      # promtool cases pin that by asserting the evaluation the third reset lands on.
      - alert: UnifiDeviceRebootLoop
        expr: resets(unpoller_device_uptime_seconds[24h]) > 2
        labels:
          severity: warning
        annotations:
          summary: "UniFi device {{ $labels.name }} has rebooted {{ $value }} times in 24 hours"
          description: "{{ $labels.name }} ({{ $labels.type }}) is power-cycling rather than running — check its injector, its cable and its supply."
      # The outcome check on UniFi's own auto-update. That schedule cannot be read
      # back over any documented API — the console's per-component rows are
      # authoritative, and the Site Manager field that looks like it says whether
      # applications update does not — so this asserts the result instead. Any
      # 8-day span contains a scheduled window, so an update still pending across
      # one has sat through that window without landing.
      #
      # min_over_time rather than a for: of the same length. auspex reboots weekly
      # for its own autoupdate and a restart resets every pending for: timer, so a
      # for: 8d would be wiped each Tuesday and could never fire; reading the range
      # out of the TSDB survives it. The second term requires the series to have
      # existed 8 days ago too, so a newly-published update cannot alert on a min
      # taken over the handful of samples it has.
      #
      # present_over_time rather than a bare instant selector at offset, which a
      # single missed scrape eight days ago would defeat — same shape and same
      # reason as MicroOSBuildStale below.
      - alert: UnifiFirmwareUpdatePending
        expr: |
          min_over_time(unpoller_device_upgradable[8d]) == 1
            and present_over_time(unpoller_device_upgradable[1d] offset 8d)
        labels:
          severity: warning
        annotations:
          summary: "UniFi firmware update pending on {{ $labels.name }} for over 8 days"
          description: "{{ $labels.name }} ({{ $labels.type }}) has had a firmware update available across a full auto-update window without it landing."
      # Airtime: the one radio measure that explains bad WiFi rather than merely
      # describing it. A saturated channel is slow for every client on it, and no
      # host-side exporter can see the medium at all.
      #
      # 0.5, not 70. unpoller divides UniFi's 0-100 cu_total by 100, so this is a
      # RATIO — a threshold written as 70 would never fire, and nothing else in the
      # file would say so.
      #
      # Calibrated from live readings rather than history, because the controller
      # keeps none: its 5minutes/hourly/daily .ap report tables span a week and
      # carry no cu_* field at all, so airtime exists only as the instantaneous
      # value in stat/device. The two points that do exist are the busiest radio
      # here sitting at 0.17, and the incident this rule was written for — a
      # crashed device in a null packet storm, which held a radio at 0.70 for most
      # of a day and was found only by eye, in a dashboard. 0.5 is ~3x the observed
      # normal and clear of the known-bad. Worth revisiting once the TSDB holds a
      # few weeks of it.
      #
      # That the fault was a crashed device is why this rule is not redundant with
      # UnifiDeviceDisconnected: the device stayed adopted and stayed talking to the
      # controller. It was flooding, not absent, so the site health count never
      # moved. Airtime is the only signal that saw it.
      #
      # avg_over_time rather than a for: of the same length. Airtime is a sampled
      # instantaneous gauge and a noisy one, so a for: — which demands every
      # evaluation in the window exceed — resets on a single dip and can leave a
      # genuinely congested radio alerting late or not at all. The mean over the
      # window is what "sustained" means here, and it also rides out the legitimate
      # spike of one large transfer. It cannot flap either: over a full window a 15m
      # mean of 60s samples moves by at most (new-old)/15 per evaluation, so the
      # smoothing is also the hysteresis — the same argument UnifiDeviceRebootLoop
      # makes for its 24h range.
      #
      # 15m and not 30m. The known incident ran for hours, so any window would have
      # caught it and the window is not calibrated against it — it is chosen so a
      # SHORTER recurrence is caught too. At 30m a ten-minute event at 0.70 against
      # this background averages 0.35 and would pass unremarked; at 15m it reaches
      # 0.52 and fires. The other side is bounded by test rather than by argument:
      # a five-minute transfer spike at 0.80 averages 0.37 over 15m, and the
      # promtool case fails if that ever starts alerting.
      - alert: UnifiRadioAirtimeHigh
        expr: avg_over_time(unpoller_device_radio_channel_utilization_total_ratio[15m]) > 0.5
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.name }} {{ $labels.band }} GHz airtime at {{ $value | humanizePercentage }}"
          description: >-
            The {{ $labels.band }} GHz radio on {{ $labels.name }} has averaged
            {{ $value | humanizePercentage }} airtime over 15 minutes — every client on
            that channel is slow. Compare its receive and transmit ratios against
            total: close to it is our own saturation, far below is a neighbouring
            network, and the remedy differs.
      # Wired packet loss, from the only place the fleet can see it. There is no
      # per-client loss metric — and the client families are filtered out at ingest
      # anyway — so the switch port is the instrument: an erroring port is a
      # physical fault, and every wired client behind it suffers.
      #
      # Errors and not drops. Measured across every up port on this fleet, the two
      # error counters are zero everywhere bar a single port carrying 2 in its
      # lifetime against 3.2M packets, so any sustained error rate is abnormal and
      # needs no baseline subtracted. The dropped counters are the opposite: four
      # ports carry them permanently, at 1e-5 to 4e-5 of their traffic, because a
      # switch drops legitimately — a rule on those would fire forever.
      #
      # A rate, not the counter: these are lifetime totals that only ever climb, so
      # a threshold on the raw value fires once and never clears. rate() also
      # absorbs the reset when a switch reboots.
      #
      # Summed rather than two rules, because a fault shows on whichever direction
      # it happens to hit and both counters carry the same label set, so the
      # addition matches one-to-one and yields one alert per port. The promtool
      # cases fault each direction separately, so dropping either term fails.
      #
      # 0.1/s — about 90 errors across the window — is the one threshold on this
      # branch with no observed bad case behind it: the fleet has never recorded an
      # erroring port, so it is set from the zero baseline plus room for a duplex
      # renegotiation rather than measured against a fault. Worth revisiting the
      # first time a cable does go bad.
      - alert: UnifiPortErrorsHigh
        expr: |
          rate(unpoller_device_port_receive_errors_total[15m])
            + rate(unpoller_device_port_transmit_errors_total[15m]) > 0.1
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.port_id }} is logging {{ printf \"%.2f\" $value }} errors/s"
          description: >-
            {{ $labels.port_id }} has logged {{ printf "%.2f" $value }} receive and
            transmit errors a second for 15 minutes, where every port on this fleet
            normally sits at zero. That is a physical fault, not congestion: reseat
            or replace the cable, and check the link has not negotiated down.

  - name: backups
    rules:
      - alert: PodmanBackupFailed
        expr: podman_backup_success == 0
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "podman backup failed on {{ $labels.instance }}"
          description: "The last podman volume backup run on {{ $labels.instance }} failed."
      # The weekly timer caps a healthy run at ~7 days old; 8 gives a day's grace
      # before flagging a run that never fired (the metric stops advancing).
      - alert: PodmanBackupOverdue
        expr: time() - podman_backup_last_run_timestamp_seconds > 8 * 86400
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "podman backup overdue on {{ $labels.instance }}"
          description: "{{ $labels.instance }} has not run a podman volume backup in over 8 days."

      - alert: HomeBackupFailed
        expr: home_backup_success == 0
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "home backup failed on {{ $labels.instance }}"
          description: "The last home directory backup run on {{ $labels.instance }} failed."
      # The weekly timer caps a healthy run at ~7 days old; 8 gives a day's grace
      # before flagging a run that never fired (the metric stops advancing).
      - alert: HomeBackupOverdue
        expr: time() - home_backup_last_run_timestamp_seconds > 8 * 86400
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "home backup overdue on {{ $labels.instance }}"
          description: "{{ $labels.instance }} has not run a home directory backup in over 8 days."

      - alert: WordpressDbDumpFailed
        expr: wordpress_db_dump_success == 0
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "WordPress database dump failed on {{ $labels.instance }}"
          description: "The last WordPress database dump on {{ $labels.instance }} failed — the DR fallback for a broken in-place upgrade is now stale."
      # The daily timer caps a healthy dump at ~1 day old; 2 gives a day's grace
      # before flagging a dump that stopped advancing.
      - alert: WordpressDbDumpOverdue
        expr: time() - wordpress_db_dump_last_run_timestamp_seconds > 2 * 86400
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "WordPress database dump overdue on {{ $labels.instance }}"
          description: "{{ $labels.instance }} has not produced a WordPress database dump in over 2 days."

      # The three rules above watch the copy that lands on the NAS. The six below
      # watch the copy that leaves it — three DSM Hyper Backup tasks mirroring the
      # restic repos and the photo library off-site — where the fault that matters
      # is one DSM's own task notification cannot see: a task that stops copying a
      # folder still finishes and still reports success, so a repo falls out of the
      # off-site copy with every run green. rogue-trader-home-backup was out of the
      # home task for five weeks that way, and nothing in this file could have said
      # so.
      #
      # The covered set is observable only in the manifest DSM caches beside each
      # task, which the offsite_mirror probe on auspex reads and republishes. Every
      # series below therefore carries auspex's instance label and the NAS task's
      # name: the probe runs there, and the NAS runs no exporter of its own.
      #
      # The declared coverage is published as a series too, rather than restated as
      # a literal here — this file is static and ships as data, so the set the play
      # declares could not otherwise reach it.
      #
      # Gated on the task having been read at all. Without that gate a task whose
      # manifest is missing entirely would raise one of these per declared folder
      # on top of OffsiteMirrorTaskUnverified below — two alertnames, and so two
      # pages, for one fault. This rule means "a folder is missing from a manifest
      # that was read"; a manifest that is not there at all is the next rule's.
      - alert: OffsiteMirrorCoverageMissing
        expr: >-
          (offsite_mirror_task_expected unless on (instance, task, folder) offsite_mirror_task_covered)
          and on (instance, task) offsite_mirror_task_status
        for: 1h
        labels:
          severity: critical
        annotations:
          summary: "the {{ $labels.task }} off-site mirror no longer covers {{ $labels.folder }}"
          description: >-
            {{ $labels.folder }} is declared as covered by the {{ $labels.task }} Hyper
            Backup task but is absent from the manifest its last run wrote — that data
            has no off-site copy, and the task is still reporting success.
      # The absent() companion, in the shape ScheduledJobMetricMissing uses: the
      # declared set is itself a published family, so a task the probe found no
      # manifest for shows as an expectation with no status behind it. Nothing else
      # would say so — every other rule here keys on a series the manifest
      # produces, and a task deleted, retargeted or never run against the current
      # target produces none of them. A warning, not a critical: this is the loss
      # of the check, not evidence of a failed backup, and DSM clearing its cache
      # on a reboot reads the same way until the task's next weekly run.
      - alert: OffsiteMirrorTaskUnverified
        expr: group by (instance, task) (offsite_mirror_task_expected) unless on (instance, task) offsite_mirror_task_status
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "the {{ $labels.task }} off-site mirror cannot be verified"
          description: >-
            No cached manifest on the NAS names the {{ $labels.task }} Hyper Backup
            task, so neither its coverage nor its last run can be checked from here.
      # This and the rule below read every task the manifest cache names, declared
      # or not: what is failing or stalled is a property of what the NAS is
      # running, and gating it on the declaration would let a task quietly dropped
      # from the play stop being watched. Coverage above is the other way round —
      # it is only ever measured against the declaration.
      - alert: OffsiteMirrorTaskFailed
        expr: offsite_mirror_task_status == 0
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "the {{ $labels.task }} off-site mirror failed"
          description: >-
            The last run of the {{ $labels.task }} Hyper Backup task did not report
            success — the off-site copy it maintains is no longer advancing.
      # All three tasks are weekly, so a healthy run caps the gauge at ~7 days old;
      # 8 gives a day's grace, as the two rules above it do. The gauge is written
      # only for a successful run, so this rule and the one above partition the
      # fault rather than one decaying into the other: a task DSM records as
      # failed loses the gauge entirely and raises only OffsiteMirrorTaskFailed,
      # while a task that has simply stopped running keeps its last success and
      # ages into this one. Neither can fire for the other's fault.
      - alert: OffsiteMirrorTaskOverdue
        expr: time() - offsite_mirror_task_last_success_timestamp_seconds > 8 * 86400
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "the {{ $labels.task }} off-site mirror is overdue"
          description: "The {{ $labels.task }} Hyper Backup task has not completed a successful run in over 8 days."
      # The probe's own outcome, which is what a NAS it cannot reach or authenticate
      # to looks like: the payload it last managed to write stands untouched, so
      # every rule above goes on evaluating it and saying the mirror is fine. This
      # is also the state a fresh deploy sits in until the operator installs the
      # probe's public key on the NAS by hand — see roles/offsite_mirror.
      #
      # 25h, not the 15m the other *Failed rules carry. The probe is daily and does
      # not retry, so a window a shade over one cycle is what makes this "two
      # consecutive failed runs": a single failure the next morning clears breaks
      # the for: before it elapses and never pages.
      - alert: OffsiteMirrorProbeFailed
        expr: offsite_mirror_success == 0
        for: 25h
        labels:
          severity: warning
        annotations:
          summary: "the off-site mirror probe failed on {{ $labels.instance }}"
          description: >-
            {{ $labels.instance }} could not read the NAS's Hyper Backup manifest cache
            on two consecutive days, so the coverage and freshness rules above are
            evaluating the last payload it managed to write, however old.
      # The daily timer caps a healthy run at ~1 day old; 2 gives a day's grace
      # before flagging a probe that stopped firing.
      - alert: OffsiteMirrorProbeOverdue
        expr: time() - offsite_mirror_last_run_timestamp_seconds > 2 * 86400
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "the off-site mirror probe is overdue on {{ $labels.instance }}"
          description: "{{ $labels.instance }} has not read the NAS's Hyper Backup manifest cache in over 2 days."
      # The R2 copy gets its own rules because the four task rules above cannot
      # reach it: DSM's manifest for a cloud Hyper Backup target carries no task
      # name, status, last-run time or folder list, which is what each of them
      # reads. The r2_mirror probe reads the bucket itself instead, so these read
      # presence, freshness and stranded uploads — what a destination can answer
      # for. The two probe rules below are a second probe's own outcome, not a
      # replacement for anything. Rationale in full: roles/r2_mirror/README.md.
      #
      # Scoped to the declared set rather than written as `bytes == 0`, so a prefix
      # the probe finds but the play never declared — one holding nothing but a
      # stranded part — cannot read as a missing copy.
      #
      # Bytes, not objects: a zero-byte folder marker is an object, and both R2's
      # dashboard creating a prefix by hand and a container having its contents
      # removed leave one, either of which would hold this critical rule silent on a
      # copy that does not exist. Strictly stronger, since bytes > 0 implies objects
      # > 0 and a container holding a backup always has bytes.
      - alert: R2MirrorContainerMissing
        expr: group by (instance, container) (r2_mirror_container_expected) unless on (instance, container) (r2_mirror_container_bytes > 0)
        for: 1h
        labels:
          severity: critical
        annotations:
          summary: "the {{ $labels.container }} R2 container holds nothing"
          description: >-
            {{ $labels.container }} is declared in the play but the bucket holds no
            object under its prefix — the second off-site copy of those repos does
            not exist.
      # Both uploads are weekly, so a healthy run caps the gauge at ~7 days old; 8
      # gives a day's grace, matching OffsiteMirrorTaskOverdue. The gauge is the
      # newest object in the container, not a status DSM reported: a task that
      # stops running, fails every run, or has its credentials revoked all reach
      # this the same way, because none of them put a new object in the bucket.
      #
      # Joined onto the expected family for the reason ContainerMissing is scoped to
      # it: the probe publishes this gauge for every prefix it finds, so a retired or
      # renamed task whose objects remain in the bucket — or anything landing at the
      # root — would alert from 8 days on, permanently, on a prefix nobody declared,
      # with no remedy but deleting objects out of the last-resort copy.
      - alert: R2MirrorContainerStale
        expr: time() - (r2_mirror_container_last_write_timestamp_seconds and on (instance, container) r2_mirror_container_expected) > 8 * 86400
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "the {{ $labels.container }} R2 copy is stale"
          description: "Nothing has been written to {{ $labels.container }} in R2 in over 8 days."
      # An upload interrupted partway leaves its parts in the bucket, where they
      # bill as storage and appear in no listing — the failure mode that is
      # invisible from both ends unless something asks for it. An upload in flight
      # while the probe runs is a legitimate reading the next day's run clears, so
      # the window has to outlast one probe cycle: at 24h the gauge holds its value
      # for exactly the for:, and whether a cleared upload pages turns on where the
      # next run's jitter falls. 25h means two consecutive readings, as it does on
      # R2MirrorProbeFailed.
      - alert: R2MirrorStrandedParts
        expr: r2_mirror_multipart_pending > 0
        for: 25h
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.container }} has incomplete uploads in R2"
          description: >-
            {{ $value }} multipart upload(s) into {{ $labels.container }} were started
            and never completed. They are billed as storage and do not appear in a
            bucket listing.
      # The probe's own outcome, which is what a revoked key or an unreachable
      # endpoint looks like: the payload it last wrote stands untouched, so the
      # three rules above go on evaluating it and saying the copy is fine. 25h
      # rather than the 15m a *Failed rule usually carries, for the same reason
      # OffsiteMirrorProbeFailed does — the probe is daily and does not retry, so
      # this window means two consecutive failed runs.
      - alert: R2MirrorProbeFailed
        expr: r2_mirror_success == 0
        for: 25h
        labels:
          severity: warning
        annotations:
          summary: "the R2 copy probe failed on {{ $labels.instance }}"
          description: >-
            {{ $labels.instance }} could not read the R2 bucket on two consecutive
            days, so the rules above are evaluating the last payload it managed to
            write, however old.
      # The daily timer caps a healthy run at ~1 day old; 2 gives a day's grace
      # before flagging a probe that stopped firing.
      - alert: R2MirrorProbeOverdue
        expr: time() - r2_mirror_last_run_timestamp_seconds > 2 * 86400
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "the R2 copy probe is overdue on {{ $labels.instance }}"
          description: "{{ $labels.instance }} has not read the R2 bucket in over 2 days."

  - name: filesystem
    rules:
      - alert: FilesystemSpaceLow
        expr: node_filesystem_avail_bytes{fstype!~"tmpfs|squashfs|overlay|ramfs"} / node_filesystem_size_bytes * 100 < 10
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "low disk space on {{ $labels.instance }}:{{ $labels.mountpoint }}"
          description: "{{ $labels.mountpoint }} on {{ $labels.instance }} has under 10% free."
      # The kernel remounts a filesystem read-only in response to certain I/O errors;
      # the state is durable and never self-clears, so the 5m for: only rides out a
      # scrape artefact. The metric is the ro mount flag, not an error state, so a
      # deliberate read-only mount would trip it too — hence the annotation names the
      # cause as likely, not certain. Nothing else names it: the host stays up, every
      # probe stays green, and space never runs low because no write lands — at best the
      # *Overdue rules notice, late, that metrics stopped being written. Same fstype
      # exclusion as the space alert above, but not the same reach: statfs crosses the
      # wire, so that one sees the NAS through the fleet's NFS mounts, whereas ro is
      # the client's own mount option — a read-only volume on administratum reads 0
      # here, and goes uncovered.
      #
      # MicroOS mounts / read-only by design — that is the whole transactional-update
      # model, not a fault — so rogue-trader would otherwise hold this critical alert
      # firing forever. The exclusion is joined on (instance, mountpoint) rather than
      # instance alone, so it drops only the root of a MicroOS host: a genuine
      # remount of /var there still alerts, as does a read-only / on Tumbleweed.
      # node_os_info carries the id, and label_replace only supplies the mountpoint
      # for the join. If node_os_info ever stops being exported the join matches
      # nothing and the alert returns — it fails towards noise, not silence.
      - alert: FilesystemReadOnly
        expr: |
          node_filesystem_readonly{fstype!~"tmpfs|squashfs|overlay|ramfs"} == 1
            unless on(instance, mountpoint)
          label_replace(node_os_info{id="opensuse-microos"}, "mountpoint", "/", "instance", ".*")
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.instance }}:{{ $labels.mountpoint }} is mounted read-only"
          description: "{{ $labels.mountpoint }} on {{ $labels.instance }} is mounted read-only — writes fail silently. Likely a remount after an I/O error."

      # podman's store is mounted off a separate block device where a host sets
      # the podman role's podman_storage_device — auspex, whose store holds this
      # Prometheus's own TSDB and has no business on an SD card. That mount is
      # nofail, deliberately: a monitoring host that will not boot without its
      # data disk is worse than one that boots degraded. The cost is that the
      # failure is completely silent — podman just writes to the root filesystem
      # under the empty mount point, every container starts, every probe stays
      # green, and the card fills up over weeks. This is the only thing that says
      # so, and it catches the mount coming up from the wrong device too.
      #
      # absent() carries only the matcher's labels, so there is no instance to
      # name. It also fires when the host's node_exporter is down, alongside
      # InstanceDown — honest rather than silent, and the pair reads correctly:
      # nothing can confirm the mount while nothing is reporting.
      #
      # Fleet-global, not per host: absent() is satisfied by ANY host reporting
      # such a mount. Exactly right while one host sets podman_storage_device —
      # the day a second does, one of them can lose its mount silently while the
      # other keeps this quiet, and the rule needs rewriting per instance.
      - alert: ContainerStoreMountMissing
        expr: absent(node_filesystem_size_bytes{mountpoint="/var/lib/containers", device=~"/dev/nvme.+"})
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "podman's container store is not mounted from its NVMe"
          description: >-
            No filesystem is mounted at /var/lib/containers from an NVMe device. podman
            is writing its images, volumes and the Prometheus TSDB to the root
            filesystem underneath the mount point — silently, since nofail lets the host
            boot without it.

  - name: memory
    rules:
      # Mirrors FilesystemSpaceLow: the same 10% headroom, severity and window, for
      # the other exhaustible resource. MemAvailable is the kernel's own estimate and
      # has already netted off reclaimable page cache, so crossing it is real pressure
      # rather than a full-looking cache. 15m rides out the transient spikes that are
      # routine here — a build, the weekly zypper dup, a backup run.
      - alert: MemoryLow
        expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes * 100 < 10
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "low memory on {{ $labels.instance }}"
          description: "{{ $labels.instance }} has under 10% memory available."

  - name: hardware
    rules:
      # solar already holds 88C for a continuous 15m under its weekly zypper dup, and
      # summer ambient lifts it further, so 90 would fire on routine load. 95 errs late
      # deliberately: throttling at 105C costs clock, not hardware, whereas a weekly false
      # positive costs the alert its credibility. No second, higher-threshold rule — it
      # would double-alert one fault, as ServiceRestartStorm's exclusion explains.
      #
      # Two thresholds, one rule, because the fleet has two thermal classes and no single
      # number serves both: the N150s' Tjmax is 105C, where a Pi 5 soft-throttles at 80C
      # and hard-throttles at 85C. Splitting this into a rule each is what it looks like
      # it wants to be, and promtool's lint refuses it — duplicate rules key on name plus
      # labels, not expression — which is the same conclusion the comment above reaches
      # for its own reason: one fault pages once.
      #
      # The chip labels scope each side to its class, and no host exports both, so the
      # union can never double-count an instance. platform_coretemp_0 comes from the two
      # N150 boxes; thermal_thermal_zone0 from auspex, read off the box rather than
      # inferred — node_exporter names the chip from the hwmon `device` symlink, which
      # there resolves to /sys/devices/virtual/thermal/thermal_zone0. It falls back to the
      # hwmon `name` file only when that symlink is absent, so the `cpu_thermal_0` the Pi
      # reports there is not the label and would match nothing.
      #
      # 80C leaves the Pi 5C before its clocks are pulled outright, and one with working
      # active cooling never sustains it: the board's own thermal zone declares fan trip
      # points from 50C up, so a sustained 80C means the cooling is absent or failed, not
      # that the host is busy.
      - alert: HostCpuTemperatureHigh
        expr: >-
          max by (instance) (node_hwmon_temp_celsius{chip="platform_coretemp_0"}) > 95
          or max by (instance) (node_hwmon_temp_celsius{chip="thermal_thermal_zone0"}) > 80
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "CPU on {{ $labels.instance }} sustained above its thermal limit"
          description: >-
            {{ $labels.instance }} has held its CPU at {{ $value }}C for 15 minutes — past
            the limit for its class, 95C on the N150s and 80C on the Pi. Check the
            heatsink and that the fan is spinning.

      # smartmon reads SMART daily, so a bad sample stands for ~24h of scrapes;
      # every for: below debounces the scrape stream, not the check.
      - alert: SmartDeviceUnhealthy
        expr: smartmon_device_healthy == 0
        for: 1h
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.device }} on {{ $labels.instance }} fails its SMART self-assessment"
          description: >-
            The firmware on {{ $labels.device }} ({{ $labels.instance }}) reports the
            disk as failing, or smartctl could not assess it at all. Confirm the
            backups are current and replace the disk.
      # 90 leaves ~10% of rated endurance — months of runway at homelab write
      # rates, so a warning to plan a replacement, not a page.
      - alert: NvmeWearHigh
        expr: smartmon_nvme_percentage_used >= 90
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.device }} on {{ $labels.instance }} is near its rated endurance"
          description: >-
            The NVMe health log on {{ $labels.device }} ({{ $labels.instance }}) reports
            {{ $value }}% of rated endurance used — plan a replacement.
      # delta, not increase: the metric is a gauge republished from a daily
      # read. Any growth is real — media errors move only when the controller
      # failed a read or write against its own error correction — and the count
      # often climbs while the overall verdict stays green, so this is the
      # earlier of the two signals.
      - alert: NvmeMediaErrorsIncreasing
        expr: delta(smartmon_nvme_media_errors[7d]) > 0
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.device }} on {{ $labels.instance }} is accumulating media errors"
          description: >-
            {{ $labels.device }} on {{ $labels.instance }} has logged new media and
            data integrity errors over the last 7 days — the disk is degrading ahead
            of its own verdict.
      # Every host running the check has at least one real disk, so a zero
      # denominator means the scan broke, not that hardware left: every rule
      # above reads clean by vacuum.
      - alert: SmartDevicesDisappeared
        expr: smartmon_devices_checked == 0
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }} scanned no SMART-capable devices"
          description: >-
            The SMART check on {{ $labels.instance }} found no devices to read — the
            host is watched but nothing is, so every disk-health rule reads clean by
            vacuum.
      - alert: SmartmonFailed
        expr: smartmon_success == 0
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "SMART check failed on {{ $labels.instance }}"
          description: >-
            The last SMART check run on {{ $labels.instance }} failed — often a device
            that stopped answering smartctl mid-run, which is itself a disk symptom.
      # The daily timer caps a healthy run at ~1 day old; 2 gives a day's grace
      # before flagging a run that never fired (the metric stops advancing).
      - alert: SmartmonOverdue
        expr: time() - smartmon_last_run_timestamp_seconds > 2 * 86400
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "SMART check overdue on {{ $labels.instance }}"
          description: "{{ $labels.instance }} has not completed a SMART check in over 2 days."

  - name: time
    rules:
      # NTP keeps the fleet's clocks disciplined; drift breaks TLS validation, log
      # correlation, and the time-based comparisons in these very rules. 30m rides
      # out a brief resync — a step after a reboot or a network blip — and fires
      # only on a clock that has genuinely stopped syncing.
      - alert: ClockNotSynchronised
        expr: node_timex_sync_status == 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "clock not synchronised on {{ $labels.instance }}"
          description: "{{ $labels.instance }} has had no NTP time sync for 30 minutes — clock drift can break TLS validation and log correlation."

  - name: services
    rules:
      # node_exporter's systemd collector exposes a true per-unit restart counter,
      # robust to the cgroup-id churn that defeats a cadvisor start-time proxy.
      # The counter zeroes on boot and dependency-ordered units restart a few times
      # during startup; gate on uptime past the 15m window so that churn stays out of
      # the increase. wireguard is excluded because WireguardTunnelDown below watches
      # the same counter on a lower threshold: it would otherwise raise a second,
      # differently-named alert for one fault, and group_by is on alertname.
      #
      # Both thresholds here sit on a half, and that is not a typo. increase() does
      # not return the delta it measured: it rescales that delta to the range
      # boundaries, so what comes back for N restarts is only approximately N — on
      # the fleet's scrape cadence, 3.01-3.05 for three. Written `> 3` the rule fires
      # on the third restart while its own description says "more than 3 times", and
      # WireguardTunnelDown below was worse: `> 1` fired on a single restart, which
      # paged twice in the week this was found, both times for a kill the tunnel had
      # already recovered from before the alert fired. The rescaling runs in both
      # directions — a ragged window can report *under* the delta as readily as over
      # it — so each threshold sits midway between the count that should be quiet and
      # the count that should page, rather than on either.
      - alert: ServiceRestartStorm
        expr: increase(node_systemd_service_restart_total{name!="wireguard.service"}[15m]) > 3.5 and on(instance) time() - node_boot_time_seconds > 15 * 60
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.name }} is restarting repeatedly on {{ $labels.instance }}"
          description: "{{ $labels.name }} on {{ $labels.instance }} auto-restarted more than 3 times in 15 minutes."
      # A dead tunnel raises nothing on its own: every app in the arr stack shares
      # wireguard's netns and answers on loopback, so their blackbox probes stay green
      # while egress is gone. The only signal is the restart cycle that wireguard's own
      # healthcheck kill drives. ServiceRestartStorm above would eventually catch it,
      # but only as an anonymous warning about "a unit"; name the fault instead, and
      # fire on the second restart (~7m) rather than the fourth. Restarts here are
      # automatic ones only, so an Ansible-driven restart never trips it — nor does a
      # PartOf-propagated stop of a joiner. Same boot gate as above.
      # Half-threshold for the reason given above; measured here, one restart reads
      # 1.004-1.017 and two 2.03.
      - alert: WireguardTunnelDown
        expr: increase(node_systemd_service_restart_total{name="wireguard.service"}[15m]) > 1.5 and on(instance) time() - node_boot_time_seconds > 15 * 60
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "the wireguard tunnel is down on {{ $labels.instance }}"
          description: "wireguard auto-restarted more than once in 15 minutes — it cannot reach the internet through wg0, so the arr stack has no egress."
      # Discord is the only receiver that carries alerts, and the Watchdog deadman
      # proves only that the pipeline is alive — Discord delivery could break while
      # the deadman stayed green, the gap the alertmanager role's inhibit rule now
      # closes. The counter is pre-registered at 0 per integration, so the series is
      # never sparse, and it advances only once RetryStage has given up on a flush —
      # one increment is a flush that failed to deliver. Summed without reason: the
      # counter splits per failure reason, and a messy outage alternating reasons
      # would otherwise leave every series under any threshold. > 1.5, the
      # half-threshold idiom: one failed flush reads ~1 and two ~2, and no nflog
      # entry is written for a failed send, so a broken group is re-attempted — and
      # the counter re-incremented — at every 5m group_interval flush. With the for:
      # over left-open windows, a single healed flush — most trips, the delivery
      # delayed rather than lost — never fires at all; a two-flush burst fires
      # only briefly, muting the beat ~5m, inside the healthchecks.io down
      # threshold; sustained failure fires ~10m in and holds. That matters doubly
      # since the inhibition: a firing here mutes the Watchdog, and these
      # graduated windows keep a short healed blip from gapping the deadman beat
      # far enough to flap a down/up email pair for nothing — a healed outage of
      # three-plus flushes (~15m+) still emails one pair, worth it at that length.
      # The honest limitation stands: this alert is itself routed to Discord, so a
      # total outage cannot surface it while it lasts, but it lands within ~5m of
      # Discord returning — and the permanent case, a rotted webhook that never
      # returns, escapes over the inhibition instead.
      - alert: AlertmanagerNotificationsFailing
        expr: sum without (reason) (increase(alertmanager_notifications_failed_total{integration="discord"}[15m])) > 1.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "alertmanager cannot deliver notifications to discord"
          description: "Alertmanager on {{ $labels.instance }} failed to deliver to Discord — alerts may not be reaching the operator."
      # The catch-all: every other unit-level rule names a unit it already knows
      # about, so a service with no bespoke alert fails silently. This keys on the
      # terminal failed state, where ServiceRestartStorm and WireguardTunnelDown key
      # on the restart counter (flapping but still alive) — a unit is in one state or
      # the other, so they never double-report one fault. The excluded units do have
      # a bespoke alert: each writes a *_success metric whose *Failed rule carries a
      # richer description and the right severity (a failed backup or reconcile is
      # critical, this is a warning). group_by is on alertname, so without the
      # exclusion one fault would raise two alerts — the same reasoning that excludes
      # wireguard from ServiceRestartStorm. 15m rides out a unit that fails and is
      # restarted by its own Restart= policy.
      - alert: SystemdUnitFailed
        expr: >-
          node_systemd_unit_state{state="failed",
          name!~"(arbites|inquisition|smartmon|offsite-mirror|r2-mirror|podman-backup|home-backup|autoupdate|wordpress-cron|wordpress-db-dump|wordpress-update-check|wordpress-boost)[.]service"}
          == 1
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.name }} has failed on {{ $labels.instance }}"
          description: "The systemd unit {{ $labels.name }} on {{ $labels.instance }} is in the failed state and has not recovered."

  - name: maintenance
    rules:
      # Coupled to autoupdate.service's Restart=on-failure: RestartSec=1h with
      # StartLimitBurst=4 retries a transient mirror miss for 3h, each attempt
      # rewriting the metric. Wait longer than that burst so only an update that
      # has exhausted its retries pages, not one still healing itself.
      - alert: AutoupdateFailed
        expr: autoupdate_success == 0
        for: 4h
        labels:
          severity: warning
        annotations:
          summary: "unattended update failed on {{ $labels.instance }}"
          description: "The last unattended update on {{ $labels.instance }} failed — the host may be unpatched or did not reboot."
      # The weekly timer has no Persistent=, so a healthy run lands near 7 days
      # apart; 9 gives grace over the cadence and jitter before flagging a stalled
      # updater or a cycle the host slept through.
      - alert: AutoupdateOverdue
        expr: time() - autoupdate_last_run_timestamp_seconds > 9 * 86400
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "unattended update overdue on {{ $labels.instance }}"
          description: "{{ $labels.instance }} has not completed an unattended update in over 9 days."

      # The transactional counterpart to the pair above, and the only rule that sees a
      # MicroOS host which has silently stopped updating. autoupdate.service runs
      # `transactional-update dup` there, which exits 0 and writes autoupdate_success 1
      # *before* the reboot it then triggers — so when the new snapshot fails a
      # health-checker plugin at boot, health-checker rolls back to the previous one and
      # the host returns working, unpatched, with the pair above still satisfied by a run
      # that was undone: the textfile metric lives on @/var, which no rollback touches.
      # Nothing else notices either — an old snapshot is a working system, so probes
      # answer and no unit is failed, and the reboot pair falls inside the 15m uptime
      # gate ServiceRestartStorm and WireguardTunnelDown share. Left alone it repeats
      # every week, forever. A boot that never reaches userspace is the covered case, not
      # this one: health-checker never runs, the host stays down, InstanceDown has it in 5m.
      #
      # node_os_version is node_exporter's parse of VERSION_ID, which on a rolling
      # openSUSE is the build datestamp — already a number, and one that only moves
      # forward. Do NOT rewrite this as a regression (`< max_over_time`): a rollback
      # returns the host to the build it was already running, so there is no higher value
      # to fall from unless the doomed boot was itself scraped — and it will not be. The
      # first scrape lands 31s after boot here, behind wg0 and the exporter container,
      # where health-checker decides at default.target and waits for neither; the boots
      # it rolls back are precisely the ones that keep the exporter down. Staleness reads
      # only builds the host actually ran, so it never depends on catching that boot. The
      # `<=` is equality in practice — the range includes the instant sample, so the
      # minimum can never exceed it — and is written as a comparison because the property
      # is directional: the build has not risen off its own floor.
      #
      # 14d is two weekly update cycles, so a false positive needs openSUSE to publish no
      # MicroOS snapshot for a fortnight — rarer than a public VPS going quietly
      # unpatched is costly. The cost is latency: it fires about a week after the failed
      # update, one cycle later than a regression would, which is the price of not needing
      # that boot observed. The window needs a fortnight of history, which is what
      # prometheus_retention_time is pinned for. A host re-imaged from an older artefact
      # trips it at once, correctly — the build really did go backwards.
      #
      # The offset conjunct keeps it honest on a series younger than the window: with
      # under a fortnight of samples — a rebuilt host, a restored TSDB, a second MicroOS
      # host joining — the minimum is trivially the current build, and the rule would page
      # about a fortnight it cannot see. It offsets by the same 14d the window spans, so
      # the two agree on what a fortnight is; a shorter offset would quietly become the
      # thing that times the alert on a host whose build has never once advanced. It
      # cannot mute the rule for long either, since retention outruns it by a fortnight.
      # present_over_time, not a bare instant selector, because one missed scrape is
      # enough to empty the latter: the host reboots weekly, and 14 days later that hole
      # would land under the offset, resolve a firing alert and re-fire it an hour later.
      #
      # for: 3h outlasts autoupdate.timer's RandomizedDelaySec=2h, the same coupling
      # AutoupdateFailed's for: has to the retry burst. At 1h the margin was thinner than
      # the jitter, so a week with no published snapshot could fire this an hour before
      # the next dup landed and cleared it.
      #
      # This does overlap AutoupdateOverdue when the timer itself has stopped: that fires
      # at 9d, this at 14d. Left alone deliberately — the `unless` that would suppress the
      # duplicate also suppresses a real rollback whenever an update is independently
      # failing, and a second notification is the cheaper error than a silence.
      - alert: MicroOSBuildStale
        expr: |
          node_os_version{id="opensuse-microos"} <= min_over_time(node_os_version{id="opensuse-microos"}[14d])
            and present_over_time(node_os_version{id="opensuse-microos"}[1d] offset 14d)
        for: 3h
        labels:
          severity: warning
        annotations:
          summary: "MicroOS build stale on {{ $labels.instance }}"
          description: >-
            {{ $labels.instance }} is still on build {{ printf "%.0f" $value }}, the oldest it
            has run in a fortnight — two update cycles have changed nothing, so it is
            unpatched and not updating itself. A failed boot most likely rolled it back to
            the previous snapshot: check `journalctl -u health-checker` and `snapper list`.

      # The third way an update goes wrong, and the only one AutoupdateFailed and
      # AutoupdateOverdue read as healthy on every host rather than just MicroOS as
      # the rule above does: `zypper dup` and `apt-get dist-upgrade` skip a locked or
      # held package and exit 0, so the run succeeds, the timestamp advances, and
      # that one package stops being patched for as long as the lock stands. Dependency conflicts and an unreachable repository both
      # fail loudly instead — non-interactive zypper cancels on a solver problem, and
      # a skipped repository exits 106, which is not in the unit's SuccessExitStatus —
      # so a lock is the one silent skip left.
      #
      # A hold is a deliberate act (autoupdate's README names `apt-mark hold
      # rpi-eeprom` as the lever for the Pi's EEPROM trade), so this is not a fault to
      # fix but a decision to re-take, and it stands until the lock goes. Written by
      # autoupdate.service's ExecStartPost, so it moves at that host's weekly cadence
      # and no faster: it cannot fire before the update it suppressed has actually
      # run — and, the asymmetry that matters, clearing the lock does not clear this
      # until the next weekly update rewrites the file. That is how a warning-severity
      # rule gets muted for good, so the republish is in the description rather than
      # left for the operator to work out. 1h because nothing about a lock needs a
      # fast page; the hook publishes by rename, so there is no half-written scrape
      # to ride out.
      - alert: AutoupdatePackageHeld
        expr: autoupdate_package_hold == 1
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.package }} is held back from updates on {{ $labels.instance }}"
          description: >-
            {{ $labels.package }} on {{ $labels.instance }} is locked or held, so the last
            unattended update skipped it and still exited successfully. Clear it with
            `apt-mark unhold`, or with `zypper removelock` after checking `zypper locks`
            for the type — removelock exits 0 having done nothing on a pattern lock
            without `-t`. Then re-run `autoupdate-holds.sh` to republish, or this stands
            until that host's next weekly update rewrites the metric.

      # The fourth thing a successful update leaves behind, and the only one that is
      # not a fault: `dup` and `dist-upgrade` update packages, they never uninstall
      # the ones nothing needs any more. autoupdate.service's ExecStartPost cleanup
      # removes that class itself, so a healthy host publishes {class="unneeded"} 0
      # and this fires on what the cleanup cannot clear — a removal that failed, and
      # MicroOS, where a second transaction could discard the dup so none runs — plus
      # {class="orphaned"}, the packages no repository offers that are not unneeded
      # either, so something requires them or a hand asked for them. Those are removed
      # only where they are also unneeded and never for being orphans: a repository
      # that fails to load turns every package it carries into an orphan, so keying an
      # unattended removal on that class would strip a host over a mirror outage.
      #
      # Written by the same hook as the holds gauge and inheriting its cadence: it
      # moves at that host's weekly update and no faster, so removing an orphan by
      # hand does not clear this until the next run rewrites the file — which is why
      # the republish is in the description rather than left to be worked out. Unlike
      # the holds gauge it resolves on the value, not by staleness: the label set is
      # fixed and two wide, so the hook publishes both classes every run, zero
      # included. 1h because nothing about accumulated cruft needs a fast page, and
      # the hook publishes by rename, so there is no half-written scrape to ride out.
      - alert: AutoupdatePackagesUncleaned
        expr: autoupdate_uncleaned_packages > 0
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "{{ $value }} {{ $labels.class }} package(s) left on {{ $labels.instance }} after the update"
          description: >-
            The post-update cleanup on {{ $labels.instance }} left {{ $value }}
            {{ $labels.class }} package(s) installed. `orphaned` means no repository offers
            them and nothing has made them unneeded, so the cleanup never takes them —
            decide those one at a time, and in the role if a role installs them. `unneeded`
            means its removal failed, or the host is MicroOS, where it does not run: clear
            that with `transactional-update run zypper remove --clean-deps <names>`, which
            shows here only after the reboot. List them with
            `zypper packages --{{ $labels.class }}`, or on Debian with
            `apt-get --dry-run --purge autoremove` and `apt list '?obsolete'`. Then re-run
            `autoupdate-cleanup.sh` to republish, or this stands until that host's next
            weekly update rewrites the metric.

      # WordPress auto-applies minor core releases (and any plugins or themes the
      # operator opted into) on its own twice-daily cadence; the 24h for: plus the
      # six-hourly check keeps the gauge fresh enough that those clear first, so
      # only updates actually awaiting a hand — majors, and anything not opted into
      # auto-update — ever alert.
      - alert: WordpressUpdateAvailable
        expr: wordpress_updates_available > 0
        for: 24h
        labels:
          severity: warning
        annotations:
          summary: "WordPress {{ $labels.type }} update available on {{ $labels.instance }}"
          description: "{{ $value }} {{ $labels.type }} update(s) are pending on {{ $labels.instance }} — apply via wp-cli or wp-admin."

      # The six-hourly metric holds success=0 constant until the next run, so a
      # single transient wp-cli or wordpress.org blip would satisfy a short for:;
      # 12h (over two checks) fires only on a sustained failure, not a self-healing
      # one-off.
      - alert: WordpressUpdateCheckFailed
        expr: wordpress_update_check_success == 0
        for: 12h
        labels:
          severity: warning
        annotations:
          summary: "WordPress update check failed on {{ $labels.instance }}"
          description: "The last WordPress update check on {{ $labels.instance }} errored — pending core, plugin, theme, or translation updates may be missed."
      # The six-hourly timer caps a healthy check at ~6h old; over a day (four
      # missed runs) gives ample grace before flagging a stalled checker whose
      # metric has stopped advancing.
      - alert: WordpressUpdateCheckOverdue
        expr: time() - wordpress_update_check_last_run_timestamp_seconds > 1 * 86400
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "WordPress update check overdue on {{ $labels.instance }}"
          description: "{{ $labels.instance }} has not completed a WordPress update check in over a day."

      # wp-cron overwrites the metric every 5 minutes, so a one-off failure clears
      # on the next run; 15m (three cycles) fires only on a sustained failure — the
      # run reached wp-cli but errored (the database unreachable), since an
      # individual scheduled hook failing still exits the run 0. A wholly down stack
      # never runs the job (Requires=/After=wordpress.service), freezing the metric
      # for WordpressCronOverdue to catch instead.
      - alert: WordpressCronFailed
        expr: wordpress_cron_success == 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "WordPress cron failed on {{ $labels.instance }}"
          description: "The last WordPress cron run on {{ $labels.instance }} errored — the database is unreachable or wp-cli otherwise failed."
      # The 5-minute timer caps a healthy run at minutes old; an hour (twelve
      # missed fires) gives ample grace before flagging a timer that has stopped —
      # a stopped timer silently stalls every scheduled post and task, and its
      # still-firing-but-failing counterpart is caught by WordpressCronFailed.
      - alert: WordpressCronOverdue
        expr: time() - wordpress_cron_last_run_timestamp_seconds > 1 * 3600
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "WordPress cron overdue on {{ $labels.instance }}"
          description: "{{ $labels.instance }} has not run WordPress cron in over an hour — scheduled posts and tasks have stalled."

      # Jetpack Boost's free tier generates critical CSS in the browser, so
      # nothing on the host — or in these rules — can regenerate it. They report
      # only, and clear when the operator regenerates from wp-admin.
      #
      # All three gauges are published whether or not Boost is installed, so the
      # two rules below gate on a second series rather than on absence: the role
      # does not manage the plugin, and a WordPress host without it must not
      # alert for CSS it was never meant to have.
      #
      # Deliberately no rule on wordpress_boost_critical_css_providers{status="error"}.
      # A provider whose pages carry no external stylesheet fails every single
      # run — emmasedit's singular_wpm-testimonial does — so a rule on the error
      # count would fire permanently and teach the operator to ignore it. The
      # gauge is published for context; the two real failures are below.
      - alert: WordpressBoostCriticalCssMissing
        expr: wordpress_boost_critical_css_generated == 0 and on (instance) wordpress_boost_installed == 1
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Jetpack Boost critical CSS not generated on {{ $labels.instance }}"
          description: >-
            Boost reports no critical CSS on {{ $labels.instance }} — a plugin update
            resets the state — so pages load without it, or worse serve a stale copy
            still in storage. Regenerate from the Boost admin page.
      # Keyed on generated == 1, not installed == 1: an install that has never
      # generated carries updated 0, which would otherwise trip this rule as well
      # as the missing one above and raise two alerts for one fault.
      #
      # Critical CSS only goes stale when the theme or above-the-fold markup
      # changes, which is operator-driven — so this is a nudge, not a fault, and
      # 30d is set long enough that a site left alone does not nag. Lengthen or
      # drop it if it ever does.
      - alert: WordpressBoostCriticalCssStale
        expr: >-
          time() - wordpress_boost_critical_css_updated_timestamp_seconds > 30 * 86400
          and on (instance) wordpress_boost_critical_css_generated == 1
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Jetpack Boost critical CSS stale on {{ $labels.instance }}"
          description: >-
            The critical CSS on {{ $labels.instance }} was generated over 30 days ago
            and no longer reflects any theme or markup change since. Regenerate it from
            the Boost admin page.
      # The six-hourly metric holds success=0 constant until the next run, so a
      # single transient wp-cli blip would satisfy a short for:; 12h (over two
      # checks) fires only on a sustained failure, matching WordpressUpdateCheckFailed.
      - alert: WordpressBoostFailed
        expr: wordpress_boost_success == 0
        for: 12h
        labels:
          severity: warning
        annotations:
          summary: "Jetpack Boost check failed on {{ $labels.instance }}"
          description: "The last Jetpack Boost check on {{ $labels.instance }} errored — critical CSS may have lapsed unseen."
      # The six-hourly timer caps a healthy check at ~6h old; over a day (four
      # missed runs) gives ample grace before flagging a stalled checker. This is
      # the only rule that catches a stopped timer or a deleted script: the check
      # always exits 0 by design, so wordpress-boost.service can barely enter
      # failed, its last .prom stays on disk serving success 1 indefinitely, and
      # SystemdUnitFailed excludes the unit on the grounds this pair covers it.
      - alert: WordpressBoostOverdue
        expr: time() - wordpress_boost_last_run_timestamp_seconds > 1 * 86400
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Jetpack Boost check overdue on {{ $labels.instance }}"
          description: "{{ $labels.instance }} has not completed a Jetpack Boost check in over a day."

  - name: arbites
    rules:
      - alert: ArbitesFailed
        expr: arbites_success == 0
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "fleet reconcile failed on {{ $labels.instance }}"
          description: "The last unattended fleet reconcile on {{ $labels.instance }} failed — main is no longer reaching the fleet."
      # The 15-minute timer caps a healthy run at well under an hour old; 2 hours
      # gives ample grace over a reboot or brief outage before flagging a timer
      # that has stopped firing (a hard-stopped reconciler).
      - alert: ArbitesStale
        expr: time() - arbites_last_run_timestamp_seconds > 2 * 3600
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "fleet reconcile stale on {{ $labels.instance }}"
          description: "{{ $labels.instance }} has not completed a fleet reconcile in over 2 hours."

  - name: drift
    rules:
      # arbites proves main was applied; the inquisition proves the host still
      # matches it. Hourly runs publish per-container offenders, so every for:
      # here spans at least two runs — one bad sample poisons a whole hour of
      # scrapes, and a single-run for: would fire on a transient mid-update
      # wobble the next run clears.
      #
      # 6h, not 2h: a correct apply clears digest drift within minutes of the
      # handler restart, so anything standing is the handler-that-never-fired
      # class — real, permanent, and not urgent. A host mid-reboot raises
      # inactive, not digest, and its scrape gap resets every for: here anyway.
      - alert: ContainerDigestDrift
        expr: inquisition_offender{class="digest"} == 1
        for: 6h
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.container }} on {{ $labels.instance }} runs an image its quadlet does not pin"
          description: >-
            {{ $labels.container }} on {{ $labels.instance }} has run for over 6 hours on
            a digest other than its quadlet's pin — a restart that never fired, or a pin
            applied without one.
      - alert: UnmanagedContainerRunning
        expr: inquisition_offender{class="unmanaged"} == 1
        for: 2h
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.container }} on {{ $labels.instance }} is declared by no quadlet"
          description: >-
            {{ $labels.container }} exists on {{ $labels.instance }} outside the repo's
            declarations — unmanaged state the fleet's config does not describe.
      # 2h also clears podman_backup's weekly quiesce, which stops every
      # .container on the host to snapshot it: capped at an hour by
      # restic_backup_timeout_start_sec, so exactly one :37 run sees the stopped
      # units. Widening that cap, or moving the backup so its window straddles
      # two :37 marks, fires this for every container on the host.
      - alert: QuadletNotRunning
        expr: inquisition_offender{class="inactive"} == 1
        for: 2h
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.container }} on {{ $labels.instance }} is declared but not running"
          description: >-
            The quadlet for {{ $labels.container }} on {{ $labels.instance }} is on disk
            but its service is not active — never started, or stopped by hand.
            SystemdUnitFailed only sees the failed state.
      - alert: QuadletUnpinned
        expr: inquisition_offender{class="unpinned"} == 1
        for: 2h
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.container }} on {{ $labels.instance }} is not pinned by digest"
          description: >-
            The quadlet for {{ $labels.container }} on {{ $labels.instance }} carries a
            tag-only Image= — outside the renovate pin discipline, so what it runs after
            a pull is unrecorded.
      # The one rule keyed on the denominator rather than an offender: a check
      # that inspects nothing publishes no offender at all and success 1, which
      # is exactly what a clean host publishes. Every other silent
      # failure is already covered — a wrong quadlet dir turns all 21 containers
      # unmanaged, and a textfile path typo takes both files out of the glob and
      # raises ScheduledJobMetricMissing — so this is the last case, not a
      # duplicate: a host that has genuinely lost its declarations.
      - alert: QuadletsDisappeared
        expr: inquisition_containers_checked == 0
        for: 2h
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }} declares no quadlets"
          description: >-
            The drift check on {{ $labels.instance }} found no quadlet declarations to
            compare — the host is watched but has nothing to watch, so every other
            drift rule reads clean by vacuum.
      # 90m, not 15m: a recreate mid-check can fail one run, and on the hourly
      # cadence its failure metric stands until the next run — 90m demands two
      # consecutive failures before paging.
      - alert: InquisitionFailed
        expr: inquisition_success == 0
        for: 90m
        labels:
          severity: warning
        annotations:
          summary: "drift check failed on {{ $labels.instance }}"
          description: "The last two drift check runs on {{ $labels.instance }} failed — the host's containers are unwatched."
      # for: 2h, not 1h: the timer omits Persistent, so a host returning from an
      # outage republishes its pre-outage .prom from disk at once and does not
      # refresh it until the next :37 — up to an hour later. A 1h window has zero
      # margin over that gap and pages for a host that is already healthy.
      - alert: InquisitionOverdue
        expr: time() - inquisition_last_run_timestamp_seconds > 3 * 3600
        for: 2h
        labels:
          severity: warning
        annotations:
          summary: "drift check overdue on {{ $labels.instance }}"
          description: "{{ $labels.instance }} has not completed a drift check in over 3 hours — the hourly timer has stopped firing."

  - name: music
    rules:
      # lidarr-rejected only fills after the ~1h poke cap of a matched album lidarr
      # will not take (unmonitored artist, quality-profile mismatch), so the
      # rejection is already definitive when it appears — alert on the *Failed 15m
      # cadence, not a longer grace. The original download still seeds.
      - alert: BeetsPipelineLidarrRejected
        expr: beets_pipeline_lidarr_rejected_albums > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "beets pipeline imports rejected by lidarr on {{ $labels.instance }}"
          description: "Albums on {{ $labels.instance }} matched but lidarr refused them; they sit in quarantine/lidarr-rejected and need a look."
      # No-match albums are normal (new releases, patchy AcoustID) and cleared by
      # hand; a large standing pile signals a mass-quarantine event or an unworked
      # backlog. Threshold tuned to the operator's processing cadence.
      - alert: BeetsPipelineQuarantineBacklog
        expr: beets_pipeline_quarantine_albums > 10
        for: 6h
        labels:
          severity: warning
        annotations:
          summary: "beets pipeline quarantine backlog on {{ $labels.instance }}"
          description: "Unmatched albums on {{ $labels.instance }} have been awaiting hand-processing for over 6 hours."

  - name: monitoring
    rules:
      # Prometheus's rules and scrape config are rendered by Ansible and applied
      # unattended by arbites, so a bad deploy has no operator watching it
      # land. These two cover the two ways that fails, and are complementary rather
      # than overlapping: config or rules that do not parse are rejected at reload
      # (PrometheusConfigReloadFailed), while rules that parse but error at
      # evaluation — a typo'd function, a bad label matcher — are caught here. Both
      # are silent by nature: the rules simply stop producing series, so nothing
      # else would ever say so. Alert on any failure in the window rather than a
      # rate, since one failed evaluation already means a rule is not running.
      - alert: PrometheusRuleEvaluationFailing
        expr: increase(prometheus_rule_evaluation_failures_total[10m]) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "prometheus rule group {{ $labels.rule_group }} is failing to evaluate on {{ $labels.instance }}"
          description: >-
            Prometheus on {{ $labels.instance }} has failed to evaluate rules in group
            {{ $labels.rule_group }} over the last 10 minutes — those rules have silently
            stopped producing series.
      # Warning, not critical, and for the same reason as AutoupdateFailed: a rejected
      # reload is not an outage. Prometheus keeps serving the last-good config, so
      # monitoring stays up and only the new change is missing — it needs a hand, not
      # a callout.
      - alert: PrometheusConfigReloadFailed
        expr: prometheus_config_last_reload_successful == 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "prometheus config reload failed on {{ $labels.instance }}"
          description: >-
            Prometheus on {{ $labels.instance }} rejected its last config reload and is
            running the previous config — an arbites-applied change has not taken effect.
      # Roles write .prom files into the collector directory, and one malformed
      # sample line drops that whole file from the scrape while the writer's own
      # *_success metric stays 1 — a class no per-family rule can see, because
      # an absent family matches nothing. This is the collector's own parse
      # verdict: the only signal for a malformed payload file, and the earlier
      # one for a malformed outcome file, whose vanished *_success family
      # ScheduledJobMetricMissing below then also flags.
      - alert: TextfileScrapeError
        expr: node_textfile_scrape_error == 1
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "a textfile metric file on {{ $labels.instance }} is malformed"
          description: >-
            node_exporter on {{ $labels.instance }} failed to parse at least one .prom
            file in the textfile collector directory — that file's metrics have
            vanished from the scrape while their writer still reports success.
      # The oneshots SystemdUnitFailed excludes are excluded *because* each
      # writes a *_success metric with a bespoke *Failed rule. That trade only holds
      # while the metric is actually published: every one of those rules is `== 0` or
      # `time() - <gauge> > N`, and both match nothing on an empty vector, so a family
      # that stops being written disables its own alert AND is already exempt from the
      # catch-all. Nothing else would ever say so — the units keep succeeding, so no
      # rule anywhere has a series to fire on.
      #
      # The write is one `mkdir -p` away from silent: the textfile path is an
      # independent literal in nine role defaults (restic_backup, arr, autoupdate,
      # wordpress, arbites, inquisition, smartmon, offsite_mirror, r2_mirror), tied to
      # node_exporter_textfile_directory by a comment and nothing else. A
      # one-character divergence lands the .prom outside the collector's glob and
      # the family vanishes with every run still green.
      #
      # A bare absent() would need the family gone from EVERY host before it fired.
      # Key on unit presence instead: node_exporter's systemd collector includes every
      # .service (--collector.systemd.unit-include=.+[.]service|nfs-.+[.]mount), so a
      # host exports node_systemd_unit_state for the unit iff the role that writes the
      # metric is deployed there — exact ground truth, per host, carrying no topology.
      # Measured against the live fleet: the unit set and the metric set match family for
      # family (home 3/3, podman 2/2, autoupdate 3/3, the wordpress trio, and
      # arbites and inquisition 1/1 each). Both sides ride the same node_exporter
      # scrape, so a
      # down host drops out of both and raises nothing here.
      #
      # The left group by (instance, name) is load-bearing twice over: it keeps `name`
      # so the alert says which family broke, and it collapses node_exporter's
      # one-series-per-state into one, or a single fault would raise five identical
      # alerts. The right-hand sides need no aggregation — `unless on (instance)`
      # builds a signature set, so a family reporting several series per host
      # collapses on its own. Both properties are pinned in tests/alerts_test.yml.
      #
      # The roster must stay in step with SystemdUnitFailed's exclusion regex above;
      # a further oneshot excluded there and forgotten here is uncovered by both.
      # bin/check-alert-test-coverage.py asserts the two sets are equal rather than
      # trusting it. It holds the SystemdUnitFailed case in tests/alerts_test.yml to
      # the same roster too — that case drives one series per excluded unit, and it
      # asserted nothing about wordpress-boost from dab44a0 until that gate landed.
      #
      # Fires on a newly built host until its first run writes the metric — correct,
      # not noise: the unit is installed and has never recorded a successful run. On a
      # weekly timer that stands for up to a week after a rebuild.
      - alert: ScheduledJobMetricMissing
        expr: >-
          (group by (instance, name) (node_systemd_unit_state{name="podman-backup.service"}) unless on (instance) podman_backup_success)
          or (group by (instance, name) (node_systemd_unit_state{name="home-backup.service"}) unless on (instance) home_backup_success)
          or (group by (instance, name) (node_systemd_unit_state{name="wordpress-db-dump.service"}) unless on (instance) wordpress_db_dump_success)
          or (group by (instance, name) (node_systemd_unit_state{name="wordpress-cron.service"}) unless on (instance) wordpress_cron_success)
          or (group by (instance, name) (node_systemd_unit_state{name="wordpress-update-check.service"}) unless on (instance) wordpress_update_check_success)
          or (group by (instance, name) (node_systemd_unit_state{name="wordpress-boost.service"}) unless on (instance) wordpress_boost_success)
          or (group by (instance, name) (node_systemd_unit_state{name="autoupdate.service"}) unless on (instance) autoupdate_success)
          or (group by (instance, name) (node_systemd_unit_state{name="arbites.service"}) unless on (instance) arbites_success)
          or (group by (instance, name) (node_systemd_unit_state{name="inquisition.service"}) unless on (instance) inquisition_success)
          or (group by (instance, name) (node_systemd_unit_state{name="smartmon.service"}) unless on (instance) smartmon_success)
          or (group by (instance, name) (node_systemd_unit_state{name="offsite-mirror.service"}) unless on (instance) offsite_mirror_success)
          or (group by (instance, name) (node_systemd_unit_state{name="r2-mirror.service"}) unless on (instance) r2_mirror_success)
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.name }} on {{ $labels.instance }} publishes no outcome metric"
          description: >-
            {{ $labels.name }} is installed on {{ $labels.instance }} but its textfile
            outcome metric is absent, so that unit's bespoke *Failed and *Overdue rules
            match an empty vector and can never fire — and SystemdUnitFailed excludes it
            on the assumption they do.

  - name: watchdog
    rules:
      # Always-firing heartbeat: its arrival at the deadman receiver proves the
      # whole alerting path (Prometheus -> Alertmanager -> heartbeat) is live, so
      # its ABSENCE is the signal — a missed beat means the pipeline is broken,
      # not that anything here is wrong. No for:, so it fires on the first
      # evaluation; severity none, as a firing Watchdog is never itself a problem.
      # A second route (alertmanager role, which owns the cadence and the why)
      # also delivers it to Discord periodically, exercising the webhook.
      - alert: Watchdog
        expr: vector(1)
        labels:
          severity: none
        annotations:
          summary: "alerting pipeline heartbeat"
          description: "Always firing; the periodic Discord leg exercises the webhook, and a stopped deadman beat means the pipeline is broken."
