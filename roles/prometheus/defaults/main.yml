---
# Where the compose project (compose.yaml + prometheus.yml) is written.
prometheus_project_dir: /opt/prometheus

# Host path bind-mounted as the TSDB data dir (/prometheus in the container).
prometheus_data_dir: /var/lib/prometheus

# How long the TSDB keeps samples. Pinned rather than left on Prometheus's 15d
# default because MicroOSBuildStale needs a fortnight of history to read, and that
# floor should not rest on a default nobody declared. Double the window, so a
# fortnight is there with room. Roughly 2.5GB at the fleet's 17k series, against
# 333GB free on the volume.
prometheus_retention_time: 30d

# The container runs as this uid:gid so the TSDB bind mount can be 0755 owned by
# the deploy user instead of world-writable — the NAS has no sudo to chown the
# mount to the image's default nobody (65534). Defaults to the connecting user
# (root under molecule, jonny on the NAS), which the data-dir task makes the owner.
prometheus_run_user: "{{ ansible_facts['user_uid'] }}:{{ ansible_facts['user_gid'] }}"

# Alertmanager targets alerts are ROUTED to, each "host:9093". Empty by default,
# so no alerting block or rule files are configured until a host sets them.
#
# Routed to and not scraped: this role scrapes nothing but itself. The agent
# co-located with Alertmanager scrapes it over loopback, and adding a scrape here
# would give the one Alertmanager two instance labels, so InstanceDown would fire
# on whichever network path blipped rather than on Alertmanager being down.
prometheus_alertmanager_targets: []

# Accept remote-write pushes (--web.enable-remote-write-receiver), so a
# Prometheus running in agent mode elsewhere can write into this TSDB. Off by
# default: the endpoint carries no authentication, so anything that can reach the
# port can inject series, and it is opened only where an agent actually writes.
prometheus_remote_write_receiver: false

# How far behind the head a sample may be and still be ingested, as
# storage.tsdb.out_of_order_time_window. Empty leaves Prometheus's default, which
# is no out-of-order ingestion at all.
#
# It is what makes a writing agent's buffer real rather than notional. An agent
# holds samples in its WAL while this server is unreachable and replays them on
# reconnect — but this server's own self-scrape keeps its head advancing and
# compacting to a block every 2h, so on reconnect anything older than the last
# persisted block is rejected as out of bounds and silently dropped. Size this to
# the agent's --storage.agent.retention.max-time — prometheus_agent_retention_max_time,
# which that role sets explicitly rather than inheriting a compiled-in default, so
# this pair cannot come apart under a digest bump — and the two together mean an
# outage shorter than the buffer loses nothing.
prometheus_out_of_order_time_window: ""

# Extra compose security_opt entries, appended to the no-new-privileges the
# template hardcodes (alongside cap_drop: ALL). Empty in production; the molecule
# scenario sets apparmor=unconfined because its nested CI container cannot load an
# AppArmor profile.
prometheus_security_opt_extra: []
