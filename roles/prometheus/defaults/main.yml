---
# Where prometheus.yml and the rules directory are rendered, and bind-mounted
# read-only into the container at the same path.
prometheus_config_dir: /etc/prometheus

# Address the web endpoint binds. Loopback by default, since nothing off a host
# has business reaching a Prometheus that only it queries; a host whose Grafana
# lives elsewhere on the LAN overrides it.
prometheus_listen_address: 127.0.0.1:9090

# What the self-scrape job aims at, and so the `instance` label on the only series
# that reports whether the fleet's rule evaluator is itself healthy — the two
# alerts in the monitoring group read nothing else.
#
# Defaults to whatever the endpoint binds, which is right while that is loopback.
# A host binding the LAN overrides it with a NAME: 192.168.x.x:9090 is a poor label
# to title an alert with, and though --web.listen-address would take a name, making
# the bind wait on name resolution at boot buys nothing. That split is not new —
# node_exporter and cadvisor already bind an address and are scraped by hostname.
prometheus_self_target: "{{ prometheus_listen_address }}"

# How long the TSDB keeps samples. Pinned rather than left on Prometheus's 15d
# default because MicroOSBuildStale needs a fortnight of history to read, and that
# floor should not rest on a default nobody declared. Double the window, so a
# fortnight is there with room. A host with storage to spare sets it far higher:
# measured on this fleet, 30 days costs 2.1 GB, so a year is ~26 GB.
prometheus_retention_time: 30d

# Alertmanager targets, each "host:9093" — both the alerting block alerts are
# ROUTED to and the alertmanager scrape job's target list. One var for both
# because there is one Alertmanager at one address: scraping it from anywhere
# else would give it a second instance label, and InstanceDown would then fire on
# whichever network path blipped rather than on Alertmanager being down.
#
# Empty configures no alerting and loads no rules, so the role is a bare scraper
# until a host sets it.
prometheus_alertmanager_targets: []

# node_exporter scrape targets, each "host:9100".
prometheus_node_targets: []

# cadvisor scrape targets, each "host:8080", scraped at 30s to match cadvisor's
# housekeeping interval.
prometheus_cadvisor_targets: []

# Blackbox probe targets: each entry pairs a prober module with the full URLs to
# run it against, and the same module may appear in more than one entry.
prometheus_probe_targets: []

# host:port of the blackbox_exporter the blackbox job scrapes. Must match the
# blackbox_exporter role's blackbox_exporter_listen_address — two independent
# defaults on co-located roles, agreeing at the exporter's loopback bind.
prometheus_blackbox_address: 127.0.0.1:9115
