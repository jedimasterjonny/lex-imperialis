---
# promtool unit tests for the shipped alert rules. Run by the promtool-test
# pre-commit hook, which fires on a change to either this file or the rules.
#
# These drive the rules the fleet actually loads — rule_files points at the real
# alerts.yml, resolved relative to this file — so a test cannot pass against a
# restated copy of an expression while the shipped one is broken.
#
# Deliberately not molecule's job: the scenario asserts the rules load in a real
# Prometheus (by name and count), which is the deployment half. Whether an
# expression fires on the fault it names is a property of the file, and promtool
# evaluates for: windows, labels and annotations in milliseconds without a
# container tier.
rule_files:
  - ../files/rules/alerts.yml

# 5m, not the 1m these cases were first written at: MicroOSBuildStale turns on a
# fortnight-wide window, and re-evaluating that every simulated minute costs the hook
# five times its runtime for nothing. Every eval_time and every rule for: is a multiple
# of 5m, so nothing below loses precision — but promtool floors an off-grid eval_time
# silently rather than rejecting it, so a case written at 3h57m would assert at 3h55m
# and quietly mean something other than it says. The 5m ceiling binds each test's own
# series interval, not this: a series sampled sparser than the lookback reads as stale
# between evaluations, and no for: could ever be satisfied.
evaluation_interval: 5m

tests:
  # ScheduledJobMetricMissing exists because a *Failed rule whose metric family
  # has vanished matches an empty vector and never fires. A test that only
  # asserted the rule parsed would repeat exactly that mistake, so both
  # polarities are named cases here.
  - interval: 1m
    name: a unit whose outcome metric is never published alerts
    input_series:
      - series: 'node_systemd_unit_state{job="node",instance="solar:9100",name="home-backup.service",state="active"}'
        values: "1x70"
    alert_rule_test:
      # Past the rule's for: 1h, so this covers the wait as well as the match.
      - eval_time: 65m
        alertname: ScheduledJobMetricMissing
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: solar:9100
              name: home-backup.service
            exp_annotations:
              summary: "home-backup.service on solar:9100 publishes no outcome metric"
              description: >-
                home-backup.service is installed on solar:9100 but its textfile outcome
                metric is absent, so that unit's bespoke *Failed and *Overdue rules match
                an empty vector and can never fire — and SystemdUnitFailed excludes it on
                the assumption they do.
      # Still inside for:, so the alert is pending rather than firing. Without
      # this the case above would also pass a rule with no for: at all.
      - eval_time: 30m
        alertname: ScheduledJobMetricMissing
        exp_alerts: []

  # The negative control, and the reason the case above means anything: publish
  # the metric and the same rule must go quiet.
  - interval: 1m
    name: a unit publishing its outcome metric does not alert
    input_series:
      - series: 'node_systemd_unit_state{job="node",instance="solar:9100",name="home-backup.service",state="active"}'
        values: "1x70"
      - series: 'home_backup_success{job="node",instance="solar:9100"}'
        values: "1x70"
    alert_rule_test:
      - eval_time: 65m
        alertname: ScheduledJobMetricMissing
        exp_alerts: []

  # node_exporter emits one series per unit *per state*, so the left-hand
  # group by (instance, name) is load-bearing: without it each state would
  # survive the join and one broken family would raise five identical alerts.
  - interval: 1m
    name: the many states of one unit raise exactly one alert
    input_series:
      - series: 'node_systemd_unit_state{job="node",instance="solar:9100",name="home-backup.service",state="active"}'
        values: "1x70"
      - series: 'node_systemd_unit_state{job="node",instance="solar:9100",name="home-backup.service",state="failed"}'
        values: "0x70"
      - series: 'node_systemd_unit_state{job="node",instance="solar:9100",name="home-backup.service",state="inactive"}'
        values: "0x70"
    alert_rule_test:
      - eval_time: 65m
        alertname: ScheduledJobMetricMissing
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: solar:9100
              name: home-backup.service
            exp_annotations:
              summary: "home-backup.service on solar:9100 publishes no outcome metric"
              description: >-
                home-backup.service is installed on solar:9100 but its textfile outcome
                metric is absent, so that unit's bespoke *Failed and *Overdue rules match
                an empty vector and can never fire — and SystemdUnitFailed excludes it on
                the assumption they do.

  # The right-hand side is joined with `unless on (instance)`, which builds a
  # signature set and so collapses duplicates on its own — no aggregation needed
  # to suppress a family that reports more than one series per host. Pins that,
  # since it is why the right-hand sides are bare metric selectors.
  - interval: 1m
    name: a multi-series outcome metric still suppresses the alert
    input_series:
      - series: 'node_systemd_unit_state{job="node",instance="solar:9100",name="wordpress-db-dump.service",state="active"}'
        values: "1x70"
      - series: 'wordpress_db_dump_success{job="node",instance="solar:9100",site="one"}'
        values: "1x70"
      - series: 'wordpress_db_dump_success{job="node",instance="solar:9100",site="two"}'
        values: "1x70"
    alert_rule_test:
      - eval_time: 65m
        alertname: ScheduledJobMetricMissing
        exp_alerts: []

  # One host losing its metric must not mask another host that still has one,
  # and the alert has to name the host that broke.
  - interval: 1m
    name: the alert is per host, not fleet-wide
    input_series:
      - series: 'node_systemd_unit_state{job="node",instance="solar:9100",name="podman-backup.service",state="active"}'
        values: "1x70"
      - series: 'node_systemd_unit_state{job="node",instance="rogue-trader:9100",name="podman-backup.service",state="active"}'
        values: "1x70"
      - series: 'podman_backup_success{job="node",instance="solar:9100"}'
        values: "1x70"
    alert_rule_test:
      - eval_time: 65m
        alertname: ScheduledJobMetricMissing
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: rogue-trader:9100
              name: podman-backup.service
            exp_annotations:
              summary: "podman-backup.service on rogue-trader:9100 publishes no outcome metric"
              description: >-
                podman-backup.service is installed on rogue-trader:9100 but its textfile
                outcome metric is absent, so that unit's bespoke *Failed and *Overdue
                rules match an empty vector and can never fire — and SystemdUnitFailed
                excludes it on the assumption they do.

  # AutoupdateFailed's for: is sized to outlast autoupdate.service's retry burst
  # (RestartSec=1h x StartLimitBurst=4 = 3h), so these two cases are really one
  # assertion about that coupling: shorten the for: back to minutes and the
  # healing case below starts paging for a mirror lag that fixed itself.
  - interval: 1m
    name: an update still inside its retry burst does not alert
    input_series:
      # Fails, then a retry an hour in succeeds and rewrites the metric.
      - series: 'autoupdate_success{job="node",instance="scholam:9100"}'
        values: "0x60 1x200"
    alert_rule_test:
      - eval_time: 4h5m
        alertname: AutoupdateFailed
        exp_alerts: []

  - interval: 1m
    name: an update that exhausts its retries alerts
    input_series:
      - series: 'autoupdate_success{job="node",instance="scholam:9100"}'
        values: "0x260"
    alert_rule_test:
      # Past for:, so the retries are spent and the host really is unpatched.
      - eval_time: 4h5m
        alertname: AutoupdateFailed
        exp_alerts:
          - exp_labels:
              severity: warning
              job: node
              instance: scholam:9100
            exp_annotations:
              summary: "unattended update failed on scholam:9100"
              description: >-
                The last unattended update on scholam:9100 failed — the host may be
                unpatched or did not reboot.
      # Still pending: without this the case above would also pass a for: of 15m,
      # which is the value this change moved away from.
      - eval_time: 3h55m
        alertname: AutoupdateFailed
        exp_alerts: []

  # FilesystemReadOnly carves out the MicroOS root, which is read-only by design.
  # The carve-out is the kind that silently over-reaches, so all three polarities
  # are named: the state it must ignore, and the two neighbouring states it must
  # still catch. Dropping the join keys to instance alone passes the first case
  # and fails the third.
  - interval: 1m
    name: the MicroOS root being read-only does not alert
    input_series:
      - series: 'node_filesystem_readonly{job="node",instance="rogue-trader:9100",mountpoint="/",fstype="btrfs",device="/dev/sda3"}'
        values: "1x20"
      - series: 'node_os_info{job="node",instance="rogue-trader:9100",id="opensuse-microos",name="openSUSE MicroOS"}'
        values: "1x20"
    alert_rule_test:
      - eval_time: 15m
        alertname: FilesystemReadOnly
        exp_alerts: []

  # The exclusion keys on the OS, not on the mountpoint: a read-only / on a
  # Tumbleweed host is still the I/O-error remount the rule is named for.
  - interval: 1m
    name: a read-only root on a non-MicroOS host still alerts
    input_series:
      - series: 'node_filesystem_readonly{job="node",instance="solar:9100",mountpoint="/",fstype="btrfs",device="/dev/sda2"}'
        values: "1x20"
      - series: 'node_os_info{job="node",instance="solar:9100",id="opensuse-tumbleweed",name="openSUSE Tumbleweed"}'
        values: "1x20"
    alert_rule_test:
      - eval_time: 15m
        alertname: FilesystemReadOnly
        exp_alerts:
          - exp_labels:
              severity: critical
              job: node
              instance: solar:9100
              mountpoint: /
              fstype: btrfs
              device: /dev/sda2
            exp_annotations:
              summary: "solar:9100:/ is mounted read-only"
              description: "/ on solar:9100 is mounted read-only — writes fail silently. Likely a remount after an I/O error."

  # And it keys on the mountpoint, not just the OS: /var is a writable subvolume
  # on MicroOS, so it going read-only there is a real fault the carve-out must
  # not swallow.
  - interval: 1m
    name: a read-only non-root filesystem on MicroOS still alerts
    input_series:
      - series: 'node_filesystem_readonly{job="node",instance="rogue-trader:9100",mountpoint="/var",fstype="btrfs",device="/dev/sda3"}'
        values: "1x20"
      - series: 'node_os_info{job="node",instance="rogue-trader:9100",id="opensuse-microos",name="openSUSE MicroOS"}'
        values: "1x20"
    alert_rule_test:
      - eval_time: 15m
        alertname: FilesystemReadOnly
        exp_alerts:
          - exp_labels:
              severity: critical
              job: node
              instance: rogue-trader:9100
              mountpoint: /var
              fstype: btrfs
              device: /dev/sda3
            exp_annotations:
              summary: "rogue-trader:9100:/var is mounted read-only"
              description: "/var on rogue-trader:9100 is mounted read-only — writes fail silently. Likely a remount after an I/O error."

  # MicroOSBuildStale is the only rule that sees a rolled-back host, so a rule that
  # parses but cannot fire would restore exactly the blind spot it was written for.
  # These sample at 5m per the file-level note above, the window being a fortnight.
  #
  # The rollback is deliberately absent from the input: the series simply stops
  # advancing, which is the shape the rule's own comment explains it has to read.
  #
  # Three hosts in one case rather than three cases, because each has to run past the
  # rule's 14d offset guard before it proves anything, and that horizon is what the
  # runtime is made of. The firing assertion names one host, so it pins the scope twice
  # over: a fleet-wide floor would go quiet, and a dropped id selector would add a
  # fourth alert.
  - interval: 5m
    name: one stale host alerts, while a host still advancing and a non-MicroOS host do not
    input_series:
      # Stale: a day on the old build, then an update lands and nothing moves after it.
      # The hole at 26h50m-27h10m sits exactly a fortnight before the firing assertion
      # below, so it lands under the offset: the guard's 1d range still spans it, where a
      # bare instant selector there would come up empty and drop the alert.
      - series: 'node_os_version{job="node",instance="rogue-trader:9100",id="opensuse-microos",name="openSUSE MicroOS"}'
        values: "20260717x287 20260724x33 _ _ _ _ _ 20260724x4061"
      # Healthy: keeps taking a new build, so a lower one is always inside its window.
      - series: 'node_os_version{job="node",instance="solar:9100",id="opensuse-microos",name="openSUSE MicroOS"}'
        values: "20260717x287 20260724x2015 20260731x2100"
      # Not MicroOS, and just as stuck: only the id selector keeps it out.
      - series: 'node_os_version{job="node",instance="scholam:9100",id="opensuse-tumbleweed",name="openSUSE Tumbleweed"}'
        values: "20260724x4400"
    alert_rule_test:
      # 14 days in, past the offset guard so the rule is free to fire: the previous build
      # is still inside the window, so every host has demonstrably updated within a
      # fortnight and the rule must stay quiet. This is the ordinary healthy state, the
      # one a badly written staleness rule pages about daily, and what pins the window —
      # shorten it to a week and this case alerts.
      - eval_time: 340h
        alertname: MicroOSBuildStale
        exp_alerts: []
      # The last older sample leaves the window at 359h55m, so the rule goes active
      # there and this is the last evaluation still inside its for:. Five minutes of
      # slack either side, which pins the for: to the three hours it claims rather
      # than to anything shorter.
      - eval_time: 362h50m
        alertname: MicroOSBuildStale
        exp_alerts: []
      # Past for:, and only the stale MicroOS host alerts.
      - eval_time: 363h
        alertname: MicroOSBuildStale
        exp_alerts:
          - exp_labels:
              severity: warning
              job: node
              instance: rogue-trader:9100
              id: opensuse-microos
              name: openSUSE MicroOS
            exp_annotations:
              summary: "MicroOS build stale on rogue-trader:9100"
              description: >-
                rogue-trader:9100 is still on build 20260724, the oldest it has run in a
                fortnight — two update cycles have changed nothing, so it is unpatched and not
                updating itself. A failed boot most likely rolled it back to the previous
                snapshot: check `journalctl -u health-checker` and `snapper list`.

  # The offset conjunct, which the rule's comment explains: without it a series younger
  # than the window has a minimum that is trivially its own current value, and fires.
  #
  # Just under the offset's own length, not a token day or two, so the case pins how far
  # back the guard reaches and not merely that it is there: any shortening leaves a rule
  # as noisy as having no guard at all, and a series that stops short of the real offset
  # would pass every one of them. Evaluated three hours past where a shortened guard
  # would go active, since one that is merely pending still asserts nothing.
  - interval: 5m
    name: a host with less history than the window does not alert
    input_series:
      - series: 'node_os_version{job="node",instance="rogue-trader:9100",id="opensuse-microos",name="openSUSE MicroOS"}'
        values: "20260724x3790"
    alert_rule_test:
      - eval_time: 315h
        alertname: MicroOSBuildStale
        exp_alerts: []

  # The drift rules' for: windows are sized to the inquisition's hourly cadence:
  # one bad run poisons a whole hour of scrapes, so every window spans at least
  # two runs and a single-run wobble never fires. Each class gets its firing
  # case; digest also gets the not-yet case that pins the wait, and Failed the
  # one-bad-run case that pins the two-run demand.
  - interval: 5m
    name: a container off its pinned digest for over 6h alerts
    input_series:
      - series: 'inquisition_offender{job="node",instance="solar:9100",class="digest",container="sonarr"}'
        values: "1x80"
    alert_rule_test:
      - eval_time: 6h5m
        alertname: ContainerDigestDrift
        exp_alerts:
          - exp_labels:
              severity: warning
              job: node
              instance: solar:9100
              class: digest
              container: sonarr
            exp_annotations:
              summary: "sonarr on solar:9100 runs an image its quadlet does not pin"
              description: >-
                sonarr on solar:9100 has run for over 6 hours on a digest other than its
                quadlet's pin — a restart that never fired, or a pin applied without one.

  - interval: 5m
    name: digest drift younger than its window does not alert
    input_series:
      - series: 'inquisition_offender{job="node",instance="solar:9100",class="digest",container="sonarr"}'
        values: "1x80"
    alert_rule_test:
      - eval_time: 5h55m
        alertname: ContainerDigestDrift
        exp_alerts: []

  - interval: 5m
    name: an undeclared container standing 2h alerts
    input_series:
      - series: 'inquisition_offender{job="node",instance="solar:9100",class="unmanaged",container="interloper"}'
        values: "1x30"
    alert_rule_test:
      - eval_time: 2h5m
        alertname: UnmanagedContainerRunning
        exp_alerts:
          - exp_labels:
              severity: warning
              job: node
              instance: solar:9100
              class: unmanaged
              container: interloper
            exp_annotations:
              summary: "interloper on solar:9100 is declared by no quadlet"
              description: >-
                interloper exists on solar:9100 outside the repo's declarations — unmanaged
                state the fleet's config does not describe.

  - interval: 5m
    name: a declared quadlet not running for 2h alerts
    input_series:
      - series: 'inquisition_offender{job="node",instance="solar:9100",class="inactive",container="idle"}'
        values: "1x30"
    alert_rule_test:
      - eval_time: 2h5m
        alertname: QuadletNotRunning
        exp_alerts:
          - exp_labels:
              severity: warning
              job: node
              instance: solar:9100
              class: inactive
              container: idle
            exp_annotations:
              summary: "idle on solar:9100 is declared but not running"
              description: >-
                The quadlet for idle on solar:9100 is on disk but its service is not active —
                never started, or stopped by hand. SystemdUnitFailed only sees the failed state.

  - interval: 5m
    name: a tag-only quadlet standing 2h alerts
    input_series:
      - series: 'inquisition_offender{job="node",instance="rogue-trader:9100",class="unpinned",container="floater"}'
        values: "1x30"
    alert_rule_test:
      - eval_time: 2h5m
        alertname: QuadletUnpinned
        exp_alerts:
          - exp_labels:
              severity: warning
              job: node
              instance: rogue-trader:9100
              class: unpinned
              container: floater
            exp_annotations:
              summary: "floater on rogue-trader:9100 is not pinned by digest"
              description: >-
                The quadlet for floater on rogue-trader:9100 carries a tag-only Image= —
                outside the renovate pin discipline, so what it runs after a pull is
                unrecorded.

  - interval: 5m
    name: two consecutive failed drift checks alert
    input_series:
      - series: 'inquisition_success{job="node",instance="solar:9100"}'
        values: "0x30"
    alert_rule_test:
      - eval_time: 95m
        alertname: InquisitionFailed
        exp_alerts:
          - exp_labels:
              severity: warning
              job: node
              instance: solar:9100
            exp_annotations:
              summary: "drift check failed on solar:9100"
              description: >-
                The last two drift check runs on solar:9100 failed — the host's containers
                are unwatched.

  # Evaluated at 60m, while the failed sample is still the latest one: past 65m
  # the series has recovered and `== 0` is an empty vector, which would hold for
  # a rule with no for: at all. The point is that one failure is still only
  # pending at an hour, not that a recovered host is silent.
  - interval: 5m
    name: a single failed drift check is still only pending at an hour
    input_series:
      - series: 'inquisition_success{job="node",instance="solar:9100"}'
        values: "0x12 1x30"
    alert_rule_test:
      - eval_time: 60m
        alertname: InquisitionFailed
        exp_alerts: []

  # The threshold trips at 3h and the window closes 2h later, so 5h05m is the
  # first evaluation past both — 4h05m would assert the old 1h window.
  - interval: 5m
    name: a drift check silent for over 3h alerts
    input_series:
      - series: 'inquisition_last_run_timestamp_seconds{job="node",instance="solar:9100"}'
        values: "0x75"
    alert_rule_test:
      - eval_time: 5h5m
        alertname: InquisitionOverdue
        exp_alerts:
          - exp_labels:
              severity: warning
              job: node
              instance: solar:9100
            exp_annotations:
              summary: "drift check overdue on solar:9100"
              description: >-
                solar:9100 has not completed a drift check in over 3 hours — the hourly
                timer has stopped firing.

  # The claim every 2h window rests on, pinned rather than asserted in a comment:
  # a mid-update wobble that the next hourly run clears must not fire. The series
  # stands for one run's worth of scrapes and then ends, so it is absent — not
  # zero — when the window closes, which is exactly how a cleared offender
  # behaves (the check publishes no line for a container that is no longer
  # drifting).
  # Evaluated at 60m, the last sample of the one run's worth: after that the
  # series is absent and the expression empty, so a later eval_time would pass
  # against a rule with no for: at all.
  - interval: 5m
    name: an offender one hourly run old is still only pending
    input_series:
      - series: 'inquisition_offender{job="node",instance="solar:9100",class="unmanaged",container="interloper"}'
        values: "1x12"
    alert_rule_test:
      - eval_time: 60m
        alertname: UnmanagedContainerRunning
        exp_alerts: []

  # The denominator rule: a check that inspected nothing publishes exactly what
  # a clean host does — no offender, success 1 — so without this it reads clean.
  - interval: 5m
    name: a host whose quadlets have all disappeared alerts
    input_series:
      - series: 'inquisition_containers_checked{job="node",instance="solar:9100"}'
        values: "0x30"
    alert_rule_test:
      - eval_time: 2h5m
        alertname: QuadletsDisappeared
        exp_alerts:
          - exp_labels:
              severity: warning
              job: node
              instance: solar:9100
            exp_annotations:
              summary: "solar:9100 declares no quadlets"
              description: >-
                The drift check on solar:9100 found no quadlet declarations to compare —
                the host is watched but has nothing to watch, so every other drift rule
                reads clean by vacuum.

  - interval: 5m
    name: each class rule claims only its own offender
    input_series:
      - series: 'inquisition_offender{job="node",instance="solar:9100",class="digest",container="sonarr"}'
        values: "1x90"
      - series: 'inquisition_offender{job="node",instance="solar:9100",class="unmanaged",container="interloper"}'
        values: "1x90"
      - series: 'inquisition_offender{job="node",instance="solar:9100",class="inactive",container="idle"}'
        values: "1x90"
      - series: 'inquisition_offender{job="node",instance="solar:9100",class="unpinned",container="floater"}'
        values: "1x90"
      - series: 'inquisition_containers_checked{job="node",instance="solar:9100"}'
        values: "15x90"
      - series: 'inquisition_success{job="node",instance="solar:9100"}'
        values: "1x90"
    alert_rule_test:
      - eval_time: 7h
        alertname: ContainerDigestDrift
        exp_alerts:
          - exp_labels:
              severity: warning
              job: node
              instance: solar:9100
              class: digest
              container: sonarr
            exp_annotations:
              summary: "sonarr on solar:9100 runs an image its quadlet does not pin"
              description: >-
                sonarr on solar:9100 has run for over 6 hours on a digest other than its
                quadlet's pin — a restart that never fired, or a pin applied without one.
      - eval_time: 7h
        alertname: UnmanagedContainerRunning
        exp_alerts:
          - exp_labels:
              severity: warning
              job: node
              instance: solar:9100
              class: unmanaged
              container: interloper
            exp_annotations:
              summary: "interloper on solar:9100 is declared by no quadlet"
              description: >-
                interloper exists on solar:9100 outside the repo's declarations — unmanaged
                state the fleet's config does not describe.
      - eval_time: 7h
        alertname: QuadletNotRunning
        exp_alerts:
          - exp_labels:
              severity: warning
              job: node
              instance: solar:9100
              class: inactive
              container: idle
            exp_annotations:
              summary: "idle on solar:9100 is declared but not running"
              description: >-
                The quadlet for idle on solar:9100 is on disk but its service is not active —
                never started, or stopped by hand. SystemdUnitFailed only sees the failed state.
      - eval_time: 7h
        alertname: QuadletUnpinned
        exp_alerts:
          - exp_labels:
              severity: warning
              job: node
              instance: solar:9100
              class: unpinned
              container: floater
            exp_annotations:
              summary: "floater on solar:9100 is not pinned by digest"
              description: >-
                The quadlet for floater on solar:9100 carries a tag-only Image= —
                outside the renovate pin discipline, so what it runs after a pull is
                unrecorded.
      # A host inspecting 15 quadlets is not a vacuum, and a run reporting success
      # is not a failure — the two threshold rules the offenders do not cover.
      - eval_time: 7h
        alertname: QuadletsDisappeared
        exp_alerts: []
      - eval_time: 7h
        alertname: InquisitionFailed
        exp_alerts: []

  # PrometheusAgentAbsent is the rule that catches every OTHER rule going quiet,
  # so a test that only proved it parsed would repeat the exact mistake it exists
  # to prevent. Both polarities are named cases, and the pending case pins the
  # for: — without it the firing case would also pass a rule with no wait at all.
  - interval: 1m
    name: samples no longer arriving from the agent alerts
    input_series:
      # Deliberately not the agent's own series: this input is another job
      # entirely, so up{job="prometheus_agent"} is genuinely absent while the
      # server is otherwise healthy. An empty input_series would also satisfy
      # absent(), but would not distinguish "the agent stopped" from "nothing is
      # running at all", which is the distinction the rule is making.
      - series: 'up{job="prometheus",instance="administratum:9090"}'
        values: "1x30"
    alert_rule_test:
      - eval_time: 15m
        alertname: PrometheusAgentAbsent
        exp_alerts:
          - exp_labels:
              severity: critical
              job: prometheus_agent
            exp_annotations:
              summary: "no samples are arriving from the prometheus agent"
              description: >-
                No up{job="prometheus_agent"} series is arriving, so the agent that scrapes
                the entire fleet is not writing. Every other rule is now evaluating an empty
                vector and cannot fire — this alert is the only thing standing between a
                stopped agent and silence. Expect roughly 15 minutes from the agent stopping
                to this firing, not the 10m for: alone: up stays queryable for the 5m
                lookback delta after its last sample, so absent() only turns true once that
                has elapsed.
      # Inside for:, so pending rather than firing.
      - eval_time: 5m
        alertname: PrometheusAgentAbsent
        exp_alerts: []

  # The negative control, and what makes the case above mean anything: an agent
  # that is writing must leave the rule silent, even while it is failing to
  # deliver — the two rules cover different faults and must not double-report.
  - interval: 1m
    name: an agent that is writing does not raise the absent alert
    input_series:
      - series: 'up{job="prometheus_agent",instance="127.0.0.1:9090"}'
        values: "1x30"
    alert_rule_test:
      - eval_time: 15m
        alertname: PrometheusAgentAbsent
        exp_alerts: []

  # The partial-failure case: the channel is up enough to carry its own bad news.
  - interval: 1m
    name: an agent failing to write samples alerts
    input_series:
      - series: 'prometheus_remote_storage_samples_failed_total{job="prometheus_agent",instance="127.0.0.1:9090",url="http://administratum:9090/api/v1/write"}'
        values: "0+60x30"
    alert_rule_test:
      - eval_time: 20m
        alertname: PrometheusRemoteWriteFailing
        exp_alerts:
          - exp_labels:
              severity: warning
              job: prometheus_agent
              instance: 127.0.0.1:9090
              url: http://administratum:9090/api/v1/write
            exp_annotations:
              summary: "prometheus agent on 127.0.0.1:9090 is failing to write samples"
              description: >-
                The agent on 127.0.0.1:9090 has been failing to write samples to
                http://administratum:9090/api/v1/write for 15 minutes. Its WAL buffers
                against a receiver outage, but only to
                --storage.agent.retention.max-time — past that the backlog is dropped, and
                anything older than the receiver's out_of_order_time_window is refused even
                once it reconnects.
      - eval_time: 10m
        alertname: PrometheusRemoteWriteFailing
        exp_alerts: []

  # A flat failure counter is a healthy agent: the rule keys on the rate, so a
  # historical failure that stopped must not keep alerting forever.
  - interval: 1m
    name: a failure counter that has stopped rising does not alert
    input_series:
      - series: 'prometheus_remote_storage_samples_failed_total{job="prometheus_agent",instance="127.0.0.1:9090",url="http://administratum:9090/api/v1/write"}'
        values: "500x30"
    alert_rule_test:
      - eval_time: 20m
        alertname: PrometheusRemoteWriteFailing
        exp_alerts: []

  # The Pi branch of HostCpuTemperatureHigh. The 15m eval fires and the 10m one does
  # not, which pins the for: to the window it claims rather than to anything shorter.
  - interval: 1m
    name: a Pi held above its soft-throttle point alerts
    input_series:
      - series: 'node_hwmon_temp_celsius{chip="thermal_thermal_zone0",job="node",instance="auspex:9100",sensor="temp1"}'
        values: "86x30"
    alert_rule_test:
      - eval_time: 15m
        alertname: HostCpuTemperatureHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: auspex:9100
            exp_annotations:
              summary: "CPU on auspex:9100 sustained above its thermal limit"
              description: >-
                auspex:9100 has held its CPU at 86C for 15 minutes — past the limit
                for its class, 95C on the N150s and 80C on the Pi. Check the heatsink
                and that the fan is spinning.
      - eval_time: 10m
        alertname: HostCpuTemperatureHigh
        exp_alerts: []

  # The negative control, at a temperature a Pi under real load reaches: the threshold
  # has to sit above working-warm or it reports the workload instead of the cooling.
  - interval: 1m
    name: a warm but unthrottled Pi stays silent
    input_series:
      - series: 'node_hwmon_temp_celsius{chip="thermal_thermal_zone0",job="node",instance="auspex:9100",sensor="temp1"}'
        values: "72x30"
    alert_rule_test:
      - eval_time: 20m
        alertname: HostCpuTemperatureHigh
        exp_alerts: []

  # 88C is the figure the rule's own comment cites for solar under its weekly zypper dup,
  # so this is the false positive the 95 threshold was chosen to avoid, held as a test.
  # It is also what stops the Pi's lower threshold leaking onto the N150s: collapse the
  # two branches to one 80C comparison and this case pages every week.
  - interval: 1m
    name: an N150 at its weekly peak load stays silent
    input_series:
      - series: 'node_hwmon_temp_celsius{chip="platform_coretemp_0",job="node",instance="solar:9100",sensor="temp1"}'
        values: "88x30"
    alert_rule_test:
      - eval_time: 20m
        alertname: HostCpuTemperatureHigh
        exp_alerts: []

  # Both branches live at once, each raising exactly one alert for its own host. A branch
  # dropped in a later edit shows up here as a missing alert rather than as a fault that
  # goes unreported for months — which, being a thermal fault on a fanless board in a
  # cupboard, is the failure this whole rule exists for.
  - interval: 1m
    name: a hot Pi and a hot N150 each raise one alert
    input_series:
      - series: 'node_hwmon_temp_celsius{chip="thermal_thermal_zone0",job="node",instance="auspex:9100",sensor="temp1"}'
        values: "100x30"
      - series: 'node_hwmon_temp_celsius{chip="platform_coretemp_0",job="node",instance="solar:9100",sensor="temp1"}'
        values: "100x30"
    alert_rule_test:
      - eval_time: 20m
        alertname: HostCpuTemperatureHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: auspex:9100
            exp_annotations:
              summary: "CPU on auspex:9100 sustained above its thermal limit"
              description: >-
                auspex:9100 has held its CPU at 100C for 15 minutes — past the limit
                for its class, 95C on the N150s and 80C on the Pi. Check the heatsink
                and that the fan is spinning.
          - exp_labels:
              severity: warning
              instance: solar:9100
            exp_annotations:
              summary: "CPU on solar:9100 sustained above its thermal limit"
              description: >-
                solar:9100 has held its CPU at 100C for 15 minutes — past the limit
                for its class, 95C on the N150s and 80C on the Pi. Check the heatsink
                and that the fan is spinning.

  # InstanceDown and BlackboxExporterDown split one failure mode, and the split is
  # only correct as a pair. Every blackbox target is a probe URL scraped from the one
  # co-located exporter, so an exporter outage takes all of them down at once: without
  # InstanceDown's job exclusion that is one critical per probed URL, and without the
  # max() it is one more on top. Both halves are asserted on the same input.
  - interval: 1m
    name: an unreachable blackbox exporter raises one alert, not one per probe target
    input_series:
      - series: 'up{job="blackbox",instance="https://jonnyoc.uk"}'
        values: "0x20"
      - series: 'up{job="blackbox",instance="https://sonarr.home.arpa/ping"}'
        values: "0x20"
      - series: 'up{job="blackbox",instance="https://transmission.home.arpa/transmission/web/"}'
        values: "0x20"
      # A healthy host alongside, so the silence below is the exclusion doing its work
      # rather than the rule having nothing to match at all.
      - series: 'up{job="node",instance="solar:9100"}'
        values: "1x20"
    alert_rule_test:
      - eval_time: 10m
        alertname: BlackboxExporterDown
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: "the blackbox exporter is unreachable — all probing is blind"
              description: "Prometheus cannot scrape the blackbox exporter, so nothing is being probed — not the public sites, not the containerised services."
      - eval_time: 10m
        alertname: InstanceDown
        exp_alerts: []
      # The first evaluation, where the exporter has just gone unreachable and the
      # rule is pending. A 5m for: is exactly one step of this file's 5m evaluation
      # interval, so no on-grid time can tell it from a shorter one — what this pins
      # is that the wait exists at all, which is what rides out a missed scrape.
      - eval_time: 0m
        alertname: BlackboxExporterDown
        exp_alerts: []

  # The other side of that split. A host that stops answering is InstanceDown's to
  # raise, and one blackbox target failing while its siblings answer is not an
  # exporter outage at all — which is what the max() is for. Written as min(), or as
  # a bare up{job="blackbox"} == 0, this case pages about the exporter every time a
  # single probe scrape times out.
  - interval: 1m
    name: a downed host alerts while a single blackbox scrape blip does not
    input_series:
      - series: 'up{job="node",instance="rogue-trader:9100"}'
        values: "0x20"
      - series: 'up{job="blackbox",instance="https://jonnyoc.uk"}'
        values: "0x20"
      - series: 'up{job="blackbox",instance="https://emmasedit.com"}'
        values: "1x20"
    alert_rule_test:
      - eval_time: 10m
        alertname: InstanceDown
        exp_alerts:
          - exp_labels:
              severity: critical
              job: node
              instance: rogue-trader:9100
            exp_annotations:
              summary: "rogue-trader:9100 (node) is down"
              description: "rogue-trader:9100 has been unreachable for over 5 minutes."
      - eval_time: 10m
        alertname: BlackboxExporterDown
        exp_alerts: []
      # Pending at the first evaluation; a 5m for: is one evaluation step, so this
      # pins that the wait exists, not its length.
      - eval_time: 0m
        alertname: InstanceDown
        exp_alerts: []

  # ProbeDown reads probe_success — the prober module's own verdict — rather than the
  # status code, because targets legitimately answer other codes: transmission's RPC
  # is auth-walled and answers 401 under http_2xx_or_401, and the redirect zones
  # answer 3xx before the 2xx. Keyed on the code instead, this case pages about a
  # target working exactly as designed.
  - interval: 1m
    name: an auth-walled target answering its module stays silent while a dead one alerts
    input_series:
      - series: 'probe_success{job="blackbox",instance="https://transmission.home.arpa/transmission/web/",module="http_2xx_or_401"}'
        values: "1x20"
      - series: 'probe_success{job="blackbox",instance="https://sonarr.home.arpa/ping",module="http_2xx"}'
        values: "0x20"
    alert_rule_test:
      - eval_time: 10m
        alertname: ProbeDown
        exp_alerts:
          - exp_labels:
              severity: critical
              job: blackbox
              instance: https://sonarr.home.arpa/ping
              module: http_2xx
            exp_annotations:
              summary: "probe of https://sonarr.home.arpa/ping is failing"
              description: "The blackbox probe of https://sonarr.home.arpa/ping has not answered with an accepted status for over 5 minutes."
      # Pending at the first evaluation, which is what rides out a deploy; a 5m for:
      # is one evaluation step, so this pins that the wait exists, not its length.
      - eval_time: 0m
        alertname: ProbeDown
        exp_alerts: []

  # The `> 0` conjunct is the whole rule. Blackbox exports a zero expiry both for a
  # failed probe and for a successful non-TLS one, and plex is probed over plain
  # HTTP — so `0 - time()` is hugely negative, satisfies the threshold, and without
  # the guard this fires forever on a target that has no certificate to expire.
  - interval: 5m
    name: a stalled renewal alerts while a plain-HTTP target and a fresh cert do not
    input_series:
      # Ten days out: a renewal has silently stalled, with time to intervene by hand.
      - series: 'probe_ssl_earliest_cert_expiry{job="blackbox",instance="https://jonnyoc.uk"}'
        values: "864000x20"
      # Thirty days out: the ordinary state of an auto-renewing cert.
      - series: 'probe_ssl_earliest_cert_expiry{job="blackbox",instance="https://emmasedit.com"}'
        values: "2592000x20"
      # plex, probed over plain HTTP: no certificate, so blackbox reports zero.
      - series: 'probe_ssl_earliest_cert_expiry{job="blackbox",instance="http://solar:32400/identity"}'
        values: "0x20"
    alert_rule_test:
      - eval_time: 1h5m
        alertname: ProbeSSLCertExpiringSoon
        exp_alerts:
          - exp_labels:
              severity: warning
              job: blackbox
              instance: https://jonnyoc.uk
            exp_annotations:
              summary: "TLS certificate for https://jonnyoc.uk expiring soon"
              description: "The TLS certificate served by https://jonnyoc.uk expires in under 14 days — auto-renewal may have stalled."
      - eval_time: 55m
        alertname: ProbeSSLCertExpiringSoon
        exp_alerts: []

  # The three backup *Failed rules share one shape and one risk: each reads a metric
  # family written by a different role's script, so a rule naming a family nothing
  # publishes is silent forever and indistinguishable from a healthy fleet — the trap
  # ScheduledJobMetricMissing exists for, on the very rules it protects. One case
  # reads all three, each failing on a host that actually runs it.
  - interval: 5m
    name: each backup family's failure raises its own alert and no other
    input_series:
      - series: 'podman_backup_success{job="node",instance="solar:9100"}'
        values: "0x10"
      - series: 'home_backup_success{job="node",instance="scholam:9100"}'
        values: "0x10"
      - series: 'wordpress_db_dump_success{job="node",instance="rogue-trader:9100"}'
        values: "0x10"
    alert_rule_test:
      - eval_time: 20m
        alertname: PodmanBackupFailed
        exp_alerts:
          - exp_labels:
              severity: critical
              job: node
              instance: solar:9100
            exp_annotations:
              summary: "podman backup failed on solar:9100"
              description: "The last podman volume backup run on solar:9100 failed."
      - eval_time: 20m
        alertname: HomeBackupFailed
        exp_alerts:
          - exp_labels:
              severity: critical
              job: node
              instance: scholam:9100
            exp_annotations:
              summary: "home backup failed on scholam:9100"
              description: "The last home directory backup run on scholam:9100 failed."
      - eval_time: 20m
        alertname: WordpressDbDumpFailed
        exp_alerts:
          - exp_labels:
              severity: critical
              job: node
              instance: rogue-trader:9100
            exp_annotations:
              summary: "WordPress database dump failed on rogue-trader:9100"
              description: "The last WordPress database dump on rogue-trader:9100 failed — the DR fallback for a broken in-place upgrade is now stale."
      # Inside for:, so all three are pending — one assertion pins the window they share.
      - eval_time: 10m
        alertname: PodmanBackupFailed
        exp_alerts: []

  # Every *Overdue rule is a threshold sitting a grace period above the cadence of the
  # timer that writes its gauge, and that grace is the only thing between a useful
  # alert and a weekly false positive. Here each gauge holds the age a healthy run
  # leaves it at, so the case fails the moment a threshold is tightened onto the
  # cadence itself.
  #
  # The gauges are negative because promtool's clock starts at zero: -604800 places
  # the last successful run seven days before the test begins, which pins an eight-day
  # threshold without simulating eight days of scrapes.
  - interval: 5m
    name: every scheduled job at its healthy cadence stays silent
    input_series:
      # Weekly timers, a day inside their thresholds.
      - series: 'podman_backup_last_run_timestamp_seconds{job="node",instance="solar:9100"}'
        values: "-604800x20"
      - series: 'home_backup_last_run_timestamp_seconds{job="node",instance="solar:9100"}'
        values: "-604800x20"
      - series: 'autoupdate_last_run_timestamp_seconds{job="node",instance="solar:9100"}'
        values: "-604800x20"
      # Daily.
      - series: 'wordpress_db_dump_last_run_timestamp_seconds{job="node",instance="rogue-trader:9100"}'
        values: "-86400x20"
      # Six-hourly.
      - series: 'wordpress_update_check_last_run_timestamp_seconds{job="node",instance="rogue-trader:9100"}'
        values: "-21600x20"
      # Every fifteen minutes.
      - series: 'arbites_last_run_timestamp_seconds{job="node",instance="scholam:9100"}'
        values: "-900x20"
    alert_rule_test:
      - eval_time: 1h5m
        alertname: PodmanBackupOverdue
        exp_alerts: []
      - eval_time: 1h5m
        alertname: HomeBackupOverdue
        exp_alerts: []
      - eval_time: 1h5m
        alertname: AutoupdateOverdue
        exp_alerts: []
      - eval_time: 1h5m
        alertname: WordpressDbDumpOverdue
        exp_alerts: []
      - eval_time: 1h5m
        alertname: WordpressUpdateCheckOverdue
        exp_alerts: []
      - eval_time: 1h5m
        alertname: ArbitesStale
        exp_alerts: []

  # wordpress-cron's timer fires every five minutes and its threshold is an hour, both
  # inside the window these tests run in — so unlike the weekly gauges above, a
  # constant value would drift past the threshold on the clock alone and prove nothing.
  # Modelled as it behaves: a gauge that advances with time is never overdue, however
  # long the test runs.
  - interval: 5m
    name: a five-minutely job that keeps firing is never overdue
    input_series:
      - series: 'wordpress_cron_last_run_timestamp_seconds{job="node",instance="rogue-trader:9100"}'
        values: "0+300x30"
    alert_rule_test:
      - eval_time: 2h5m
        alertname: WordpressCronOverdue
        exp_alerts: []

  # The mirror of the healthy case: every gauge just past its own threshold, so each
  # rule fires for the job that has genuinely stopped. All seven share a 1h for:,
  # and each is asserted separately at 55m rather than once for the set — the shared
  # window is seven independent copies of the same literal, so one of them shortened
  # is exactly the edit a single assertion would wave through.
  - interval: 5m
    name: each scheduled job past its grace alerts
    input_series:
      - series: 'podman_backup_last_run_timestamp_seconds{job="node",instance="solar:9100"}'
        values: "-694800x20"
      - series: 'home_backup_last_run_timestamp_seconds{job="node",instance="solar:9100"}'
        values: "-694800x20"
      - series: 'autoupdate_last_run_timestamp_seconds{job="node",instance="solar:9100"}'
        values: "-781200x20"
      - series: 'wordpress_db_dump_last_run_timestamp_seconds{job="node",instance="rogue-trader:9100"}'
        values: "-176400x20"
      - series: 'wordpress_update_check_last_run_timestamp_seconds{job="node",instance="rogue-trader:9100"}'
        values: "-90000x20"
      - series: 'wordpress_cron_last_run_timestamp_seconds{job="node",instance="rogue-trader:9100"}'
        values: "-7200x20"
      - series: 'arbites_last_run_timestamp_seconds{job="node",instance="scholam:9100"}'
        values: "-10800x20"
    alert_rule_test:
      - eval_time: 1h5m
        alertname: PodmanBackupOverdue
        exp_alerts:
          - exp_labels:
              severity: warning
              job: node
              instance: solar:9100
            exp_annotations:
              summary: "podman backup overdue on solar:9100"
              description: "solar:9100 has not run a podman volume backup in over 8 days."
      - eval_time: 1h5m
        alertname: HomeBackupOverdue
        exp_alerts:
          - exp_labels:
              severity: warning
              job: node
              instance: solar:9100
            exp_annotations:
              summary: "home backup overdue on solar:9100"
              description: "solar:9100 has not run a home directory backup in over 8 days."
      - eval_time: 1h5m
        alertname: AutoupdateOverdue
        exp_alerts:
          - exp_labels:
              severity: warning
              job: node
              instance: solar:9100
            exp_annotations:
              summary: "unattended update overdue on solar:9100"
              description: "solar:9100 has not completed an unattended update in over 9 days."
      - eval_time: 1h5m
        alertname: WordpressDbDumpOverdue
        exp_alerts:
          - exp_labels:
              severity: warning
              job: node
              instance: rogue-trader:9100
            exp_annotations:
              summary: "WordPress database dump overdue on rogue-trader:9100"
              description: "rogue-trader:9100 has not produced a WordPress database dump in over 2 days."
      - eval_time: 1h5m
        alertname: WordpressUpdateCheckOverdue
        exp_alerts:
          - exp_labels:
              severity: warning
              job: node
              instance: rogue-trader:9100
            exp_annotations:
              summary: "WordPress update check overdue on rogue-trader:9100"
              description: "rogue-trader:9100 has not completed a WordPress update check in over a day."
      - eval_time: 1h5m
        alertname: WordpressCronOverdue
        exp_alerts:
          - exp_labels:
              severity: warning
              job: node
              instance: rogue-trader:9100
            exp_annotations:
              summary: "WordPress cron overdue on rogue-trader:9100"
              description: "rogue-trader:9100 has not run WordPress cron in over an hour — scheduled posts and tasks have stalled."
      - eval_time: 1h5m
        alertname: ArbitesStale
        exp_alerts:
          - exp_labels:
              severity: warning
              job: node
              instance: scholam:9100
            exp_annotations:
              summary: "fleet reconcile stale on scholam:9100"
              description: "scholam:9100 has not completed a fleet reconcile in over 2 hours."
      # Every gauge above is already past its threshold at the first evaluation, so
      # these seven are the 1h for: and nothing else.
      - eval_time: 55m
        alertname: PodmanBackupOverdue
        exp_alerts: []
      - eval_time: 55m
        alertname: HomeBackupOverdue
        exp_alerts: []
      - eval_time: 55m
        alertname: AutoupdateOverdue
        exp_alerts: []
      - eval_time: 55m
        alertname: WordpressDbDumpOverdue
        exp_alerts: []
      - eval_time: 55m
        alertname: WordpressUpdateCheckOverdue
        exp_alerts: []
      - eval_time: 55m
        alertname: WordpressCronOverdue
        exp_alerts: []
      - eval_time: 55m
        alertname: ArbitesStale
        exp_alerts: []

  # arbites is the unattended path from main to the fleet: when it fails, every merged
  # change stops arriving and nothing else says so — the fleet keeps serving the last
  # good apply, indefinitely and quietly. 15m is one timer cycle, so this lands on the
  # first run that does not recover.
  - interval: 5m
    name: a failed fleet reconcile alerts
    input_series:
      - series: 'arbites_success{job="node",instance="scholam:9100"}'
        values: "0x10"
    alert_rule_test:
      - eval_time: 20m
        alertname: ArbitesFailed
        exp_alerts:
          - exp_labels:
              severity: critical
              job: node
              instance: scholam:9100
            exp_annotations:
              summary: "fleet reconcile failed on scholam:9100"
              description: "The last unattended fleet reconcile on scholam:9100 failed — main is no longer reaching the fleet."
      - eval_time: 10m
        alertname: ArbitesFailed
        exp_alerts: []

  # wp-cron rewrites its metric every five minutes, so a single failed cycle clears
  # itself; the 15m for: is what tells that apart from a database that has actually
  # gone away. Evaluated at 10m, while the third failing sample is still the latest —
  # past 15m the series has recovered and `== 0` is an empty vector, which would hold
  # for a rule with no for: at all.
  - interval: 5m
    name: one failed wp-cron cycle is still only pending when the next runs
    input_series:
      - series: 'wordpress_cron_success{job="node",instance="rogue-trader:9100"}'
        values: "0x2 1x20"
    alert_rule_test:
      - eval_time: 10m
        alertname: WordpressCronFailed
        exp_alerts: []

  - interval: 5m
    name: three failed wp-cron cycles alert
    input_series:
      - series: 'wordpress_cron_success{job="node",instance="rogue-trader:9100"}'
        values: "0x10"
    alert_rule_test:
      - eval_time: 20m
        alertname: WordpressCronFailed
        exp_alerts:
          - exp_labels:
              severity: warning
              job: node
              instance: rogue-trader:9100
            exp_annotations:
              summary: "WordPress cron failed on rogue-trader:9100"
              description: "The last WordPress cron run on rogue-trader:9100 errored — the database is unreachable or wp-cli otherwise failed."

  # The update check runs six-hourly and holds success=0 constant until its next run,
  # so any for: shorter than that interval fires on a single wordpress.org blip. 12h
  # spans two checks: the first failure is still only pending when the second lands.
  - interval: 5m
    name: one failed six-hourly update check is still pending when the next runs
    input_series:
      - series: 'wordpress_update_check_success{job="node",instance="rogue-trader:9100"}'
        values: "0x72 1x80"
    alert_rule_test:
      - eval_time: 6h
        alertname: WordpressUpdateCheckFailed
        exp_alerts: []

  - interval: 5m
    name: an update check failing across two runs alerts
    input_series:
      - series: 'wordpress_update_check_success{job="node",instance="rogue-trader:9100"}'
        values: "0x150"
    alert_rule_test:
      - eval_time: 12h5m
        alertname: WordpressUpdateCheckFailed
        exp_alerts:
          - exp_labels:
              severity: warning
              job: node
              instance: rogue-trader:9100
            exp_annotations:
              summary: "WordPress update check failed on rogue-trader:9100"
              description: "The last WordPress update check on rogue-trader:9100 errored — pending core, plugin, theme, or translation updates may be missed."

  # WordPress applies minor core releases on its own twice-daily cadence, so a pending
  # count is the ordinary state for hours at a time. The 24h for: is what keeps this
  # rule about the updates that need a hand — a major, or anything not opted into
  # auto-update — rather than about WordPress's own backlog between runs.
  - interval: 5m
    name: an update WordPress applies itself does not alert
    input_series:
      - series: 'wordpress_updates_available{job="node",instance="rogue-trader:9100",type="plugin"}'
        values: "1x240 0x20"
    alert_rule_test:
      - eval_time: 20h
        alertname: WordpressUpdateAvailable
        exp_alerts: []

  - interval: 5m
    name: an update standing past a day alerts
    input_series:
      - series: 'wordpress_updates_available{job="node",instance="rogue-trader:9100",type="core"}'
        values: "2x300"
    alert_rule_test:
      - eval_time: 24h5m
        alertname: WordpressUpdateAvailable
        exp_alerts:
          - exp_labels:
              severity: warning
              job: node
              instance: rogue-trader:9100
              type: core
            exp_annotations:
              summary: "WordPress core update available on rogue-trader:9100"
              description: "2 core update(s) are pending on rogue-trader:9100 — apply via wp-cli or wp-admin."
      - eval_time: 23h55m
        alertname: WordpressUpdateAvailable
        exp_alerts: []

  # The fstype exclusion is what keeps this rule about disks: a tmpfs at 99% is the
  # ordinary state of /run and an overlay is a container's own layer, so without it
  # every host pages daily and the one real alert is lost among them.
  - interval: 5m
    name: a filling disk alerts while a full tmpfs and a healthy disk do not
    input_series:
      - series: 'node_filesystem_avail_bytes{job="node",instance="solar:9100",mountpoint="/",fstype="btrfs",device="/dev/sda2"}'
        values: "5x20"
      - series: 'node_filesystem_size_bytes{job="node",instance="solar:9100",mountpoint="/",fstype="btrfs",device="/dev/sda2"}'
        values: "100x20"
      - series: 'node_filesystem_avail_bytes{job="node",instance="solar:9100",mountpoint="/home",fstype="btrfs",device="/dev/sda3"}'
        values: "50x20"
      - series: 'node_filesystem_size_bytes{job="node",instance="solar:9100",mountpoint="/home",fstype="btrfs",device="/dev/sda3"}'
        values: "100x20"
      - series: 'node_filesystem_avail_bytes{job="node",instance="solar:9100",mountpoint="/run",fstype="tmpfs",device="tmpfs"}'
        values: "1x20"
      - series: 'node_filesystem_size_bytes{job="node",instance="solar:9100",mountpoint="/run",fstype="tmpfs",device="tmpfs"}'
        values: "100x20"
    alert_rule_test:
      - eval_time: 20m
        alertname: FilesystemSpaceLow
        exp_alerts:
          - exp_labels:
              severity: warning
              job: node
              instance: solar:9100
              mountpoint: /
              fstype: btrfs
              device: /dev/sda2
            exp_annotations:
              summary: "low disk space on solar:9100:/"
              description: "/ on solar:9100 has under 10% free."
      - eval_time: 10m
        alertname: FilesystemSpaceLow
        exp_alerts: []

  # 15m is sized to the pressure spikes that are routine on these boxes — a build, the
  # weekly zypper dup, a backup run — so a ten-minute dip must ride out while a host
  # that stays under its headroom alerts. Both are here on one input: at 20m the
  # spiking host has recovered and the sustained one fires, and at 10m neither has
  # cleared the window yet.
  - interval: 5m
    name: a memory spike rides out while sustained pressure alerts
    input_series:
      - series: 'node_memory_MemAvailable_bytes{job="node",instance="solar:9100"}'
        values: "5x2 50x20"
      - series: 'node_memory_MemTotal_bytes{job="node",instance="solar:9100"}'
        values: "100x30"
      - series: 'node_memory_MemAvailable_bytes{job="node",instance="scholam:9100"}'
        values: "5x30"
      - series: 'node_memory_MemTotal_bytes{job="node",instance="scholam:9100"}'
        values: "100x30"
    alert_rule_test:
      - eval_time: 20m
        alertname: MemoryLow
        exp_alerts:
          - exp_labels:
              severity: warning
              job: node
              instance: scholam:9100
            exp_annotations:
              summary: "low memory on scholam:9100"
              description: "scholam:9100 has under 10% memory available."
      - eval_time: 10m
        alertname: MemoryLow
        exp_alerts: []

  # 30m rides out a clock stepping after a reboot or a brief loss of the NTP server,
  # so only a host that has genuinely stopped syncing alerts — a shorter window pages
  # every time a host comes back up.
  - interval: 5m
    name: a brief resync rides out while a host that stops syncing alerts
    input_series:
      - series: 'node_timex_sync_status{job="node",instance="scholam:9100"}'
        values: "0x5 1x20"
      - series: 'node_timex_sync_status{job="node",instance="solar:9100"}'
        values: "0x20"
    alert_rule_test:
      - eval_time: 35m
        alertname: ClockNotSynchronised
        exp_alerts:
          - exp_labels:
              severity: warning
              job: node
              instance: solar:9100
            exp_annotations:
              summary: "clock not synchronised on solar:9100"
              description: "solar:9100 has had no NTP time sync for 30 minutes — clock drift can break TLS validation and log correlation."
      - eval_time: 25m
        alertname: ClockNotSynchronised
        exp_alerts: []

  # Two rules on one counter, and three properties that only hold together.
  # ServiceRestartStorm excludes wireguard.service so a dead tunnel raises one alert
  # rather than two differently-named ones — group_by is on alertname, so the
  # duplicate would page twice for one fault. WireguardTunnelDown names that fault
  # instead of reporting "a unit". And both are gated on the host having been up for
  # 15 minutes, because the counter zeroes at boot and dependency-ordered units
  # restart a few times on the way up — without the gate every reboot pages.
  #
  # node_boot_time_seconds is zero, so the host booted exactly when the test started:
  # the 10m evaluation is still inside that boot, and the 25m one is a host that has
  # settled and is flapping anyway. Both counters are already well past their
  # thresholds at 10m, so the gate is the only thing holding the alerts back there.
  - interval: 1m
    name: a flapping unit and a flapping tunnel each raise only their own alert
    input_series:
      - series: 'node_systemd_service_restart_total{job="node",instance="solar:9100",name="caddy.service"}'
        values: "0+1x40"
      - series: 'node_systemd_service_restart_total{job="node",instance="solar:9100",name="wireguard.service"}'
        values: "0+1x40"
      - series: 'node_boot_time_seconds{job="node",instance="solar:9100"}'
        values: "0x40"
    alert_rule_test:
      - eval_time: 10m
        alertname: ServiceRestartStorm
        exp_alerts: []
      - eval_time: 10m
        alertname: WireguardTunnelDown
        exp_alerts: []
      - eval_time: 25m
        alertname: ServiceRestartStorm
        exp_alerts:
          - exp_labels:
              severity: warning
              job: node
              instance: solar:9100
              name: caddy.service
            exp_annotations:
              summary: "caddy.service is restarting repeatedly on solar:9100"
              description: "caddy.service on solar:9100 auto-restarted more than 3 times in 15 minutes."
      - eval_time: 25m
        alertname: WireguardTunnelDown
        exp_alerts:
          - exp_labels:
              severity: critical
              job: node
              instance: solar:9100
              name: wireguard.service
            exp_annotations:
              summary: "the wireguard tunnel is down on solar:9100"
              description: "wireguard auto-restarted more than once in 15 minutes — it cannot reach the internet through wg0, so the arr stack has no egress."

  # The catch-all, whose whole risk is its exclusion roster: eight oneshots are
  # excluded *because* each has a bespoke *Failed rule carrying a richer description
  # and the right severity, and group_by is on alertname, so a name left in would
  # page twice for one failed backup. All eight fail at once here alongside an
  # ordinary unit, so a name dropped from the regex surfaces as a second alert in
  # this case rather than as a duplicate page months later. No host runs all eight —
  # the roster keys on the unit name and the instance is incidental, so one host
  # keeps the "exactly one alert" assertion legible.
  - interval: 5m
    name: the eight oneshots with their own rules raise no catch-all alert
    input_series:
      - series: 'node_systemd_unit_state{job="node",instance="solar:9100",name="arbites.service",state="failed"}'
        values: "1x10"
      - series: 'node_systemd_unit_state{job="node",instance="solar:9100",name="inquisition.service",state="failed"}'
        values: "1x10"
      - series: 'node_systemd_unit_state{job="node",instance="solar:9100",name="podman-backup.service",state="failed"}'
        values: "1x10"
      - series: 'node_systemd_unit_state{job="node",instance="solar:9100",name="home-backup.service",state="failed"}'
        values: "1x10"
      - series: 'node_systemd_unit_state{job="node",instance="solar:9100",name="autoupdate.service",state="failed"}'
        values: "1x10"
      - series: 'node_systemd_unit_state{job="node",instance="solar:9100",name="wordpress-cron.service",state="failed"}'
        values: "1x10"
      - series: 'node_systemd_unit_state{job="node",instance="solar:9100",name="wordpress-db-dump.service",state="failed"}'
        values: "1x10"
      - series: 'node_systemd_unit_state{job="node",instance="solar:9100",name="wordpress-update-check.service",state="failed"}'
        values: "1x10"
      - series: 'node_systemd_unit_state{job="node",instance="solar:9100",name="caddy.service",state="failed"}'
        values: "1x10"
    alert_rule_test:
      - eval_time: 20m
        alertname: SystemdUnitFailed
        exp_alerts:
          - exp_labels:
              severity: warning
              job: node
              instance: solar:9100
              name: caddy.service
              state: failed
            exp_annotations:
              summary: "caddy.service has failed on solar:9100"
              description: "The systemd unit caddy.service on solar:9100 is in the failed state and has not recovered."
      # Inside for:, which rides out a unit that fails and is restarted by its own
      # Restart= policy.
      - eval_time: 10m
        alertname: SystemdUnitFailed
        exp_alerts: []

  # Discord is the only receiver that carries alerts, and the Watchdog cannot see it
  # fail: the deadman routes to its own receiver, so delivery to Discord can be broken
  # while the heartbeat stays green. The integration selector keeps this rule on that
  # receiver rather than on the deadman's webhook, whose failure the deadman already
  # reports by going silent.
  - interval: 1m
    name: failed discord deliveries alert while the deadman webhook's do not
    input_series:
      - series: 'alertmanager_notifications_failed_total{job="alertmanager",instance="auspex:9093",integration="discord",reason="clientError"}'
        values: "0+1x40"
      - series: 'alertmanager_notifications_failed_total{job="alertmanager",instance="auspex:9093",integration="webhook",reason="clientError"}'
        values: "0+1x40"
    alert_rule_test:
      - eval_time: 25m
        alertname: AlertmanagerNotificationsFailing
        exp_alerts:
          - exp_labels:
              severity: warning
              job: alertmanager
              instance: auspex:9093
              integration: discord
              reason: clientError
            exp_annotations:
              summary: "alertmanager cannot deliver notifications to discord"
              description: "Alertmanager on auspex:9093 failed to deliver to Discord (clientError) — alerts may not be reaching the operator."
      # The counter has already risen by the first evaluation that can see two
      # samples, so the rule is active here and pending. As with the probe rules
      # above, a 5m for: is one step of this file's evaluation interval and no
      # on-grid time separates it from a shorter one; this pins that the wait is
      # there, which is what makes the alert latency rather than suppression.
      - eval_time: 5m
        alertname: AlertmanagerNotificationsFailing
        exp_alerts: []

  # A counter that has stopped rising is a delivery failure already healed: no nflog
  # entry is written for a failed send, so the group is re-attempted at the next
  # group_interval. Keyed on the raw total rather than the increase, this rule would
  # never stop firing after the fleet's first transient blip.
  - interval: 1m
    name: a delivery failure that has stopped recurring does not alert
    input_series:
      - series: 'alertmanager_notifications_failed_total{job="alertmanager",instance="auspex:9093",integration="discord",reason="clientError"}'
        values: "12x40"
    alert_rule_test:
      - eval_time: 30m
        alertname: AlertmanagerNotificationsFailing
        exp_alerts: []

  # The two ways an unattended Prometheus deploy fails, written to be complementary
  # rather than overlapping: config or rules that do not parse are rejected at reload,
  # while rules that parse but error at evaluation reload clean and simply stop
  # producing series. Each case asserts the other rule stays silent — a rule that
  # fired on both faults would say the wrong thing about half of them, and both are
  # silent by nature, so nothing else would correct it.
  - interval: 1m
    name: rules that fail to evaluate alert without implicating the config reload
    input_series:
      - series: 'prometheus_rule_evaluation_failures_total{job="prometheus",instance="administratum:9090",rule_group="drift"}'
        values: "0+1x40"
      - series: 'prometheus_config_last_reload_successful{job="prometheus",instance="administratum:9090"}'
        values: "1x40"
    alert_rule_test:
      - eval_time: 25m
        alertname: PrometheusRuleEvaluationFailing
        exp_alerts:
          - exp_labels:
              severity: warning
              job: prometheus
              instance: administratum:9090
              rule_group: drift
            exp_annotations:
              summary: "prometheus rule group drift is failing to evaluate on administratum:9090"
              description: >-
                Prometheus on administratum:9090 has failed to evaluate rules in group drift
                over the last 10 minutes — those rules have silently stopped producing series.
      - eval_time: 25m
        alertname: PrometheusConfigReloadFailed
        exp_alerts: []
      - eval_time: 10m
        alertname: PrometheusRuleEvaluationFailing
        exp_alerts: []

  - interval: 1m
    name: a rejected config reload alerts without implicating rule evaluation
    input_series:
      - series: 'prometheus_config_last_reload_successful{job="prometheus",instance="administratum:9090"}'
        values: "0x40"
      # Flat, not absent: rules that were already failing before the reload was
      # rejected must not make this case pass by accident.
      - series: 'prometheus_rule_evaluation_failures_total{job="prometheus",instance="administratum:9090",rule_group="drift"}'
        values: "7x40"
    alert_rule_test:
      - eval_time: 20m
        alertname: PrometheusConfigReloadFailed
        exp_alerts:
          - exp_labels:
              severity: warning
              job: prometheus
              instance: administratum:9090
            exp_annotations:
              summary: "prometheus config reload failed on administratum:9090"
              description: >-
                Prometheus on administratum:9090 rejected its last config reload and is running
                the previous config — an arbites-applied change has not taken effect.
      - eval_time: 20m
        alertname: PrometheusRuleEvaluationFailing
        exp_alerts: []
      - eval_time: 10m
        alertname: PrometheusConfigReloadFailed
        exp_alerts: []

  # A rejected album is already definitive when the metric shows it: the pipeline only
  # counts one after exhausting its ~1h poke cap, so 15m here is the *Failed cadence
  # rather than a grace period on top of a retry.
  - interval: 5m
    name: albums lidarr refused alert
    input_series:
      - series: 'beets_pipeline_lidarr_rejected_albums{job="node",instance="solar:9100"}'
        values: "2x20"
    alert_rule_test:
      - eval_time: 20m
        alertname: BeetsPipelineLidarrRejected
        exp_alerts:
          - exp_labels:
              severity: warning
              job: node
              instance: solar:9100
            exp_annotations:
              summary: "beets pipeline imports rejected by lidarr on solar:9100"
              description: "Albums on solar:9100 matched but lidarr refused them; they sit in quarantine/lidarr-rejected and need a look."
      - eval_time: 10m
        alertname: BeetsPipelineLidarrRejected
        exp_alerts: []

  # Unmatched albums are normal — new releases and patchy AcoustID both land in
  # quarantine — so the threshold is the working pile the operator clears by hand, not
  # zero. Ten is tolerated and eleven is a backlog; written `> 0` this rule would page
  # about the ordinary state of the pipeline.
  - interval: 5m
    name: a quarantine pile at the threshold does not alert
    input_series:
      - series: 'beets_pipeline_quarantine_albums{job="node",instance="solar:9100"}'
        values: "10x90"
    alert_rule_test:
      - eval_time: 7h
        alertname: BeetsPipelineQuarantineBacklog
        exp_alerts: []

  - interval: 5m
    name: a quarantine backlog past the threshold alerts
    input_series:
      - series: 'beets_pipeline_quarantine_albums{job="node",instance="solar:9100"}'
        values: "11x90"
    alert_rule_test:
      - eval_time: 6h5m
        alertname: BeetsPipelineQuarantineBacklog
        exp_alerts:
          - exp_labels:
              severity: warning
              job: node
              instance: solar:9100
            exp_annotations:
              summary: "beets pipeline quarantine backlog on solar:9100"
              description: "Unmatched albums on solar:9100 have been awaiting hand-processing for over 6 hours."
      - eval_time: 5h55m
        alertname: BeetsPipelineQuarantineBacklog
        exp_alerts: []

  # The deadman's beat, whose entire value is that it never stops. Two properties hold
  # it, and the single evaluation at zero pins both: it fires on the very first one,
  # where a for: of any length would open a window in which the pipeline looks dead to
  # the receiver, and it carries severity none, which is what routes it away from the
  # operator. The input series is unrelated on purpose — the rule reads nothing, so an
  # expression rewritten to depend on any real metric loses its alert here.
  - interval: 1m
    name: the watchdog heartbeat fires from the first evaluation
    input_series:
      - series: 'up{job="node",instance="solar:9100"}'
        values: "1x10"
    alert_rule_test:
      - eval_time: 0m
        alertname: Watchdog
        exp_alerts:
          - exp_labels:
              severity: none
            exp_annotations:
              summary: "alerting pipeline heartbeat"
              description: "This alert always fires; if it stops reaching the deadman receiver, the Prometheus -> Alertmanager -> heartbeat pipeline is broken."
