---
# promtool unit tests for the shipped alert rules. Run by the promtool-test
# pre-commit hook, which fires on a change to either this file or the rules.
#
# These drive the rules the fleet actually loads — rule_files points at the real
# alerts.yml, resolved relative to this file — so a test cannot pass against a
# restated copy of an expression while the shipped one is broken.
#
# Deliberately not molecule's job: the scenario asserts the rules load in a real
# Prometheus (by name and count), which is the deployment half. Whether an
# expression fires on the fault it names is a property of the file, and promtool
# evaluates for: windows, labels and annotations in milliseconds without a
# container tier.
#
# Not the only case file: promtool fixes evaluation_interval per file, so the
# multi-day-window cases that pin no for: finer than an hour sit in
# alerts_long_window_test.yml on an hourly grid, which is 16s of hook runtime.
# Anything needing the 5m grid below belongs here. Coverage spans both —
# bin/check-alert-test-coverage.py globs them.
rule_files:
  - ../files/rules/alerts.yml

# 5m, not the 1m these cases were first written at: MicroOSBuildStale turns on a
# fortnight-wide window, and re-evaluating that every simulated minute costs the hook
# five times its runtime for nothing. Every eval_time and every rule for: is a multiple
# of 5m, so nothing below loses precision — but promtool floors an off-grid eval_time
# silently rather than rejecting it, so a case written at 3h57m would assert at 3h55m
# and quietly mean something other than it says. The 5m ceiling binds each test's own
# series interval, not this: a series sampled sparser than the lookback reads as stale
# between evaluations, and no for: could ever be satisfied.
evaluation_interval: 5m

tests:
  # ScheduledJobMetricMissing exists because a *Failed rule whose metric family
  # has vanished matches an empty vector and never fires. A test that only
  # asserted the rule parsed would repeat exactly that mistake, so both
  # polarities are named cases here.
  - interval: 1m
    name: a unit whose outcome metric is never published alerts
    input_series:
      - series: 'node_systemd_unit_state{job="node",instance="solar:9100",name="home-backup.service",state="active"}'
        values: "1x70"
    alert_rule_test:
      # Past the rule's for: 1h, so this covers the wait as well as the match.
      - eval_time: 65m
        alertname: ScheduledJobMetricMissing
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: solar:9100
              name: home-backup.service
            exp_annotations:
              summary: "home-backup.service on solar:9100 publishes no outcome metric"
              description: >-
                home-backup.service is installed on solar:9100 but its textfile outcome
                metric is absent, so that unit's bespoke *Failed and *Overdue rules match
                an empty vector and can never fire — and SystemdUnitFailed excludes it on
                the assumption they do.
      # Still inside for:, so the alert is pending rather than firing. Without
      # this the case above would also pass a rule with no for: at all.
      - eval_time: 30m
        alertname: ScheduledJobMetricMissing
        exp_alerts: []

  # The negative control, and the reason the case above means anything: publish
  # the metric and the same rule must go quiet.
  - interval: 1m
    name: a unit publishing its outcome metric does not alert
    input_series:
      - series: 'node_systemd_unit_state{job="node",instance="solar:9100",name="home-backup.service",state="active"}'
        values: "1x70"
      - series: 'home_backup_success{job="node",instance="solar:9100"}'
        values: "1x70"
    alert_rule_test:
      - eval_time: 65m
        alertname: ScheduledJobMetricMissing
        exp_alerts: []

  # node_exporter emits one series per unit *per state*, so the left-hand
  # group by (instance, name) is load-bearing: without it each state would
  # survive the join and one broken family would raise five identical alerts.
  - interval: 1m
    name: the many states of one unit raise exactly one alert
    input_series:
      - series: 'node_systemd_unit_state{job="node",instance="solar:9100",name="home-backup.service",state="active"}'
        values: "1x70"
      - series: 'node_systemd_unit_state{job="node",instance="solar:9100",name="home-backup.service",state="failed"}'
        values: "0x70"
      - series: 'node_systemd_unit_state{job="node",instance="solar:9100",name="home-backup.service",state="inactive"}'
        values: "0x70"
    alert_rule_test:
      - eval_time: 65m
        alertname: ScheduledJobMetricMissing
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: solar:9100
              name: home-backup.service
            exp_annotations:
              summary: "home-backup.service on solar:9100 publishes no outcome metric"
              description: >-
                home-backup.service is installed on solar:9100 but its textfile outcome
                metric is absent, so that unit's bespoke *Failed and *Overdue rules match
                an empty vector and can never fire — and SystemdUnitFailed excludes it on
                the assumption they do.

  # The right-hand side is joined with `unless on (instance)`, which builds a
  # signature set and so collapses duplicates on its own — no aggregation needed
  # to suppress a family that reports more than one series per host. Pins that,
  # since it is why the right-hand sides are bare metric selectors.
  - interval: 1m
    name: a multi-series outcome metric still suppresses the alert
    input_series:
      - series: 'node_systemd_unit_state{job="node",instance="solar:9100",name="wordpress-db-dump.service",state="active"}'
        values: "1x70"
      - series: 'wordpress_db_dump_success{job="node",instance="solar:9100",site="one"}'
        values: "1x70"
      - series: 'wordpress_db_dump_success{job="node",instance="solar:9100",site="two"}'
        values: "1x70"
    alert_rule_test:
      - eval_time: 65m
        alertname: ScheduledJobMetricMissing
        exp_alerts: []

  # One host losing its metric must not mask another host that still has one,
  # and the alert has to name the host that broke.
  - interval: 1m
    name: the alert is per host, not fleet-wide
    input_series:
      - series: 'node_systemd_unit_state{job="node",instance="solar:9100",name="podman-backup.service",state="active"}'
        values: "1x70"
      - series: 'node_systemd_unit_state{job="node",instance="rogue-trader:9100",name="podman-backup.service",state="active"}'
        values: "1x70"
      - series: 'podman_backup_success{job="node",instance="solar:9100"}'
        values: "1x70"
    alert_rule_test:
      - eval_time: 65m
        alertname: ScheduledJobMetricMissing
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: rogue-trader:9100
              name: podman-backup.service
            exp_annotations:
              summary: "podman-backup.service on rogue-trader:9100 publishes no outcome metric"
              description: >-
                podman-backup.service is installed on rogue-trader:9100 but its textfile
                outcome metric is absent, so that unit's bespoke *Failed and *Overdue
                rules match an empty vector and can never fire — and SystemdUnitFailed
                excludes it on the assumption they do.

  # AutoupdateFailed's for: is sized to outlast autoupdate.service's retry burst
  # (RestartSec=1h x StartLimitBurst=4 = 3h), so these two cases are really one
  # assertion about that coupling: shorten the for: back to minutes and the
  # healing case below starts paging for a mirror lag that fixed itself.
  - interval: 1m
    name: an update still inside its retry burst does not alert
    input_series:
      # Fails, then a retry an hour in succeeds and rewrites the metric.
      - series: 'autoupdate_success{job="node",instance="scholam:9100"}'
        values: "0x60 1x200"
    alert_rule_test:
      - eval_time: 4h5m
        alertname: AutoupdateFailed
        exp_alerts: []

  - interval: 1m
    name: an update that exhausts its retries alerts
    input_series:
      - series: 'autoupdate_success{job="node",instance="scholam:9100"}'
        values: "0x260"
    alert_rule_test:
      # Past for:, so the retries are spent and the host really is unpatched.
      - eval_time: 4h5m
        alertname: AutoupdateFailed
        exp_alerts:
          - exp_labels:
              severity: warning
              job: node
              instance: scholam:9100
            exp_annotations:
              summary: "unattended update failed on scholam:9100"
              description: >-
                The last unattended update on scholam:9100 failed — the host may be
                unpatched or did not reboot.
      # Still pending: without this the case above would also pass a for: of 15m,
      # which is the value this change moved away from.
      - eval_time: 3h55m
        alertname: AutoupdateFailed
        exp_alerts: []

  # AutoupdatePackageHeld is the case the two rules above call healthy: the update
  # ran, exited 0 and advanced its timestamp having skipped the held package. Both
  # metrics are held green here for exactly that reason — a case carrying only the
  # hold would pass against a rule that had been keyed on failure by mistake.
  #
  # One case, not two, because the resolve path is the same series: the hook emits
  # one sample per held package and none at all for a host holding nothing, so
  # clearing a lock resolves this through staleness — and asserting that needs the
  # alert to have fired first. Samples stop at 70m; 80m is past the 5m horizon.
  # What the 80m assertion pins is that the expression stays instant: wrap it in a
  # lookback (max_over_time, say) and a cleared lock keeps paging. It is not about
  # a 0 being published instead — `== 1` resolves on that too. Split in two, the
  # resolve case would restate the for: window and carry a second copy of the
  # annotations, a reword away from drifting out of step with this one.
  - interval: 1m
    name: a package held back from a successful update alerts, and clears with the lock
    input_series:
      - series: 'autoupdate_package_hold{job="node",instance="auspex:9100",package="rpi-eeprom"}'
        values: "1x70 _x50"
      - series: 'autoupdate_success{job="node",instance="auspex:9100"}'
        values: "1x120"
    alert_rule_test:
      - eval_time: 65m
        alertname: AutoupdatePackageHeld
        exp_alerts:
          - exp_labels:
              severity: warning
              job: node
              instance: auspex:9100
              package: rpi-eeprom
            exp_annotations:
              summary: "rpi-eeprom is held back from updates on auspex:9100"
              description: >-
                rpi-eeprom on auspex:9100 is locked or held, so the last unattended update
                skipped it and still exited successfully. Clear it with `apt-mark unhold`,
                or with `zypper removelock` after checking `zypper locks` for the type —
                removelock exits 0 having done nothing on a pattern lock without `-t`. Then
                re-run `autoupdate-holds.sh` to republish, or this stands until that host's
                next weekly update rewrites the metric.
      # Still inside for:, so the case above cannot pass against a shortened window.
      - eval_time: 55m
        alertname: AutoupdatePackageHeld
        exp_alerts: []
      - eval_time: 65m
        alertname: AutoupdateFailed
        exp_alerts: []
      # Past the staleness horizon, so the series is genuinely gone.
      - eval_time: 80m
        alertname: AutoupdatePackageHeld
        exp_alerts: []

  # The cleanup's counterpart to the case above: the update ran, exited 0, removed
  # what it could, and what it could not remove is still installed. unneeded is held
  # at 0 throughout as the control the label makes necessary — the expression selects
  # the family rather than one class, so a single firing class has to be shown not to
  # drag the other in with it.
  #
  # One case, not two, and for the opposite reason to the holds case above: the hook
  # publishes both classes every run, zero included, so the resolve is a value change
  # on a live series rather than staleness — and asserting it needs the alert to have
  # fired first. Written as a run that cleared the orphan, which is the resolve path
  # that exists: `> 0` is what makes the published zero resolve at all, and a lookback
  # wrapped round it would keep paging for a package already gone.
  - interval: 1m
    name: packages the post-update cleanup could not remove alert, and clear when they go
    input_series:
      - series: 'autoupdate_uncleaned_packages{job="node",instance="scholam:9100",class="orphaned"}'
        values: "1x70 0x50"
      - series: 'autoupdate_uncleaned_packages{job="node",instance="scholam:9100",class="unneeded"}'
        values: "0x120"
    alert_rule_test:
      - eval_time: 65m
        alertname: AutoupdatePackagesUncleaned
        exp_alerts:
          - exp_labels:
              severity: warning
              job: node
              instance: scholam:9100
              class: orphaned
            exp_annotations:
              summary: "1 orphaned package(s) left on scholam:9100 after the update"
              description: >-
                The post-update cleanup on scholam:9100 left 1 orphaned package(s)
                installed. `orphaned` means no repository offers them and nothing has made
                them unneeded, so the cleanup never takes them — decide those one at a
                time, and in the role if a role installs them. `unneeded` means its removal
                failed, or the host is MicroOS, where it does not run: clear that with
                `transactional-update run zypper remove --clean-deps <names>`, which shows
                here only after the reboot. List them with `zypper packages --orphaned`, or
                on Debian with `apt-get --dry-run --purge autoremove` and `apt list
                '?obsolete'`. Then re-run `autoupdate-cleanup.sh` to republish, or this
                stands until that host's next weekly update rewrites the metric.
      # Still inside for:, so the case above cannot pass against a shortened window.
      - eval_time: 55m
        alertname: AutoupdatePackagesUncleaned
        exp_alerts: []
      # The next weekly run removed the orphan and published the zero.
      - eval_time: 75m
        alertname: AutoupdatePackagesUncleaned
        exp_alerts: []

  # FilesystemReadOnly carves out the MicroOS root, which is read-only by design.
  # The carve-out is the kind that silently over-reaches, so all three polarities
  # are named: the state it must ignore, and the two neighbouring states it must
  # still catch. Dropping the join keys to instance alone passes the first case
  # and fails the third.
  - interval: 1m
    name: the MicroOS root being read-only does not alert
    input_series:
      - series: 'node_filesystem_readonly{job="node",instance="rogue-trader:9100",mountpoint="/",fstype="btrfs",device="/dev/sda3"}'
        values: "1x20"
      - series: 'node_os_info{job="node",instance="rogue-trader:9100",id="opensuse-microos",name="openSUSE MicroOS"}'
        values: "1x20"
    alert_rule_test:
      - eval_time: 15m
        alertname: FilesystemReadOnly
        exp_alerts: []

  # The exclusion keys on the OS, not on the mountpoint: a read-only / on a
  # Tumbleweed host is still the I/O-error remount the rule is named for.
  - interval: 1m
    name: a read-only root on a non-MicroOS host still alerts
    input_series:
      - series: 'node_filesystem_readonly{job="node",instance="solar:9100",mountpoint="/",fstype="btrfs",device="/dev/sda2"}'
        values: "1x20"
      - series: 'node_os_info{job="node",instance="solar:9100",id="opensuse-tumbleweed",name="openSUSE Tumbleweed"}'
        values: "1x20"
    alert_rule_test:
      - eval_time: 15m
        alertname: FilesystemReadOnly
        exp_alerts:
          - exp_labels:
              severity: critical
              job: node
              instance: solar:9100
              mountpoint: /
              fstype: btrfs
              device: /dev/sda2
            exp_annotations:
              summary: "solar:9100:/ is mounted read-only"
              description: "/ on solar:9100 is mounted read-only — writes fail silently. Likely a remount after an I/O error."

  # And it keys on the mountpoint, not just the OS: /var is a writable subvolume
  # on MicroOS, so it going read-only there is a real fault the carve-out must
  # not swallow.
  - interval: 1m
    name: a read-only non-root filesystem on MicroOS still alerts
    input_series:
      - series: 'node_filesystem_readonly{job="node",instance="rogue-trader:9100",mountpoint="/var",fstype="btrfs",device="/dev/sda3"}'
        values: "1x20"
      - series: 'node_os_info{job="node",instance="rogue-trader:9100",id="opensuse-microos",name="openSUSE MicroOS"}'
        values: "1x20"
    alert_rule_test:
      - eval_time: 15m
        alertname: FilesystemReadOnly
        exp_alerts:
          - exp_labels:
              severity: critical
              job: node
              instance: rogue-trader:9100
              mountpoint: /var
              fstype: btrfs
              device: /dev/sda3
            exp_annotations:
              summary: "rogue-trader:9100:/var is mounted read-only"
              description: "/var on rogue-trader:9100 is mounted read-only — writes fail silently. Likely a remount after an I/O error."

  # ContainerStoreMountMissing is an absent() rule over a mount that exists on one
  # host, so a case with no input at all would satisfy it while proving nothing.
  # Each case feeds a node_exporter that is plainly up and reporting filesystems —
  # the fault under test is the mount, not the host.
  - interval: 1m
    name: a container store that never mounted alerts
    input_series:
      # Root only: /var/lib/containers is a directory on the SD card, exactly what
      # podman falls through to when the nofail mount does not come up.
      - series: 'node_filesystem_size_bytes{job="node",instance="auspex:9100",mountpoint="/",device="/dev/mmcblk0p2",fstype="ext4"}'
        values: "31000000000x30"
    alert_rule_test:
      - eval_time: 20m
        alertname: ContainerStoreMountMissing
        exp_alerts:
          # absent() carries only the equality matchers, so mountpoint survives and
          # the device regex does not — and no instance is named, which is why the
          # annotations cannot reference one.
          - exp_labels:
              severity: warning
              mountpoint: /var/lib/containers
            exp_annotations:
              summary: "podman's container store is not mounted from its NVMe"
              description: >-
                No filesystem is mounted at /var/lib/containers from an NVMe device. podman
                is writing its images, volumes and the Prometheus TSDB to the root
                filesystem underneath the mount point — silently, since nofail lets the host
                boot without it.
      # Inside for:, so pending rather than firing.
      - eval_time: 10m
        alertname: ContainerStoreMountMissing
        exp_alerts: []

  # The device matcher doing its job. A mount at the right path from the SD card is
  # the same fault as no mount at all, and a path-only rule would call it healthy.
  - interval: 1m
    name: a container store mounted from the wrong device alerts
    input_series:
      - series: 'node_filesystem_size_bytes{job="node",instance="auspex:9100",mountpoint="/var/lib/containers",device="/dev/mmcblk0p3",fstype="ext4"}'
        values: "24000000000x30"
    alert_rule_test:
      - eval_time: 20m
        alertname: ContainerStoreMountMissing
        exp_alerts:
          - exp_labels:
              severity: warning
              mountpoint: /var/lib/containers
            exp_annotations:
              summary: "podman's container store is not mounted from its NVMe"
              description: >-
                No filesystem is mounted at /var/lib/containers from an NVMe device. podman
                is writing its images, volumes and the Prometheus TSDB to the root
                filesystem underneath the mount point — silently, since nofail lets the host
                boot without it.

  # The negative control, and what makes the two cases above mean anything.
  - interval: 1m
    name: a container store mounted from its NVMe does not alert
    input_series:
      - series: 'node_filesystem_size_bytes{job="node",instance="auspex:9100",mountpoint="/var/lib/containers",device="/dev/nvme0n1p1",fstype="ext4"}'
        values: "250000000000x30"
    alert_rule_test:
      - eval_time: 20m
        alertname: ContainerStoreMountMissing
        exp_alerts: []

  # NfsShareUnmounted reads a state the fleet spent ~14 h in over one month with
  # nothing reporting it. Both polarities on one host: node_exporter reports every
  # state of a unit, so an unmounted share is active=0/inactive=1 rather than an
  # absent series, and the mounted share beside it is what makes the firing one mean
  # something.
  - interval: 1m
    name: an unmounted nfs share alerts while a mounted one does not
    input_series:
      - series: 'node_systemd_unit_state{job="node",instance="scholam:9100",name="nfs-astropath.mount",state="active"}'
        values: "0x20"
      - series: 'node_systemd_unit_state{job="node",instance="scholam:9100",name="nfs-astropath.mount",state="inactive"}'
        values: "1x20"
      - series: 'node_systemd_unit_state{job="node",instance="scholam:9100",name="nfs-scriptorum.mount",state="active"}'
        values: "1x20"
      - series: 'node_systemd_unit_state{job="node",instance="scholam:9100",name="nfs-scriptorum.mount",state="inactive"}'
        values: "0x20"
    alert_rule_test:
      - eval_time: 15m
        alertname: NfsShareUnmounted
        exp_alerts:
          - exp_labels:
              severity: critical
              job: node
              instance: scholam:9100
              name: nfs-astropath.mount
              state: active
            exp_annotations:
              summary: "nfs-astropath.mount is not mounted on scholam:9100"
              description: >-
                The mount unit nfs-astropath.mount on scholam:9100 is not active, so
                the NFS share is gone and reads fall through to the empty mount point
                underneath. Nothing remounts it on its own — start the unit, or reapply the
                nfs role.
      # Inside for: 10m, which covers the boot window.
      - eval_time: 5m
        alertname: NfsShareUnmounted
        exp_alerts: []

  # The boundary with the catch-all, which the mount units now reach. A unit that
  # fails to mount is `failed` and not `active` at the same time, so before
  # SystemdUnitFailed was restricted to .service one fault raised two alerts on a
  # group_by keyed to alertname. The caddy.service in the same input is what stops
  # that restriction being a way to switch the catch-all off altogether.
  - interval: 1m
    name: a mount unit that failed to mount raises only the nfs alert
    input_series:
      - series: 'node_systemd_unit_state{job="node",instance="scholam:9100",name="nfs-astropath.mount",state="active"}'
        values: "0x20"
      - series: 'node_systemd_unit_state{job="node",instance="scholam:9100",name="nfs-astropath.mount",state="failed"}'
        values: "1x20"
      - series: 'node_systemd_unit_state{job="node",instance="scholam:9100",name="caddy.service",state="failed"}'
        values: "1x20"
    alert_rule_test:
      - eval_time: 20m
        alertname: NfsShareUnmounted
        exp_alerts:
          - exp_labels:
              severity: critical
              job: node
              instance: scholam:9100
              name: nfs-astropath.mount
              state: active
            exp_annotations:
              summary: "nfs-astropath.mount is not mounted on scholam:9100"
              description: >-
                The mount unit nfs-astropath.mount on scholam:9100 is not active, so
                the NFS share is gone and reads fall through to the empty mount point
                underneath. Nothing remounts it on its own — start the unit, or reapply the
                nfs role.
      - eval_time: 20m
        alertname: SystemdUnitFailed
        exp_alerts:
          - exp_labels:
              severity: warning
              job: node
              instance: scholam:9100
              name: caddy.service
              state: failed
            exp_annotations:
              summary: "caddy.service has failed on scholam:9100"
              description: "The systemd unit caddy.service on scholam:9100 is in the failed state and has not recovered."

  # MicroOSBuildStale is the only rule that sees a rolled-back host, so a rule that
  # parses but cannot fire would restore exactly the blind spot it was written for.
  # These sample at 5m per the file-level note above, the window being a fortnight.
  #
  # The rollback is deliberately absent from the input: the series simply stops
  # advancing, which is the shape the rule's own comment explains it has to read.
  #
  # Three hosts in one case rather than three cases, because each has to run past the
  # rule's 14d offset guard before it proves anything, and that horizon is what the
  # runtime is made of. The firing assertion names one host, so it pins the scope twice
  # over: a fleet-wide floor would go quiet, and a dropped id selector would add a
  # fourth alert.
  - interval: 5m
    name: one stale host alerts, while a host still advancing and a non-MicroOS host do not
    input_series:
      # Stale: a day on the old build, then an update lands and nothing moves after it.
      # The hole at 26h50m-27h10m sits exactly a fortnight before the firing assertion
      # below, so it lands under the offset: the guard's 1d range still spans it, where a
      # bare instant selector there would come up empty and drop the alert.
      - series: 'node_os_version{job="node",instance="rogue-trader:9100",id="opensuse-microos",name="openSUSE MicroOS"}'
        values: "20260717x287 20260724x33 _ _ _ _ _ 20260724x4061"
      # Healthy: keeps taking a new build, so a lower one is always inside its window.
      - series: 'node_os_version{job="node",instance="solar:9100",id="opensuse-microos",name="openSUSE MicroOS"}'
        values: "20260717x287 20260724x2015 20260731x2100"
      # Not MicroOS, and just as stuck: only the id selector keeps it out.
      - series: 'node_os_version{job="node",instance="scholam:9100",id="opensuse-tumbleweed",name="openSUSE Tumbleweed"}'
        values: "20260724x4400"
    alert_rule_test:
      # 14 days in, past the offset guard so the rule is free to fire: the previous build
      # is still inside the window, so every host has demonstrably updated within a
      # fortnight and the rule must stay quiet. This is the ordinary healthy state, the
      # one a badly written staleness rule pages about daily, and what pins the window —
      # shorten it to a week and this case alerts.
      - eval_time: 340h
        alertname: MicroOSBuildStale
        exp_alerts: []
      # The last older sample leaves the window at 359h55m, so the rule goes active
      # there and this is the last evaluation still inside its for:. Five minutes of
      # slack either side, which pins the for: to the three hours it claims rather
      # than to anything shorter.
      - eval_time: 362h50m
        alertname: MicroOSBuildStale
        exp_alerts: []
      # Past for:, and only the stale MicroOS host alerts.
      - eval_time: 363h
        alertname: MicroOSBuildStale
        exp_alerts:
          - exp_labels:
              severity: warning
              job: node
              instance: rogue-trader:9100
              id: opensuse-microos
              name: openSUSE MicroOS
            exp_annotations:
              summary: "MicroOS build stale on rogue-trader:9100"
              description: >-
                rogue-trader:9100 is still on build 20260724, the oldest it has run in a
                fortnight — two update cycles have changed nothing, so it is unpatched and not
                updating itself. A failed boot most likely rolled it back to the previous
                snapshot: check `journalctl -u health-checker` and `snapper list`.

  # The drift rules' for: windows are sized to the inquisition's hourly cadence:
  # one bad run poisons a whole hour of scrapes, so every window spans at least
  # two runs and a single-run wobble never fires. Each class gets its firing
  # case; digest also gets the not-yet case that pins the wait, and Failed the
  # one-bad-run case that pins the two-run demand.
  - interval: 5m
    name: a container off its pinned digest for over 6h alerts
    input_series:
      - series: 'inquisition_offender{job="node",instance="solar:9100",class="digest",container="sonarr"}'
        values: "1x80"
    alert_rule_test:
      - eval_time: 6h5m
        alertname: ContainerDigestDrift
        exp_alerts:
          - exp_labels:
              severity: warning
              job: node
              instance: solar:9100
              class: digest
              container: sonarr
            exp_annotations:
              summary: "sonarr on solar:9100 runs an image its quadlet does not pin"
              description: >-
                sonarr on solar:9100 has run for over 6 hours on a digest other than its
                quadlet's pin — a restart that never fired, or a pin applied without one.

  - interval: 5m
    name: digest drift younger than its window does not alert
    input_series:
      - series: 'inquisition_offender{job="node",instance="solar:9100",class="digest",container="sonarr"}'
        values: "1x80"
    alert_rule_test:
      - eval_time: 5h55m
        alertname: ContainerDigestDrift
        exp_alerts: []

  - interval: 5m
    name: an undeclared container standing 2h alerts
    input_series:
      - series: 'inquisition_offender{job="node",instance="solar:9100",class="unmanaged",container="interloper"}'
        values: "1x30"
    alert_rule_test:
      - eval_time: 2h5m
        alertname: UnmanagedContainerRunning
        exp_alerts:
          - exp_labels:
              severity: warning
              job: node
              instance: solar:9100
              class: unmanaged
              container: interloper
            exp_annotations:
              summary: "interloper on solar:9100 is declared by no quadlet"
              description: >-
                interloper exists on solar:9100 outside the repo's declarations — unmanaged
                state the fleet's config does not describe.

  - interval: 5m
    name: a declared quadlet not running for 2h alerts
    input_series:
      - series: 'inquisition_offender{job="node",instance="solar:9100",class="inactive",container="idle"}'
        values: "1x30"
    alert_rule_test:
      - eval_time: 2h5m
        alertname: QuadletNotRunning
        exp_alerts:
          - exp_labels:
              severity: warning
              job: node
              instance: solar:9100
              class: inactive
              container: idle
            exp_annotations:
              summary: "idle on solar:9100 is declared but not running"
              description: >-
                The quadlet for idle on solar:9100 is on disk but its service is not active —
                never started, or stopped by hand. SystemdUnitFailed only sees the failed state.

  - interval: 5m
    name: a tag-only quadlet standing 2h alerts
    input_series:
      - series: 'inquisition_offender{job="node",instance="rogue-trader:9100",class="unpinned",container="floater"}'
        values: "1x30"
    alert_rule_test:
      - eval_time: 2h5m
        alertname: QuadletUnpinned
        exp_alerts:
          - exp_labels:
              severity: warning
              job: node
              instance: rogue-trader:9100
              class: unpinned
              container: floater
            exp_annotations:
              summary: "floater on rogue-trader:9100 is not pinned by digest"
              description: >-
                The quadlet for floater on rogue-trader:9100 carries a tag-only Image= —
                outside the renovate pin discipline, so what it runs after a pull is
                unrecorded.

  - interval: 5m
    name: two consecutive failed drift checks alert
    input_series:
      - series: 'inquisition_success{job="node",instance="solar:9100"}'
        values: "0x30"
    alert_rule_test:
      - eval_time: 95m
        alertname: InquisitionFailed
        exp_alerts:
          - exp_labels:
              severity: warning
              job: node
              instance: solar:9100
            exp_annotations:
              summary: "drift check failed on solar:9100"
              description: >-
                The last two drift check runs on solar:9100 failed — the host's containers
                are unwatched.

  # Evaluated at 60m, while the failed sample is still the latest one: past 65m
  # the series has recovered and `== 0` is an empty vector, which would hold for
  # a rule with no for: at all. The point is that one failure is still only
  # pending at an hour, not that a recovered host is silent.
  - interval: 5m
    name: a single failed drift check is still only pending at an hour
    input_series:
      - series: 'inquisition_success{job="node",instance="solar:9100"}'
        values: "0x12 1x30"
    alert_rule_test:
      - eval_time: 60m
        alertname: InquisitionFailed
        exp_alerts: []

  # The threshold trips at 3h and the window closes 2h later, so 5h05m is the
  # first evaluation past both — 4h05m would assert the old 1h window.
  - interval: 5m
    name: a drift check silent for over 3h alerts
    input_series:
      - series: 'inquisition_last_run_timestamp_seconds{job="node",instance="solar:9100"}'
        values: "0x75"
    alert_rule_test:
      - eval_time: 5h5m
        alertname: InquisitionOverdue
        exp_alerts:
          - exp_labels:
              severity: warning
              job: node
              instance: solar:9100
            exp_annotations:
              summary: "drift check overdue on solar:9100"
              description: >-
                solar:9100 has not completed a drift check in over 3 hours — the hourly
                timer has stopped firing.

  # The claim every 2h window rests on, pinned rather than asserted in a comment:
  # a mid-update wobble that the next hourly run clears must not fire. The series
  # stands for one run's worth of scrapes and then ends, so it is absent — not
  # zero — when the window closes, which is exactly how a cleared offender
  # behaves (the check publishes no line for a container that is no longer
  # drifting).
  # Evaluated at 60m, the last sample of the one run's worth: after that the
  # series is absent and the expression empty, so a later eval_time would pass
  # against a rule with no for: at all.
  - interval: 5m
    name: an offender one hourly run old is still only pending
    input_series:
      - series: 'inquisition_offender{job="node",instance="solar:9100",class="unmanaged",container="interloper"}'
        values: "1x12"
    alert_rule_test:
      - eval_time: 60m
        alertname: UnmanagedContainerRunning
        exp_alerts: []

  # The denominator rule: a check that inspected nothing publishes exactly what
  # a clean host does — no offender, success 1 — so without this it reads clean.
  - interval: 5m
    name: a host whose quadlets have all disappeared alerts
    input_series:
      - series: 'inquisition_containers_checked{job="node",instance="solar:9100"}'
        values: "0x30"
    alert_rule_test:
      - eval_time: 2h5m
        alertname: QuadletsDisappeared
        exp_alerts:
          - exp_labels:
              severity: warning
              job: node
              instance: solar:9100
            exp_annotations:
              summary: "solar:9100 declares no quadlets"
              description: >-
                The drift check on solar:9100 found no quadlet declarations to compare —
                the host is watched but has nothing to watch, so every other drift rule
                reads clean by vacuum.

  - interval: 5m
    name: each class rule claims only its own offender
    input_series:
      - series: 'inquisition_offender{job="node",instance="solar:9100",class="digest",container="sonarr"}'
        values: "1x90"
      - series: 'inquisition_offender{job="node",instance="solar:9100",class="unmanaged",container="interloper"}'
        values: "1x90"
      - series: 'inquisition_offender{job="node",instance="solar:9100",class="inactive",container="idle"}'
        values: "1x90"
      - series: 'inquisition_offender{job="node",instance="solar:9100",class="unpinned",container="floater"}'
        values: "1x90"
      - series: 'inquisition_containers_checked{job="node",instance="solar:9100"}'
        values: "15x90"
      - series: 'inquisition_success{job="node",instance="solar:9100"}'
        values: "1x90"
    alert_rule_test:
      - eval_time: 7h
        alertname: ContainerDigestDrift
        exp_alerts:
          - exp_labels:
              severity: warning
              job: node
              instance: solar:9100
              class: digest
              container: sonarr
            exp_annotations:
              summary: "sonarr on solar:9100 runs an image its quadlet does not pin"
              description: >-
                sonarr on solar:9100 has run for over 6 hours on a digest other than its
                quadlet's pin — a restart that never fired, or a pin applied without one.
      - eval_time: 7h
        alertname: UnmanagedContainerRunning
        exp_alerts:
          - exp_labels:
              severity: warning
              job: node
              instance: solar:9100
              class: unmanaged
              container: interloper
            exp_annotations:
              summary: "interloper on solar:9100 is declared by no quadlet"
              description: >-
                interloper exists on solar:9100 outside the repo's declarations — unmanaged
                state the fleet's config does not describe.
      - eval_time: 7h
        alertname: QuadletNotRunning
        exp_alerts:
          - exp_labels:
              severity: warning
              job: node
              instance: solar:9100
              class: inactive
              container: idle
            exp_annotations:
              summary: "idle on solar:9100 is declared but not running"
              description: >-
                The quadlet for idle on solar:9100 is on disk but its service is not active —
                never started, or stopped by hand. SystemdUnitFailed only sees the failed state.
      - eval_time: 7h
        alertname: QuadletUnpinned
        exp_alerts:
          - exp_labels:
              severity: warning
              job: node
              instance: solar:9100
              class: unpinned
              container: floater
            exp_annotations:
              summary: "floater on solar:9100 is not pinned by digest"
              description: >-
                The quadlet for floater on solar:9100 carries a tag-only Image= —
                outside the renovate pin discipline, so what it runs after a pull is
                unrecorded.
      # A host inspecting 15 quadlets is not a vacuum, and a run reporting success
      # is not a failure — the two threshold rules the offenders do not cover.
      - eval_time: 7h
        alertname: QuadletsDisappeared
        exp_alerts: []
      - eval_time: 7h
        alertname: InquisitionFailed
        exp_alerts: []

  # The Pi branch of HostCpuTemperatureHigh. The 15m eval fires and the 10m one does
  # not, which pins the for: to the window it claims rather than to anything shorter.
  - interval: 1m
    name: a Pi held above its soft-throttle point alerts
    input_series:
      - series: 'node_hwmon_temp_celsius{chip="thermal_thermal_zone0",job="node",instance="auspex:9100",sensor="temp1"}'
        values: "86x30"
    alert_rule_test:
      - eval_time: 15m
        alertname: HostCpuTemperatureHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: auspex:9100
            exp_annotations:
              summary: "CPU on auspex:9100 sustained above its thermal limit"
              description: >-
                auspex:9100 has held its CPU at 86C for 15 minutes — past the limit
                for its class, 95C on the N150s and 80C on the Pi. Check the heatsink
                and that the fan is spinning.
      - eval_time: 10m
        alertname: HostCpuTemperatureHigh
        exp_alerts: []

  # The negative control, at a temperature a Pi under real load reaches: the threshold
  # has to sit above working-warm or it reports the workload instead of the cooling.
  - interval: 1m
    name: a warm but unthrottled Pi stays silent
    input_series:
      - series: 'node_hwmon_temp_celsius{chip="thermal_thermal_zone0",job="node",instance="auspex:9100",sensor="temp1"}'
        values: "72x30"
    alert_rule_test:
      - eval_time: 20m
        alertname: HostCpuTemperatureHigh
        exp_alerts: []

  # 88C is the figure the rule's own comment cites for solar under its weekly zypper dup,
  # so this is the false positive the 95 threshold was chosen to avoid, held as a test.
  # It is also what stops the Pi's lower threshold leaking onto the N150s: collapse the
  # two branches to one 80C comparison and this case pages every week.
  - interval: 1m
    name: an N150 at its weekly peak load stays silent
    input_series:
      - series: 'node_hwmon_temp_celsius{chip="platform_coretemp_0",job="node",instance="solar:9100",sensor="temp1"}'
        values: "88x30"
    alert_rule_test:
      - eval_time: 20m
        alertname: HostCpuTemperatureHigh
        exp_alerts: []

  # Both branches live at once, each raising exactly one alert for its own host. A branch
  # dropped in a later edit shows up here as a missing alert rather than as a fault that
  # goes unreported for months — which, being a thermal fault on a fanless board in a
  # cupboard, is the failure this whole rule exists for.
  - interval: 1m
    name: a hot Pi and a hot N150 each raise one alert
    input_series:
      - series: 'node_hwmon_temp_celsius{chip="thermal_thermal_zone0",job="node",instance="auspex:9100",sensor="temp1"}'
        values: "100x30"
      - series: 'node_hwmon_temp_celsius{chip="platform_coretemp_0",job="node",instance="solar:9100",sensor="temp1"}'
        values: "100x30"
    alert_rule_test:
      - eval_time: 20m
        alertname: HostCpuTemperatureHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: auspex:9100
            exp_annotations:
              summary: "CPU on auspex:9100 sustained above its thermal limit"
              description: >-
                auspex:9100 has held its CPU at 100C for 15 minutes — past the limit
                for its class, 95C on the N150s and 80C on the Pi. Check the heatsink
                and that the fan is spinning.
          - exp_labels:
              severity: warning
              instance: solar:9100
            exp_annotations:
              summary: "CPU on solar:9100 sustained above its thermal limit"
              description: >-
                solar:9100 has held its CPU at 100C for 15 minutes — past the limit
                for its class, 95C on the N150s and 80C on the Pi. Check the heatsink
                and that the fan is spinning.

  # The firmware's own verdict. The 30m eval pins the for: 1h — the daily check
  # republishes a bad sample for ~24h of scrapes, so the window debounces the
  # scrape stream, not the check.
  - interval: 5m
    name: a disk failing its SMART self-assessment alerts
    input_series:
      - series: 'smartmon_device_healthy{job="node",instance="solar:9100",device="nvme0"}'
        values: "0x30"
    alert_rule_test:
      - eval_time: 65m
        alertname: SmartDeviceUnhealthy
        exp_alerts:
          - exp_labels:
              severity: critical
              job: node
              instance: solar:9100
              device: nvme0
            exp_annotations:
              summary: "nvme0 on solar:9100 fails its SMART self-assessment"
              description: >-
                The firmware on nvme0 (solar:9100) reports the disk as failing, or
                smartctl could not assess it at all. Confirm the backups are current
                and replace the disk.
      - eval_time: 30m
        alertname: SmartDeviceUnhealthy
        exp_alerts: []

  # Two devices either side of the threshold in one case: 91 fires, 89 stays
  # silent, which pins >= 90 to the number it claims.
  - interval: 5m
    name: an NVMe near its rated endurance alerts while a fresher one stays silent
    input_series:
      - series: 'smartmon_nvme_percentage_used{job="node",instance="solar:9100",device="nvme0"}'
        values: "91x30"
      - series: 'smartmon_nvme_percentage_used{job="node",instance="solar:9100",device="nvme1"}'
        values: "89x30"
    alert_rule_test:
      - eval_time: 65m
        alertname: NvmeWearHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              job: node
              instance: solar:9100
              device: nvme0
            exp_annotations:
              summary: "nvme0 on solar:9100 is near its rated endurance"
              description: >-
                The NVMe health log on nvme0 (solar:9100) reports 91% of rated
                endurance used — plan a replacement.
      - eval_time: 30m
        alertname: NvmeWearHigh
        exp_alerts: []

  # A step up turns delta over [7d] positive at t=5m, and the for: 1h holds it
  # pending until the hour — so 65m fires and 30m does not. The flat non-zero
  # device alongside is the negative control: the rule keys on growth, not on
  # the count, so an old disk that logged errors once, long ago, is history
  # rather than degradation — the exhaustive exp_alerts is what asserts its
  # silence.
  - interval: 5m
    name: a rising media error count alerts while a flat one stays silent
    input_series:
      - series: 'smartmon_nvme_media_errors{job="node",instance="solar:9100",device="nvme0"}'
        values: "0 12x20"
      - series: 'smartmon_nvme_media_errors{job="node",instance="solar:9100",device="nvme1"}'
        values: "12x20"
    alert_rule_test:
      - eval_time: 65m
        alertname: NvmeMediaErrorsIncreasing
        exp_alerts:
          - exp_labels:
              severity: warning
              job: node
              instance: solar:9100
              device: nvme0
            exp_annotations:
              summary: "nvme0 on solar:9100 is accumulating media errors"
              description: >-
                nvme0 on solar:9100 has logged new media and data integrity errors over
                the last 7 days — the disk is degrading ahead of its own verdict.
      - eval_time: 30m
        alertname: NvmeMediaErrorsIncreasing
        exp_alerts: []

  # The denominator rule: a scan that reads nothing on a host that runs the
  # check means the scan broke, and every verdict rule above reads clean by
  # vacuum.
  - interval: 5m
    name: a SMART scan that finds no devices alerts
    input_series:
      - series: 'smartmon_devices_checked{job="node",instance="solar:9100"}'
        values: "0x30"
    alert_rule_test:
      - eval_time: 65m
        alertname: SmartDevicesDisappeared
        exp_alerts:
          - exp_labels:
              severity: warning
              job: node
              instance: solar:9100
            exp_annotations:
              summary: "solar:9100 scanned no SMART-capable devices"
              description: >-
                The SMART check on solar:9100 found no devices to read — the host is
                watched but nothing is, so every disk-health rule reads clean by
                vacuum.
      - eval_time: 30m
        alertname: SmartDevicesDisappeared
        exp_alerts: []

  - interval: 5m
    name: a failed SMART check run alerts
    input_series:
      - series: 'smartmon_success{job="node",instance="solar:9100"}'
        values: "0x30"
    alert_rule_test:
      - eval_time: 65m
        alertname: SmartmonFailed
        exp_alerts:
          - exp_labels:
              severity: warning
              job: node
              instance: solar:9100
            exp_annotations:
              summary: "SMART check failed on solar:9100"
              description: >-
                The last SMART check run on solar:9100 failed — often a device that
                stopped answering smartctl mid-run, which is itself a disk symptom.
      - eval_time: 30m
        alertname: SmartmonFailed
        exp_alerts: []

  # The gauge is negative because promtool's clock starts at zero: -172800
  # places the last run exactly two days before the test begins, so the
  # threshold trips at the first tick without simulating two days of scrapes,
  # and the for: 1h alone separates the 65m fire from the 30m silence.
  - interval: 5m
    name: a SMART check silent for over 2 days alerts
    input_series:
      - series: 'smartmon_last_run_timestamp_seconds{job="node",instance="solar:9100"}'
        values: "-172800x30"
    alert_rule_test:
      - eval_time: 65m
        alertname: SmartmonOverdue
        exp_alerts:
          - exp_labels:
              severity: warning
              job: node
              instance: solar:9100
            exp_annotations:
              summary: "SMART check overdue on solar:9100"
              description: "solar:9100 has not completed a SMART check in over 2 days."
      - eval_time: 30m
        alertname: SmartmonOverdue
        exp_alerts: []

  # The collector's parse verdict — the only rule that sees a malformed .prom
  # file, whose family vanishes from the scrape while its writer reports
  # success.
  - interval: 5m
    name: a malformed textfile metric file alerts
    input_series:
      - series: 'node_textfile_scrape_error{job="node",instance="solar:9100"}'
        values: "1x30"
    alert_rule_test:
      - eval_time: 65m
        alertname: TextfileScrapeError
        exp_alerts:
          - exp_labels:
              severity: warning
              job: node
              instance: solar:9100
            exp_annotations:
              summary: "a textfile metric file on solar:9100 is malformed"
              description: >-
                node_exporter on solar:9100 failed to parse at least one .prom file in
                the textfile collector directory — that file's metrics have vanished
                from the scrape while their writer still reports success.
      - eval_time: 30m
        alertname: TextfileScrapeError
        exp_alerts: []

  # InstanceDown and BlackboxExporterDown split one failure mode, and the split is
  # only correct as a pair. Every blackbox target is a probe URL scraped from the one
  # co-located exporter, so an exporter outage takes all of them down at once: without
  # InstanceDown's job exclusion that is one critical per probed URL, and without the
  # max() it is one more on top. Both halves are asserted on the same input.
  - interval: 1m
    name: an unreachable blackbox exporter raises one alert, not one per probe target
    input_series:
      - series: 'up{job="blackbox",instance="https://jonnyoc.uk"}'
        values: "0x20"
      - series: 'up{job="blackbox",instance="https://sonarr.home.arpa/ping"}'
        values: "0x20"
      - series: 'up{job="blackbox",instance="https://transmission.home.arpa/transmission/web/"}'
        values: "0x20"
      # A healthy host alongside, so the silence below is the exclusion doing its work
      # rather than the rule having nothing to match at all.
      - series: 'up{job="node",instance="solar:9100"}'
        values: "1x20"
    alert_rule_test:
      - eval_time: 10m
        alertname: BlackboxExporterDown
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: "the blackbox exporter is unreachable — all probing is blind"
              description: "Prometheus cannot scrape the blackbox exporter, so nothing is being probed — not the public sites, not the containerised services."
      - eval_time: 10m
        alertname: InstanceDown
        exp_alerts: []
      # The first evaluation, where the exporter has just gone unreachable and the
      # rule is pending. A 5m for: is exactly one step of this file's 5m evaluation
      # interval, so no on-grid time can tell it from a shorter one — what this pins
      # is that the wait exists at all, which is what rides out a missed scrape.
      - eval_time: 0m
        alertname: BlackboxExporterDown
        exp_alerts: []

  # The other side of that split. A host that stops answering is InstanceDown's to
  # raise, and one blackbox target failing while its siblings answer is not an
  # exporter outage at all — which is what the max() is for. Written as min(), or as
  # a bare up{job="blackbox"} == 0, this case pages about the exporter every time a
  # single probe scrape times out.
  - interval: 1m
    name: a downed host alerts while a single blackbox scrape blip does not
    input_series:
      - series: 'up{job="node",instance="rogue-trader:9100"}'
        values: "0x20"
      - series: 'up{job="blackbox",instance="https://jonnyoc.uk"}'
        values: "0x20"
      - series: 'up{job="blackbox",instance="https://emmasedit.com"}'
        values: "1x20"
    alert_rule_test:
      - eval_time: 10m
        alertname: InstanceDown
        exp_alerts:
          - exp_labels:
              severity: critical
              job: node
              instance: rogue-trader:9100
            exp_annotations:
              summary: "rogue-trader:9100 (node) is down"
              description: "rogue-trader:9100 has been unreachable for over 5 minutes."
      - eval_time: 10m
        alertname: BlackboxExporterDown
        exp_alerts: []
      # Pending at the first evaluation; a 5m for: is one evaluation step, so this
      # pins that the wait exists, not its length.
      - eval_time: 0m
        alertname: InstanceDown
        exp_alerts: []

  # ProbeDown reads probe_success — the prober module's own verdict — rather than the
  # status code, because targets legitimately answer other codes: transmission's RPC
  # is auth-walled and answers 401 under http_2xx_or_401, and the redirect zones
  # answer 3xx before the 2xx. Keyed on the code instead, this case pages about a
  # target working exactly as designed.
  - interval: 1m
    name: an auth-walled target answering its module stays silent while a dead one alerts
    input_series:
      - series: 'probe_success{job="blackbox",instance="https://transmission.home.arpa/transmission/web/",module="http_2xx_or_401"}'
        values: "1x20"
      - series: 'probe_success{job="blackbox",instance="https://sonarr.home.arpa/ping",module="http_2xx"}'
        values: "0x20"
    alert_rule_test:
      - eval_time: 10m
        alertname: ProbeDown
        exp_alerts:
          - exp_labels:
              severity: critical
              job: blackbox
              instance: https://sonarr.home.arpa/ping
              module: http_2xx
            exp_annotations:
              summary: "probe of https://sonarr.home.arpa/ping is failing"
              description: "The blackbox probe of https://sonarr.home.arpa/ping has not answered with an accepted status for over 5 minutes."
      # Pending at the first evaluation, which is what rides out a deploy; a 5m for:
      # is one evaluation step, so this pins that the wait exists, not its length.
      - eval_time: 0m
        alertname: ProbeDown
        exp_alerts: []

  # The `> 0` conjunct is the whole rule. Blackbox exports a zero expiry both for a
  # failed probe and for a successful non-TLS one, and plex is probed over plain
  # HTTP — so `0 - time()` is hugely negative, satisfies the threshold, and without
  # the guard this fires forever on a target that has no certificate to expire.
  - interval: 5m
    name: a stalled renewal alerts while a plain-HTTP target and a fresh cert do not
    input_series:
      # Ten days out: a renewal has silently stalled, with time to intervene by hand.
      - series: 'probe_ssl_earliest_cert_expiry{job="blackbox",instance="https://jonnyoc.uk"}'
        values: "864000x20"
      # Thirty days out: the ordinary state of an auto-renewing cert.
      - series: 'probe_ssl_earliest_cert_expiry{job="blackbox",instance="https://emmasedit.com"}'
        values: "2592000x20"
      # plex, probed over plain HTTP: no certificate, so blackbox reports zero.
      - series: 'probe_ssl_earliest_cert_expiry{job="blackbox",instance="http://solar:32400/identity"}'
        values: "0x20"
    alert_rule_test:
      - eval_time: 1h5m
        alertname: ProbeSSLCertExpiringSoon
        exp_alerts:
          - exp_labels:
              severity: warning
              job: blackbox
              instance: https://jonnyoc.uk
            exp_annotations:
              summary: "TLS certificate for https://jonnyoc.uk expiring soon"
              description: "The TLS certificate served by https://jonnyoc.uk expires in under 14 days — auto-renewal may have stalled."
      - eval_time: 55m
        alertname: ProbeSSLCertExpiringSoon
        exp_alerts: []

  # The three backup *Failed rules share one shape and one risk: each reads a metric
  # family written by a different role's script, so a rule naming a family nothing
  # publishes is silent forever and indistinguishable from a healthy fleet — the trap
  # ScheduledJobMetricMissing exists for, on the very rules it protects. One case
  # reads all three, each failing on a host that actually runs it.
  - interval: 5m
    name: each backup family's failure raises its own alert and no other
    input_series:
      - series: 'podman_backup_success{job="node",instance="solar:9100"}'
        values: "0x10"
      - series: 'home_backup_success{job="node",instance="scholam:9100"}'
        values: "0x10"
      - series: 'wordpress_db_dump_success{job="node",instance="rogue-trader:9100"}'
        values: "0x10"
    alert_rule_test:
      - eval_time: 20m
        alertname: PodmanBackupFailed
        exp_alerts:
          - exp_labels:
              severity: critical
              job: node
              instance: solar:9100
            exp_annotations:
              summary: "podman backup failed on solar:9100"
              description: "The last podman volume backup run on solar:9100 failed."
      - eval_time: 20m
        alertname: HomeBackupFailed
        exp_alerts:
          - exp_labels:
              severity: critical
              job: node
              instance: scholam:9100
            exp_annotations:
              summary: "home backup failed on scholam:9100"
              description: "The last home directory backup run on scholam:9100 failed."
      - eval_time: 20m
        alertname: WordpressDbDumpFailed
        exp_alerts:
          - exp_labels:
              severity: critical
              job: node
              instance: rogue-trader:9100
            exp_annotations:
              summary: "WordPress database dump failed on rogue-trader:9100"
              description: "The last WordPress database dump on rogue-trader:9100 failed — the DR fallback for a broken in-place upgrade is now stale."
      # Inside for:, so all three are pending — one assertion pins the window they share.
      - eval_time: 10m
        alertname: PodmanBackupFailed
        exp_alerts: []

  # Every *Overdue rule is a threshold sitting a grace period above the cadence of the
  # timer that writes its gauge, and that grace is the only thing between a useful
  # alert and a weekly false positive. Here each gauge holds the age a healthy run
  # leaves it at, so the case fails the moment a threshold is tightened onto the
  # cadence itself.
  #
  # The gauges are negative because promtool's clock starts at zero: -604800 places
  # the last successful run seven days before the test begins, which pins an eight-day
  # threshold without simulating eight days of scrapes.
  - interval: 5m
    name: every scheduled job at its healthy cadence stays silent
    input_series:
      # Weekly timers, a day inside their thresholds.
      - series: 'podman_backup_last_run_timestamp_seconds{job="node",instance="solar:9100"}'
        values: "-604800x20"
      - series: 'home_backup_last_run_timestamp_seconds{job="node",instance="solar:9100"}'
        values: "-604800x20"
      - series: 'autoupdate_last_run_timestamp_seconds{job="node",instance="solar:9100"}'
        values: "-604800x20"
      # Daily.
      - series: 'wordpress_db_dump_last_run_timestamp_seconds{job="node",instance="rogue-trader:9100"}'
        values: "-86400x20"
      # Six-hourly.
      - series: 'wordpress_update_check_last_run_timestamp_seconds{job="node",instance="rogue-trader:9100"}'
        values: "-21600x20"
      - series: 'wordpress_boost_last_run_timestamp_seconds{job="node",instance="rogue-trader:9100"}'
        values: "-21600x20"
      # Every fifteen minutes.
      - series: 'arbites_last_run_timestamp_seconds{job="node",instance="scholam:9100"}'
        values: "-900x20"
    alert_rule_test:
      - eval_time: 1h5m
        alertname: PodmanBackupOverdue
        exp_alerts: []
      - eval_time: 1h5m
        alertname: HomeBackupOverdue
        exp_alerts: []
      - eval_time: 1h5m
        alertname: AutoupdateOverdue
        exp_alerts: []
      - eval_time: 1h5m
        alertname: WordpressDbDumpOverdue
        exp_alerts: []
      - eval_time: 1h5m
        alertname: WordpressUpdateCheckOverdue
        exp_alerts: []
      - eval_time: 1h5m
        alertname: WordpressBoostOverdue
        exp_alerts: []
      - eval_time: 1h5m
        alertname: ArbitesStale
        exp_alerts: []

  # wordpress-cron's timer fires every five minutes and its threshold is an hour, both
  # inside the window these tests run in — so unlike the weekly gauges above, a
  # constant value would drift past the threshold on the clock alone and prove nothing.
  # Modelled as it behaves: a gauge that advances with time is never overdue, however
  # long the test runs.
  - interval: 5m
    name: a five-minutely job that keeps firing is never overdue
    input_series:
      - series: 'wordpress_cron_last_run_timestamp_seconds{job="node",instance="rogue-trader:9100"}'
        values: "0+300x30"
    alert_rule_test:
      - eval_time: 2h5m
        alertname: WordpressCronOverdue
        exp_alerts: []

  # The mirror of the healthy case: every gauge just past its own threshold, so each
  # rule fires for the job that has genuinely stopped. All seven share a 1h for:,
  # and each is asserted separately at 55m rather than once for the set — the shared
  # window is seven independent copies of the same literal, so one of them shortened
  # is exactly the edit a single assertion would wave through.
  - interval: 5m
    name: each scheduled job past its grace alerts
    input_series:
      - series: 'podman_backup_last_run_timestamp_seconds{job="node",instance="solar:9100"}'
        values: "-694800x20"
      - series: 'home_backup_last_run_timestamp_seconds{job="node",instance="solar:9100"}'
        values: "-694800x20"
      - series: 'autoupdate_last_run_timestamp_seconds{job="node",instance="solar:9100"}'
        values: "-781200x20"
      - series: 'wordpress_db_dump_last_run_timestamp_seconds{job="node",instance="rogue-trader:9100"}'
        values: "-176400x20"
      - series: 'wordpress_update_check_last_run_timestamp_seconds{job="node",instance="rogue-trader:9100"}'
        values: "-90000x20"
      - series: 'wordpress_cron_last_run_timestamp_seconds{job="node",instance="rogue-trader:9100"}'
        values: "-7200x20"
      - series: 'arbites_last_run_timestamp_seconds{job="node",instance="scholam:9100"}'
        values: "-10800x20"
    alert_rule_test:
      - eval_time: 1h5m
        alertname: PodmanBackupOverdue
        exp_alerts:
          - exp_labels:
              severity: warning
              job: node
              instance: solar:9100
            exp_annotations:
              summary: "podman backup overdue on solar:9100"
              description: "solar:9100 has not run a podman volume backup in over 8 days."
      - eval_time: 1h5m
        alertname: HomeBackupOverdue
        exp_alerts:
          - exp_labels:
              severity: warning
              job: node
              instance: solar:9100
            exp_annotations:
              summary: "home backup overdue on solar:9100"
              description: "solar:9100 has not run a home directory backup in over 8 days."
      - eval_time: 1h5m
        alertname: AutoupdateOverdue
        exp_alerts:
          - exp_labels:
              severity: warning
              job: node
              instance: solar:9100
            exp_annotations:
              summary: "unattended update overdue on solar:9100"
              description: "solar:9100 has not completed an unattended update in over 9 days."
      - eval_time: 1h5m
        alertname: WordpressDbDumpOverdue
        exp_alerts:
          - exp_labels:
              severity: warning
              job: node
              instance: rogue-trader:9100
            exp_annotations:
              summary: "WordPress database dump overdue on rogue-trader:9100"
              description: "rogue-trader:9100 has not produced a WordPress database dump in over 2 days."
      - eval_time: 1h5m
        alertname: WordpressUpdateCheckOverdue
        exp_alerts:
          - exp_labels:
              severity: warning
              job: node
              instance: rogue-trader:9100
            exp_annotations:
              summary: "WordPress update check overdue on rogue-trader:9100"
              description: "rogue-trader:9100 has not completed a WordPress update check in over a day."
      - eval_time: 1h5m
        alertname: WordpressCronOverdue
        exp_alerts:
          - exp_labels:
              severity: warning
              job: node
              instance: rogue-trader:9100
            exp_annotations:
              summary: "WordPress cron overdue on rogue-trader:9100"
              description: "rogue-trader:9100 has not run WordPress cron in over an hour — scheduled posts and tasks have stalled."
      - eval_time: 1h5m
        alertname: ArbitesStale
        exp_alerts:
          - exp_labels:
              severity: warning
              job: node
              instance: scholam:9100
            exp_annotations:
              summary: "fleet reconcile stale on scholam:9100"
              description: "scholam:9100 has not completed a fleet reconcile in over 2 hours."
      # Every gauge above is already past its threshold at the first evaluation, so
      # these seven are the 1h for: and nothing else.
      - eval_time: 55m
        alertname: PodmanBackupOverdue
        exp_alerts: []
      - eval_time: 55m
        alertname: HomeBackupOverdue
        exp_alerts: []
      - eval_time: 55m
        alertname: AutoupdateOverdue
        exp_alerts: []
      - eval_time: 55m
        alertname: WordpressDbDumpOverdue
        exp_alerts: []
      - eval_time: 55m
        alertname: WordpressUpdateCheckOverdue
        exp_alerts: []
      - eval_time: 55m
        alertname: WordpressCronOverdue
        exp_alerts: []
      - eval_time: 55m
        alertname: ArbitesStale
        exp_alerts: []

  # The off-site mirror's six rules read a probe on auspex rather than a unit on the
  # host being protected, so every series below carries auspex's instance label and
  # the NAS task's name. The first case is the fault the whole family exists for and
  # the only one no notification on the NAS can raise: a task still reporting success
  # while a repo has quietly fallen out of it. Two families, declared and observed,
  # are compared — so the case also pins that a task whose manifest names everything
  # it should raises nothing.
  - interval: 5m
    name: a repo dropped from an off-site mirror task alerts while a complete task does not
    input_series:
      - series: 'offsite_mirror_task_expected{job="node",instance="auspex:9100",task="home-backup",folder="/astropath/solar-home-backup"}'
        values: "1x20"
      - series: 'offsite_mirror_task_expected{job="node",instance="auspex:9100",task="home-backup",folder="/astropath/rogue-trader-home-backup"}'
        values: "1x20"
      - series: 'offsite_mirror_task_covered{job="node",instance="auspex:9100",task="home-backup",folder="/astropath/solar-home-backup"}'
        values: "1x20"
      - series: 'offsite_mirror_task_status{job="node",instance="auspex:9100",task="home-backup"}'
        values: "1x20"
      - series: 'offsite_mirror_task_expected{job="node",instance="auspex:9100",task="photos-backup",folder="/scriptorum/photos"}'
        values: "1x20"
      - series: 'offsite_mirror_task_covered{job="node",instance="auspex:9100",task="photos-backup",folder="/scriptorum/photos"}'
        values: "1x20"
      - series: 'offsite_mirror_task_status{job="node",instance="auspex:9100",task="photos-backup"}'
        values: "1x20"
    alert_rule_test:
      - eval_time: 1h5m
        alertname: OffsiteMirrorCoverageMissing
        exp_alerts:
          - exp_labels:
              severity: critical
              job: node
              instance: auspex:9100
              task: home-backup
              folder: /astropath/rogue-trader-home-backup
            exp_annotations:
              summary: "the home-backup off-site mirror no longer covers /astropath/rogue-trader-home-backup"
              description: >-
                /astropath/rogue-trader-home-backup is declared as covered by the
                home-backup Hyper Backup task but is absent from the manifest its last
                run wrote — that data has no off-site copy, and the task is still
                reporting success.
      - eval_time: 55m
        alertname: OffsiteMirrorCoverageMissing
        exp_alerts: []
      # Both tasks published a status, so the companion below has nothing to claim —
      # the two rules partition the fault rather than both reporting it.
      - eval_time: 1h5m
        alertname: OffsiteMirrorTaskUnverified
        exp_alerts: []
      # And a task reporting success raises neither failure rule.
      - eval_time: 1h5m
        alertname: OffsiteMirrorTaskFailed
        exp_alerts: []

  # The absent() companion. A task the probe found no manifest for publishes no
  # status at all, which every other rule in the family matches an empty vector on —
  # the trap ScheduledJobMetricMissing exists for, one layer further out. The second
  # assertion is the gate on OffsiteMirrorCoverageMissing: without it this one fault
  # would raise a coverage alert per declared folder as well.
  - interval: 5m
    name: a task with no cached manifest alerts as unverified and raises no coverage alert
    input_series:
      - series: 'offsite_mirror_task_expected{job="node",instance="auspex:9100",task="photos-backup",folder="/scriptorum/photos"}'
        values: "1x20"
    alert_rule_test:
      - eval_time: 1h5m
        alertname: OffsiteMirrorTaskUnverified
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: auspex:9100
              task: photos-backup
            exp_annotations:
              summary: "the photos-backup off-site mirror cannot be verified"
              description: >-
                No cached manifest on the NAS names the photos-backup Hyper Backup task,
                so neither its coverage nor its last run can be checked from here.
      - eval_time: 1h5m
        alertname: OffsiteMirrorCoverageMissing
        exp_alerts: []
      - eval_time: 55m
        alertname: OffsiteMirrorTaskUnverified
        exp_alerts: []

  - interval: 5m
    name: an off-site mirror task reporting failure alerts
    input_series:
      - series: 'offsite_mirror_task_status{job="node",instance="auspex:9100",task="podman-backup"}'
        values: "0x10"
    alert_rule_test:
      - eval_time: 20m
        alertname: OffsiteMirrorTaskFailed
        exp_alerts:
          - exp_labels:
              severity: critical
              job: node
              instance: auspex:9100
              task: podman-backup
            exp_annotations:
              summary: "the podman-backup off-site mirror failed"
              description: >-
                The last run of the podman-backup Hyper Backup task did not report
                success — the off-site copy it maintains is no longer advancing.
      - eval_time: 10m
        alertname: OffsiteMirrorTaskFailed
        exp_alerts: []

  # 8 days, a day's grace over the weekly cadence, read off the NAS's own record of
  # the run rather than a systemd timer. One gauge a day inside the threshold and one
  # a day past it, so the case fails the moment the grace is tightened onto the
  # cadence itself. Negative values place the runs before promtool's zero clock.
  - interval: 5m
    name: an off-site mirror task past its weekly grace alerts while one inside it does not
    input_series:
      - series: 'offsite_mirror_task_last_success_timestamp_seconds{job="node",instance="auspex:9100",task="home-backup"}'
        values: "-604800x20"
      - series: 'offsite_mirror_task_last_success_timestamp_seconds{job="node",instance="auspex:9100",task="podman-backup"}'
        values: "-694800x20"
    alert_rule_test:
      - eval_time: 1h5m
        alertname: OffsiteMirrorTaskOverdue
        exp_alerts:
          - exp_labels:
              severity: warning
              job: node
              instance: auspex:9100
              task: podman-backup
            exp_annotations:
              summary: "the podman-backup off-site mirror is overdue"
              description: "The podman-backup Hyper Backup task has not completed a successful run in over 8 days."
      - eval_time: 55m
        alertname: OffsiteMirrorTaskOverdue
        exp_alerts: []

  # The probe's own failure, which is the state a fresh deploy sits in until the
  # operator installs its public key on the NAS — and the state that makes every rule
  # above evaluate a stale payload while saying nothing. 25h is what turns this into
  # "two consecutive daily runs": the assertion at 24h is the whole point of the
  # number, not a routine for: check.
  - interval: 5m
    name: two consecutive failed probe runs alert
    input_series:
      - series: 'offsite_mirror_success{job="node",instance="auspex:9100"}'
        values: "0x320"
    alert_rule_test:
      - eval_time: 25h5m
        alertname: OffsiteMirrorProbeFailed
        exp_alerts:
          - exp_labels:
              severity: warning
              job: node
              instance: auspex:9100
            exp_annotations:
              summary: "the off-site mirror probe failed on auspex:9100"
              description: >-
                auspex:9100 could not read the NAS's Hyper Backup manifest cache on two
                consecutive days, so the coverage and freshness rules above are
                evaluating the last payload it managed to write, however old.
      - eval_time: 24h
        alertname: OffsiteMirrorProbeFailed
        exp_alerts: []

  # The other half of that window, and the reason it is not 15m: one failed run that
  # the next morning's clears must never page. The metric flips at 24h, inside the
  # for:, and the rule is still silent six hours later.
  - interval: 5m
    name: a failed probe run that the next day clears never alerts
    input_series:
      - series: 'offsite_mirror_success{job="node",instance="auspex:9100"}'
        values: "0x287 1x100"
    alert_rule_test:
      - eval_time: 30h
        alertname: OffsiteMirrorProbeFailed
        exp_alerts: []

  # The daily timer caps a healthy run at ~1 day old; the two gauges here sit either
  # side of the 2-day threshold, so a probe still firing stays silent and one that
  # stopped alerts. Both are auspex because only auspex runs the probe, so they are
  # separated by nothing but the value — which is what the rule reads.
  - interval: 5m
    name: a probe still firing daily stays silent
    input_series:
      - series: 'offsite_mirror_last_run_timestamp_seconds{job="node",instance="auspex:9100"}'
        values: "-86400x20"
    alert_rule_test:
      - eval_time: 1h5m
        alertname: OffsiteMirrorProbeOverdue
        exp_alerts: []

  - interval: 5m
    name: a probe silent for over two days alerts
    input_series:
      - series: 'offsite_mirror_last_run_timestamp_seconds{job="node",instance="auspex:9100"}'
        values: "-183600x20"
    alert_rule_test:
      - eval_time: 1h5m
        alertname: OffsiteMirrorProbeOverdue
        exp_alerts:
          - exp_labels:
              severity: warning
              job: node
              instance: auspex:9100
            exp_annotations:
              summary: "the off-site mirror probe is overdue on auspex:9100"
              description: "auspex:9100 has not read the NAS's Hyper Backup manifest cache in over 2 days."
      - eval_time: 55m
        alertname: OffsiteMirrorProbeOverdue
        exp_alerts: []

  # The R2 copy's own family. DSM's cloud manifest carries no task name, status or
  # last-run time, so none of the rules above can see this destination at all —
  # these read the bucket the probe listed instead. The first case is the one the
  # family exists for: a declared container the bucket does not hold, checked
  # alongside a populated one so it also pins that a healthy container is silent.
  - interval: 5m
    name: a declared R2 container the bucket does not hold alerts while a populated one does not
    input_series:
      - series: 'r2_mirror_container_expected{job="node",instance="auspex:9100",container="home-backup-r2"}'
        values: "1x20"
      - series: 'r2_mirror_container_bytes{job="node",instance="auspex:9100",container="home-backup-r2"}'
        values: "8589934592x20"
      - series: 'r2_mirror_container_expected{job="node",instance="auspex:9100",container="photos-backup-r2"}'
        values: "1x20"
      - series: 'r2_mirror_container_bytes{job="node",instance="auspex:9100",container="photos-backup-r2"}'
        values: "0x20"
      # Undeclared and empty — the prefix the probe found but the play never named,
      # which the scoping exists to keep out. Without it the rule could be written
      # as a bare bytes == 0 and every case here would still pass.
      - series: 'r2_mirror_container_bytes{job="node",instance="auspex:9100",container="stray.hbk"}'
        values: "0x20"
    alert_rule_test:
      - eval_time: 1h5m
        alertname: R2MirrorContainerMissing
        exp_alerts:
          - exp_labels:
              severity: critical
              instance: auspex:9100
              container: photos-backup-r2
            exp_annotations:
              summary: "the photos-backup-r2 R2 container holds nothing"
              description: >-
                photos-backup-r2 is declared in the play but the bucket holds no object
                under its prefix — the second off-site copy of those repos does not
                exist.
      - eval_time: 55m
        alertname: R2MirrorContainerMissing
        exp_alerts: []

  # Why that gate reads bytes and not objects. A zero-byte folder marker — what R2's
  # dashboard writes for a prefix made by hand, and what emptying a container leaves
  # behind — counts as an object, so an object gate reads this container as a copy
  # that exists while it holds nothing at all.
  - interval: 5m
    name: a declared R2 container holding nothing but a folder marker alerts
    input_series:
      - series: 'r2_mirror_container_expected{job="node",instance="auspex:9100",container="podman-backup-r2"}'
        values: "1x20"
      - series: 'r2_mirror_container_objects{job="node",instance="auspex:9100",container="podman-backup-r2"}'
        values: "1x20"
      - series: 'r2_mirror_container_bytes{job="node",instance="auspex:9100",container="podman-backup-r2"}'
        values: "0x20"
    alert_rule_test:
      - eval_time: 1h5m
        alertname: R2MirrorContainerMissing
        exp_alerts:
          - exp_labels:
              severity: critical
              instance: auspex:9100
              container: podman-backup-r2
            exp_annotations:
              summary: "the podman-backup-r2 R2 container holds nothing"
              description: >-
                podman-backup-r2 is declared in the play but the bucket holds no object
                under its prefix — the second off-site copy of those repos does not
                exist.
      - eval_time: 55m
        alertname: R2MirrorContainerMissing
        exp_alerts: []

  # 8 days, a day's grace over the weekly upload, read off the newest object in the
  # container rather than a status DSM reported — a task that stops running, fails
  # every run, or has had its key revoked all reach it the same way. One container a
  # day inside the threshold and one a day past it, so the case fails the moment the
  # grace is tightened onto the cadence. Negative values place the writes before
  # promtool's zero clock. The third container is the join the rule carries: the probe
  # publishes this gauge for every prefix it finds, so a retired task's leftover
  # objects sit stale for good, and nothing but deleting them out of the last-resort
  # copy would ever clear the page they would otherwise raise.
  - interval: 5m
    name: a stale declared R2 container alerts while one inside its weekly grace and an undeclared prefix do not
    input_series:
      - series: 'r2_mirror_container_expected{job="node",instance="auspex:9100",container="home-backup-r2"}'
        values: "1x20"
      - series: 'r2_mirror_container_last_write_timestamp_seconds{job="node",instance="auspex:9100",container="home-backup-r2"}'
        values: "-604800x20"
      - series: 'r2_mirror_container_expected{job="node",instance="auspex:9100",container="podman-backup-r2"}'
        values: "1x20"
      - series: 'r2_mirror_container_last_write_timestamp_seconds{job="node",instance="auspex:9100",container="podman-backup-r2"}'
        values: "-694800x20"
      - series: 'r2_mirror_container_last_write_timestamp_seconds{job="node",instance="auspex:9100",container="stray.hbk"}'
        values: "-694800x20"
    alert_rule_test:
      - eval_time: 1h5m
        alertname: R2MirrorContainerStale
        exp_alerts:
          - exp_labels:
              severity: warning
              job: node
              instance: auspex:9100
              container: podman-backup-r2
            exp_annotations:
              summary: "the podman-backup-r2 R2 copy is stale"
              description: "Nothing has been written to podman-backup-r2 in R2 in over 8 days."
      - eval_time: 55m
        alertname: R2MirrorContainerStale
        exp_alerts: []

  # Parts left by an interrupted upload bill as storage and appear in no listing, so
  # nothing else can report them. 25h is what separates a stranded part from an
  # upload merely in flight while the probe ran: the assertion just inside it is the
  # whole point of the number, not a routine for: check.
  - interval: 5m
    name: an upload stranded past a second probe alerts, one in flight does not
    input_series:
      - series: 'r2_mirror_multipart_pending{job="node",instance="auspex:9100",container="podman-backup-r2"}'
        values: "1x320"
    alert_rule_test:
      - eval_time: 25h5m
        alertname: R2MirrorStrandedParts
        exp_alerts:
          - exp_labels:
              severity: warning
              job: node
              instance: auspex:9100
              container: podman-backup-r2
            exp_annotations:
              summary: "podman-backup-r2 has incomplete uploads in R2"
              description: >-
                1 multipart upload(s) into podman-backup-r2 were started and never
                completed. They are billed as storage and do not appear in a bucket
                listing.
      - eval_time: 24h55m
        alertname: R2MirrorStrandedParts
        exp_alerts: []

  # The other half of that window, and the reason it is not 24h: the gauge holds one
  # probe's reading until the next run overwrites it, so a for: of exactly the cycle
  # decides on jitter. The second run here lands half an hour late and reports the
  # upload completed — the first assertion is where a 24h window would have paged
  # for it, the second is the eval time the case above fires at.
  - interval: 5m
    name: an upload the next probe finds completed never alerts
    input_series:
      - series: 'r2_mirror_multipart_pending{job="node",instance="auspex:9100",container="podman-backup-r2"}'
        values: "1x294 0x100"
    alert_rule_test:
      - eval_time: 24h5m
        alertname: R2MirrorStrandedParts
        exp_alerts: []
      - eval_time: 25h5m
        alertname: R2MirrorStrandedParts
        exp_alerts: []

  # The probe's own outcome. Without it a revoked key looks like a healthy copy: the
  # payload it last wrote keeps being evaluated by every rule above. 25h is what
  # turns the first into "two consecutive daily runs", so the assertion at 24h is
  # the point of the number rather than a routine check.
  - interval: 5m
    name: an R2 probe that fails or stops firing alerts
    input_series:
      - series: 'r2_mirror_success{job="node",instance="auspex:9100"}'
        values: "0x320"
      - series: 'r2_mirror_last_run_timestamp_seconds{job="node",instance="auspex:9100"}'
        values: "-180000x320"
    alert_rule_test:
      - eval_time: 25h5m
        alertname: R2MirrorProbeFailed
        exp_alerts:
          - exp_labels:
              severity: warning
              job: node
              instance: auspex:9100
            exp_annotations:
              summary: "the R2 copy probe failed on auspex:9100"
              description: >-
                auspex:9100 could not read the R2 bucket on two consecutive days, so
                the rules above are evaluating the last payload it managed to write,
                however old.
      - eval_time: 24h
        alertname: R2MirrorProbeFailed
        exp_alerts: []
      - eval_time: 1h5m
        alertname: R2MirrorProbeOverdue
        exp_alerts:
          - exp_labels:
              severity: warning
              job: node
              instance: auspex:9100
            exp_annotations:
              summary: "the R2 copy probe is overdue on auspex:9100"
              description: "auspex:9100 has not read the R2 bucket in over 2 days."
      - eval_time: 55m
        alertname: R2MirrorProbeOverdue
        exp_alerts: []

  # arbites is the unattended path from main to the fleet: when it fails, every merged
  # change stops arriving and nothing else says so — the fleet keeps serving the last
  # good apply, indefinitely and quietly. 15m is one timer cycle, so this lands on the
  # first run that does not recover.
  - interval: 5m
    name: a failed fleet reconcile alerts
    input_series:
      - series: 'arbites_success{job="node",instance="scholam:9100"}'
        values: "0x10"
    alert_rule_test:
      - eval_time: 20m
        alertname: ArbitesFailed
        exp_alerts:
          - exp_labels:
              severity: critical
              job: node
              instance: scholam:9100
            exp_annotations:
              summary: "fleet reconcile failed on scholam:9100"
              description: "The last unattended fleet reconcile on scholam:9100 failed — main is no longer reaching the fleet."
      - eval_time: 10m
        alertname: ArbitesFailed
        exp_alerts: []

  # wp-cron rewrites its metric every five minutes, so a single failed cycle clears
  # itself; the 15m for: is what tells that apart from a database that has actually
  # gone away. Evaluated at 10m, while the third failing sample is still the latest —
  # past 15m the series has recovered and `== 0` is an empty vector, which would hold
  # for a rule with no for: at all.
  - interval: 5m
    name: one failed wp-cron cycle is still only pending when the next runs
    input_series:
      - series: 'wordpress_cron_success{job="node",instance="rogue-trader:9100"}'
        values: "0x2 1x20"
    alert_rule_test:
      - eval_time: 10m
        alertname: WordpressCronFailed
        exp_alerts: []

  - interval: 5m
    name: three failed wp-cron cycles alert
    input_series:
      - series: 'wordpress_cron_success{job="node",instance="rogue-trader:9100"}'
        values: "0x10"
    alert_rule_test:
      - eval_time: 20m
        alertname: WordpressCronFailed
        exp_alerts:
          - exp_labels:
              severity: warning
              job: node
              instance: rogue-trader:9100
            exp_annotations:
              summary: "WordPress cron failed on rogue-trader:9100"
              description: "The last WordPress cron run on rogue-trader:9100 errored — the database is unreachable or wp-cli otherwise failed."

  # The update check runs six-hourly and holds success=0 constant until its next run,
  # so any for: shorter than that interval fires on a single wordpress.org blip. 12h
  # spans two checks: the first failure is still only pending when the second lands.
  - interval: 5m
    name: one failed six-hourly update check is still pending when the next runs
    input_series:
      - series: 'wordpress_update_check_success{job="node",instance="rogue-trader:9100"}'
        values: "0x72 1x80"
    alert_rule_test:
      - eval_time: 6h
        alertname: WordpressUpdateCheckFailed
        exp_alerts: []

  - interval: 5m
    name: an update check failing across two runs alerts
    input_series:
      - series: 'wordpress_update_check_success{job="node",instance="rogue-trader:9100"}'
        values: "0x150"
    alert_rule_test:
      - eval_time: 12h5m
        alertname: WordpressUpdateCheckFailed
        exp_alerts:
          - exp_labels:
              severity: warning
              job: node
              instance: rogue-trader:9100
            exp_annotations:
              summary: "WordPress update check failed on rogue-trader:9100"
              description: "The last WordPress update check on rogue-trader:9100 errored — pending core, plugin, theme, or translation updates may be missed."

  # WordPress applies minor core releases on its own twice-daily cadence, so a pending
  # count is the ordinary state for hours at a time. The 24h for: is what keeps this
  # rule about the updates that need a hand — a major, or anything not opted into
  # auto-update — rather than about WordPress's own backlog between runs.
  - interval: 5m
    name: an update WordPress applies itself does not alert
    input_series:
      - series: 'wordpress_updates_available{job="node",instance="rogue-trader:9100",type="plugin"}'
        values: "1x240 0x20"
    alert_rule_test:
      - eval_time: 20h
        alertname: WordpressUpdateAvailable
        exp_alerts: []

  - interval: 5m
    name: an update standing past a day alerts
    input_series:
      - series: 'wordpress_updates_available{job="node",instance="rogue-trader:9100",type="core"}'
        values: "2x300"
    alert_rule_test:
      - eval_time: 24h5m
        alertname: WordpressUpdateAvailable
        exp_alerts:
          - exp_labels:
              severity: warning
              job: node
              instance: rogue-trader:9100
              type: core
            exp_annotations:
              summary: "WordPress core update available on rogue-trader:9100"
              description: "2 core update(s) are pending on rogue-trader:9100 — apply via wp-cli or wp-admin."
      - eval_time: 23h55m
        alertname: WordpressUpdateAvailable
        exp_alerts: []

  # The install gate is what keeps these rules off a WordPress host that never had
  # Boost: the role does not manage the plugin, so the check publishes generated 0
  # there too, and without the gate every such host would alert for CSS it was
  # never meant to have.
  - interval: 5m
    name: ungenerated critical CSS alerts only where Boost is installed
    input_series:
      - series: 'wordpress_boost_installed{job="node",instance="rogue-trader:9100"}'
        values: "1x30"
      - series: 'wordpress_boost_critical_css_generated{job="node",instance="rogue-trader:9100"}'
        values: "0x30"
      - series: 'wordpress_boost_installed{job="node",instance="solar:9100"}'
        values: "0x30"
      - series: 'wordpress_boost_critical_css_generated{job="node",instance="solar:9100"}'
        values: "0x30"
    alert_rule_test:
      - eval_time: 1h5m
        alertname: WordpressBoostCriticalCssMissing
        exp_alerts:
          - exp_labels:
              severity: warning
              job: node
              instance: rogue-trader:9100
            exp_annotations:
              summary: "Jetpack Boost critical CSS not generated on rogue-trader:9100"
              description: >-
                Boost reports no critical CSS on rogue-trader:9100 — a plugin update
                resets the state — so pages load without it, or worse serve a stale copy
                still in storage. Regenerate from the Boost admin page.
      - eval_time: 55m
        alertname: WordpressBoostCriticalCssMissing
        exp_alerts: []

  # Pins the anti-overlap property: an install that has never generated carries
  # updated 0, so keying the stale rule on generated == 1 rather than on
  # installed == 1 is what stops one fault raising two alerts.
  - interval: 5m
    name: ageing critical CSS alerts, and an ungenerated one raises only the missing rule
    input_series:
      - series: 'wordpress_boost_critical_css_generated{job="node",instance="rogue-trader:9100"}'
        values: "1x30"
      - series: 'wordpress_boost_critical_css_updated_timestamp_seconds{job="node",instance="rogue-trader:9100"}'
        values: "-2592000x30"
      - series: 'wordpress_boost_installed{job="node",instance="solar:9100"}'
        values: "1x30"
      - series: 'wordpress_boost_critical_css_generated{job="node",instance="solar:9100"}'
        values: "0x30"
      - series: 'wordpress_boost_critical_css_updated_timestamp_seconds{job="node",instance="solar:9100"}'
        values: "0x30"
    alert_rule_test:
      - eval_time: 1h5m
        alertname: WordpressBoostCriticalCssStale
        exp_alerts:
          - exp_labels:
              severity: warning
              job: node
              instance: rogue-trader:9100
            exp_annotations:
              summary: "Jetpack Boost critical CSS stale on rogue-trader:9100"
              description: >-
                The critical CSS on rogue-trader:9100 was generated over 30 days ago and
                no longer reflects any theme or markup change since. Regenerate it from
                the Boost admin page.

  # Freshly generated CSS is not stale however long the test runs.
  - interval: 5m
    name: recently generated critical CSS does not alert
    input_series:
      - series: 'wordpress_boost_critical_css_generated{job="node",instance="rogue-trader:9100"}'
        values: "1x30"
      - series: 'wordpress_boost_critical_css_updated_timestamp_seconds{job="node",instance="rogue-trader:9100"}'
        values: "-86400x30"
    alert_rule_test:
      - eval_time: 2h
        alertname: WordpressBoostCriticalCssStale
        exp_alerts: []

  # A provider whose pages carry no external stylesheet fails every run, so the
  # error gauge is published for context and deliberately carries no rule. This
  # pins that: a healthy install with a permanently failing provider is silent.
  - interval: 5m
    name: a permanently failing critical CSS provider raises nothing
    input_series:
      - series: 'wordpress_boost_installed{job="node",instance="rogue-trader:9100"}'
        values: "1x30"
      - series: 'wordpress_boost_critical_css_generated{job="node",instance="rogue-trader:9100"}'
        values: "1x30"
      - series: 'wordpress_boost_critical_css_updated_timestamp_seconds{job="node",instance="rogue-trader:9100"}'
        values: "-3600x30"
      - series: 'wordpress_boost_success{job="node",instance="rogue-trader:9100"}'
        values: "1x30"
      - series: 'wordpress_boost_critical_css_providers{job="node",instance="rogue-trader:9100",status="error"}'
        values: "1x30"
    alert_rule_test:
      - eval_time: 2h
        alertname: WordpressBoostCriticalCssMissing
        exp_alerts: []
      - eval_time: 2h
        alertname: WordpressBoostCriticalCssStale
        exp_alerts: []
      - eval_time: 2h
        alertname: WordpressBoostFailed
        exp_alerts: []

  # The six-hourly metric holds success 0 constant until the next run, so 12h is
  # what makes this rule about a sustained failure rather than one transient blip.
  - interval: 5m
    name: a sustained boost check failure alerts
    input_series:
      - series: 'wordpress_boost_success{job="node",instance="rogue-trader:9100"}'
        values: "0x160"
    alert_rule_test:
      - eval_time: 12h5m
        alertname: WordpressBoostFailed
        exp_alerts:
          - exp_labels:
              severity: warning
              job: node
              instance: rogue-trader:9100
            exp_annotations:
              summary: "Jetpack Boost check failed on rogue-trader:9100"
              description: "The last Jetpack Boost check on rogue-trader:9100 errored — critical CSS may have lapsed unseen."
      - eval_time: 11h55m
        alertname: WordpressBoostFailed
        exp_alerts: []

  # A stopped timer or deleted script leaves the last .prom on disk serving
  # success 1 for ever, so this rule — not WordpressBoostFailed, and not
  # SystemdUnitFailed, which excludes the unit — is what catches a dead check.
  - interval: 5m
    name: a boost check that has stopped running alerts
    input_series:
      - series: 'wordpress_boost_last_run_timestamp_seconds{job="node",instance="rogue-trader:9100"}'
        values: "-86400x30"
      - series: 'wordpress_boost_success{job="node",instance="rogue-trader:9100"}'
        values: "1x30"
    alert_rule_test:
      - eval_time: 1h5m
        alertname: WordpressBoostOverdue
        exp_alerts:
          - exp_labels:
              severity: warning
              job: node
              instance: rogue-trader:9100
            exp_annotations:
              summary: "Jetpack Boost check overdue on rogue-trader:9100"
              description: "rogue-trader:9100 has not completed a Jetpack Boost check in over a day."
      # The frozen metric still reads healthy, which is the point.
      - eval_time: 1h5m
        alertname: WordpressBoostFailed
        exp_alerts: []

  # The fstype exclusion is what keeps this rule about disks: a tmpfs at 99% is the
  # ordinary state of /run and an overlay is a container's own layer, so without it
  # every host pages daily and the one real alert is lost among them.
  - interval: 5m
    name: a filling disk alerts while a full tmpfs and a healthy disk do not
    input_series:
      - series: 'node_filesystem_avail_bytes{job="node",instance="solar:9100",mountpoint="/",fstype="btrfs",device="/dev/sda2"}'
        values: "5x20"
      - series: 'node_filesystem_size_bytes{job="node",instance="solar:9100",mountpoint="/",fstype="btrfs",device="/dev/sda2"}'
        values: "100x20"
      - series: 'node_filesystem_avail_bytes{job="node",instance="solar:9100",mountpoint="/home",fstype="btrfs",device="/dev/sda3"}'
        values: "50x20"
      - series: 'node_filesystem_size_bytes{job="node",instance="solar:9100",mountpoint="/home",fstype="btrfs",device="/dev/sda3"}'
        values: "100x20"
      - series: 'node_filesystem_avail_bytes{job="node",instance="solar:9100",mountpoint="/run",fstype="tmpfs",device="tmpfs"}'
        values: "1x20"
      - series: 'node_filesystem_size_bytes{job="node",instance="solar:9100",mountpoint="/run",fstype="tmpfs",device="tmpfs"}'
        values: "100x20"
    alert_rule_test:
      - eval_time: 20m
        alertname: FilesystemSpaceLow
        exp_alerts:
          - exp_labels:
              severity: warning
              job: node
              instance: solar:9100
              mountpoint: /
              fstype: btrfs
              device: /dev/sda2
            exp_annotations:
              summary: "low disk space on solar:9100:/"
              description: "/ on solar:9100 has under 10% free."
      - eval_time: 10m
        alertname: FilesystemSpaceLow
        exp_alerts: []

  # 15m is sized to the pressure spikes that are routine on these boxes — a build, the
  # weekly zypper dup, a backup run — so a ten-minute dip must ride out while a host
  # that stays under its headroom alerts. Both are here on one input: at 20m the
  # spiking host has recovered and the sustained one fires, and at 10m neither has
  # cleared the window yet.
  - interval: 5m
    name: a memory spike rides out while sustained pressure alerts
    input_series:
      - series: 'node_memory_MemAvailable_bytes{job="node",instance="solar:9100"}'
        values: "5x2 50x20"
      - series: 'node_memory_MemTotal_bytes{job="node",instance="solar:9100"}'
        values: "100x30"
      - series: 'node_memory_MemAvailable_bytes{job="node",instance="scholam:9100"}'
        values: "5x30"
      - series: 'node_memory_MemTotal_bytes{job="node",instance="scholam:9100"}'
        values: "100x30"
    alert_rule_test:
      - eval_time: 20m
        alertname: MemoryLow
        exp_alerts:
          - exp_labels:
              severity: warning
              job: node
              instance: scholam:9100
            exp_annotations:
              summary: "low memory on scholam:9100"
              description: "scholam:9100 has under 10% memory available."
      - eval_time: 10m
        alertname: MemoryLow
        exp_alerts: []

  # 30m rides out a clock stepping after a reboot or a brief loss of the NTP server,
  # so only a host that has genuinely stopped syncing alerts — a shorter window pages
  # every time a host comes back up.
  - interval: 5m
    name: a brief resync rides out while a host that stops syncing alerts
    input_series:
      - series: 'node_timex_sync_status{job="node",instance="scholam:9100"}'
        values: "0x5 1x20"
      - series: 'node_timex_sync_status{job="node",instance="solar:9100"}'
        values: "0x20"
    alert_rule_test:
      - eval_time: 35m
        alertname: ClockNotSynchronised
        exp_alerts:
          - exp_labels:
              severity: warning
              job: node
              instance: solar:9100
            exp_annotations:
              summary: "clock not synchronised on solar:9100"
              description: "solar:9100 has had no NTP time sync for 30 minutes — clock drift can break TLS validation and log correlation."
      - eval_time: 25m
        alertname: ClockNotSynchronised
        exp_alerts: []

  # Two rules on one counter, and three properties that only hold together.
  # ServiceRestartStorm excludes wireguard.service so a dead tunnel raises one alert
  # rather than two differently-named ones — group_by is on alertname, so the
  # duplicate would page twice for one fault. WireguardTunnelDown names that fault
  # instead of reporting "a unit". And both are gated on the host having been up for
  # 15 minutes, because the counter zeroes at boot and dependency-ordered units
  # restart a few times on the way up — without the gate every reboot pages.
  #
  # node_boot_time_seconds is zero, so the host booted exactly when the test started:
  # the 10m evaluation is still inside that boot, and the 25m one is a host that has
  # settled and is flapping anyway. Both counters are already well past their
  # thresholds at 10m, so the gate is the only thing holding the alerts back there.
  - interval: 1m
    name: a flapping unit and a flapping tunnel each raise only their own alert
    input_series:
      - series: 'node_systemd_service_restart_total{job="node",instance="solar:9100",name="caddy.service"}'
        values: "0+1x40"
      - series: 'node_systemd_service_restart_total{job="node",instance="solar:9100",name="wireguard.service"}'
        values: "0+1x40"
      - series: 'node_boot_time_seconds{job="node",instance="solar:9100"}'
        values: "0x40"
    alert_rule_test:
      - eval_time: 10m
        alertname: ServiceRestartStorm
        exp_alerts: []
      - eval_time: 10m
        alertname: WireguardTunnelDown
        exp_alerts: []
      - eval_time: 25m
        alertname: ServiceRestartStorm
        exp_alerts:
          - exp_labels:
              severity: warning
              job: node
              instance: solar:9100
              name: caddy.service
            exp_annotations:
              summary: "caddy.service is restarting repeatedly on solar:9100"
              description: "caddy.service on solar:9100 auto-restarted more than 3 times in 15 minutes."
      - eval_time: 25m
        alertname: WireguardTunnelDown
        exp_alerts:
          - exp_labels:
              severity: critical
              job: node
              instance: solar:9100
              name: wireguard.service
            exp_annotations:
              summary: "the wireguard tunnel is down on solar:9100"
              description: "wireguard auto-restarted more than once in 15 minutes — it cannot reach the internet through wg0, so the arr stack has no egress."

  # The boundary the half-thresholds turn on; alerts.yml argues why they are halves.
  # What matters here is `interval: 4m` rather than the 1m used elsewhere, which is the
  # whole reason these cases are worth their length. Sample the series on any divisor
  # of the 5m evaluation grid and every window edge lands exactly on a sample, there is
  # nothing for the rescaling to reach for, the factor comes out at exactly 1.0, and one
  # restart reads as exactly 1.0 — which `> 1` and `> 1.5` reject alike. Written that
  # way this case passes against the broken rule and guards nothing; it was, and it did.
  # 4m is the shortest interval on which the edges stay off the grid for two consecutive
  # evaluations, which is what the for: needs to resolve either way.
  #
  # A single restart is what a rotated VPN endpoint costs when arr-wireguard-refresh
  # does not get there first, and the tunnel is back inside ten seconds, so it must stay
  # silent; a second inside the window is a tunnel that is not coming back, which is the
  # fault this names.
  - interval: 4m
    name: a single wireguard restart does not raise the tunnel alert
    input_series:
      - series: 'node_systemd_service_restart_total{job="node",instance="solar:9100",name="wireguard.service"}'
        values: "0x5 1x8"
      - series: 'node_boot_time_seconds{job="node",instance="solar:9100"}'
        values: "0x13"
    alert_rule_test:
      # 30m is the load-bearing one: the lone restart reads 1.083 here and 1.167
      # there, so under `> 1` it is only *pending* at 25m — and exp_alerts compares
      # firing alerts, so this eval passes against the broken rule on its own.
      # Measured, not assumed. 25m stays to document the pending phase; delete 30m
      # and the guard is gone.
      - eval_time: 25m
        alertname: WireguardTunnelDown
        exp_alerts: []
      - eval_time: 30m
        alertname: WireguardTunnelDown
        exp_alerts: []

  # The other side of that boundary: the same series with one more step in it. The two
  # steps are 4m apart here against ~9s on the fleet, where systemd re-runs a killed
  # container almost immediately — either way they share the 15m window, which is all
  # the rule asks. Reads 2.333 at 30m and 1.875 at 35m: both over 1.5, and the second
  # of them under 2, which is why the threshold is not `>= 2`.
  - interval: 4m
    name: two wireguard restarts in the window raise the tunnel alert
    input_series:
      - series: 'node_systemd_service_restart_total{job="node",instance="solar:9100",name="wireguard.service"}'
        values: "0x5 1 2x7"
      - series: 'node_boot_time_seconds{job="node",instance="solar:9100"}'
        values: "0x13"
    alert_rule_test:
      # Pending at 30m, so 35m is the first evaluation past the for: — this pins the
      # wait as well as the match.
      - eval_time: 35m
        alertname: WireguardTunnelDown
        exp_alerts:
          - exp_labels:
              severity: critical
              job: node
              instance: solar:9100
              name: wireguard.service
            exp_annotations:
              summary: "the wireguard tunnel is down on solar:9100"
              description: "wireguard auto-restarted more than once in 15 minutes — it cannot reach the internet through wg0, so the arr stack has no egress."

  # ServiceRestartStorm's half of the same boundary. It carried the identical bug
  # and was found by the same investigation: `> 3` fires on the third restart while
  # the description says "more than 3 times". Three steps land in one scrape gap
  # here, which is what a flapping unit does on the fleet — systemd re-runs it in
  # under a second and a 15s scrape sees 0 then 3 — and it is also the geometry that
  # keeps the rescaling visible across two evaluations, as the wireguard cases above
  # need it to be.
  - interval: 4m
    name: three restarts of an ordinary unit do not raise the storm alert
    input_series:
      - series: 'node_systemd_service_restart_total{job="node",instance="solar:9100",name="caddy.service"}'
        values: "0x5 3x8"
      - series: 'node_boot_time_seconds{job="node",instance="solar:9100"}'
        values: "0x13"
    alert_rule_test:
      # Reads 3.25 then 3.5 — over `> 3` at both, which is pending then firing.
      - eval_time: 25m
        alertname: ServiceRestartStorm
        exp_alerts: []
      - eval_time: 30m
        alertname: ServiceRestartStorm
        exp_alerts: []

  - interval: 4m
    name: four restarts of an ordinary unit raise the storm alert
    input_series:
      - series: 'node_systemd_service_restart_total{job="node",instance="solar:9100",name="caddy.service"}'
        values: "0x5 4x8"
      - series: 'node_boot_time_seconds{job="node",instance="solar:9100"}'
        values: "0x13"
    alert_rule_test:
      - eval_time: 30m
        alertname: ServiceRestartStorm
        exp_alerts:
          - exp_labels:
              severity: warning
              job: node
              instance: solar:9100
              name: caddy.service
            exp_annotations:
              summary: "caddy.service is restarting repeatedly on solar:9100"
              description: "caddy.service on solar:9100 auto-restarted more than 3 times in 15 minutes."

  # The catch-all, whose whole risk is its exclusion roster: the oneshots are
  # excluded *because* each has a bespoke *Failed rule carrying a richer description
  # and the right severity, and group_by is on alertname, so a name left in would
  # page twice for one failed backup. Every member fails at once here alongside an
  # ordinary unit, so a name dropped from the regex surfaces as a second alert in
  # this case rather than as a duplicate page months later. The reverse direction —
  # a unit added to the roster and not added here — reads as a pass, so
  # bin/check-alert-test-coverage.py holds this list to the roster rather than trusting
  # it. No host runs them all: the roster keys on the unit name and the instance is
  # incidental, so one host keeps the "exactly one alert" assertion legible.
  - interval: 5m
    name: the oneshots with their own rules raise no catch-all alert
    input_series:
      - series: 'node_systemd_unit_state{job="node",instance="solar:9100",name="arbites.service",state="failed"}'
        values: "1x10"
      - series: 'node_systemd_unit_state{job="node",instance="solar:9100",name="inquisition.service",state="failed"}'
        values: "1x10"
      - series: 'node_systemd_unit_state{job="node",instance="solar:9100",name="smartmon.service",state="failed"}'
        values: "1x10"
      - series: 'node_systemd_unit_state{job="node",instance="solar:9100",name="offsite-mirror.service",state="failed"}'
        values: "1x10"
      - series: 'node_systemd_unit_state{job="node",instance="solar:9100",name="r2-mirror.service",state="failed"}'
        values: "1x10"
      - series: 'node_systemd_unit_state{job="node",instance="solar:9100",name="podman-backup.service",state="failed"}'
        values: "1x10"
      - series: 'node_systemd_unit_state{job="node",instance="solar:9100",name="home-backup.service",state="failed"}'
        values: "1x10"
      - series: 'node_systemd_unit_state{job="node",instance="solar:9100",name="autoupdate.service",state="failed"}'
        values: "1x10"
      - series: 'node_systemd_unit_state{job="node",instance="solar:9100",name="wordpress-cron.service",state="failed"}'
        values: "1x10"
      - series: 'node_systemd_unit_state{job="node",instance="solar:9100",name="wordpress-db-dump.service",state="failed"}'
        values: "1x10"
      - series: 'node_systemd_unit_state{job="node",instance="solar:9100",name="wordpress-update-check.service",state="failed"}'
        values: "1x10"
      - series: 'node_systemd_unit_state{job="node",instance="solar:9100",name="wordpress-boost.service",state="failed"}'
        values: "1x10"
      - series: 'node_systemd_unit_state{job="node",instance="solar:9100",name="caddy.service",state="failed"}'
        values: "1x10"
    alert_rule_test:
      - eval_time: 20m
        alertname: SystemdUnitFailed
        exp_alerts:
          - exp_labels:
              severity: warning
              job: node
              instance: solar:9100
              name: caddy.service
              state: failed
            exp_annotations:
              summary: "caddy.service has failed on solar:9100"
              description: "The systemd unit caddy.service on solar:9100 is in the failed state and has not recovered."
      # Inside for:, which rides out a unit that fails and is restarted by its own
      # Restart= policy.
      - eval_time: 10m
        alertname: SystemdUnitFailed
        exp_alerts: []

  # Discord is the only receiver that carries alerts, and the Watchdog cannot see it
  # fail: the deadman routes to its own receiver, so delivery to Discord can break
  # while the heartbeat stays green — which is why this rule's firing also inhibits
  # the Watchdog (alertmanager role), making the heartbeat stop and the deadman
  # report it. The integration selector keeps this rule on that receiver rather than
  # on the deadman's webhook, whose failure the deadman already reports by going
  # silent — the third series pins that. An outage alternating its failure
  # reason every flush: each reason series alone reads at most exactly 1.5 —
  # under the strict > — so only the sum without (reason) fires, which is what
  # this pins. Active from 10m (pending there), firing from 15m, resolved by
  # 45m once the last increment ages out of the left-open window.
  - interval: 5m
    name: sustained mixed-reason discord failures alert and a healed outage resolves
    input_series:
      - series: 'alertmanager_notifications_failed_total{job="alertmanager",instance="auspex:9093",integration="discord",reason="serverError"}'
        values: "0 1 1 2 2 3x6"
      - series: 'alertmanager_notifications_failed_total{job="alertmanager",instance="auspex:9093",integration="discord",reason="other"}'
        values: "0 0 1 1 2 2 3x5"
      - series: 'alertmanager_notifications_failed_total{job="alertmanager",instance="auspex:9093",integration="webhook",reason="clientError"}'
        values: "0+1x10"
    alert_rule_test:
      - eval_time: 15m
        alertname: AlertmanagerNotificationsFailing
        exp_alerts:
          - exp_labels:
              severity: warning
              job: alertmanager
              instance: auspex:9093
              integration: discord
            exp_annotations:
              summary: "alertmanager cannot deliver notifications to discord"
              description: "Alertmanager on auspex:9093 failed to deliver to Discord — alerts may not be reaching the operator."
      # Active but inside the 5m for:, which pins that the wait is there — what
      # makes the alert latency rather than suppression.
      - eval_time: 10m
        alertname: AlertmanagerNotificationsFailing
        exp_alerts: []
      - eval_time: 45m
        alertname: AlertmanagerNotificationsFailing
        exp_alerts: []

  # One failed flush reads ~1: under > 1.5, never fires.
  - interval: 1m
    name: a single healed delivery failure never alerts
    input_series:
      - series: 'alertmanager_notifications_failed_total{job="alertmanager",instance="auspex:9093",integration="discord",reason="clientError"}'
        values: "0 1x10"
    alert_rule_test:
      - eval_time: 10m
        alertname: AlertmanagerNotificationsFailing
        exp_alerts: []

  # A counter that has stopped rising is a delivery failure already healed: no nflog
  # entry is written for a failed send, so the group is re-attempted at the next
  # group_interval. Keyed on the raw total rather than the increase, this rule would
  # never stop firing after the fleet's first transient blip.
  - interval: 1m
    name: a delivery failure that has stopped recurring does not alert
    input_series:
      - series: 'alertmanager_notifications_failed_total{job="alertmanager",instance="auspex:9093",integration="discord",reason="clientError"}'
        values: "12x40"
    alert_rule_test:
      - eval_time: 30m
        alertname: AlertmanagerNotificationsFailing
        exp_alerts: []

  # The two ways an unattended Prometheus deploy fails, written to be complementary
  # rather than overlapping: config or rules that do not parse are rejected at reload,
  # while rules that parse but error at evaluation reload clean and simply stop
  # producing series. Each case asserts the other rule stays silent — a rule that
  # fired on both faults would say the wrong thing about half of them, and both are
  # silent by nature, so nothing else would correct it.
  - interval: 1m
    name: rules that fail to evaluate alert without implicating the config reload
    input_series:
      - series: 'prometheus_rule_evaluation_failures_total{job="prometheus",instance="auspex:9090",rule_group="drift"}'
        values: "0+1x40"
      - series: 'prometheus_config_last_reload_successful{job="prometheus",instance="auspex:9090"}'
        values: "1x40"
    alert_rule_test:
      - eval_time: 25m
        alertname: PrometheusRuleEvaluationFailing
        exp_alerts:
          - exp_labels:
              severity: warning
              job: prometheus
              instance: auspex:9090
              rule_group: drift
            exp_annotations:
              summary: "prometheus rule group drift is failing to evaluate on auspex:9090"
              description: >-
                Prometheus on auspex:9090 has failed to evaluate rules in group drift
                over the last 10 minutes — those rules have silently stopped producing series.
      - eval_time: 25m
        alertname: PrometheusConfigReloadFailed
        exp_alerts: []
      - eval_time: 10m
        alertname: PrometheusRuleEvaluationFailing
        exp_alerts: []

  - interval: 1m
    name: a rejected config reload alerts without implicating rule evaluation
    input_series:
      - series: 'prometheus_config_last_reload_successful{job="prometheus",instance="auspex:9090"}'
        values: "0x40"
      # Flat, not absent: rules that were already failing before the reload was
      # rejected must not make this case pass by accident.
      - series: 'prometheus_rule_evaluation_failures_total{job="prometheus",instance="auspex:9090",rule_group="drift"}'
        values: "7x40"
    alert_rule_test:
      - eval_time: 20m
        alertname: PrometheusConfigReloadFailed
        exp_alerts:
          - exp_labels:
              severity: warning
              job: prometheus
              instance: auspex:9090
            exp_annotations:
              summary: "prometheus config reload failed on auspex:9090"
              description: >-
                Prometheus on auspex:9090 rejected its last config reload and is running
                the previous config — an arbites-applied change has not taken effect.
      - eval_time: 20m
        alertname: PrometheusRuleEvaluationFailing
        exp_alerts: []
      - eval_time: 10m
        alertname: PrometheusConfigReloadFailed
        exp_alerts: []

  # A rejected album is already definitive when the metric shows it: the pipeline only
  # counts one after exhausting its ~1h poke cap, so 15m here is the *Failed cadence
  # rather than a grace period on top of a retry.
  - interval: 5m
    name: albums lidarr refused alert
    input_series:
      - series: 'beets_pipeline_lidarr_rejected_albums{job="node",instance="solar:9100"}'
        values: "2x20"
    alert_rule_test:
      - eval_time: 20m
        alertname: BeetsPipelineLidarrRejected
        exp_alerts:
          - exp_labels:
              severity: warning
              job: node
              instance: solar:9100
            exp_annotations:
              summary: "beets pipeline imports rejected by lidarr on solar:9100"
              description: "Albums on solar:9100 matched but lidarr refused them; they sit in quarantine/lidarr-rejected and need a look."
      - eval_time: 10m
        alertname: BeetsPipelineLidarrRejected
        exp_alerts: []

  # Unmatched albums are normal — new releases and patchy AcoustID both land in
  # quarantine — so the threshold is the working pile the operator clears by hand, not
  # zero. Ten is tolerated and eleven is a backlog; written `> 0` this rule would page
  # about the ordinary state of the pipeline.
  - interval: 5m
    name: a quarantine pile at the threshold does not alert
    input_series:
      - series: 'beets_pipeline_quarantine_albums{job="node",instance="solar:9100"}'
        values: "10x90"
    alert_rule_test:
      - eval_time: 7h
        alertname: BeetsPipelineQuarantineBacklog
        exp_alerts: []

  - interval: 5m
    name: a quarantine backlog past the threshold alerts
    input_series:
      - series: 'beets_pipeline_quarantine_albums{job="node",instance="solar:9100"}'
        values: "11x90"
    alert_rule_test:
      - eval_time: 6h5m
        alertname: BeetsPipelineQuarantineBacklog
        exp_alerts:
          - exp_labels:
              severity: warning
              job: node
              instance: solar:9100
            exp_annotations:
              summary: "beets pipeline quarantine backlog on solar:9100"
              description: "Unmatched albums on solar:9100 have been awaiting hand-processing for over 6 hours."
      - eval_time: 5h55m
        alertname: BeetsPipelineQuarantineBacklog
        exp_alerts: []

  # The -1 arm, which the rule's comment explains: it is upstream's sentinel for
  # "no poll has ever succeeded", and the one value a bare > threshold can never
  # reach, so it needs a case of its own.
  - interval: 1m
    name: a poller that never reaches the controller alerts while its scrape stays green
    input_series:
      - series: 'unpoller_prometheus_cache_age_seconds{job="unpoller",instance="127.0.0.1:9130"}'
        values: "-1x20"
    alert_rule_test:
      - eval_time: 10m
        alertname: UnpollerPollOverdue
        exp_alerts:
          - exp_labels:
              severity: warning
              job: unpoller
              instance: 127.0.0.1:9130
            exp_annotations:
              summary: "unpoller has not polled the UniFi controller in over 30 minutes"
              description: "unpoller is serving a stale snapshot, so the unpoller_* series are frozen at their last values rather than absent."
      # Inside for:, so pending rather than firing — the sentinel matches from the
      # first sample, and without this the case above would pass a rule with no
      # for: at all.
      - eval_time: 0m
        alertname: UnpollerPollOverdue
        exp_alerts: []

  # The other arm: a poller that polled successfully once and then stopped, so the
  # age climbs rather than sitting at the sentinel. Starts under the threshold and
  # crosses it, which is also this rule's fresh-snapshot control — at 0m the age is
  # a healthy 1700s and the rule must be silent, so a dropped or inverted threshold
  # fails here.
  - interval: 1m
    name: a snapshot that goes stale alerts, and a fresh one does not
    input_series:
      - series: 'unpoller_prometheus_cache_age_seconds{job="unpoller",instance="127.0.0.1:9130"}'
        values: "1700+60x40"
    alert_rule_test:
      - eval_time: 0m
        alertname: UnpollerPollOverdue
        exp_alerts: []
      - eval_time: 15m
        alertname: UnpollerPollOverdue
        exp_alerts:
          - exp_labels:
              severity: warning
              job: unpoller
              instance: 127.0.0.1:9130
            exp_annotations:
              summary: "unpoller has not polled the UniFi controller in over 30 minutes"
              description: "unpoller is serving a stale snapshot, so the unpoller_* series are frozen at their last values rather than absent."

  # The controller's own count of adopted devices that have stopped talking to
  # it, one gauge per subsystem. Two properties in one case.
  #
  # First, the rule discriminates: written as a bare `unpoller_site_disconnected`
  # with no comparison it would fire on the healthy wlan series too, which is what
  # that series is here to catch.
  #
  # Second, and the reason for `without (status)`: a second switch failing moves
  # UniFi's health string from warning to error, which is a DIFFERENT series. The
  # lan input below does exactly that at 41m. Aggregated, the count is continuous
  # from 21m and the alert is firing by 50m; keyed on status it would see a series
  # that only began at 41m, still be inside its for:, and report nothing — so this
  # case fails if the aggregation is dropped.
  - interval: 1m
    name: a disconnected UniFi device alerts on its own subsystem across a status change
    input_series:
      - series: 'unpoller_site_disconnected{subsystem="lan",status="warning",site_name="Default",source="unifi"}'
        values: "0x20 1x20 _x40"
      - series: 'unpoller_site_disconnected{subsystem="lan",status="error",site_name="Default",source="unifi"}'
        values: "_x40 2x39"
      - series: 'unpoller_site_disconnected{subsystem="wlan",status="ok",site_name="Default",source="unifi"}'
        values: "0x80"
    alert_rule_test:
      - eval_time: 50m
        alertname: UnifiDeviceDisconnected
        exp_alerts:
          - exp_labels:
              severity: warning
              subsystem: lan
              site_name: Default
              source: unifi
            exp_annotations:
              summary: "2 UniFi lan device(s) disconnected"
              description: "The controller reports 2 adopted lan device(s) not talking to it — powered off, or the uplink is dead."
      # Inside for:, so the count is already non-zero and only the wait keeps it
      # quiet — without this the case above would equally pass a rule with no for:,
      # which would then alert on a device rebooting between two scrapes.
      - eval_time: 25m
        alertname: UnifiDeviceDisconnected
        exp_alerts: []

  # Three uptime resets in a day against one, which is what separates a device
  # power-cycling from a device taking a firmware update. The single-reboot series
  # is the whole point of the threshold: written as `> 0` this rule would fire on
  # every scheduled UniFi update the fleet takes.
  - interval: 5m
    name: a device power-cycling alerts while one clean reboot does not
    input_series:
      - series: 'unpoller_device_uptime_seconds{type="uap",site_name="Default",name="Upstairs AP",source="unifi"}'
        values: "3000+300x10 300+300x10 300+300x10 300+300x10"
      - series: 'unpoller_device_uptime_seconds{type="usw",site_name="Default",name="Core",source="unifi"}'
        values: "500000+300x20 300+300x22"
    alert_rule_test:
      # The third reset lands at 165m, and the rule carries no for:, so this is the
      # first evaluation that can fire — asserting it here pins the absence of a
      # wait, which a later edit could otherwise reintroduce unnoticed.
      - eval_time: 165m
        alertname: UnifiDeviceRebootLoop
        exp_alerts:
          - exp_labels:
              severity: warning
              type: uap
              site_name: Default
              name: Upstairs AP
              source: unifi
            exp_annotations:
              summary: "UniFi device Upstairs AP has rebooted 3 times in 24 hours"
              description: "Upstairs AP (uap) is power-cycling rather than running — check its injector, its cable and its supply."
      # One evaluation earlier only two resets are in the window, so this pins the
      # threshold at >2 rather than >1 — the line between a fault and a device that
      # took a firmware update and then lost power once.
      - eval_time: 160m
        alertname: UnifiDeviceRebootLoop
        exp_alerts: []

  # The operator's two calibration points, encoded so neither can drift: a radio
  # that sustains congestion must alert, and a radio that briefly spikes ABOVE the
  # incident level must not. The second is what the mean buys over a for: — one
  # large transfer takes a channel to 0.8 for five minutes, and that is not a
  # fault. The third series is the busiest radio's real idle reading, so a
  # threshold dropped anywhere near normal fails here.
  - interval: 1m
    name: a congested radio alerts while a brief spike and a normal one do not
    input_series:
      - series: 'unpoller_device_radio_channel_utilization_total_ratio{name="Upstairs AP",band="2.4",radio="ng",radio_name="wifi0"}'
        values: "0.6x20 0.3x0 0.6x39"
      # The incident this rule was written for, at the level and duration the
      # calibration comment cites: ten minutes at 0.70 over a 0.17 background. Its
      # 15m mean is 0.5233 and it fires; at 30m the same event averages under 0.4
      # and does not. This series is the only thing pinning the window's UPPER
      # bound — without it the range can be widened back to 30m, silently losing
      # the very event that motivated the rule, while the description still reads
      # "over 15 minutes".
      - series: 'unpoller_device_radio_channel_utilization_total_ratio{name="Downstairs AP",band="2.4",radio="ng",radio_name="wifi0"}'
        values: "0.17x15 0.7x9 0.17x34"
      - series: 'unpoller_device_radio_channel_utilization_total_ratio{name="Downstairs AP",band="5",radio="na",radio_name="wifi1"}'
        values: "0.15x20 0.8x4 0.15x34"
      - series: 'unpoller_device_radio_channel_utilization_total_ratio{name="Upstairs AP",band="5",radio="na",radio_name="wifi1"}'
        values: "0.17x60"
    alert_rule_test:
      # 25m is the one evaluation that carries every property at once, and it is on
      # the file's 5m grid — an off-grid time would be floored silently. Here the
      # spiking radio reads 0.8 instantaneously, ABOVE the incident level, while its
      # 15m mean is at its own peak of 0.37 — the spike ends here deliberately, so
      # the window holds all five of its samples rather than one. The congested
      # radio also dips to 0.3 for one sample inside the window, which min_over_time
      # would swallow: that dip is what makes the MEAN load-bearing rather than any
      # aggregation over the range. Written against the
      # instantaneous gauge instead of the mean, this rule pages every time someone
      # starts a large download, and this evaluation is what says so.
      - eval_time: 25m
        alertname: UnifiRadioAirtimeHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              name: Downstairs AP
              band: "2.4"
              radio: ng
              radio_name: wifi0
            exp_annotations:
              summary: "Downstairs AP 2.4 GHz airtime at 52.33%"
              description: >-
                The 2.4 GHz radio on Downstairs AP has averaged 52.33% airtime over 15
                minutes — every client on that channel is slow. Compare its receive
                and transmit ratios against total: close to it is our own saturation,
                far below is a neighbouring network, and the remedy differs.
          - exp_labels:
              severity: warning
              name: Upstairs AP
              band: "2.4"
              radio: ng
              radio_name: wifi0
            exp_annotations:
              summary: "Upstairs AP 2.4 GHz airtime at 58%"
              description: >-
                The 2.4 GHz radio on Upstairs AP has averaged 58% airtime over 15
                minutes — every client on that channel is slow. Compare its receive
                and transmit ratios against total: close to it is our own saturation,
                far below is a neighbouring network, and the remedy differs.

  # Each direction is faulted on its own port, so dropping either term of the sum
  # leaves that port silent and fails here. The third port is the control that
  # matters: a one-off burst of 10 errors is a duplex renegotiation, not a bad
  # cable, and a threshold set anywhere near zero would page for it. Its jump sits
  # INSIDE the evaluated window on purpose — at the edge the rate computes to a
  # flat zero and the case stops discriminating a low threshold at all.
  - interval: 1m
    name: an erroring switch port alerts in either direction while a one-off burst does not
    input_series:
      - series: 'unpoller_device_port_receive_errors_total{port_id="Study Switch Port 4",port_num="4"}'
        values: "0+12x60"
      - series: 'unpoller_device_port_transmit_errors_total{port_id="Study Switch Port 4",port_num="4"}'
        values: "0x60"
      - series: 'unpoller_device_port_receive_errors_total{port_id="Lounge Switch Port 4",port_num="4"}'
        values: "0x60"
      - series: 'unpoller_device_port_transmit_errors_total{port_id="Lounge Switch Port 4",port_num="4"}'
        values: "0+12x60"
      - series: 'unpoller_device_port_receive_errors_total{port_id="Cupboard Switch Port 4",port_num="4"}'
        values: "0x18 10x42"
      - series: 'unpoller_device_port_transmit_errors_total{port_id="Cupboard Switch Port 4",port_num="4"}'
        values: "0x60"
    alert_rule_test:
      - eval_time: 25m
        alertname: UnifiPortErrorsHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              port_id: Lounge Switch Port 4
              port_num: "4"
            exp_annotations:
              summary: "Lounge Switch Port 4 is logging 0.20 errors/s"
              description: >-
                Lounge Switch Port 4 has logged 0.20 receive and transmit errors a second for 15
                minutes, where every port on this fleet normally sits at zero. That is
                a physical fault, not congestion: reseat or replace the cable, and
                check the link has not negotiated down.
          - exp_labels:
              severity: warning
              port_id: Study Switch Port 4
              port_num: "4"
            exp_annotations:
              summary: "Study Switch Port 4 is logging 0.20 errors/s"
              description: >-
                Study Switch Port 4 has logged 0.20 receive and transmit errors a second for 15
                minutes, where every port on this fleet normally sits at zero. That is
                a physical fault, not congestion: reseat or replace the cable, and
                check the link has not negotiated down.

  # The deadman's beat, whose entire value is that it never stops. Two properties hold
  # it, and the single evaluation at zero pins both: it fires on the very first one,
  # where a for: of any length would open a window in which the pipeline looks dead to
  # the receiver, and it carries severity none, which is what routes it away from the
  # operator. The input series is unrelated on purpose — the rule reads nothing, so an
  # expression rewritten to depend on any real metric loses its alert here.
  - interval: 1m
    name: the watchdog heartbeat fires from the first evaluation
    input_series:
      - series: 'up{job="node",instance="solar:9100"}'
        values: "1x10"
    alert_rule_test:
      - eval_time: 0m
        alertname: Watchdog
        exp_alerts:
          - exp_labels:
              severity: none
            exp_annotations:
              summary: "alerting pipeline heartbeat"
              description: "Always firing; the periodic Discord leg exercises the webhook, and a stopped deadman beat means the pipeline is broken."
