---
- name: Converge
  hosts: all
  vars_files:
    - fixtures.yml
  tasks:
    - name: Apply the podman role
      ansible.builtin.include_role:
        name: podman

    - name: Apply the caddy role
      ansible.builtin.include_role:
        name: caddy

    - name: Apply the arr role
      ansible.builtin.include_role:
        name: arr
