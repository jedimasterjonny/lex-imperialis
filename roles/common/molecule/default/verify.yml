---
- name: Verify
  hosts: all
  gather_facts: false
  vars:
    # Mirror converge: the molecule instance name is the container's hostname.
    common_hostname: "{{ inventory_hostname }}"
    # The aliases from common_disabled_repos this image actually carries — a
    # test-only fixture, so the role has no var for it.
    common_present_repos:
      - repo-non-oss
      - repo-openh264
    # What each distribution should end up with. Spelled out from the platform's
    # group rather than read from the role's fact-derived defaults: this play
    # gathers no facts, and an assertion that recomputes the expression it is
    # checking asserts nothing.
    common_expected_chrony_dir: "{{ '/etc/chrony/conf.d' if 'debian' in group_names else '/etc/chrony.d' }}"
    common_expected_pool: "{{ 'debian.pool.ntp.org' if 'debian' in group_names else 'opensuse.pool.ntp.org' }}"
    common_expected_bash_package: "{{ 'bash-ubuntu' if 'debian' in group_names else 'bash-suse' }}"
  vars_files:
    - ../../defaults/main.yml
    - ../../vars/main.yml
    - fixtures.yml
  tasks:
    - name: Look up the owner account
      ansible.builtin.getent:
        database: passwd
        key: "{{ common_user_name }}"

    - name: Read the group database
      ansible.builtin.getent:
        database: group

    - name: Owner account mirrors the configured identity
      ansible.builtin.assert:
        that:
          - ansible_facts['getent_passwd'][common_user_name][1] | int == common_user_uid
          - ansible_facts['getent_passwd'][common_user_name][2] == ansible_facts['getent_group'][common_user_group][1]
          - ansible_facts['getent_passwd'][common_user_name][4] == common_user_home
          - ansible_facts['getent_passwd'][common_user_name][5] == common_user_shell
        fail_msg: "owner account does not match the configured uid/group/home/shell"

    - name: Owner belongs to the configured supplementary groups
      ansible.builtin.assert:
        that:
          - common_user_name in ansible_facts['getent_group'][item][2].split(',')
        fail_msg: "owner is not a member of the {{ item }} group"
        quiet: true
      loop: "{{ common_user_groups }}"

    - name: Stat the wheel sudoers drop-in
      ansible.builtin.stat:
        path: /etc/sudoers.d/wheel
      register: common_sudoers_wheel

    - name: Wheel sudoers drop-in is installed and sudo-readable
      ansible.builtin.assert:
        that:
          - common_sudoers_wheel.stat.exists
          - common_sudoers_wheel.stat.mode == '0440'
          - common_sudoers_wheel.stat.pw_name == 'root'
          - common_sudoers_wheel.stat.gr_name == 'root'
        fail_msg: "/etc/sudoers.d/wheel is missing or not owned root:root mode 0440"

    # The stat proves the file exists and is sudo-readable; slurp it to prove the
    # policy itself — wheel gets full sudo and authenticates with its own password
    # (targetpw off), the two lines that make the drop-in load-bearing.
    - name: Stat the ansible account's sudoers drop-in
      ansible.builtin.stat:
        path: "/etc/sudoers.d/{{ common_ansible_user }}"
      register: common_sudoers_ansible

    - name: The ansible sudoers drop-in is installed and sudo-readable
      ansible.builtin.assert:
        that:
          - common_sudoers_ansible.stat.exists
          - common_sudoers_ansible.stat.mode == '0440'
          - common_sudoers_ansible.stat.pw_name == 'root'
          - common_sudoers_ansible.stat.gr_name == 'root'
        fail_msg: "/etc/sudoers.d/{{ common_ansible_user }} is missing or not root:root 0440"

    - name: The unmanaged cloud-init copy of the grant is gone
      ansible.builtin.stat:
        path: /etc/sudoers.d/90-cloud-init-users
      register: common_sudoers_cloudinit

    - name: Only the managed drop-in grants the account passwordless sudo
      ansible.builtin.assert:
        that:
          - not common_sudoers_cloudinit.stat.exists
        fail_msg: "90-cloud-init-users still grants NOPASSWD alongside the managed file"

    # What the policy resolves to, not merely what was written: sudo -l -U parses
    # the whole sudoers tree for that account, so it catches a drop-in that lands
    # correctly but is overridden, unparsed, or naming an account that does not
    # exist — none of which a file read would show.
    - name: Ask sudo what the ansible account may actually do
      ansible.builtin.command: "sudo -n -l -U {{ common_ansible_user }}"
      register: common_sudo_effective
      changed_when: false
      become: true

    - name: The account resolves to passwordless root
      ansible.builtin.assert:
        that:
          - "'(ALL : ALL) NOPASSWD: ALL' in common_sudo_effective.stdout"
        fail_msg: "sudo does not grant {{ common_ansible_user }} NOPASSWD root: {{ common_sudo_effective.stdout }}"

    - name: Read the wheel sudoers drop-in
      ansible.builtin.slurp:
        src: /etc/sudoers.d/wheel
      register: common_sudoers_wheel_content
      become: true

    - name: Wheel sudoers grants own-password sudo
      ansible.builtin.assert:
        that:
          - "'%wheel ALL=(ALL:ALL) ALL' in (common_sudoers_wheel_content.content | b64decode)"
          - "'Defaults:%wheel !targetpw' in (common_sudoers_wheel_content.content | b64decode)"
        fail_msg: "the wheel sudoers drop-in does not grant own-password sudo"
        quiet: true

    - name: Stat the modprobe blacklist drop-in
      ansible.builtin.stat:
        path: /etc/modprobe.d/common-blacklist.conf
      register: common_blacklist

    - name: Modprobe blacklist drop-in is installed and root-owned
      ansible.builtin.assert:
        that:
          - common_blacklist.stat.exists
          - common_blacklist.stat.mode == '0644'
          - common_blacklist.stat.pw_name == 'root'
          - common_blacklist.stat.gr_name == 'root'
        fail_msg: "/etc/modprobe.d/common-blacklist.conf is missing or not owned root:root mode 0644"

    - name: Read the modprobe blacklist drop-in
      ansible.builtin.slurp:
        src: /etc/modprobe.d/common-blacklist.conf
      register: common_blacklist_content

    # The fixture module is spelled out rather than read from the role's
    # defaults: vars_files outranks vars, so the empty default would win here.
    - name: Modprobe drop-in bars the fixture module from loading
      ansible.builtin.assert:
        that:
          - "'blacklist lex_absent_module' in (common_blacklist_content.content | b64decode)"
          - "'install lex_absent_module /bin/false' in (common_blacklist_content.content | b64decode)"
        fail_msg: "the modprobe drop-in does not bar lex_absent_module from loading"
        quiet: true

    # Debian has no zypper and common_disabled_repos is empty there, so the whole
    # repository half of the role is a no-op — one block rather than a conditional
    # on each of the eight tasks below.
    - name: Verify the zypper repository handling
      when: "'debian' not in group_names"
      block:
        # The cloud image carries the stock repo-* aliases, so the container
        # exercises repo-non-oss and leaves download.opensuse.org-non-oss
        # unmatched — both branches at once.
        - name: Read the non-OSS repository definitions
          ansible.builtin.slurp:
            src: "/etc/zypp/repos.d/{{ item }}.repo"
          loop: "{{ common_present_repos }}"
          register: common_nonoss_repo_defs
          become: true

        # The slurp itself is the not-removed half: it fails outright on a
        # missing file.
        - name: The non-OSS repositories are disabled on disk, not removed
          ansible.builtin.assert:
            that:
              - "'enabled=0' in (item.content | b64decode)"
              - "'enabled=1' not in (item.content | b64decode)"
            fail_msg: "{{ item.item }} is not disabled"
            quiet: true
          loop: "{{ common_nonoss_repo_defs.results }}"
          loop_control:
            label: "{{ item.item }}"

        - name: Query zypper for the non-OSS repositories
          ansible.builtin.command:
            argv:
              - zypper
              - --non-interactive
              - --no-refresh
              - search
              - --installed-only
              - --repo
              - "{{ item }}"
          loop: "{{ common_present_repos }}"
          register: common_nonoss_repo_query
          changed_when: false
          failed_when: false
          become: true

        # rc 3 covers "disabled" and "unknown" alike; the slurp above already
        # proved the definition is still on disk, so here it can only mean
        # disabled.
        - name: Zypper treats the non-OSS repositories as disabled
          ansible.builtin.assert:
            that:
              - item.rc == 3
            fail_msg: "zypper does not treat {{ item.item }} as disabled"
            quiet: true
          loop: "{{ common_nonoss_repo_query.results }}"
          loop_control:
            label: "{{ item.item }}"

        - name: Stat the NON-OSS alias this image does not carry
          ansible.builtin.stat:
            path: /etc/zypp/repos.d/download.opensuse.org-non-oss.repo
          register: common_absent_repo

        - name: An unmatched alias is skipped rather than created
          ansible.builtin.assert:
            that:
              - not common_absent_repo.stat.exists
            fail_msg: "the role created a repository definition the host does not carry"

        - name: Read the OSS repository definition
          ansible.builtin.slurp:
            src: /etc/zypp/repos.d/repo-oss.repo
          register: common_oss_repo_def
          become: true

        # The role must touch only the aliases it names; nothing else proves it
        # left a repository outside that list alone.
        - name: A repository outside the list is left enabled
          ansible.builtin.assert:
            that:
              - "'enabled=1' in (common_oss_repo_def.content | b64decode)"
            fail_msg: "the role disabled repo-oss, which is not in its scope"

    # The Debian half of the same property: the role must not have brought a
    # package manager's repository state with it. /etc/zypp is the whole of
    # zypper's configuration, so its absence is the assertion.
    - name: Stat zypper's configuration directory
      ansible.builtin.stat:
        path: /etc/zypp
      register: common_zypp_dir
      when: "'debian' in group_names"

    - name: No zypper state is created on a Debian host
      ansible.builtin.assert:
        that:
          - not common_zypp_dir.stat.exists
        fail_msg: "the role created zypper configuration on a host that has no zypper"
      when: "'debian' in group_names"

    - name: Stat sdbootutil's TPM prediction directory
      ansible.builtin.stat:
        path: /var/lib/pcrlock.d
      register: common_pcrlock_dir

    - name: TPM prediction directory exists and is root-owned
      ansible.builtin.assert:
        that:
          - common_pcrlock_dir.stat.exists
          - common_pcrlock_dir.stat.isdir
          - common_pcrlock_dir.stat.mode == '0755'
          - common_pcrlock_dir.stat.pw_name == 'root'
          - common_pcrlock_dir.stat.gr_name == 'root'
        fail_msg: "/var/lib/pcrlock.d is missing or not owned root:root mode 0755"

    # python3-selinux is a Provides of a versioned python3XX-selinux, which is the
    # name package_facts records — so resolve through rpm instead. One call takes
    # the whole list; its non-zero exit is the assertion.
    - name: Every base package resolves to an installed provider
      ansible.builtin.command:
        argv: "{{ ['rpm', '--query', '--whatprovides'] + common_packages }}"
      changed_when: false
      when: "'debian' not in group_names"

    # No Provides indirection on Debian, so the names are the names — but
    # dpkg-query -W succeeds for a package that is removed and not purged, so ask
    # for the status too rather than lean on the exit code alone.
    - name: Query dpkg for the base packages
      ansible.builtin.command:
        argv: "{{ ['dpkg-query', '--show', '--showformat=${Package} ${Status}\n'] + common_packages }}"
      register: common_dpkg_query
      changed_when: false
      when: "'debian' in group_names"

    - name: Every base package is installed
      ansible.builtin.assert:
        that:
          - item.split(' ', 1)[1] == 'install ok installed'
        fail_msg: "{{ item.split(' ', 1)[0] }} is not installed"
        quiet: true
      loop: "{{ common_dpkg_query.stdout_lines | default([]) }}"
      when: "'debian' in group_names"

    - name: Stat the NTP drop-in
      ansible.builtin.stat:
        path: "{{ common_expected_chrony_dir }}/common-ntp.conf"
      register: common_ntp_dropin

    - name: NTP drop-in is installed and root-owned
      ansible.builtin.assert:
        that:
          - common_ntp_dropin.stat.exists
          - common_ntp_dropin.stat.mode == '0644'
          - common_ntp_dropin.stat.pw_name == 'root'
          - common_ntp_dropin.stat.gr_name == 'root'
        fail_msg: "{{ common_expected_chrony_dir }}/common-ntp.conf is missing or not owned root:root mode 0644"

    # chronyd defaults to /etc/chrony.conf; the newer openSUSE package ships the
    # vendor copy under /usr/etc instead, as that image already does, and Debian
    # puts the whole tree under /etc/chrony. Follow whichever exists rather than
    # pin the layout of the day.
    - name: Stat chrony's own configuration
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /etc/chrony.conf
        - /etc/chrony/chrony.conf
        - /usr/etc/chrony.conf
      register: common_chrony_conf

    # -p expands the whole config chain and exits, so it proves chrony reads the
    # drop-in and parses it — which the file's own content cannot.
    - name: Expand chrony's configuration
      ansible.builtin.command:
        argv:
          - /usr/sbin/chronyd
          - -p
          - -f
          - "{{ (common_chrony_conf.results | selectattr('stat.exists') | first).stat.path }}"
      register: common_chrony_config
      changed_when: false
      become: true

    # Both fixture sources are spelled out rather than looped from the role's
    # defaults: vars_files outranks vars, so a converge override would be
    # invisible here and the second entry would go unasserted.
    - name: Chrony carries every configured NTP source
      ansible.builtin.assert:
        that:
          - "'pool time.cloudflare.com iburst' in common_chrony_config.stdout"
          - "'pool lex-absent-ntp.invalid iburst' in common_chrony_config.stdout"
        fail_msg: "chrony does not carry both configured sources"

    - name: The distro's own source survives alongside
      ansible.builtin.assert:
        that:
          - common_expected_pool in common_chrony_config.stdout
        fail_msg: "the drop-in displaced the packaged {{ common_expected_pool }} source"

    - name: Stat the stowed bashrc
      ansible.builtin.stat:
        path: "{{ common_user_home }}/.bashrc"
      register: common_bashrc

    # The link's target, not merely that it is a link. The dots repo ships a
    # bash package per distribution and each shadows the skel .bashrc it
    # replaces, so stowing the wrong one converges green while the host loses its
    # own shell setup — bash-completion, lesspipe and debian_chroot, on Debian.
    - name: Owner bashrc is a stow symlink into this distribution's package
      ansible.builtin.assert:
        that:
          - common_bashrc.stat.exists
          - common_bashrc.stat.islnk
          - "'/' ~ common_expected_bash_package ~ '/' in common_bashrc.stat.lnk_target"
        fail_msg: "the owner's .bashrc is not stowed from {{ common_expected_bash_package }}"

    - name: Read the system hostname
      ansible.builtin.command: hostname
      register: common_hostname_cmd
      changed_when: false

    - name: System hostname matches the configured name
      ansible.builtin.assert:
        that:
          - common_hostname_cmd.stdout == common_hostname
        fail_msg: "hostname is {{ common_hostname_cmd.stdout }}, expected {{ common_hostname }}"

    - name: Read the owner's authorized_keys
      ansible.builtin.slurp:
        src: "{{ common_user_home }}/.ssh/authorized_keys"
      register: common_owner_keys
      become: true

    - name: Read the ansible account's authorized_keys
      ansible.builtin.slurp:
        src: "/home/{{ common_ansible_user }}/.ssh/authorized_keys"
      register: common_ansible_keys
      become: true

    # The additive arm: an exclusive list would have taken the undeclared key
    # with it, so this is what proves a first deploy cannot revoke access. The
    # declared key was planted comment-less, so finding it with its comment also
    # proves the rewrite of a bootstrap-seeded key happened.
    - name: The owner's declared key is authorised and the undeclared one survives
      ansible.builtin.assert:
        that:
          - common_fixture_owner_key in (common_owner_keys.content | b64decode)
          - common_fixture_undeclared_key in (common_owner_keys.content | b64decode)
        fail_msg: "owner keys are {{ common_owner_keys.content | b64decode }}"

    # The authoritative arm, and the one the fleet rollout depends on. Equality
    # rather than a membership test plus a line count: it also catches the file
    # holding one key that is the wrong one.
    - name: The ansible account holds its declared key and nothing else
      ansible.builtin.assert:
        that:
          - (common_ansible_keys.content | b64decode | trim) == common_fixture_ansible_key
        fail_msg: "ansible keys are {{ common_ansible_keys.content | b64decode }}"

    # Ownership is load-bearing for the owner only: the fixture creates that
    # account at the wrong uid and the role's user task moves it, relying on
    # usermod to carry the home directory with it. Were that to stop, the file
    # would be left owned by a stale uid, sshd's StrictModes would refuse it, and
    # the assertions above would still pass on content alone. The ansible account
    # has no such task — the role manages its keys and not its identity — so that
    # row is true by construction and rides along for symmetry.
    #
    # Mode is asserted even though the role does not hold it (README): the first
    # converge writes both files, and a write is the one moment the mode is the
    # role's doing and a regression to group-readable is cheaply visible.
    - name: Stat both key files
      ansible.builtin.stat:
        path: "{{ item.home }}/.ssh/authorized_keys"
      register: common_key_file_stat
      loop:
        - home: "{{ common_user_home }}"
          owner: "{{ common_user_name }}"
        - home: "/home/{{ common_ansible_user }}"
          owner: "{{ common_ansible_user }}"
      loop_control:
        label: "{{ item.home }}"
      become: true

    - name: Each key file is owner-only and owned by its own account
      ansible.builtin.assert:
        that:
          - item.stat.pw_name == item.item.owner
          - item.stat.mode == '0600'
        fail_msg: "{{ item.item.home }} authorized_keys is {{ item.stat.mode }} owned by {{ item.stat.pw_name }}"
        quiet: true
      loop: "{{ common_key_file_stat.results }}"
      loop_control:
        label: "{{ item.item.home }}"
