---
- name: Verify
  hosts: all
  gather_facts: false
  vars:
    # Mirror converge: the molecule instance name is the container's hostname.
    common_hostname: "{{ inventory_hostname }}"
    # The aliases from common_disabled_repos this image actually carries — a
    # test-only fixture, so the role has no var for it.
    common_present_repos:
      - repo-non-oss
      - repo-openh264
  vars_files:
    - ../../defaults/main.yml
  tasks:
    - name: Look up the owner account
      ansible.builtin.getent:
        database: passwd
        key: "{{ common_user_name }}"

    - name: Read the group database
      ansible.builtin.getent:
        database: group

    - name: Owner account mirrors the configured identity
      ansible.builtin.assert:
        that:
          - ansible_facts['getent_passwd'][common_user_name][1] | int == common_user_uid
          - ansible_facts['getent_passwd'][common_user_name][2] == ansible_facts['getent_group'][common_user_group][1]
          - ansible_facts['getent_passwd'][common_user_name][4] == common_user_home
          - ansible_facts['getent_passwd'][common_user_name][5] == common_user_shell
        fail_msg: "owner account does not match the configured uid/group/home/shell"

    - name: Owner belongs to the configured supplementary groups
      ansible.builtin.assert:
        that:
          - common_user_name in ansible_facts['getent_group'][item][2].split(',')
        fail_msg: "owner is not a member of the {{ item }} group"
        quiet: true
      loop: "{{ common_user_groups }}"

    - name: Stat the wheel sudoers drop-in
      ansible.builtin.stat:
        path: /etc/sudoers.d/wheel
      register: common_sudoers_wheel

    - name: Wheel sudoers drop-in is installed and sudo-readable
      ansible.builtin.assert:
        that:
          - common_sudoers_wheel.stat.exists
          - common_sudoers_wheel.stat.mode == '0440'
          - common_sudoers_wheel.stat.pw_name == 'root'
          - common_sudoers_wheel.stat.gr_name == 'root'
        fail_msg: "/etc/sudoers.d/wheel is missing or not owned root:root mode 0440"

    # The stat proves the file exists and is sudo-readable; slurp it to prove the
    # policy itself — wheel gets full sudo and authenticates with its own password
    # (targetpw off), the two lines that make the drop-in load-bearing.
    - name: Read the wheel sudoers drop-in
      ansible.builtin.slurp:
        src: /etc/sudoers.d/wheel
      register: common_sudoers_wheel_content
      become: true

    - name: Wheel sudoers grants own-password sudo
      ansible.builtin.assert:
        that:
          - "'%wheel ALL=(ALL:ALL) ALL' in (common_sudoers_wheel_content.content | b64decode)"
          - "'Defaults:%wheel !targetpw' in (common_sudoers_wheel_content.content | b64decode)"
        fail_msg: "the wheel sudoers drop-in does not grant own-password sudo"
        quiet: true

    - name: Stat the modprobe blacklist drop-in
      ansible.builtin.stat:
        path: /etc/modprobe.d/common-blacklist.conf
      register: common_blacklist

    - name: Modprobe blacklist drop-in is installed and root-owned
      ansible.builtin.assert:
        that:
          - common_blacklist.stat.exists
          - common_blacklist.stat.mode == '0644'
          - common_blacklist.stat.pw_name == 'root'
          - common_blacklist.stat.gr_name == 'root'
        fail_msg: "/etc/modprobe.d/common-blacklist.conf is missing or not owned root:root mode 0644"

    - name: Read the modprobe blacklist drop-in
      ansible.builtin.slurp:
        src: /etc/modprobe.d/common-blacklist.conf
      register: common_blacklist_content

    # The fixture module is spelled out rather than read from the role's
    # defaults: vars_files outranks vars, so the empty default would win here.
    - name: Modprobe drop-in bars the fixture module from loading
      ansible.builtin.assert:
        that:
          - "'blacklist lex_absent_module' in (common_blacklist_content.content | b64decode)"
          - "'install lex_absent_module /bin/false' in (common_blacklist_content.content | b64decode)"
        fail_msg: "the modprobe drop-in does not bar lex_absent_module from loading"
        quiet: true

    # The cloud image carries the stock repo-* aliases, so the container exercises
    # repo-non-oss and leaves download.opensuse.org-non-oss unmatched — both
    # branches at once.
    - name: Read the non-OSS repository definitions
      ansible.builtin.slurp:
        src: "/etc/zypp/repos.d/{{ item }}.repo"
      loop: "{{ common_present_repos }}"
      register: common_nonoss_repo_defs
      become: true

    # The slurp itself is the not-removed half: it fails outright on a missing file.
    - name: The non-OSS repositories are disabled on disk, not removed
      ansible.builtin.assert:
        that:
          - "'enabled=0' in (item.content | b64decode)"
          - "'enabled=1' not in (item.content | b64decode)"
        fail_msg: "{{ item.item }} is not disabled"
        quiet: true
      loop: "{{ common_nonoss_repo_defs.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Query zypper for the non-OSS repositories
      ansible.builtin.command:
        argv:
          - zypper
          - --non-interactive
          - --no-refresh
          - search
          - --installed-only
          - --repo
          - "{{ item }}"
      loop: "{{ common_present_repos }}"
      register: common_nonoss_repo_query
      changed_when: false
      failed_when: false
      become: true

    # rc 3 covers "disabled" and "unknown" alike; the slurp above already proved
    # the definition is still on disk, so here it can only mean disabled.
    - name: Zypper treats the non-OSS repositories as disabled
      ansible.builtin.assert:
        that:
          - item.rc == 3
        fail_msg: "zypper does not treat {{ item.item }} as disabled"
        quiet: true
      loop: "{{ common_nonoss_repo_query.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Stat the NON-OSS alias this image does not carry
      ansible.builtin.stat:
        path: /etc/zypp/repos.d/download.opensuse.org-non-oss.repo
      register: common_absent_repo

    - name: An unmatched alias is skipped rather than created
      ansible.builtin.assert:
        that:
          - not common_absent_repo.stat.exists
        fail_msg: "the role created a repository definition the host does not carry"

    - name: Read the OSS repository definition
      ansible.builtin.slurp:
        src: /etc/zypp/repos.d/repo-oss.repo
      register: common_oss_repo_def
      become: true

    # The role must touch only the aliases it names; nothing else proves it left
    # a repository outside that list alone.
    - name: A repository outside the list is left enabled
      ansible.builtin.assert:
        that:
          - "'enabled=1' in (common_oss_repo_def.content | b64decode)"
        fail_msg: "the role disabled repo-oss, which is not in its scope"

    - name: Stat sdbootutil's TPM prediction directory
      ansible.builtin.stat:
        path: /var/lib/pcrlock.d
      register: common_pcrlock_dir

    - name: TPM prediction directory exists and is root-owned
      ansible.builtin.assert:
        that:
          - common_pcrlock_dir.stat.exists
          - common_pcrlock_dir.stat.isdir
          - common_pcrlock_dir.stat.mode == '0755'
          - common_pcrlock_dir.stat.pw_name == 'root'
          - common_pcrlock_dir.stat.gr_name == 'root'
        fail_msg: "/var/lib/pcrlock.d is missing or not owned root:root mode 0755"

    # python3-selinux is a Provides of a versioned python3XX-selinux, which is the
    # name package_facts records — so resolve through rpm instead. One call takes
    # the whole list; its non-zero exit is the assertion.
    - name: Every base package resolves to an installed provider
      ansible.builtin.command:
        argv: "{{ ['rpm', '--query', '--whatprovides'] + common_packages }}"
      changed_when: false

    - name: Stat the stowed bashrc
      ansible.builtin.stat:
        path: "{{ common_user_home }}/.bashrc"
      register: common_bashrc

    - name: Owner bashrc is a stow symlink
      ansible.builtin.assert:
        that:
          - common_bashrc.stat.exists
          - common_bashrc.stat.islnk
        fail_msg: "bash-suse dotfiles are not stowed for the owner"

    - name: Read the system hostname
      ansible.builtin.command: hostname
      register: common_hostname_cmd
      changed_when: false

    - name: System hostname matches the configured name
      ansible.builtin.assert:
        that:
          - common_hostname_cmd.stdout == common_hostname
        fail_msg: "hostname is {{ common_hostname_cmd.stdout }}, expected {{ common_hostname }}"
