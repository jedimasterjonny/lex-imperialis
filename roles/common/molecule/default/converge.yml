---
- name: Converge
  hosts: all
  vars:
    # The molecule instance name is already the container hostname, so this
    # keeps the hostname task idempotent.
    common_hostname: "{{ inventory_hostname }}"
    # A module no kernel carries: naming a real one would have the container —
    # whose /sys is the host's — try to unload the runner's own driver. That
    # leaves nothing to unload, so this proves the drop-in alone.
    common_blacklisted_modules:
      - lex_absent_module
    # A non-default zone, so verify proves common_timezone is what drives the
    # task rather than the role agreeing with itself. Distinct from the image's
    # Etc/UTC too, so the converge has real work to do. No timer is installed
    # here, so the catch-up a zone change can fire on a real host has nothing to
    # fire.
    common_timezone: America/New_York
    # Two entries, so the template's loop is exercised rather than assumed. The
    # second never resolves, which costs nothing: chronyd -p expands the config
    # without contacting a source.
    common_ntp_sources:
      - time.cloudflare.com
      - lex-absent-ntp.invalid
    # Fixture keys, not the fleet's: inventory/group_vars/all is not this
    # scenario's inventory, so the lists are declared here.
    common_authorized_keys:
      - "{{ common_fixture_owner_key }}"
    common_ansible_authorized_keys:
      - "{{ common_fixture_ansible_key }}"
    # Both arms in one converge: the owner's list stays additive, matching the
    # role default, while the ansible account's is authoritative. Prepare plants
    # the undeclared keys, so the removal happens on the first converge and the
    # second finds nothing left to do — the idempotence check still passes.
    common_authorized_keys_exclusive: false
    common_ansible_authorized_keys_exclusive: true
  vars_files:
    - fixtures.yml
  tasks:
    - name: Apply the common role
      ansible.builtin.include_role:
        name: common
