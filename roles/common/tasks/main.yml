---
- name: Set the system hostname
  ansible.builtin.hostname:
    name: "{{ common_hostname }}"
  become: true

# kmod owns /etc/modprobe.d and every fleet host has it, but a minimal Debian
# image can ship without kmod entirely — and template does not create a parent,
# so the drop-in below fails outright rather than landing somewhere inert.
- name: Ensure the modprobe drop-in directory exists
  ansible.builtin.file:
    path: /etc/modprobe.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

# blacklist alone only stops the udev/modalias autoload, so pair it with an
# install line that sends an explicit modprobe — or a load pulled in as another
# module's dependency — to /bin/false. Rendered unconditionally: an empty list
# yields an inert file, so emptying it reclaims the modules rather than leaving
# a stale drop-in barring them forever.
- name: Bar the blacklisted kernel modules from loading
  ansible.builtin.template:
    src: blacklist.conf.j2
    dest: /etc/modprobe.d/common-blacklist.conf
    owner: root
    group: root
    mode: "0644"
  become: true

# modprobe's own loaded-check reads modules.builtin under the running kernel's
# /lib/modules, absent from a container rootfs — it fails outright rather than
# skipping. /sys/module is the kernel's own answer, and it spells a module with
# underscores however modprobe was given it.
- name: Probe for the blacklisted kernel modules
  ansible.builtin.stat:
    path: "/sys/module/{{ item | replace('-', '_') }}"
  loop: "{{ common_blacklisted_modules }}"
  register: common_module_probe

# The drop-in only bites at the next boot, so unload what is already live.
# Skipped under --check: nothing is really removed there, so a holder still
# holds, and modprobe's own dry run (-n) refuses with "Module is in use" —
# failing the check gate for the whole host on a first deploy.
- name: Unload the blacklisted kernel modules
  community.general.modprobe:
    name: "{{ item.item }}"
    state: absent
  loop: "{{ common_module_probe.results }}"
  loop_control:
    label: "{{ item.item }}"
  when:
    - item.stat.exists
    - not ansible_check_mode
  become: true

# Keep this ahead of the package install below, and so ahead of every later
# role's, to resolve packages against the declared repository set.
#
# rc 104 is "no matching items" and rc 3 "repository disabled, or unknown" — the
# steady state here, and the answer for a NON-OSS alias the host does not carry.
# The match is version-exact and rpm records no provenance, so 104 means nothing
# installed matches what the repository currently offers, which is the closest a
# converge gets to "nothing came from here".
#
# --no-refresh spares that steady state a metadata fetch, but a repository still
# enabled and uncached is fetched anyway: the one converge that does real work is
# also the one that can fail on the network.
- name: Search for packages installed from the repositories to keep disabled
  ansible.builtin.command:
    argv:
      - zypper
      - --non-interactive
      - --no-refresh
      - search
      - --installed-only
      - --repo
      - "{{ item }}"
  loop: "{{ common_disabled_repos }}"
  register: common_disabled_repo_search
  changed_when: false
  failed_when: false
  check_mode: false
  become: true

- name: Assert no package is installed from a repository to keep disabled
  ansible.builtin.assert:
    that:
      - item.rc in [3, 104]
    fail_msg: >-
      zypper exited {{ item.rc }} searching {{ item.item }}. rc 0 means installed
      packages match what it offers, and disabling it would orphan them from
      autoupdate's weekly `dup` — uninstall them, or drop the alias from
      common_disabled_repos. Any other exit means the search itself failed,
      most often fetching metadata for a repository still enabled.
    quiet: true
  loop: "{{ common_disabled_repo_search.results }}"
  loop_control:
    label: "{{ item.item }}"

# Located by section header rather than filename: the section is the alias zypper
# reads, whatever the file is called. See the README for why zypper_repository
# cannot do this job.
- name: Locate the repository definitions to keep disabled
  ansible.builtin.find:
    paths: /etc/zypp/repos.d
    patterns: "*.repo"
    contains: '^\[{{ item | regex_escape }}\]$'
  loop: "{{ common_disabled_repos }}"
  register: common_disabled_repo_files
  become: true

- name: Keep the repositories disabled
  community.general.ini_file:
    path: "{{ item.files[0].path }}"
    section: "{{ item.item }}"
    option: enabled
    value: "0"
    no_extra_spaces: true
    create: false
  loop: "{{ common_disabled_repo_files.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.matched > 0
  become: true

# sdbootutil-update-predictions.service runs after every snapper snapshot, and its
# ExecStartPre unconditionally backs up /var/lib/pcrlock.d — a directory only a TPM2
# LUKS enrolment creates. Unenrolled, the prediction itself is a no-op returning 0,
# so creating the directory is the whole fix. Keep this ahead of the zypper task
# below: that transaction snapshots, and so arms the unit, on a fresh host's first
# converge.
- name: Ensure sdbootutil's TPM prediction directory exists
  ansible.builtin.file:
    path: /var/lib/pcrlock.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

# ansible.builtin.package dispatches to apt on Debian but cannot refresh its
# lists — it has no update_cache — and autoupdate masks apt-daily.timer, so
# nothing else refreshes them either. Do it here, ahead of the install below and
# so ahead of every later role's in the same play: an install against a
# week-stale list 404s on a version the mirror has already rotated away, and per
# playbooks/README.md a play that cannot converge stalls the whole reconcile.
# cache_valid_time keeps a converge within the hour from refetching, so this
# stays idempotent across a reapply.
- name: Refresh the apt package lists
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  when: ansible_facts['os_family'] == 'Debian'
  become: true

# package, not zypper: it dispatches to the zypper module on openSUSE, whose
# disable_recommends already defaults true, so this is behaviour-preserving there
# and works on Debian besides. Every name in common_packages exists under both.
- name: Install base packages
  ansible.builtin.package:
    name: "{{ common_packages }}"
    state: present
  become: true

# Declare the SELinux mode fleet-wide instead of leaning on the OS default, so it
# is config-as-code: every host already enforces, so this holds the mode rather
# than setting it. Gated on a manageable SELinux so the SELinux-less molecule
# containers skip it.
#
# After the install above, which carries the python binding this module imports —
# except on a transactional host, where that install lands in the next snapshot
# and the image has to ship the binding already.
- name: Set the SELinux mode
  ansible.posix.selinux:
    state: "{{ common_selinux_mode }}"
    policy: targeted
  become: true
  when: ansible_selinux.status == 'enabled'

# No OS branch because the module dispatches on `timedatectl` rather than on the
# distribution, and all its systemd arm writes is /etc/localtime — which is why
# a transactional host takes this outside a snapshot. See the README.
#
# systemd re-arms every calendar timer on the change itself, so nothing notifies
# — and a Persistent= timer whose slot the shift moves into the past fires its
# catch-up run there and then. Only a host whose zone actually changes is
# exposed, and only for the hour before each such slot, but on a host running
# podman_backup that catch-up stops every container mid-play.
- name: Set the system timezone
  community.general.timezone:
    name: "{{ common_timezone }}"
  become: true

# Dropped beside the packaged pool.conf, never over it. Both openSUSE chrony
# layouts read /etc/chrony.d — as an include glob, where taking that name would
# overwrite the vendor file, and as the first confdir, where it would shadow it —
# and Debian's chrony.conf carries `confdir /etc/chrony/conf.d` beside its own
# pool line, so either way the distro's own source goes with it. Rendered
# unconditionally, so emptying the list drops back to that source alone, and kept
# behind the package install above, which owns the directory.
- name: Add the fleet's NTP sources
  ansible.builtin.template:
    src: ntp.conf.j2
    dest: "{{ common_chrony_conf_dir }}/common-ntp.conf"
    owner: root
    group: root
    mode: "0644"
  become: true
  notify:
    - Query the chronyd unit for common
    - Restart chronyd for common

- name: Ensure the owner's supplementary groups exist
  ansible.builtin.group:
    name: "{{ item }}"
    system: true
  loop: "{{ common_user_groups }}"
  become: true

- name: Ensure the owner account exists
  ansible.builtin.user:
    name: "{{ common_user_name }}"
    uid: "{{ common_user_uid }}"
    group: "{{ common_user_group }}"
    groups: "{{ common_user_groups }}"
    append: true
    shell: "{{ common_user_shell }}"
    comment: "{{ common_user_comment }}"
    create_home: true
  become: true

# validate keeps a broken policy from ever reaching disk and locking out sudo.
- name: Grant the wheel group own-password sudo
  ansible.builtin.copy:
    dest: /etc/sudoers.d/wheel
    content: |
      ## wheel members may run any command, authenticating with their own
      ## password rather than root's (overriding the vendor-default targetpw).
      %wheel ALL=(ALL:ALL) ALL
      Defaults:%wheel !targetpw
    owner: root
    group: root
    mode: "0440"
    validate: /usr/sbin/visudo -cf %s
  become: true

# The grant that makes an unattended apply possible, and the widest privilege on
# the fleet. Written once by whichever bootstrap built the host and reconciled by
# nothing since — the same drift the key lists had, on the account those keys
# open. validate keeps a broken policy off disk; a rejected render fails the play
# with the previous file intact rather than leaving the account unable to
# escalate.
- name: Grant the ansible account passwordless sudo
  ansible.builtin.copy:
    dest: /etc/sudoers.d/{{ common_ansible_user }}
    content: |
      ## The account the plays connect as. NOPASSWD so a play — and the arbites
      ## timer — escalates with no operator present.
      {{ common_ansible_user }} ALL=(ALL:ALL) NOPASSWD: ALL
    owner: root
    group: root
    mode: "0440"
    validate: /usr/sbin/visudo -cf %s
  become: true

# cloud-init writes the same grant under its own name, so auspex carried it twice
# once the task above landed: one managed, one not. Ordered after that task on
# purpose — the reverse would leave a window with no grant at all, and an apply
# that failed in it would strand the account unable to escalate. A no-op on hosts
# bootstrap/host.sh built, which never had this file. A reflash recreates it, and
# the next converge removes it again.
- name: Remove the unmanaged cloud-init copy of that grant
  ansible.builtin.file:
    path: /etc/sudoers.d/90-cloud-init-users
    state: absent
  become: true

# One task per account, each passing the whole list as a single newline-joined
# key: exclusive against a loop would leave only the last iteration's key.
- name: Authorise the owner's SSH keys
  ansible.posix.authorized_key:
    user: "{{ common_user_name }}"
    key: "{{ common_authorized_keys | join('\n') }}"
    exclusive: "{{ common_authorized_keys_exclusive }}"
  when: common_authorized_keys | length > 0
  become: true

- name: Authorise the ansible account's SSH keys
  ansible.posix.authorized_key:
    user: "{{ common_ansible_user }}"
    key: "{{ common_ansible_authorized_keys | join('\n') }}"
    exclusive: "{{ common_ansible_authorized_keys_exclusive }}"
  when: common_ansible_authorized_keys | length > 0
  become: true

- name: Deploy the owner's dotfiles
  ansible.builtin.include_role:
    name: stow
  vars:
    stow_user: "{{ common_user_name }}"
    stow_user_home: "{{ common_user_home }}"
    stow_packages:
      - "{{ common_bash_stow_package }}"
