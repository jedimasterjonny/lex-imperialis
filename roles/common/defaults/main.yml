---
# common_hostname has no default — each play sets it per host, since the
# inventory name isn't always the real one (this_host is the alias for scholam).

# Owner account: the identity mirrors the local Tumbleweed install. wheel is
# added for sudo; no password is managed.
common_user_name: jonny
# Every play overrides this to 1026 (NAS uid alignment); the 1000 default is
# exercised only by molecule, whose prepare frees uid 1000 on the image.
common_user_uid: 1000
common_user_group: users
common_user_groups:
  - wheel
common_user_shell: /bin/bash
common_user_comment: "Jonny O'Connell"
common_user_home: "/home/{{ common_user_name }}"

# SELinux mode for every host, declared rather than left to the OS default. The
# whole fleet already enforces, so this holds the mode rather than setting it.
# Applied only where SELinux is manageable, so the molecule containers (no
# SELinux) skip it.
common_selinux_mode: enforcing
# Empty until an inventory declares them — see README.
common_authorized_keys: []
common_ansible_authorized_keys: []
common_authorized_keys_exclusive: false
common_ansible_authorized_keys_exclusive: false

# Kernel modules barred from loading, in unload order — a holder must be listed
# before the module it holds.
common_blacklisted_modules: []

# zypper repositories held disabled, by alias. Both NON-OSS spellings are listed
# because the alias tracks how a host was installed, not its distro — see README.
# Distro-derived rather than gated in tasks/: empty on Debian, which has no
# zypper, and the four tasks that loop over it then skip on their own. The whole
# repository half of the role needs no OS branch, only an empty list.
common_disabled_repos: >-
  {{ []
     if ansible_facts['os_family'] == 'Debian'
     else ['download.opensuse.org-non-oss', 'repo-non-oss', 'repo-openh264'] }}

# Where chrony reads drop-ins from. Distro-derived: openSUSE's chrony.conf takes
# /etc/chrony.d, Debian's carries `confdir /etc/chrony/conf.d`. The role's
# contract — drop in beside the packaged pool, never over it — holds at either.
common_chrony_conf_dir: >-
  {{ '/etc/chrony/conf.d'
     if ansible_facts['os_family'] == 'Debian'
     else '/etc/chrony.d' }}

# The dots package stowed for the owner's bash configuration. Distro-derived:
# the dots repo ships one per distribution, and each shadows the skel .bashrc it
# replaces, so the wrong one deploys green while losing that distribution's own
# shell setup.
common_bash_stow_package: >-
  {{ 'bash-ubuntu'
     if ansible_facts['os_family'] == 'Debian'
     else 'bash-suse' }}

# The host clock's zone, one for the whole fleet, declared rather than left to
# whatever each image was installed with. Every schedule in the repo is an
# OnCalendar= in that clock, so one frame is what keeps the backup stagger's
# spacing constant across the seasons — see the README and docs/backups.md. A
# container's TZ= is its own role's var and is not this.
common_timezone: Europe/London

# NTP sources added as chrony pool lines alongside whichever the distro
# installed. See the README for what a second source does and does not buy.
common_ntp_sources:
  - time.cloudflare.com

# Base tools, plus python3-selinux — the binding ansible.posix.selinux imports —
# and chrony, whose sources the role configures.
common_packages:
  - vim
  - tmux
  - htop
  - sudo
  - git
  - python3-selinux
  - chrony
