---
# Declares the groups so Ansible parses this directory as an inventory source and
# loads the generated group_vars beside it. The hosts come from molecule's own
# inventory, which names them per ${MOLECULE_RUN_ID} and puts them in these groups.
solar:
rogue_trader:
  vars:
    # Referenced, not transcribed: the generated fixture already carries this from
    # the play, so it stays written in exactly one place.
    fleet_bind_address: "{{ cadvisor_listen_ip }}"
