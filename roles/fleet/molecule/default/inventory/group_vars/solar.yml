# Generated by bin/gen-fixture-hostvars.py from inventory/host_vars/solar.yml.
# Do not edit — regenerate with `python3 bin/gen-fixture-hostvars.py`; the pre-commit
# hook fails on drift. Vault secrets stand in from all.yml, resolved beneath this.
---
common_hostname: solar
common_user_uid: 1026
common_blacklisted_modules:
  - iwlmvm
  - iwlwifi
autoupdate_oncalendar: Mon *-*-* 03:00:00
nfs_shares:
  - name: scriptorum
    server: administratum
    export: /volume1/scriptorum
  - name: astropath
    server: administratum
    export: /volume2/astropath
arr_enabled:
  - prowlarr
  - flaresolverr
  - lidarr
  - radarr
  - sonarr
  - beets
  - recyclarr
  - plex
  - wireguard
  - transmission
arr_data_root: /nfs/scriptorum/arr-data
arr_data_dirs: {}
firewalld_services:
  - ssh
  - http
  - https
firewalld_ports:
  - 443/udp
  - 32400/tcp
  - 1900/udp
  - 5353/udp
  - 8324/tcp
  - 32410/udp
  - 32412-32414/udp
  - 32469/tcp
  - 9100/tcp
  - 8080/tcp
  - 9093/tcp
node_exporter_listen_address: '{{ ansible_facts[''default_ipv4''][''address''] }}:9100'
cadvisor_listen_ip: '{{ ansible_facts[''default_ipv4''][''address''] }}'
grafana_prometheus_url: http://administratum:9090
restic_backup_password: '{{ solar_restic_password }}'
