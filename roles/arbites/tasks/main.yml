---
# The pip module imports `packaging` from the interpreter ansible uses on the
# host to parse requirements; the system pythons here ship without it, so
# install the matching flavour's package (e.g. python313-packaging for 3.13).
# ansible.cfg pins that interpreter, so the flavour follows the distro rather
# than whichever python is newest on disk.
- name: Install git, the venv builder, the deployment API tools, and the pip module's packaging dependency
  community.general.zypper:
    name:
      - curl
      - git
      - jq
      - python3-pip
      - "python{{ ansible_facts['python']['version']['major'] }}{{ ansible_facts['python']['version']['minor'] }}-packaging"
    state: present
  become: true

- name: Create the service state and secret directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - path: "{{ arbites_state_dir }}"
      mode: "0755"
    - path: "{{ arbites_config_dir }}"
      mode: "0700"
    - path: "{{ arbites_config_dir }}/ssh"
      mode: "0700"
  become: true

# The vault password and fleet SSH key come from neither the vault (circular) nor
# the public repo, so the operator places them out-of-band (README). Fail loudly
# here rather than enable a timer that can't decrypt or authenticate.
- name: Stat the operator-placed secrets
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ arbites_vault_pass_file }}"
    - "{{ arbites_ssh_key_file }}"
  register: arbites_secrets
  become: true

# mode[-2:] == '00' is owner-only: 0600 and a stricter 0400 both pass, a
# group/world-readable secret fails.
- name: The vault password and SSH key are present and private
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - item.stat.mode[-2:] == '00'
    fail_msg: "{{ item.item }} is missing or readable beyond its owner — place it 0600 (README)"
    quiet: true
  loop: "{{ arbites_secrets.results }}"
  loop_control:
    label: "{{ item.item }}"

# With host-key checking on, the reconcile pins each fleet host against this
# operator-seeded known_hosts (README). Assert it before arming a timer that would
# otherwise fail every fleet connection. Host public keys, not a secret, so only
# presence and non-emptiness are checked, not the mode.
- name: Stat the operator-placed known_hosts
  ansible.builtin.stat:
    path: "{{ arbites_known_hosts_file }}"
  register: arbites_known_hosts
  become: true
  when: arbites_host_key_checking | bool

- name: The known_hosts is present and non-empty when host-key checking is on
  ansible.builtin.assert:
    that:
      - arbites_known_hosts.stat.exists
      - arbites_known_hosts.stat.size > 0
    fail_msg: >-
      {{ arbites_known_hosts_file }} is missing or empty — seed it from the
      fleet before enabling host-key checking (README)
    quiet: true
  when: arbites_host_key_checking | bool

- name: Clone the repository the reconciler applies from
  ansible.builtin.git:
    repo: "{{ arbites_clone_url }}"
    dest: "{{ arbites_repo_dir }}"
    version: "{{ arbites_branch }}"
  become: true

- name: Build the ansible runtime venv from the repo's requirements
  ansible.builtin.pip:
    requirements: "{{ arbites_repo_dir }}/requirements.txt"
    virtualenv: "{{ arbites_venv_dir }}"
    virtualenv_command: python3 -m venv
  become: true

# The deployment token reaches both scripts through a 0600 EnvironmentFile rather
# than the world-readable unit or the 0755 scripts. Rendered even when the token is
# empty, so clearing the vault var revokes it on the next apply instead of leaving
# the last one on disk.
- name: Install the reconcile environment file
  ansible.builtin.template:
    src: env.j2
    dest: "{{ arbites_env_file }}"
    owner: root
    group: root
    mode: "0600"
  become: true
  no_log: true

- name: Install the reconcile and metric scripts
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: root
    group: root
    mode: "0755"
  loop:
    - src: arbites.sh.j2
      dest: "{{ arbites_script }}"
    - src: arbites-metric.sh.j2
      dest: "{{ arbites_metric_script }}"
  become: true

- name: Install the reconcile service and timer
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - arbites.service
    - arbites.timer
  become: true

# No restart handler: a oneshot timer has nothing to restart, and this way a
# self-apply never tears down its own run.
- name: Enable and start the reconcile timer
  ansible.builtin.systemd_service:
    name: arbites.timer
    enabled: true
    state: started
    daemon_reload: true
  become: true
