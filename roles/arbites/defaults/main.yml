---
# Service-owned working state: the git clone the reconciler applies from and the
# Python venv it runs ansible out of. Under /var/lib, like the node_exporter and
# prometheus service state.
arbites_state_dir: /var/lib/arbites
arbites_repo_dir: "{{ arbites_state_dir }}/repo"
arbites_venv_dir: "{{ arbites_state_dir }}/venv"
# The SHA last successfully applied; the unchanged-HEAD short-circuit reads it.
arbites_last_applied_file: "{{ arbites_state_dir }}/last-applied-sha"
# Soft kill-switch: touch this to make the timer fire as a clean no-op (README).
arbites_pause_flag: "{{ arbites_state_dir }}/pause"

# Where the repo is pulled from and the branch that is the single source of
# truth. Public HTTPS — read-only, no deploy key.
arbites_clone_url: https://github.com/jedimasterjonny/lex-imperialis.git
arbites_branch: main

# Operator-placed secrets the role asserts but never manages: neither can come
# from the vault (the reconciler needs the password to read the vault) nor the
# public repo. 0600 root, placed out-of-band (README).
arbites_config_dir: /etc/arbites
arbites_vault_pass_file: "{{ arbites_config_dir }}/vault_pass"
arbites_ssh_key_file: "{{ arbites_config_dir }}/ssh/id_arbites"
# The known_hosts pinning each fleet host's key. Consulted only when host-key
# checking is on (below); it maps topology (host keys + addresses), so it is
# operator-placed out-of-band like the secrets above, not committed (README).
arbites_known_hosts_file: "{{ arbites_config_dir }}/ssh/known_hosts"

# SSH host-key checking for the unattended apply. On by default: a machine-in-the-
# middle on the LAN/WireGuard path impersonating a fleet host would otherwise
# receive that host's rendered secrets (env files, WireGuard confs). Requires
# arbites_known_hosts_file, seeded from the fleet — the role asserts it is
# present. Set false to skip the check where no known_hosts is placed.
arbites_host_key_checking: true

# Installed scripts. /usr/local/sbin: root-only, like podman-backup.
arbites_script: /usr/local/sbin/arbites.sh
arbites_metric_script: /usr/local/sbin/arbites-metric.sh

# node_exporter textfile-collector directory the outcome metric is written to
# (arbites.prom). Must match the node_exporter role's
# node_exporter_textfile_directory so Prometheus scrapes what this writes.
arbites_textfile_dir: /var/lib/node_exporter/textfile_collector

# Reconcile cadence. Every 15 min with a 2 min jitter: the unchanged-HEAD
# short-circuit makes an idle run near-free, so a merge reaches the fleet within
# ~15 min. Persistent (unlike autoupdate) catches up a run missed across a reboot
# — it only applies main, never reboots.
arbites_oncalendar: "*:0/15"
arbites_randomized_delay: "2m"

# GitHub deployment record for each apply, mirroring the terraform workflow's
# environment badge in the repo UI (`Segmentum Obscurus` there, the cloud estate;
# this is the fleet). Telemetry only — every API call is best-effort, so a GitHub
# outage or an expired token never fails a reconcile. Empty token (the default,
# and molecule) skips the API entirely; set `arbites_github_token` in the vault to
# turn it on. A fine-grained PAT with Deployments: read and write, or a classic one
# scoped `repo_deployment`, and nothing else (README).
arbites_github_token: ""
arbites_deployment_environment: Segmentum Solar
# Derived so the clone URL stays the single declaration of which repo this is.
arbites_github_repo: "{{ arbites_clone_url | regex_replace('^https://github\\.com/|\\.git$', '') }}"
# Carries the in-flight deployment's id from the reconcile script to the
# ExecStopPost hook that posts its final state.
arbites_deployment_id_file: "{{ arbites_state_dir }}/deployment-id"
# The token reaches both scripts through this 0600 EnvironmentFile — never the
# world-readable unit, never the 0755 scripts.
arbites_env_file: "{{ arbites_config_dir }}/env"
