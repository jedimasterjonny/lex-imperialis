---
- name: Verify
  hosts: all
  gather_facts: false
  vars_files:
    - ../../defaults/main.yml
  tasks:
    - name: Stat the reconcile and metric scripts
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - "{{ arbites_script }}"
        - "{{ arbites_metric_script }}"
      register: arbites_scripts
      become: true

    - name: The scripts are installed and executable
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.executable
        fail_msg: "{{ item.item }} is missing or not executable"
        quiet: true
      loop: "{{ arbites_scripts.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Read the installed reconcile script
      ansible.builtin.slurp:
        src: "{{ arbites_script }}"
      register: arbites_script_content
      become: true

    # Host-key checking is on by default; the script must both export it and point
    # ssh at the seeded known_hosts, or a MITM could feed the root apply forged host
    # keys and harvest each host's rendered secrets.
    - name: The reconcile script enforces host-key checking against the seeded known_hosts
      vars:
        script: "{{ arbites_script_content.content | b64decode }}"
        expected_known_hosts_opt: "UserKnownHostsFile={{ arbites_known_hosts_file }}"
      ansible.builtin.assert:
        that:
          - "'ANSIBLE_HOST_KEY_CHECKING=true' in script"
          - expected_known_hosts_opt in script
        fail_msg: "the reconcile script does not enforce host-key checking against the known_hosts"
        quiet: true

    # The deployment record is posted from both scripts, so both must carry the API
    # calls, and the token must reach them through the 0600 EnvironmentFile rather
    # than either 0755 script.
    - name: Read the installed metric hook
      ansible.builtin.slurp:
        src: "{{ arbites_metric_script }}"
      register: arbites_metric_content
      become: true

    - name: The scripts open and close a GitHub deployment without embedding the token
      vars:
        reconcile: "{{ arbites_script_content.content | b64decode }}"
        hook: "{{ arbites_metric_content.content | b64decode }}"
      ansible.builtin.assert:
        that:
          - "'api.github.com/repos/' in reconcile"
          - "'github_api deployments' in reconcile"
          - "'\"in_progress\"' in reconcile"
          - "'api.github.com/repos/' in hook"
          - "'/deployments/' in hook"
          - "'/statuses' in hook"
          - "'ARBITES_GITHUB_TOKEN' in reconcile"
          - "'ARBITES_GITHUB_TOKEN' in hook"
          - "'ARBITES_GITHUB_TOKEN=' not in reconcile"
          - "'ARBITES_GITHUB_TOKEN=' not in hook"
        fail_msg: "the scripts do not post the deployment record, or one embeds the token"
        quiet: true

    - name: Stat the environment file the token reaches the scripts through
      ansible.builtin.stat:
        path: "{{ arbites_env_file }}"
      register: arbites_env
      become: true

    - name: The environment file is owner-only
      ansible.builtin.assert:
        that:
          - arbites_env.stat.exists
          - arbites_env.stat.mode[-2:] == '00'
        fail_msg: "{{ arbites_env_file }} is missing or readable beyond its owner"
        quiet: true

    - name: The runtime venv runs ansible-playbook
      ansible.builtin.command: "{{ arbites_venv_dir }}/bin/ansible-playbook --version"
      changed_when: false
      become: true

    # daemon_reload is a no-op read here: it makes the module gather and return the
    # timer's systemctl-show properties to assert against; it reads, not mutates.
    - name: Read the reconcile timer's state
      ansible.builtin.systemd_service:
        name: arbites.timer
        daemon_reload: true
      register: arbites_timer
      become: true

    - name: The timer is enabled and fires on a 15-minute cadence
      ansible.builtin.assert:
        that:
          - arbites_timer.status.ActiveState == 'active'
          - arbites_timer.status.UnitFileState == 'enabled'
          - "'/15' in arbites_timer.status.TimersCalendar"
        fail_msg: "the reconcile timer is not enabled for a 15-minute cadence"
        quiet: true

    - name: Read the reconcile service's definition
      ansible.builtin.systemd_service:
        name: arbites.service
        daemon_reload: true
      register: arbites_service
      become: true

    - name: The service runs the reconcile script and the metric hook
      ansible.builtin.assert:
        that:
          - "'arbites.sh' in arbites_service.status.ExecStart"
          - "'arbites-metric.sh' in arbites_service.status.ExecStopPost"
          - arbites_env_file in arbites_service.status.EnvironmentFiles
        fail_msg: "the service is not wired to the reconcile script, metric hook and environment file"
        quiet: true

    - name: Run the metric hook as a successful run would
      ansible.builtin.command: "{{ arbites_metric_script }}"
      environment:
        SERVICE_RESULT: success
      changed_when: false
      become: true

    - name: Read the outcome metric after the successful run
      ansible.builtin.slurp:
        src: "{{ arbites_textfile_dir }}/arbites.prom"
      register: arbites_metric_ok
      become: true

    - name: A successful run records arbites_success 1
      ansible.builtin.assert:
        that:
          - "'arbites_success 1' in (arbites_metric_ok.content | b64decode)"
          - "'arbites_last_run_timestamp_seconds ' in (arbites_metric_ok.content | b64decode)"
          - "'arbites_applied_commit{' in (arbites_metric_ok.content | b64decode)"
        fail_msg: "the outcome metric did not report a successful run"
        quiet: true

    # Drive the writer the way systemd would on a failed run; an ExecStart failure
    # can't be forced in a container, so invoke the hook with SERVICE_RESULT set.
    - name: Run the metric hook as a failed run would
      ansible.builtin.command: "{{ arbites_metric_script }}"
      environment:
        SERVICE_RESULT: exit-code
      changed_when: false
      become: true

    - name: Read the outcome metric after the simulated failure
      ansible.builtin.slurp:
        src: "{{ arbites_textfile_dir }}/arbites.prom"
      register: arbites_metric_fail
      become: true

    - name: A failed run records arbites_success 0
      ansible.builtin.assert:
        that:
          - "'arbites_success 0' in (arbites_metric_fail.content | b64decode)"
        fail_msg: "the outcome metric did not report a failed run"
        quiet: true

    # Exercise the reconcile script's fetch/reset/unchanged-HEAD path (the apply
    # itself can't run without a fleet): seed last-applied to the clone's HEAD so
    # the script short-circuits after the fetch instead of applying.
    - name: Resolve the clone's origin HEAD
      ansible.builtin.git:
        repo: "{{ arbites_clone_url }}"
        dest: "{{ arbites_repo_dir }}"
        version: "{{ arbites_branch }}"
      register: arbites_head
      become: true

    - name: Seed the last-applied SHA to the current HEAD
      ansible.builtin.copy:
        content: "{{ arbites_head.after }}\n"
        dest: "{{ arbites_last_applied_file }}"
        owner: root
        group: root
        mode: "0644"
      become: true

    # Plant what a merged-then-reverted commit would leave behind: reset --hard
    # keeps untracked files, and ansible.cfg reads `inventory` as a directory, so
    # this file would be parsed as an inventory source on every later reconcile.
    # The second path is gitignored, so only `clean -x` reaches it.
    - name: Plant untracked files in the clone
      ansible.builtin.copy:
        content: "planted\n"
        dest: "{{ arbites_repo_dir }}/{{ item }}"
        owner: root
        group: root
        mode: "0644"
      loop:
        - inventory/zz_planted.yml
        - .vault_pass
      become: true

    - name: Run the reconcile script with HEAD unchanged
      ansible.builtin.command: "{{ arbites_script }}"
      register: arbites_unchanged
      changed_when: false
      become: true

    - name: The unchanged-HEAD short-circuit fetches but skips the apply
      ansible.builtin.assert:
        that:
          - arbites_unchanged.rc == 0
          - "'nothing to apply' in arbites_unchanged.stdout"
        fail_msg: "the unchanged-HEAD short-circuit did not skip the apply"
        quiet: true

    - name: Stat the planted files after the reconcile
      ansible.builtin.stat:
        path: "{{ arbites_repo_dir }}/{{ item }}"
      register: arbites_planted
      loop:
        - inventory/zz_planted.yml
        - .vault_pass
      become: true

    # Runs even on the no-op path: the clean sits before the unchanged-HEAD
    # short-circuit, so an idle reconcile still scrubs the tree.
    - name: The reconcile cleans untracked files out of the clone
      ansible.builtin.assert:
        that:
          - not item.stat.exists
        fail_msg: "{{ item.item }} survived the reconcile — untracked files persist across a revert"
        quiet: true
      loop: "{{ arbites_planted.results }}"
      loop_control:
        label: "{{ item.item }}"

    # The pause flag must short-circuit before any git or apply work — the only
    # part of the reconcile script safe to run in a container with no fleet.
    - name: Set the pause flag
      ansible.builtin.file:
        path: "{{ arbites_pause_flag }}"
        state: touch
        owner: root
        group: root
        mode: "0644"
      become: true

    - name: Run the reconcile script while paused
      ansible.builtin.command: "{{ arbites_script }}"
      register: arbites_paused
      changed_when: false
      become: true

    - name: The pause flag short-circuits the reconcile to a clean no-op
      ansible.builtin.assert:
        that:
          - arbites_paused.rc == 0
          - "'paused' in arbites_paused.stdout"
        fail_msg: "the pause flag did not short-circuit the reconcile"
        quiet: true
