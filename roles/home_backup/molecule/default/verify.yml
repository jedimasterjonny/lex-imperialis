---
# home_backup is a thin consumer of the restic_backup engine in generic (path)
# mode, so this scenario proves only the consumer's own wiring — the engine's
# default scenario already covers the restore round-trip, the outcome metric, and
# the restic check gate for path mode.
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    - name: Stat the backup script
      ansible.builtin.stat:
        path: /usr/local/sbin/home-backup.sh
      register: home_backup_script_stat

    - name: The home-backup script is installed and executable
      ansible.builtin.assert:
        that:
          - home_backup_script_stat.stat.exists
          - home_backup_script_stat.stat.executable
        fail_msg: "/usr/local/sbin/home-backup.sh is missing or not executable"
        quiet: true

    - name: Read the installed backup script
      ansible.builtin.slurp:
        src: /usr/local/sbin/home-backup.sh
      register: home_backup_script_content
      become: true

    - name: The script snapshots /home
      ansible.builtin.assert:
        that:
          - "'/home' in (home_backup_script_content.content | b64decode)"
        fail_msg: "the home backup script does not snapshot /home"
        quiet: true

    # The repo is unencrypted and every fleet host mounts the share it sits on,
    # so the vault password reaching a snapshot is a full-vault disclosure. Pin
    # the exclude here rather than trusting the default to stay put.
    - name: The script excludes the vault password
      ansible.builtin.assert:
        that:
          - "'--exclude=.vault_pass' in (home_backup_script_content.content | b64decode)"
        fail_msg: "the home backup script does not exclude .vault_pass"
        quiet: true

    # daemon_reload is a no-op that just makes the module gather and return the
    # timer's systemctl-show properties to assert against; it reads, not mutates.
    - name: Read the backup timer's state
      ansible.builtin.systemd_service:
        name: home-backup.timer
        daemon_reload: true
      register: home_backup_timer
      become: true

    # Assert the whole OnCalendar= against the var converge set, not a literal.
    # TimersCalendar reads
    #   { OnCalendar=<spec> ; next_elapse=<resolved time> }
    # so matching bare substrings lets the next_elapse half satisfy them — 'Thu' and
    # '01:00:00' both appear there on a Thursday 01:00 run whatever the spec says.
    # Anchoring on OnCalendar= reads only the spec.
    #
    # This is the wiring under test: every host's schedule is a play-level override
    # of home_backup_oncalendar, and a literal here tested only that the default
    # equalled itself. The scenario's group_vars set a non-default value, so the var
    # has to reach the rendered timer for this to pass.
    - name: The timer is enabled and fires on the configured schedule
      ansible.builtin.assert:
        that:
          - home_backup_timer.status.ActiveState == 'active'
          - home_backup_timer.status.UnitFileState == 'enabled'
          - >-
            'OnCalendar=' ~ home_backup_oncalendar
            in home_backup_timer.status.TimersCalendar
        fail_msg: >-
          the backup timer is not enabled for {{ home_backup_oncalendar }} —
          TimersCalendar is {{ home_backup_timer.status.TimersCalendar | default('unset') }}
        quiet: true

    # Starting the oneshot blocks until it exits, so a clean start proves the
    # engine backs up /home end to end for this consumer's wiring.
    - name: Fire the backup service
      ansible.builtin.systemd_service:
        name: home-backup.service
        state: started
      become: true
