---
platforms:
  # Incus rejects underscores in instance names, so the label is hyphenated even
  # though the role is podman_backup.
  - name: "lex-podman-backup-leap-${MOLECULE_RUN_ID:-local}"
    image: images:opensuse/16.0/cloud
    # podman mounts overlays for its storage, which incus only permits in a
    # nested-container-capable instance. The CI runner's AppArmor denies nested
    # runc's sysctl fd-reopen, so drop the profile — the instance is throwaway.
    config:
      security.nesting: "true"
      raw.lxc: lxc.apparmor.profile=unconfined
provisioner:
  inventory:
    group_vars:
      all:
        # Restated rather than shared: a scenario's molecule.yml is standalone, and
        # the tier's base.yml is common to every role so it cannot carry this. Leap
        # is the tier rogue-trader actually runs, so the override path is worth
        # covering on both.
        podman_backup_oncalendar: "Tue *-*-* 04:00:00"
