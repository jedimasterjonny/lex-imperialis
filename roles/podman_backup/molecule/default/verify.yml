---
# podman_backup is a thin consumer of the restic_backup engine in podman-volumes
# mode, so this scenario proves only what that mode adds — the quiesce, the
# restore script, and the volumes' round-trip through it. The engine's own
# scenario covers the shared contract for both modes: restic itself, the
# installed scripts, the outcome metric on a successful and a failed run, and the
# restic check gate against a repo whose packs are gone.
- name: Verify
  hosts: all
  gather_facts: false
  vars:
    # Matches restic_backup_root in converge.yml.
    podman_backup_repo_root: /var/tmp/backup
    # The restore script, which the engine installs in this mode only.
    podman_backup_restore_script: /usr/local/sbin/podman-restore.sh
    # The engine's default textfile dir (podman_backup inherits it); the outcome
    # metric lands here.
    podman_backup_textfile_dir: /var/lib/node_exporter/textfile_collector
    podman_backup_probe_content: "lex-imperialis podman backup probe\n"
    # The fixture's quadlets (converge.yml) by their part in the quiesce rule:
    # the four it is judged by, the three that mount a volume at all, and the
    # two that mount the excluded volume.
    podman_backup_quiesce_units: [lex-probe, lex-skip, lex-both, lex-none]
    podman_backup_volume_mounters: [lex-probe, lex-skip, lex-both]
    podman_backup_excluded_mounters: [lex-skip, lex-both]
  tasks:
    # side_effect ran podman-restore.sh, which quiesced (stopped) the probe unit
    # and must have restarted it via its EXIT trap. If the trap were broken the
    # unit would still be down here, before verify fires anything.
    - name: Read the probe unit's state after the side-effect restore
      ansible.builtin.systemd_service:
        name: lex-probe
      register: podman_backup_probe_after_restore
      become: true

    - name: The restore restarted the quiesced probe unit
      ansible.builtin.assert:
        that:
          - podman_backup_probe_after_restore.status.ActiveState == 'active'
        fail_msg: "the restore did not restart the quiesced probe unit"
        quiet: true

    - name: Stat the restore script
      ansible.builtin.stat:
        path: "{{ podman_backup_restore_script }}"
      register: podman_backup_restore_script_stat

    - name: The restore script is installed and executable
      ansible.builtin.assert:
        that:
          - podman_backup_restore_script_stat.stat.exists
          - podman_backup_restore_script_stat.stat.executable
        fail_msg: "{{ podman_backup_restore_script }} is missing or not executable"
        quiet: true

    # daemon_reload is a no-op that just makes the module gather and return the
    # timer's systemctl-show properties to assert against; it reads, not mutates.
    - name: Read the backup timer's state
      ansible.builtin.systemd_service:
        name: podman-backup.timer
        daemon_reload: true
      register: podman_backup_timer
      become: true

    # Assert the whole OnCalendar= against the var converge set, not two literals.
    # TimersCalendar reads
    #   { OnCalendar=<spec> ; next_elapse=<resolved time> }
    # so bare substrings can be satisfied across the two halves: a daily
    # '*-*-* 01:00:00' spec supplies '01:00:00' itself and lets next_elapse supply
    # 'Wed' every Tuesday, passing a weekly-to-daily regression one day in seven.
    # Anchoring on OnCalendar= reads only the spec. Same defect C17 found in
    # home_backup; this is the other half of that fix.
    #
    # The group_vars value is deliberately not the role default, so the pass-through
    # to restic_backup_oncalendar in tasks/main.yml has to actually carry it. A
    # literal here would have passed on a pass-through hard-coded to Wed 01:00.
    - name: The timer is enabled and fires on the configured schedule
      ansible.builtin.assert:
        that:
          - podman_backup_timer.status.ActiveState == 'active'
          - podman_backup_timer.status.UnitFileState == 'enabled'
          - >-
            'OnCalendar=' ~ podman_backup_oncalendar
            in podman_backup_timer.status.TimersCalendar
        fail_msg: >-
          the backup timer is not enabled for {{ podman_backup_oncalendar }} —
          TimersCalendar is {{ podman_backup_timer.status.TimersCalendar | default('unset') }}
        quiet: true

    # Ordering that stops a Persistent= catch-up run at boot racing the quadlet
    # units' start and quiescing nothing — the rationale is in roles/restic_backup's
    # README. The race needs a reboot to reproduce, which this tier cannot do, but
    # the ordering that removes it is a property of the rendered unit.
    - name: Read the backup service's ordering
      ansible.builtin.systemd_service:
        name: podman-backup.service
      register: podman_backup_service
      become: true

    - name: The podman-volumes backup is ordered after the container units are up
      ansible.builtin.assert:
        that:
          - "'multi-user.target' in podman_backup_service.status.After"
        fail_msg: >-
          podman-backup.service is not ordered after multi-user.target, so a
          Persistent= catch-up run at boot can quiesce nothing and snapshot live data
        quiet: true

    # The script derives the repo from $(hostname); match it the same way.
    - name: Determine the host's repo path
      ansible.builtin.command: hostname
      register: podman_backup_hostname
      changed_when: false

    - name: Set the repo path
      ansible.builtin.set_fact:
        podman_backup_repo: "{{ podman_backup_repo_root }}/{{ podman_backup_hostname.stdout }}-podman-backup"

    # The probe, and the container mounting the excluded volume beside the
    # probe volume, must be stopped and restarted; the container mounting only
    # the excluded volume and the one mounting no volume must ride through the
    # run untouched. Each activation timestamp is the proof: a quiesce that
    # stopped and restarted a unit moves it, where ActiveState alone reads
    # 'active' either way — and a broken EXIT trap would leave it down.
    - name: Read the quiesce units' activation times before the backup
      ansible.builtin.systemd_service:
        name: "{{ item }}"
      loop: "{{ podman_backup_quiesce_units }}"
      register: podman_backup_quiesce_before
      become: true

    # A container no unit owns cannot be quiesced — rogue-trader's wp wrapper
    # holds a volume this way every five minutes — so one holding a volume in
    # the snapshot is logged and left running, as it was before the quiesce
    # knew such containers existed. Run one through the backup below; always
    # removed, at once, since busybox's sh would sit out podman's stop timeout.
    - name: Back up with a container no unit owns holding the probe volume
      block:
        - name: Run an ad-hoc container holding the probe volume
          ansible.builtin.command:
            cmd: podman run -d --rm --name lex-adhoc -v lex-probe:/data:ro docker.io/library/busybox:latest sleep 3600
          changed_when: true
          become: true

        # Starting a oneshot unit blocks until it exits, so success means the
        # backup ran clean.
        - name: Fire the backup service
          ansible.builtin.systemd_service:
            name: podman-backup.service
            state: started
          become: true

        - name: Read whether the ad-hoc container rode through
          ansible.builtin.command:
            cmd: podman container inspect --format '{% raw %}{{ .State.Running }}{% endraw %}' lex-adhoc
          register: podman_backup_adhoc_running
          changed_when: false
          become: true
      always:
        - name: Remove the ad-hoc container
          ansible.builtin.command:
            cmd: podman rm -f -t 0 lex-adhoc
          changed_when: true
          become: true

    - name: The container no unit owns was left running
      ansible.builtin.assert:
        that:
          - podman_backup_adhoc_running.stdout == 'true'
        fail_msg: "the backup stopped, or failed on, a container no unit owns"
        quiet: true

    - name: Read the quiesce units' activation times after the backup
      ansible.builtin.systemd_service:
        name: "{{ item }}"
      loop: "{{ podman_backup_quiesce_units }}"
      register: podman_backup_quiesce_after
      become: true

    - name: Read the snapshot the backup just wrote
      ansible.builtin.command: "restic --password-file /etc/restic/password --repo {{ podman_backup_repo }} snapshots --json --latest 1"
      register: podman_backup_latest
      changed_when: false
      become: true

    # Every arm of the quiesce rule: the excluded volume is not in the
    # snapshot's paths; the probe, and the container mounting the excluded
    # volume beside the probe volume, were stopped and restarted; the container
    # mounting only the excluded volume, and the one mounting nothing, were
    # never stopped — auspex's TSDB and the Prometheus over it, and its
    # exporters, in miniature. Keyed by unit name, so the loop order is not
    # load-bearing.
    - name: The excluded volume is out of the snapshot, and only its mounters' peers stopped
      vars:
        podman_backup_latest_paths: "{{ (podman_backup_latest.stdout | from_json | first).paths | join(' ') }}"
        podman_backup_before: >-
          {{ dict(podman_backup_quiesce_units
             | zip(podman_backup_quiesce_before.results | map(attribute='status.ActiveEnterTimestampMonotonic'))) }}
        podman_backup_after: >-
          {{ dict(podman_backup_quiesce_units
             | zip(podman_backup_quiesce_after.results | map(attribute='status.ActiveEnterTimestampMonotonic'))) }}
      ansible.builtin.assert:
        that:
          - "'/lex-probe/' in podman_backup_latest_paths"
          - "('/' ~ restic_backup_podman_volume_excludes[0] ~ '/') not in podman_backup_latest_paths"
          - podman_backup_quiesce_after.results | map(attribute='status.ActiveState') | unique == ['active']
          - podman_backup_after['lex-probe'] != podman_backup_before['lex-probe']
          - podman_backup_after['lex-skip'] == podman_backup_before['lex-skip']
          - podman_backup_after['lex-both'] != podman_backup_before['lex-both']
          - podman_backup_after['lex-none'] == podman_backup_before['lex-none']
        fail_msg: >-
          the quiesce rule did not hold — snapshot paths: {{ podman_backup_latest_paths }};
          activation times {{ podman_backup_after }} against {{ podman_backup_before }}
          before the run
        quiet: true

    # side_effect ran podman-restore.sh after tampering with the live volume; the
    # probe should be back to its original content in the volume itself, not just
    # a scratch restore.
    - name: Read the probe file from the live volume after the restore
      ansible.builtin.slurp:
        src: /var/lib/containers/storage/volumes/lex-probe/_data/probe.txt
      register: podman_backup_live_probe
      become: true

    - name: The restore returned the original probe data to the volume
      ansible.builtin.assert:
        that:
          - (podman_backup_live_probe.content | b64decode) == podman_backup_probe_content
        fail_msg: "the restore did not return the original probe data to the volume"
        quiet: true

    - name: Stat the stray file the restore should have removed
      ansible.builtin.stat:
        path: /var/lib/containers/storage/volumes/lex-probe/_data/stray.txt
      register: podman_backup_stray
      become: true

    - name: The restore is an exact mirror, not an overlay
      ansible.builtin.assert:
        that:
          - not podman_backup_stray.stat.exists
        fail_msg: "the restore left a stray file the snapshot did not contain"
        quiet: true

    # The engine's scenario proves the installed script runs a restic check with a
    # read-data slice, and that the check rejects a repo whose packs are gone —
    # but a deleted pack is one a metadata check already catches, so neither
    # proves the read-data slice earns its keep. Bit-rot is a flipped byte
    # *inside* an otherwise-intact pack. A plain check reads and MAC-verifies tree
    # packs but not data packs, so the corruption must land in a data pack: pick
    # the largest, which the incompressible payload seeded in converge makes
    # unambiguously a data pack. Then assert the distinction — a plain check
    # passes, a --read-data check fails (full, not the rotating subset, so the
    # tampered pack is always read whatever week it is).
    - name: Discard any prior bit-rot copy
      ansible.builtin.file:
        path: "{{ podman_backup_repo }}-bitrot"
        state: absent
      become: true

    - name: Copy the scratch repo to flip a pack byte in isolation
      ansible.builtin.command: "cp -a {{ podman_backup_repo }} {{ podman_backup_repo }}-bitrot"
      changed_when: true
      become: true

    - name: Flip one byte inside the largest (data) pack
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - |
            import glob, os, sys
            packs = glob.glob(sys.argv[1] + "/data/*/*")
            if not packs:
                sys.exit("no data packs found to corrupt")
            target = max(packs, key=os.path.getsize)
            with open(target, "r+b") as f:
                first = f.read(1)
                f.seek(0)
                f.write(bytes([first[0] ^ 0xff]))
          - "{{ podman_backup_repo }}-bitrot"
      changed_when: true
      become: true

    - name: A metadata-only check does not notice the flipped byte
      ansible.builtin.command: "restic --password-file /etc/restic/password --repo {{ podman_backup_repo }}-bitrot check"
      register: podman_backup_bitrot_meta
      changed_when: false
      failed_when: false
      become: true

    - name: A read-data check catches the flipped byte
      ansible.builtin.command: "restic --password-file /etc/restic/password --repo {{ podman_backup_repo }}-bitrot check --read-data"
      register: podman_backup_bitrot_read
      changed_when: false
      failed_when: false
      become: true

    - name: Only the read-data check detects intra-pack bit-rot
      ansible.builtin.assert:
        that:
          - podman_backup_bitrot_meta.rc == 0
          - podman_backup_bitrot_read.rc != 0
        fail_msg: >-
          metadata rc={{ podman_backup_bitrot_meta.rc }} (want 0),
          read-data rc={{ podman_backup_bitrot_read.rc }} (want non-zero)
        quiet: true

    # The quiesce set comes from podman's running containers, so a host with
    # every volume-claiming container stopped — maintenance — has nothing to
    # quiesce and is consistent as it stands: the run must succeed, and the
    # volumeless container it finds running must ride through as before.
    - name: Stop the volume-claiming units, as a host under maintenance is
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        state: stopped
      loop: "{{ podman_backup_volume_mounters }}"
      become: true

    - name: Read the volumeless unit's activation time before the maintenance run
      ansible.builtin.systemd_service:
        name: lex-none
      register: podman_backup_none_before_maintenance
      become: true

    - name: Fire the backup service with nothing to quiesce
      ansible.builtin.systemd_service:
        name: podman-backup.service
        state: started
      become: true

    - name: Read the volumeless unit's activation time after the maintenance run
      ansible.builtin.systemd_service:
        name: lex-none
      register: podman_backup_none_after_maintenance
      become: true

    - name: A host with nothing running to quiesce is snapshotted as it stands
      ansible.builtin.assert:
        that:
          - >-
            podman_backup_none_after_maintenance.status.ActiveEnterTimestampMonotonic
            == podman_backup_none_before_maintenance.status.ActiveEnterTimestampMonotonic
        fail_msg: "the maintenance-state run restarted the volumeless container it found running"
        quiet: true

    # Only the probe comes back here: the excluded volume's mounters stay down
    # for the next test, which removes that volume.
    - name: Start the probe unit again
      ansible.builtin.systemd_service:
        name: lex-probe
        state: started
      become: true

    # An exclusion naming no volume on the host — the TSDB renamed under it, or
    # a typo — must refuse the run before anything is stopped: left alone, the
    # volume would silently return to the snapshot and its container to the
    # quiesce, reporting success. Remove the excluded volume, fire, and prove
    # the run failed without touching the probe unit; then put it all back.
    - name: Remove the excluded volume
      ansible.builtin.command:
        cmd: "podman volume rm {{ restic_backup_podman_volume_excludes[0] }}"
      changed_when: true
      become: true

    - name: Read the probe unit's activation time before the missing-volume run
      ansible.builtin.systemd_service:
        name: lex-probe
      register: podman_backup_probe_before_missing
      become: true

    - name: Fire the backup service with the excluded volume missing
      ansible.builtin.systemd_service:
        name: podman-backup.service
        state: started
      register: podman_backup_missing_run
      ignore_errors: true
      become: true

    - name: Read the outcome metric after the missing-volume run
      ansible.builtin.slurp:
        src: "{{ podman_backup_textfile_dir }}/podman-backup.prom"
      register: podman_backup_metric_missing
      become: true

    - name: Read the probe unit's activation time after the missing-volume run
      ansible.builtin.systemd_service:
        name: lex-probe
      register: podman_backup_probe_after_missing
      become: true

    - name: An exclusion naming no volume refuses the run before the quiesce
      ansible.builtin.assert:
        that:
          - podman_backup_missing_run is failed
          - "'podman_backup_success 0' in (podman_backup_metric_missing.content | b64decode)"
          - >-
            podman_backup_probe_after_missing.status.ActiveEnterTimestampMonotonic
            == podman_backup_probe_before_missing.status.ActiveEnterTimestampMonotonic
        fail_msg: >-
          an exclusion naming no volume did not refuse the run, or stopped the
          probe unit first (activated at
          {{ podman_backup_probe_after_missing.status.ActiveEnterTimestampMonotonic }}
          against {{ podman_backup_probe_before_missing.status.ActiveEnterTimestampMonotonic }})
        quiet: true

    - name: Clear the failed state the missing-volume run left
      ansible.builtin.command: systemctl reset-failed podman-backup.service
      changed_when: true
      become: true

    - name: Recreate the excluded volume
      ansible.builtin.command:
        cmd: "podman volume create {{ restic_backup_podman_volume_excludes[0] }}"
      changed_when: true
      become: true

    - name: Start the excluded volume's mounters again
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        state: started
      loop: "{{ podman_backup_excluded_mounters }}"
      become: true

    # The restore reads the whole snapshot into a scratch target before it touches
    # a live volume, so a repository that resolves but cannot be read must cost
    # nothing. Removing data/ models exactly the case a --dry-run precheck cannot
    # see: the snapshot metadata still resolves, so the restore commits to running
    # and only discovers the fault while writing. Corrupt the live repo rather
    # than a copy — the script derives its own repo path — so save it first.
    - name: Save the repo before corrupting it
      ansible.builtin.command: "cp -a {{ podman_backup_repo }} {{ podman_backup_repo }}-saved"
      changed_when: true
      become: true

    - name: Drop a marker into the live volume
      ansible.builtin.copy:
        content: "marker\n"
        dest: /var/lib/containers/storage/volumes/lex-probe/_data/marker.txt
        owner: root
        group: root
        mode: "0644"
      become: true

    - name: Remove the repo's data so it resolves but cannot be read
      ansible.builtin.file:
        path: "{{ podman_backup_repo }}/data"
        state: absent
      become: true

    - name: Run the restore against the unreadable repo
      ansible.builtin.command: "{{ podman_backup_restore_script }}"
      register: podman_backup_bad_restore
      changed_when: false
      failed_when: false
      become: true

    - name: Stat the marker after the failed restore
      ansible.builtin.stat:
        path: /var/lib/containers/storage/volumes/lex-probe/_data/marker.txt
      register: podman_backup_marker
      become: true

    # stat, not slurp: the pre-fix script wipes the volume, and a slurp of a file
    # that is gone fails the task itself — which fails the run, but reports a
    # missing file rather than the reason it is missing.
    - name: Stat the probe file after the failed restore
      ansible.builtin.stat:
        path: /var/lib/containers/storage/volumes/lex-probe/_data/probe.txt
      register: podman_backup_probe_stat_after_bad
      become: true

    - name: Read the probe unit's state after the failed restore
      ansible.builtin.systemd_service:
        name: lex-probe
      register: podman_backup_unit_after_bad
      become: true

    - name: A restore that cannot read the repo leaves the volumes untouched
      ansible.builtin.assert:
        that:
          - podman_backup_bad_restore.rc != 0
          - podman_backup_marker.stat.exists
          - podman_backup_probe_stat_after_bad.stat.exists
          - podman_backup_unit_after_bad.status.ActiveState == 'active'
        fail_msg: >-
          the failed restore disturbed live data (rc={{ podman_backup_bad_restore.rc }},
          marker present={{ podman_backup_marker.stat.exists }},
          probe present={{ podman_backup_probe_stat_after_bad.stat.exists }},
          unit={{ podman_backup_unit_after_bad.status.ActiveState }})
        quiet: true

    - name: Read the probe file back after the failed restore
      ansible.builtin.slurp:
        src: /var/lib/containers/storage/volumes/lex-probe/_data/probe.txt
      register: podman_backup_probe_after_bad
      become: true

    - name: The failed restore left the volume's contents unchanged
      ansible.builtin.assert:
        that:
          - (podman_backup_probe_after_bad.content | b64decode) == podman_backup_probe_content
        fail_msg: "the failed restore altered the volume's contents"
        quiet: true

    - name: Discard the corrupted repo
      ansible.builtin.file:
        path: "{{ podman_backup_repo }}"
        state: absent
      become: true

    - name: Put the saved repo back
      ansible.builtin.command: "mv {{ podman_backup_repo }}-saved {{ podman_backup_repo }}"
      changed_when: true
      become: true

    # Now the sound-repo path, driven by an explicit snapshot ID rather than
    # latest — the argument that lets a recovery skip past a bad snapshot. It must
    # also clear the marker, which the snapshot never held.
    - name: List the snapshots to name one explicitly
      ansible.builtin.command: "restic --password-file /etc/restic/password --repo {{ podman_backup_repo }} snapshots --json"
      register: podman_backup_snapshot_list
      changed_when: false
      become: true

    - name: Restore an explicitly named snapshot
      ansible.builtin.command: >-
        {{ podman_backup_restore_script }}
        {{ (podman_backup_snapshot_list.stdout | from_json | last).short_id }}
      changed_when: true
      become: true

    - name: Stat the marker after the named-snapshot restore
      ansible.builtin.stat:
        path: /var/lib/containers/storage/volumes/lex-probe/_data/marker.txt
      register: podman_backup_marker_after_good
      become: true

    - name: Read the probe file after the named-snapshot restore
      ansible.builtin.slurp:
        src: /var/lib/containers/storage/volumes/lex-probe/_data/probe.txt
      register: podman_backup_probe_after_good
      become: true

    - name: Read the probe unit's state after the named-snapshot restore
      ansible.builtin.systemd_service:
        name: lex-probe
      register: podman_backup_unit_after_good
      become: true

    - name: A named snapshot restores exactly, and the units come back
      ansible.builtin.assert:
        that:
          - not podman_backup_marker_after_good.stat.exists
          - (podman_backup_probe_after_good.content | b64decode) == podman_backup_probe_content
          - podman_backup_unit_after_good.status.ActiveState == 'active'
        fail_msg: "restoring a named snapshot did not mirror the volume or did not restart the units"
        quiet: true

    # The restore takes its stop set from the quadlet directory's glob, and its
    # zero-match case is the worse one: the swap wipes and replaces live volumes,
    # so a glob that silently matched nothing would do that with the containers
    # still running and writing. Take the quadlets out of the glob's reach and
    # confirm the restore refuses before it touches anything.
    - name: Run the restore with its quadlet directory out of the glob's reach
      block:
        - name: Move the quadlet directory away
          ansible.builtin.command: mv /etc/containers/systemd /etc/containers/systemd.staged
          changed_when: true
          become: true

        - name: Run the restore with no quadlet to quiesce
          ansible.builtin.command: "{{ podman_backup_restore_script }}"
          register: podman_backup_noquadlet_restore
          changed_when: false
          failed_when: false
          become: true

        - name: Stat the probe file after the no-quadlet restore
          ansible.builtin.stat:
            path: /var/lib/containers/storage/volumes/lex-probe/_data/probe.txt
          register: podman_backup_probe_after_noquadlet
          become: true
      # Whatever happened above, or the next run nests the live directory
      # inside the staged one.
      always:
        - name: Put the quadlet directory back
          ansible.builtin.command: mv /etc/containers/systemd.staged /etc/containers/systemd
          changed_when: true
          become: true

    # On the message, not just the return code: the script refuses on several
    # grounds before the swap, so a bare non-zero would no longer say it was this
    # one that fired.
    - name: A restore that would quiesce nothing refuses to swap
      ansible.builtin.assert:
        that:
          - podman_backup_noquadlet_restore.rc != 0
          - "'no .container quadlets' in podman_backup_noquadlet_restore.stderr"
          - podman_backup_probe_after_noquadlet.stat.exists
        fail_msg: >-
          the restore swapped volumes without quiescing anything
          (rc={{ podman_backup_noquadlet_restore.rc }},
          probe present={{ podman_backup_probe_after_noquadlet.stat.exists }}) —
          stderr: {{ podman_backup_noquadlet_restore.stderr | default('') }}
        quiet: true

    # Every other restore here runs without a terminal, so nothing yet proves the
    # confirmation still gates the wipe — and it moved, from before the repository
    # read to after it. script(1) gives the script a pty so `[ -t 0 ]` is true;
    # the command module's stdin feeds the answer. Anything but y or Y must abort
    # before a live volume is touched.
    - name: Drop a marker a confirmed restore would wipe
      ansible.builtin.copy:
        content: "tty\n"
        dest: /var/lib/containers/storage/volumes/lex-probe/_data/tty-marker.txt
        owner: root
        group: root
        mode: "0644"
      become: true

    - name: Decline the restore at its confirmation prompt
      ansible.builtin.command:
        cmd: "script -qec {{ podman_backup_restore_script }} /dev/null"
        stdin: "n"
      register: podman_backup_declined_restore
      changed_when: false
      failed_when: false
      become: true

    - name: Stat the marker after the declined restore
      ansible.builtin.stat:
        path: /var/lib/containers/storage/volumes/lex-probe/_data/tty-marker.txt
      register: podman_backup_declined_marker
      become: true

    - name: Read the probe unit's state after the declined restore
      ansible.builtin.systemd_service:
        name: lex-probe
      register: podman_backup_unit_after_declined
      become: true

    # The prompt text pins that the prompt was reached at all — without it, any
    # early failure (a missing script(1), say) has the same shape as an abort and
    # would be read as one. The scratch path pins where: the run ends AT the
    # prompt, so restic's own output can only be there if the repository read
    # happened first, which is the ordering this change introduced.
    - name: A declined confirmation aborts before anything is swapped
      ansible.builtin.assert:
        that:
          - podman_backup_declined_restore.rc != 0
          - "'aborted' in podman_backup_declined_restore.stdout"
          - "'Restore ' in podman_backup_declined_restore.stdout"
          - "'/var/tmp/podman-restore.' in podman_backup_declined_restore.stdout"
          - podman_backup_declined_marker.stat.exists
          - podman_backup_unit_after_declined.status.ActiveState == 'active'
        fail_msg: >-
          the restore swapped without a confirmed prompt, or never reached one
          (rc={{ podman_backup_declined_restore.rc }},
          marker present={{ podman_backup_declined_marker.stat.exists }},
          unit={{ podman_backup_unit_after_declined.status.ActiveState }}) —
          output: {{ podman_backup_declined_restore.stdout | default('') }}
        quiet: true

    - name: Discard the marker from the declined restore
      ansible.builtin.file:
        path: /var/lib/containers/storage/volumes/lex-probe/_data/tty-marker.txt
        state: absent
      become: true

    # The volume set is compared BOTH ways. A volume the snapshot holds that the
    # host does not is the data-loss direction — nothing here creates one, so it
    # is restored nowhere — and it is not hypothetical: solar's repo holds an
    # alertmanager-data the host lost with the role. Driving off the host's
    # volumes alone never looked, so the run swapped the rest and exited 0 having
    # dropped it. Snapshot a volume, remove it, and the newest snapshot holds one
    # this host does not: unattended, the restore must refuse outright rather
    # than proceed with no one to read a warning.
    - name: Create a volume that will exist only in the snapshot
      ansible.builtin.command:
        cmd: podman volume create lex-gone
      register: podman_backup_gone
      changed_when: "'lex-gone' in podman_backup_gone.stdout"
      failed_when:
        - podman_backup_gone.rc != 0
        - "'already exists' not in podman_backup_gone.stderr"
      become: true

    - name: Seed the doomed volume so the snapshot holds data, not just a directory
      ansible.builtin.copy:
        content: "gone\n"
        dest: /var/lib/containers/storage/volumes/lex-gone/_data/gone.txt
        owner: root
        group: root
        mode: "0644"
      become: true

    - name: Snapshot the host while the doomed volume is still present
      ansible.builtin.systemd_service:
        name: podman-backup.service
        state: started
      become: true

    - name: Remove the volume, leaving the snapshot holding one the host lacks
      ansible.builtin.command:
        cmd: podman volume rm lex-gone
      changed_when: true
      become: true

    - name: Drop a marker the restore would wipe if it swapped anyway
      ansible.builtin.copy:
        content: "orphan\n"
        dest: /var/lib/containers/storage/volumes/lex-probe/_data/orphan-marker.txt
        owner: root
        group: root
        mode: "0644"
      become: true

    - name: Run the restore against a snapshot holding a volume the host lacks
      ansible.builtin.command: "{{ podman_backup_restore_script }}"
      register: podman_backup_orphan_restore
      changed_when: false
      failed_when: false
      become: true

    - name: Stat the marker after the refused restore
      ansible.builtin.stat:
        path: /var/lib/containers/storage/volumes/lex-probe/_data/orphan-marker.txt
      register: podman_backup_orphan_marker
      become: true

    - name: Read the probe unit's state after the refused restore
      ansible.builtin.systemd_service:
        name: lex-probe
      register: podman_backup_unit_after_orphan
      become: true

    # Names the volume, not just a count: a message the operator cannot act on is
    # the same silence in a longer form.
    - name: A snapshot volume with no host counterpart is named and stops the run
      ansible.builtin.assert:
        that:
          - podman_backup_orphan_restore.rc != 0
          - "'lex-gone' in podman_backup_orphan_restore.stderr"
          - podman_backup_orphan_marker.stat.exists
          - podman_backup_unit_after_orphan.status.ActiveState == 'active'
        fail_msg: >-
          the restore dropped a snapshot volume the host does not have
          (rc={{ podman_backup_orphan_restore.rc }},
          marker present={{ podman_backup_orphan_marker.stat.exists }},
          unit={{ podman_backup_unit_after_orphan.status.ActiveState }}) —
          stderr: {{ podman_backup_orphan_restore.stderr | default('') }}
        quiet: true

    - name: Discard the marker
      ansible.builtin.file:
        path: /var/lib/containers/storage/volumes/lex-probe/_data/orphan-marker.txt
        state: absent
      become: true

    # Retention grouping, proved here rather than in the engine's own scenario
    # because this is the mode whose source set moves at run time: the paths are
    # the volume mountpoints, so a container added or removed changes them.
    # restic's default --group-by host,paths would make that a fresh retention
    # group and freeze the old one — its snapshots pinned as that group's newest
    # weeklies, never ageing out and growing the repo, and the off-site mirror,
    # without bound. Every snapshot here falls in one ISO week, so keep-weekly
    # collapses a group to a single snapshot: the count must not move when the
    # volume set does.
    - name: Count the snapshots before the volume set changes
      ansible.builtin.command: "restic --password-file /etc/restic/password --repo {{ podman_backup_repo }} snapshots --json"
      register: podman_backup_snapshots_before
      changed_when: false
      become: true

    - name: Add a second volume so the next run snapshots a different path set
      ansible.builtin.command:
        cmd: podman volume create lex-probe-two
      register: podman_backup_probe_two
      changed_when: "'lex-probe-two' in podman_backup_probe_two.stdout"
      failed_when:
        - podman_backup_probe_two.rc != 0
        - "'already exists' not in podman_backup_probe_two.stderr"
      become: true

    - name: Fire the backup service over the changed volume set
      ansible.builtin.systemd_service:
        name: podman-backup.service
        state: started
      become: true

    - name: Count the snapshots after the volume set changed
      ansible.builtin.command: "restic --password-file /etc/restic/password --repo {{ podman_backup_repo }} snapshots --json"
      register: podman_backup_snapshots_after
      changed_when: false
      become: true

    - name: A changed volume set does not open a second retention group
      ansible.builtin.assert:
        that:
          - >-
            (podman_backup_snapshots_after.stdout | from_json | length)
            == (podman_backup_snapshots_before.stdout | from_json | length)
          - >-
            'lex-probe-two' in
            ((podman_backup_snapshots_after.stdout | from_json | last).paths | join(' '))
        fail_msg: >-
          the volume set changed and retention forked:
          {{ podman_backup_snapshots_before.stdout | from_json | length }} snapshots before,
          {{ podman_backup_snapshots_after.stdout | from_json | length }} after — the
          old path set's snapshots are frozen in a retention group of their own
        quiet: true

    # Removing it leaves the newest snapshot holding a volume the host no longer
    # has — the very state the restore now refuses on. Harmless because both
    # side_effect and this play fire the backup before their first restore, and
    # retention collapses a same-week repo to that one snapshot; keep that
    # ordering if either play is rearranged.
    - name: Remove the second volume so the scenario re-runs from one
      ansible.builtin.command:
        cmd: podman volume rm lex-probe-two
      changed_when: true
      become: true
