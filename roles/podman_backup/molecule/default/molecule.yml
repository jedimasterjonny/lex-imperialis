---
# Two platforms, one per distribution the role deploys to: auspex runs it on
# Debian. The role branches on nothing, so the second platform proves the engine
# on that distribution — its package module, quadlets under Debian's podman —
# and no more.
platforms:
  # Incus rejects underscores in instance names, so the label is hyphenated even
  # though the role is podman_backup.
  - name: "lex-podman-backup-incus-${MOLECULE_RUN_ID:-local}"
    image: images:opensuse/tumbleweed/cloud
    groups:
      - opensuse
    # podman mounts overlays for its storage, which incus only permits in a
    # nested-container-capable instance. The CI runner's AppArmor denies nested
    # runtime's sysctl fd-reopen, so drop the profile — the instance is throwaway.
    config:
      security.nesting: "true"
      raw.lxc: lxc.apparmor.profile=unconfined
  - name: "lex-podman-backup-debian-${MOLECULE_RUN_ID:-local}"
    image: images:debian/13/cloud
    groups:
      - debian
    config:
      security.nesting: "true"
      raw.lxc: lxc.apparmor.profile=unconfined
provisioner:
  inventory:
    group_vars:
      all:
        # Deliberately not the role default (Wed 01:00), which is what both hosts
        # running this role actually take — so converging on it would prove only
        # that the default equals itself and would leave the pass-through to
        # restic_backup_oncalendar untested. One source, read by converge as the
        # input and by verify as the expectation.
        podman_backup_oncalendar: "Tue *-*-* 04:00:00"
