---
- name: Verify
  hosts: all
  gather_facts: false
  vars_files:
    - ../../defaults/main.yml
  tasks:
    - name: Wait for the metrics endpoint
      ansible.builtin.uri:
        url: http://127.0.0.1:9100/metrics
        return_content: true
      register: node_exporter_metrics
      until: node_exporter_metrics.status == 200
      retries: 30
      delay: 2

    - name: Host metrics are exported
      ansible.builtin.assert:
        that: "'node_cpu_seconds_total' in node_exporter_metrics.content"
        fail_msg: node_exporter served no node_cpu_seconds_total metric

    # Prove the textfile collector reads the host directory through the /host
    # bind: drop a probe metric and confirm the exporter serves it.
    - name: Drop a probe metric into the textfile directory
      ansible.builtin.copy:
        content: |
          # HELP node_textfile_probe molecule textfile collector probe.
          # TYPE node_textfile_probe gauge
          node_textfile_probe 42
        dest: "{{ node_exporter_textfile_directory }}/probe.prom"
        owner: root
        group: root
        mode: "0644"
      become: true

    - name: The probe metric is exported
      ansible.builtin.uri:
        url: http://127.0.0.1:9100/metrics
        return_content: true
      register: node_exporter_textfile
      until: "'node_textfile_probe 42' in node_exporter_textfile.content"
      retries: 15
      delay: 2

    # The systemd collector reads the host D-Bus bus; its restart counter feeds
    # prometheus's ServiceRestartStorm alert. success 1 proves the collector is
    # enabled and connected — 0 (or absent) means the alert has no data to fire on.
    - name: The systemd collector is scraping successfully
      ansible.builtin.uri:
        url: http://127.0.0.1:9100/metrics
        return_content: true
      register: node_exporter_systemd
      until: "'node_scrape_collector_success{collector=\"systemd\"} 1' in node_exporter_systemd.content"
      retries: 15
      delay: 2

    # unit-include admits the fstab-generated nfs-<name>.mount units so that an NFS
    # share going away has something reporting it (prometheus's NfsShareUnmounted).
    # Reading the rendered Exec= line back would only prove Ansible wrote what
    # Ansible wrote — and would have passed while the collector's default
    # unit-exclude, applied after the include, dropped every mount unit again. So
    # scrape a real one instead, in both of the states the alert turns on.
    - name: Remount the fixture share
      ansible.builtin.systemd_service:
        name: nfs-fixture.mount
        state: started
      become: true

    - name: The mounted fixture share is exported as active
      ansible.builtin.uri:
        url: http://127.0.0.1:9100/metrics
        return_content: true
      register: node_exporter_mounted
      until: >-
        node_exporter_mounted.content is
        search('node_systemd_unit_state[{]name="nfs-fixture[.]mount",state="active"[^}]*[}] 1')
      retries: 15
      delay: 2

    # The include is a filter, not a licence. Every other mount unit the host runs
    # (-.mount, dev-mqueue.mount, the podman overlay mounts) stays out, or the fleet
    # pays six series per mount unit for one rule that only ever reads nfs-.
    - name: No mount unit outside the nfs- prefix is exported
      vars:
        node_exporter_mount_units: >-
          {{ node_exporter_mounted.content
             | regex_findall('node_systemd_unit_state[{]name="([^"]+[.]mount)"')
             | unique | sort }}
      ansible.builtin.assert:
        that: node_exporter_mount_units | reject('match', 'nfs-') | list == []
        fail_msg: "the systemd collector exported mount units outside nfs-: {{ node_exporter_mount_units }}"
        quiet: true

    # NfsShareUnmounted is `state="active" == 0`, so the series has to SURVIVE the
    # unmount: a unit systemd unloaded would take it to an empty vector, where == 0
    # matches nothing and the alert can never fire. An out-of-band umount rather than
    # a stop, because that is what NetworkManager's stock nfs dispatcher did to the
    # fleet's shares — the fault this alert exists to report — and systemd reaches
    # the inactive state by a different road when it is not the one unmounting. Its
    # -f is dropped: an unprivileged container refuses the forced path outright
    # ("block devices are not permitted on filesystem"), and the lazy detach is what
    # takes the mount out of mountinfo either way.
    - name: Unmount the fixture share the way the fault does
      ansible.builtin.command: umount -l /nfs/fixture
      become: true
      changed_when: true

    - name: The unmounted fixture share still reports, at zero
      ansible.builtin.uri:
        url: http://127.0.0.1:9100/metrics
        return_content: true
      register: node_exporter_unmounted
      until: >-
        node_exporter_unmounted.content is
        search('node_systemd_unit_state[{]name="nfs-fixture[.]mount",state="active"[^}]*[}] 0')
      retries: 15
      delay: 2

    # unit-exclude drops podman's per-healthcheck transient units, which were 354 of
    # the 979 unit names the fleet reported over 30 days and spend ~5m failed around
    # every reboot and container recreation — pending SystemdUnitFailed the whole
    # time. Asserted on the shape rather than on converge's literal, so the two files
    # cannot drift into a check that passes by naming a unit nothing created; the
    # loaded list is read back for the same reason, as an empty exported set proves
    # nothing if the fixture was never there.
    - name: Read the units systemd has loaded
      ansible.builtin.service_facts:
      become: true

    - name: A transient healthcheck unit is loaded and kept out of the scrape
      vars:
        node_exporter_healthcheck_loaded: >-
          {{ ansible_facts.services | select('match', '[0-9a-f]{64}-[0-9a-f]+[.]service') | list }}
        node_exporter_healthcheck_exported: >-
          {{ node_exporter_unmounted.content
             | regex_findall('node_systemd_unit_state[{]name="([0-9a-f]{64}-[0-9a-f]+[.]service)"') }}
      ansible.builtin.assert:
        that:
          - node_exporter_healthcheck_loaded | length > 0
          - node_exporter_healthcheck_exported | length == 0
        fail_msg: >-
          loaded={{ node_exporter_healthcheck_loaded }}
          exported={{ node_exporter_healthcheck_exported }} — an empty loaded list means
          the fixture never started, a non-empty exported list means unit-exclude missed it
        quiet: true

    # The timex collector reads the kernel clock-sync flag via adjtimex, which the
    # default seccomp profile gates behind CAP_SYS_TIME; success 1 proves that cap
    # is granted and the collector reads — 0 (or absent) means ClockNotSynchronised
    # has no data to fire on, so this makes the AddCapability line load-bearing.
    - name: The timex collector is scraping successfully
      ansible.builtin.uri:
        url: http://127.0.0.1:9100/metrics
        return_content: true
      register: node_exporter_timex
      until: "'node_scrape_collector_success{collector=\"timex\"} 1' in node_exporter_timex.content"
      retries: 15
      delay: 2

    # The collector probes above prove the cap set is sufficient; they can't prove
    # it is minimal. Assert the posture directly so a regression that widens the
    # caps or drops the restriction fails here, not silently in production.
    - name: Read node-exporter's security posture
      ansible.builtin.command: podman inspect node-exporter
      become: true
      register: node_exporter_inspect
      changed_when: false

    # BoundingCaps is the container's cap ceiling: CAP_SYS_TIME (timex) and
    # nothing more.
    - name: The node-exporter container keeps only CAP_SYS_TIME and bars privilege escalation
      vars:
        node_exporter: "{{ node_exporter_inspect.stdout | from_json | first }}"
      ansible.builtin.assert:
        that:
          - "node_exporter.BoundingCaps | default([], true) | sort == ['CAP_SYS_TIME']"
          - "'no-new-privileges' in (node_exporter.HostConfig.SecurityOpt | default([], true))"
        fail_msg: "node-exporter's capability or no-new-privileges posture has regressed"
        quiet: true

    # A non-root user is this container's load-bearing security property, not a
    # detail. It mounts the host D-Bus system bus, and systemd authorises Manager
    # calls by uid: as nobody, StartTransientUnit is refused where root succeeds, so
    # the socket is a read-only view of unit state rather than arbitrary root. That
    # comes from the *image* (`USER nobody`), not from anything this role sets — so
    # an upstream image dropping it would silently turn the mount into a root
    # escalation with nothing else here to notice. Hence assert the user, not just
    # the caps.
    #
    # The rest is the other half of the posture: --privileged, an extra
    # security-opt, a borrowed namespace or a widened mount set all leave
    # BoundingCaps untouched. The mount set is an equality, not a substring, so an
    # *added* bind fails too.
    - name: The node-exporter container runs as a non-root user and takes no escape hatch
      vars:
        node_exporter: "{{ node_exporter_inspect.stdout | from_json | first }}"
      ansible.builtin.assert:
        that:
          - node_exporter.Config.User | default('', true) not in ['', '0', 'root']
          - not (node_exporter.HostConfig.Privileged | default(false, true))
          - node_exporter.HostConfig.SecurityOpt | default([], true) | sort == ['label=disable', 'no-new-privileges']
          - node_exporter.HostConfig.NetworkMode | default('', true) == 'host'
          - node_exporter.HostConfig.PidMode | default('', true) == 'host'
          - node_exporter.HostConfig.IpcMode | default('', true) != 'host'
          - >-
            node_exporter.HostConfig.Binds | default([], true)
            | map('regex_replace', ':[^:]*$', '') | sort
            == ['/:/host', '/run/dbus/system_bus_socket:/var/run/dbus/system_bus_socket']
        fail_msg: >-
          node-exporter's user, namespace or mount posture has regressed —
          User={{ node_exporter.Config.User | default('', true) }}
          PidMode={{ node_exporter.HostConfig.PidMode | default('', true) }}
          Binds={{ node_exporter.HostConfig.Binds | default([], true) }}
        quiet: true
