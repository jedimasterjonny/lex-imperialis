---
- name: Converge
  hosts: all
  vars:
    # A 64-hex container id and a hex run suffix, the shape podman gives a
    # healthcheck's transient unit. verify matches on the shape, not this literal.
    node_exporter_healthcheck_fixture: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef-a1b2c3d4e5f60718
  tasks:
    # A stand-in for the fstab-generated nfs-<name>.mount units the nfs role
    # produces on the fleet — the series prometheus's NfsShareUnmounted reads, and
    # the only reason the systemd collector's unit-include admits mount units at
    # all. tmpfs because a container has no NAS to reach; the collector filters on
    # the unit name.
    #
    # RequiredBy=remote-fs.target is not decoration. systemd-fstab-generator writes
    # exactly that symlink for a _netdev entry, and it is what keeps the unit loaded
    # once it goes inactive: an unreferenced mount unit is garbage-collected the
    # moment it stops, taking its series out of the scrape entirely rather than to
    # zero — measured, with an earlier draft of this fixture that omitted the
    # [Install] section and left verify's unmounted assertion reading no series at
    # all. NfsShareUnmounted is `== 0`, so that would be a rule that can never fire.
    - name: Install a fixture NFS-shaped mount unit
      ansible.builtin.copy:
        content: |
          [Unit]
          Description=molecule fixture for the systemd collector's unit filter

          [Mount]
          What=tmpfs
          Where=/nfs/fixture
          Type=tmpfs
          Options=size=1M

          [Install]
          RequiredBy=remote-fs.target
        dest: /etc/systemd/system/nfs-fixture.mount
        owner: root
        group: root
        mode: "0644"
      become: true

    - name: Start the fixture mount unit
      ansible.builtin.systemd_service:
        name: nfs-fixture.mount
        enabled: true
        state: started
        daemon_reload: true
      become: true

    # The other half of the unit filter: podman starts one transient
    # <container id>-<hex>.service per container healthcheck run, and unit-exclude
    # drops them. Really transient, via systemd-run, because that is what podman
    # does — a unit file on disk would test the regex against a shape the collector
    # never actually meets. Guarded rather than made idempotent by systemd: a second
    # systemd-run under a live unit name fails outright.
    - name: Read the units systemd has loaded
      ansible.builtin.service_facts:
      become: true

    - name: Start a transient unit named like a podman container healthcheck
      ansible.builtin.command: systemd-run --quiet --unit={{ node_exporter_healthcheck_fixture }} sleep 3600
      become: true
      changed_when: true
      when: (node_exporter_healthcheck_fixture ~ '.service') not in ansible_facts.services

    - name: Apply the podman role
      ansible.builtin.include_role:
        name: podman

    - name: Apply the node_exporter role
      ansible.builtin.include_role:
        name: node_exporter
