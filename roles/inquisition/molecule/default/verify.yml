---
- name: Verify
  hosts: all
  gather_facts: false
  vars_files:
    - ../../defaults/main.yml
  vars:
    inquisition_prom: "{{ inquisition_textfile_dir }}/inquisition.prom"
    inquisition_run_prom: "{{ inquisition_textfile_dir }}/inquisition-run.prom"
    inquisition_probe_quadlet: "{{ inquisition_quadlet_dir }}/probe-unit.container"
  tasks:
    - name: Stat the drift check and metric scripts
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - "{{ inquisition_script }}"
        - "{{ inquisition_metric_script }}"
      register: inquisition_scripts
      become: true

    - name: The scripts are installed and executable
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.executable
        fail_msg: "{{ item.item }} is missing or not executable"
        quiet: true
      loop: "{{ inquisition_scripts.results }}"
      loop_control:
        label: "{{ item.item }}"

    # daemon_reload is a no-op read here: it makes the module gather and return
    # the unit's systemctl-show properties to assert against.
    - name: Read the drift check timer's state
      ansible.builtin.systemd_service:
        name: inquisition.timer
        daemon_reload: true
      register: inquisition_timer
      become: true

    - name: The timer is enabled and fires hourly
      ansible.builtin.assert:
        that:
          - inquisition_timer.status.ActiveState == 'active'
          - inquisition_timer.status.UnitFileState == 'enabled'
          - "'*:37' in inquisition_timer.status.TimersCalendar"
        fail_msg: "the drift check timer is not enabled on the hourly cadence"
        quiet: true

    # Started by the role, so a :37 tick could land mid-verify and rewrite the
    # outcome file under the arms below. The unit stays; only the schedule goes.
    - name: Stop the timer for the duration of the checks
      ansible.builtin.systemd_service:
        name: inquisition.timer
        state: stopped
      become: true

    # ── Healthy arm: one declared, pinned, running container — no offenders.
    # Fired as the unit, not as the script: starting a oneshot blocks until it
    # exits, so both files below are what ExecStart and ExecStopPost actually
    # wrote. The later arms drive the script directly — they exercise its
    # classification, which the wiring no longer has to be asserted through.
    - name: Fire the drift check against the healthy state
      ansible.builtin.systemd_service:
        name: inquisition.service
        state: started
      become: true

    - name: Read the drift metrics after the healthy run
      ansible.builtin.slurp:
        src: "{{ inquisition_prom }}"
      register: inquisition_healthy
      become: true

    - name: A healthy host records no offender in any class
      vars:
        prom: "{{ inquisition_healthy.content | b64decode }}"
      ansible.builtin.assert:
        that:
          - "'inquisition_offender{' not in prom"
          - "'inquisition_containers_checked 1\n' in prom"
        fail_msg: "the healthy state did not record clean"
        quiet: true

    - name: Read the outcome metric the unit's hook wrote
      ansible.builtin.slurp:
        src: "{{ inquisition_run_prom }}"
      register: inquisition_run_unit
      become: true

    # The ExecStopPost wiring, asserted by its effect rather than by grepping
    # the unit for a path: a real run recorded its own success.
    - name: The unit's hook recorded the run as successful
      vars:
        prom: "{{ inquisition_run_unit.content | b64decode }}"
      ansible.builtin.assert:
        that:
          - "'inquisition_success 1' in prom"
          - "'inquisition_last_run_timestamp_seconds ' in prom"
        fail_msg: "the service's ExecStopPost hook did not record a successful run"
        quiet: true

    # ── Unmanaged arm: a container no quadlet declares.
    - name: Start an undeclared container
      ansible.builtin.command:
        cmd: podman run -d --network host --name interloper {{ inquisition_probe_image }} sleep 86400
      changed_when: true
      become: true

    - name: Run the drift check against the interloper
      ansible.builtin.command: "{{ inquisition_script }}"
      changed_when: false
      become: true

    - name: Read the drift metrics after the interloper run
      ansible.builtin.slurp:
        src: "{{ inquisition_prom }}"
      register: inquisition_unmanaged
      become: true

    - name: The interloper is named as an unmanaged offender
      vars:
        prom: "{{ inquisition_unmanaged.content | b64decode }}"
      ansible.builtin.assert:
        that:
          - "'inquisition_offender{class=\"unmanaged\",container=\"interloper\"} 1' in prom"
        fail_msg: "an undeclared container was not flagged unmanaged"
        quiet: true

    - name: Remove the interloper
      ansible.builtin.command:
        cmd: podman rm -f interloper
      changed_when: true
      become: true

    # ── Digest arm: rewrite the quadlet's pin without touching the container —
    # the handler-that-never-fired shape. No daemon-reload: the check compares
    # the file against the runtime, systemd's view of the unit is irrelevant.
    - name: Read the probe quadlet
      ansible.builtin.slurp:
        src: "{{ inquisition_probe_quadlet }}"
      register: inquisition_probe_content
      become: true

    - name: Rewrite the probe's pin to a digest it is not running
      ansible.builtin.replace:
        path: "{{ inquisition_probe_quadlet }}"
        regexp: '@sha256:[0-9a-f]+'
        replace: "@sha256:{{ '0' * 64 }}"
      become: true

    - name: Run the drift check against the rewritten pin
      ansible.builtin.command: "{{ inquisition_script }}"
      changed_when: false
      become: true

    - name: Read the drift metrics after the digest run
      ansible.builtin.slurp:
        src: "{{ inquisition_prom }}"
      register: inquisition_digest
      become: true

    # The interloper's absence is the other half: the check reads live state on
    # every run and keeps no ratchet, so a removed offender clears itself.
    - name: The probe is named as a digest offender and the interloper has cleared
      vars:
        prom: "{{ inquisition_digest.content | b64decode }}"
      ansible.builtin.assert:
        that:
          - "'inquisition_offender{class=\"digest\",container=\"probe\"} 1' in prom"
          - "'interloper' not in prom"
        fail_msg: "a running container off its pinned digest was not flagged, or a removed one persisted"
        quiet: true

    - name: Restore the probe quadlet
      ansible.builtin.copy:
        content: "{{ inquisition_probe_content.content | b64decode }}"
        dest: "{{ inquisition_probe_quadlet }}"
        owner: root
        group: root
        mode: "0644"
      become: true

    # ── Inactive arm: declared and pinned, never started. No daemon-reload
    # needed — systemctl show reports ActiveState=inactive for a unit it has
    # never loaded. Pinned deliberately: an inactive container must short-circuit
    # before the digest compare, or every stopped service would also read as
    # digest drift the moment podman could not inspect it.
    - name: Declare a pinned quadlet that is not running
      ansible.builtin.copy:
        content: |
          [Unit]
          Description=Inquisition idle probe
          [Container]
          ContainerName=idle
          Image={{ inquisition_probe_image }}@sha256:{{ '0' * 64 }}
          Exec=sleep 86400
        dest: "{{ inquisition_quadlet_dir }}/idle.container"
        owner: root
        group: root
        mode: "0644"
      become: true

    - name: Run the drift check against the idle quadlet
      ansible.builtin.command: "{{ inquisition_script }}"
      changed_when: false
      become: true

    - name: Read the drift metrics after the inactive run
      ansible.builtin.slurp:
        src: "{{ inquisition_prom }}"
      register: inquisition_inactive
      become: true

    - name: The idle quadlet is inactive only, and counted
      vars:
        prom: "{{ inquisition_inactive.content | b64decode }}"
      ansible.builtin.assert:
        that:
          - "'inquisition_offender{class=\"inactive\",container=\"idle\"} 1' in prom"
          - "'inquisition_offender{class=\"digest\",container=\"idle\"} 1' not in prom"
          - "'inquisition_containers_checked 2\n' in prom"
        fail_msg: "a declared-but-not-running quadlet was not flagged, or was also read as digest drift"
        quiet: true

    # ── Unpinned arm: a tag-only Image=. Also never started, so it is two
    # findings at once and both must say so.
    - name: Declare a quadlet pinned by tag alone
      ansible.builtin.copy:
        content: |
          [Unit]
          Description=Inquisition unpinned probe
          [Container]
          ContainerName=floater
          Image={{ inquisition_probe_image }}
          Exec=sleep 86400
        dest: "{{ inquisition_quadlet_dir }}/floater.container"
        owner: root
        group: root
        mode: "0644"
      become: true

    - name: Run the drift check against the unpinned quadlet
      ansible.builtin.command: "{{ inquisition_script }}"
      changed_when: false
      become: true

    - name: Read the drift metrics after the unpinned run
      ansible.builtin.slurp:
        src: "{{ inquisition_prom }}"
      register: inquisition_unpinned
      become: true

    - name: The tag-only quadlet is named unpinned and inactive
      vars:
        prom: "{{ inquisition_unpinned.content | b64decode }}"
      ansible.builtin.assert:
        that:
          - "'inquisition_offender{class=\"unpinned\",container=\"floater\"} 1' in prom"
          - "'inquisition_offender{class=\"inactive\",container=\"floater\"} 1' in prom"
        fail_msg: "a tag-only quadlet was not flagged unpinned"
        quiet: true

    - name: Remove the fault-injection quadlets
      ansible.builtin.file:
        path: "{{ inquisition_quadlet_dir }}/{{ item }}"
        state: absent
      loop:
        - idle.container
        - floater.container
      become: true

    # ── Vacuum arm: no declarations at all. The denominator QuadletsDisappeared
    # reads is only publishable if the check survives an empty glob, and a bash
    # array that is declared but never assigned does not survive set -u — so the
    # alert would have been unfirable by construction. The probe keeps running,
    # so it turns unmanaged, which is what a host that lost its quadlets looks
    # like.
    - name: Move the probe declaration out of the quadlet directory
      ansible.builtin.command:
        cmd: mv {{ inquisition_probe_quadlet }} /tmp/probe-unit.container
        removes: "{{ inquisition_probe_quadlet }}"
      become: true

    - name: Run the drift check with nothing declared
      ansible.builtin.command: "{{ inquisition_script }}"
      changed_when: false
      become: true

    - name: Read the drift metrics after the vacuum run
      ansible.builtin.slurp:
        src: "{{ inquisition_prom }}"
      register: inquisition_vacuum
      become: true

    - name: A host with no declarations publishes a zero denominator
      vars:
        prom: "{{ inquisition_vacuum.content | b64decode }}"
      ansible.builtin.assert:
        that:
          - "'inquisition_containers_checked 0\n' in prom"
          - "'inquisition_offender{class=\"unmanaged\",container=\"probe\"} 1' in prom"
        fail_msg: "the check did not survive an empty quadlet directory"
        quiet: true

    - name: Restore the probe declaration
      ansible.builtin.command:
        cmd: mv /tmp/probe-unit.container {{ inquisition_probe_quadlet }}
        removes: /tmp/probe-unit.container
      become: true

    - name: Run the drift check against the restored state
      ansible.builtin.command: "{{ inquisition_script }}"
      changed_when: false
      become: true

    - name: Read the drift metrics after the restore
      ansible.builtin.slurp:
        src: "{{ inquisition_prom }}"
      register: inquisition_restored
      become: true

    - name: The restored state records clean again
      vars:
        prom: "{{ inquisition_restored.content | b64decode }}"
      ansible.builtin.assert:
        that:
          - "'inquisition_offender{' not in prom"
          - "'inquisition_containers_checked 1\n' in prom"
        fail_msg: "the restored state did not record clean"
        quiet: true

    # ── Failure arm: the healthy unit fire above already recorded the success
    # path, and an ExecStart failure cannot be forced in a container — so drive
    # the hook the way systemd would on a failed run.
    - name: Run the metric hook as a failed run would
      ansible.builtin.command: "{{ inquisition_metric_script }}"
      environment:
        SERVICE_RESULT: exit-code
      changed_when: false
      become: true

    - name: Read both files after the simulated failure
      ansible.builtin.slurp:
        src: "{{ item }}"
      loop:
        - "{{ inquisition_run_prom }}"
        - "{{ inquisition_prom }}"
      register: inquisition_after_fail
      become: true

    # The whole point of the two-file split: the hook records the failure without
    # zeroing offenders it never measured. Asserting the payload is untouched
    # means reading the payload — the outcome file could never hold an offender
    # line, so asserting its absence there proves nothing.
    - name: A failed run records the failure and leaves the payload untouched
      vars:
        run_prom: "{{ inquisition_after_fail.results[0].content | b64decode }}"
        payload: "{{ inquisition_after_fail.results[1].content | b64decode }}"
      ansible.builtin.assert:
        that:
          - "'inquisition_success 0' in run_prom"
          - "payload == (inquisition_restored.content | b64decode)"
        fail_msg: "the outcome metric did not report a failed run, or the payload moved"
        quiet: true
