---
- name: Prepare
  hosts: all
  become: true
  tasks:
    # Neither image carries both halves: Tumbleweed's ships the server with no
    # client, Debian's the client with no server. The role configures the server
    # and verify probes it with the client, so both have to be here — and Debian
    # spells the client package without the plural.
    - name: Install the ssh server and client
      ansible.builtin.package:
        name:
          - openssh-server
          - "{{ 'openssh-client' if 'debian' in group_names else 'openssh-clients' }}"
        state: present

    # The container image ships sshd inactive with no host keys; first start
    # generates the keys the role's validate loads. Test-only — Ansible reaches
    # fleet hosts over SSH, so sshd is already running there. On Debian the name
    # is the ssh.service alias the package's own enable installs, which is the
    # same name the role's reload handler uses.
    - name: Start sshd
      ansible.builtin.systemd_service:
        name: sshd
        state: started
