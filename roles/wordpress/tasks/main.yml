---
- name: Create the config directory
  ansible.builtin.file:
    path: /etc/wordpress
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Create the must-use plugin directory
  ansible.builtin.file:
    path: /etc/wordpress/mu-plugins
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

# Mounted read-only into the container's mu-plugins; a restart recreates the
# container, so an edited plugin is picked up off the fresh bind mount.
- name: Deploy the hardening must-use plugin
  ansible.builtin.copy:
    src: wordpress-hardening.php
    dest: /etc/wordpress/mu-plugins/wordpress-hardening.php
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Restart wordpress

# The apache drop-in that disables PHP under wp-content/uploads (the file explains
# why); container.j2 mounts it into apache's conf-enabled.
- name: Deploy the uploads no-exec apache config
  ansible.builtin.copy:
    src: uploads-no-exec.conf
    dest: /etc/wordpress/uploads-no-exec.conf
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Restart wordpress

# Split into two EnvironmentFiles so the database root password reaches only the
# database container: db.env (every MARIADB_*, root included) is read by
# wordpress-db alone, while app.env (the WORDPRESS_DB_* creds and web config) is
# read by the web container, the wp wrapper, and the dump — all authenticating as
# the non-root user. A webshell in the web container can no longer read
# MARIADB_ROOT_PASSWORD from apache's environment. Both are 0600 and read via
# EnvironmentFile=, so no password lands in a unit file.
- name: Deploy the database container credentials
  ansible.builtin.template:
    src: db.env.j2
    dest: /etc/wordpress/db.env
    owner: root
    group: root
    mode: "0600"
  become: true
  no_log: true
  notify: Restart the wordpress database

- name: Deploy the application credentials
  ansible.builtin.template:
    src: app.env.j2
    dest: /etc/wordpress/app.env
    owner: root
    group: root
    mode: "0600"
  become: true
  no_log: true
  notify: Restart wordpress

# The credentials used to render into a single wordpress.env that carried the DB
# root password into the web container's environment. Remove that now-dead file
# so the root password isn't left behind on hosts provisioned before the split.
- name: Remove the superseded combined credentials file
  ansible.builtin.file:
    path: /etc/wordpress/wordpress.env
    state: absent
  become: true

- name: Install the database container unit
  ansible.builtin.template:
    src: mariadb.container.j2
    dest: /etc/containers/systemd/wordpress-db.container
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Restart the wordpress database

- name: Install the cache container unit
  ansible.builtin.template:
    src: valkey.container.j2
    dest: /etc/containers/systemd/wordpress-valkey.container
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Restart the wordpress cache

# The cache was renamed when it moved from redis to valkey. Stop the superseded
# container while its generated unit still exists — stopping removes the
# container too — then drop the quadlet.
- name: Check for the superseded redis cache unit
  ansible.builtin.stat:
    path: /etc/containers/systemd/wordpress-redis.container
  register: wordpress_redis_unit
  become: true

- name: Stop the superseded redis cache
  ansible.builtin.systemd_service:
    name: wordpress-redis
    state: stopped
  when: wordpress_redis_unit.stat.exists
  become: true

- name: Remove the superseded redis cache unit
  ansible.builtin.file:
    path: /etc/containers/systemd/wordpress-redis.container
    state: absent
  become: true
  notify: Reload systemd for wordpress

- name: Install the wordpress container unit
  ansible.builtin.template:
    src: wordpress.container.j2
    dest: /etc/containers/systemd/wordpress.container
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Restart wordpress

# caddy refuses to adapt a Caddyfile that puts TLS connection policies on an
# http:// site ("server listening on [:80] is HTTP, but attempts to configure TLS
# connection policies"), and a Caddyfile that will not parse crash-loops the
# proxy every site on the host sits behind. Fail the play on the typo instead.
- name: Assert origin pull is only asked for on a TLS vhost
  ansible.builtin.assert:
    that:
      - wordpress_tls
    fail_msg: >-
      wordpress_origin_pull needs wordpress_tls — caddy will not parse
      client_auth on an http:// site
    quiet: true
  when: wordpress_origin_pull

# Cloudflare's public Origin Pull CA, the one issuer of the client certificate
# the edge presents. Expires 2029-11-01; Cloudflare publishes the replacement at
# developers.cloudflare.com/ssl/static/authenticated_origin_pull_ca.pem.
- name: Deploy the Cloudflare origin pull CA
  ansible.builtin.copy:
    src: cloudflare-origin-pull-ca.pem
    dest: /etc/caddy/cloudflare-origin-pull-ca.pem
    owner: root
    group: root
    mode: "0644"
  become: true
  when: wordpress_origin_pull
  notify: Restart caddy for wordpress

# WordPress is public — it serves its own domains, not a wildcard subdomain —
# so it registers a full site block in /etc/caddy/sites-public, which the caddy
# role imports at the top level.
- name: Register wordpress with the reverse proxy
  ansible.builtin.template:
    src: wordpress.caddy.j2
    dest: /etc/caddy/sites-public/wordpress.caddy
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Restart caddy for wordpress

# Wrapper over the official cli image, so `wp <command>` manages the live site.
- name: Install the wp-cli wrapper
  ansible.builtin.template:
    src: wp.j2
    dest: /usr/local/bin/wp
    owner: root
    group: root
    mode: "0755"
  become: true

# A portable logical dump of the database, recoverable after a failed in-place
# MARIADB_AUTO_UPGRADE — restic otherwise only sweeps the cold raw datadir, which
# a newer engine may refuse to mount. Runs via the db-dump timer below.
- name: Install the database backup wrapper
  ansible.builtin.template:
    src: wp-db-dump.j2
    dest: /usr/local/bin/wp-db-dump
    owner: root
    group: root
    mode: "0755"
  become: true

# wordpress-db-dump.service's ExecStopPost hook: records each dump's outcome as a
# node_exporter textfile metric so the silently-stale DR dump alerts instead.
- name: Install the database backup metric script
  ansible.builtin.template:
    src: wp-db-dump-metric.sh.j2
    dest: /usr/local/sbin/wp-db-dump-metric.sh
    owner: root
    group: root
    mode: "0755"
  vars:
    run_metric_textfile_dir: "{{ wordpress_textfile_dir }}"
    run_metric_name: wordpress_db_dump
    run_metric_file: wordpress-db-dump
    run_metric_description: WordPress database dump
  become: true

# wordpress-update-check.service's ExecStart: counts the pending core, plugin,
# theme, and translation updates and writes them as a node_exporter textfile
# metric so an install falling behind alerts instead of drifting unseen.
- name: Install the update-check metric script
  ansible.builtin.template:
    src: wp-update-check.sh.j2
    dest: /usr/local/sbin/wp-update-check.sh
    owner: root
    group: root
    mode: "0755"
  become: true

# wordpress-boost.service's ExecStart: publishes the health of Jetpack
# Boost's critical CSS. Boost's free tier generates that CSS in the browser, so
# the host can only report it — a plugin update silently resetting the state
# otherwise leaves the site serving stale CSS unseen.
- name: Install the boost metric script
  ansible.builtin.template:
    src: wp-boost.sh.j2
    dest: /usr/local/sbin/wp-boost.sh
    owner: root
    group: root
    mode: "0755"
  become: true

# wordpress-cron.service's ExecStopPost hook: records each cron run's outcome as a
# node_exporter textfile metric so a wp-cron timer that stops firing alerts
# instead of silently stalling scheduled tasks.
- name: Install the cron metric script
  ansible.builtin.template:
    src: wp-cron-metric.sh.j2
    dest: /usr/local/sbin/wp-cron-metric.sh
    owner: root
    group: root
    mode: "0755"
  vars:
    run_metric_textfile_dir: "{{ wordpress_textfile_dir }}"
    run_metric_name: wordpress_cron
    run_metric_file: wordpress-cron
    run_metric_description: WordPress cron
  become: true

# Static units for the role's four timers: wp-cron takes scheduled tasks off
# visitor page-loads (DISABLE_WP_CRON in the env), the daily db-dump writes a
# logical backup podman_backup's restic sweep then captures alongside the
# datadir, the six-hourly update-check publishes the pending-update metric, and
# the boost check publishes the critical-CSS one.
- name: Install the wp-cron, database-backup, update-check, and boost units
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - wordpress-cron.service
    - wordpress-cron.timer
    - wordpress-db-dump.service
    - wordpress-db-dump.timer
    - wordpress-update-check.service
    - wordpress-update-check.timer
    - wordpress-boost.service
    - wordpress-boost.timer
  become: true

# Quadlet units only exist after the daemon reload, so apply pending restarts
# before asserting the services are up.
- name: Apply pending unit changes
  ansible.builtin.meta: flush_handlers

- name: Start the containers
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: started
  loop:
    - wordpress-valkey
    - wordpress-db
    - wordpress
  become: true

# daemon_reload picks up the new units before enabling; it does not report
# changed, so the task stays idempotent.
- name: Enable the wp-cron timer
  ansible.builtin.systemd_service:
    name: wordpress-cron.timer
    enabled: true
    state: started
    daemon_reload: true
  become: true

# The reload above registered this unit too, so enabling it needs no second one.
- name: Enable the database-backup timer
  ansible.builtin.systemd_service:
    name: wordpress-db-dump.timer
    enabled: true
    state: started
  become: true

# Registered by the same reload, so enabling it needs no further daemon_reload.
- name: Enable the update-check timer
  ansible.builtin.systemd_service:
    name: wordpress-update-check.timer
    enabled: true
    state: started
  become: true

# Registered by the same reload as the units above.
- name: Enable the boost timer
  ansible.builtin.systemd_service:
    name: wordpress-boost.timer
    enabled: true
    state: started
  become: true
