---
# Public domains the site answers on. The caddy public-site block reverse-
# proxies them all to the wordpress container; WordPress canonicalises between
# them (e.g. www -> apex) from its own siteurl. Point DNS for each at the host.
wordpress_domains:
  - "wordpress.{{ caddy_domain | default('home.arpa') }}"

# Front the domains with TLS: the caddy global acme_dns issues the cert via
# DNS-01 before any A record points here. Molecule sets it false to stay on
# plain HTTP with no ACME.
wordpress_tls: true

# Require Cloudflare's Authenticated Origin Pulls client certificate on the TLS
# handshake, so only the edge can reach the site and a leaked origin IP buys
# nothing. Needs wordpress_tls, and the zone's own AOP setting on first — turned
# on here while the edge still sends no certificate takes the site down. Off by
# default: it locks out every caller that is not Cloudflare.
wordpress_origin_pull: false

# Container only: the site's own timezone is a database option, so this moves log
# timestamps and mariadb's NOW(), not the times the site displays.
wordpress_timezone: Europe/London

# Memory ceiling for the valkey object cache; it evicts LRU keys past this and
# keeps nothing on disk.
wordpress_valkey_maxmemory: 256mb

# Database the wordpress container connects to; mariadb creates the database and
# user on first init. Not secret — the passwords are.
wordpress_db_name: wordpress
wordpress_db_user: wordpress

# node_exporter textfile-collector directory the role's metric writers publish to
# (wordpress-db-dump.prom, wordpress-updates.prom). Must match the node_exporter
# role's node_exporter_textfile_directory so Prometheus scrapes what they write.
wordpress_textfile_dir: /var/lib/node_exporter/textfile_collector

# Database passwords (vault-sourced). Empty leaves the stack uninitialised:
# mariadb needs them to create the database on first boot. Molecule sets
# throwaway values; the fleet sources them from the vault.
wordpress_db_password: ""
wordpress_db_root_password: ""
