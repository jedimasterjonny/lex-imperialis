---
# The database before wordpress: wordpress reconnects, but starting them in
# order spares it the failed first attempts.
- name: Restart the wordpress database
  ansible.builtin.systemd_service:
    name: wordpress-db
    state: restarted
    daemon_reload: true
  become: true

- name: Restart the wordpress cache
  ansible.builtin.systemd_service:
    name: wordpress-valkey
    state: restarted
    daemon_reload: true
  become: true

- name: Restart wordpress
  ansible.builtin.systemd_service:
    name: wordpress
    state: restarted
    daemon_reload: true
  become: true

- name: Restart caddy for wordpress
  ansible.builtin.systemd_service:
    name: caddy
    state: restarted
  become: true
