# Managed by Ansible (wordpress role). Deny direct requests for PHP under
# wp-includes. Core loads this tree by include, never by URL, so the only such
# requests are scanners fingerprinting version.php or fatalling a block file
# outside the bootstrap — or a webshell written here, since the tree is as
# writable as uploads. Denied rather than engine off so the source is never
# served either; AllowOverride None keeps an attacker .htaccess from re-granting
# it. Static assets beside the PHP still serve (blank.gif is the healthcheck).
<Directory /var/www/html/wp-includes>
    AllowOverride None
    <FilesMatch "\.php$">
        Require all denied
    </FilesMatch>
</Directory>
