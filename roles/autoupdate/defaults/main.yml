---
# Distro-derived, not a tunable. See the README for what it switches.
autoupdate_transactional: "{{ ansible_facts['distribution'] == 'openSUSE MicroOS' }}"

# Rolling Tumbleweed upgrades the whole system with `dup`; Leap (and other point
# releases) apply vendor patches with `patch`. The whole command line is the
# variable, not just the subcommand, because the binary differs too.
autoupdate_update_command: >-
  {{ '/usr/sbin/transactional-update --non-interactive dup'
     if autoupdate_transactional | bool
     else '/usr/bin/zypper --non-interactive dup --auto-agree-with-licenses'
     if ansible_facts['distribution'] == 'openSUSE Tumbleweed'
     else '/usr/bin/zypper --non-interactive patch --auto-agree-with-licenses' }}

# node_exporter textfile-collector directory the update outcome metric is written
# to (autoupdate.prom). Must match the node_exporter role's
# node_exporter_textfile_directory so Prometheus scrapes what this writes.
autoupdate_textfile_dir: /var/lib/node_exporter/textfile_collector

# The timer's systemd OnCalendar schedule. Set per host so the fleet updates on
# staggered days; the default keeps the original fleet-wide Monday 03:00 slot.
autoupdate_oncalendar: "Mon *-*-* 03:00:00"
