---
- name: Verify
  hosts: all
  vars_files:
    - ../../defaults/main.yml
  # What each image must end up running, selected on the platform's group rather
  # than derived from the role's ternary, which would only assert that ternary
  # back at itself. Not role defaults, so the vars_files above cannot outrank
  # them.
  vars:
    autoupdate_expected_command: >-
      {{ ['/usr/bin/apt-get update',
          '/usr/bin/apt-get --yes -o Dpkg::Options::=--force-confold'
          ' -o Dpkg::Options::=--force-confdef dist-upgrade']
         if 'debian' in group_names
         else ['/usr/bin/zypper --non-interactive dup --auto-agree-with-licenses'] }}
    autoupdate_expected_masked_timers: >-
      {{ ['apt-daily.timer', 'apt-daily-upgrade.timer']
         if 'debian' in group_names
         else [] }}
  tasks:
    # daemon_reload is a no-op that just makes the module gather and return the
    # timer's systemctl-show properties to assert against; it reads, not mutates.
    - name: Read the update timer's state
      ansible.builtin.systemd_service:
        name: autoupdate.timer
        daemon_reload: true
      register: autoupdate_timer
      become: true

    - name: The timer is enabled and fires on the configured schedule
      ansible.builtin.assert:
        that:
          - autoupdate_timer.status.ActiveState == 'active'
          - autoupdate_timer.status.UnitFileState == 'enabled'
          # converge sets a non-default autoupdate_oncalendar, so matching it here
          # proves the variable drives the rendered timer.
          - "'Wed *-*-* 04:00:00' in autoupdate_timer.status.TimersCalendar"
        fail_msg: "the update timer is not enabled for the configured schedule"
        quiet: true

    - name: Read the update service definition
      ansible.builtin.systemd_service:
        name: autoupdate.service
      register: autoupdate_service
      become: true

    # Not autoupdate_service.status.ExecStart: systemd_service parses systemctl
    # show into a flat map, so a property systemd repeats — one ExecStart= per
    # update command here — keeps only its last line, and the first would go
    # unasserted while reading as though it had been checked. Ask systemd for the
    # property directly, which prints every entry.
    - name: Read the update service's ExecStart lines
      ansible.builtin.command:
        argv:
          - systemctl
          - show
          - autoupdate.service
          - --property=ExecStart
      register: autoupdate_execstart
      changed_when: false
      become: true

    - name: The service runs each of this distribution's update commands
      ansible.builtin.assert:
        that:
          # The whole argv, not a substring of it: an appended argument — say
          # --download-only — would otherwise pass while the host quietly stopped
          # patching, exiting 0 and recording a success every week.
          - "('argv[]=' ~ item ~ ' ;') in autoupdate_execstart.stdout"
        fail_msg: "the service does not run `{{ item }}`"
        quiet: true
      loop: "{{ autoupdate_expected_command }}"

    - name: The service runs those commands and nothing else
      ansible.builtin.assert:
        that:
          # Counting them is the other half: matching each expected command
          # leaves a smuggled extra ExecStart= — which oneshot would run too —
          # entirely unasserted.
          - autoupdate_execstart.stdout | regex_findall('argv\\[\\]=') | length == autoupdate_expected_command | length
        fail_msg: "the service runs update commands beyond the expected ones"
        quiet: true

    - name: The service runs unattended and reboots
      ansible.builtin.assert:
        that:
          # A changed conffile otherwise prompts and hangs the unit until
          # TimeoutStartSec on a host with nobody at the console.
          - "'DEBIAN_FRONTEND=noninteractive' in autoupdate_service.status.Environment"
          # The reboot only fires because 102/103 count as success; drop this and
          # a reboot-recommended run exits non-zero and ExecStartPost is skipped.
          - autoupdate_service.status.SuccessExitStatus == '102 103'
          # Pinned to systemctl, not just to "reboot": handing the job to
          # rebootmgr is the plausible edit here, and the one the unit template
          # argues against — it exits 0 having never rebooted.
          - "'argv[]=/usr/bin/systemctl reboot ;' in autoupdate_service.status.ExecStartPost"
          - "'autoupdate-metric.sh' in autoupdate_service.status.ExecStopPost"
        fail_msg: "the service does not run non-interactively, accept 102/103, reboot, then record the outcome"
        quiet: true

    # The Debian platform is the only tier that can prove the takeover: no tier
    # boots MicroOS, and Tumbleweed ships no competing timer, so on that platform
    # the list is empty and this loops over nothing.
    - name: Read the distribution timers this role takes over
      ansible.builtin.systemd_service:
        name: "{{ item }}"
      loop: "{{ autoupdate_expected_masked_timers }}"
      register: autoupdate_distro_timers
      become: true

    - name: The distribution's own update timers are stopped and masked
      ansible.builtin.assert:
        that:
          - item.status.UnitFileState == 'masked'
          # Not merely masked: masking a running unit leaves it running, and the
          # two timers would then be armed together for the life of the boot.
          - item.status.ActiveState == 'inactive'
        fail_msg: "{{ item.item }} is not stopped and masked"
        quiet: true
      loop: "{{ autoupdate_distro_timers.results | default([]) }}"
      loop_control:
        label: "{{ item.item }}"

    # A mirror lag that aborts the commit must heal unattended rather than strand
    # the host for a week. The two intervals carry systemd's USec property names
    # but report a formatted duration, hence '1h' and '1d' rather than a count.
    - name: A failed update retries on an hourly cadence, three times over
      ansible.builtin.assert:
        that:
          - autoupdate_service.status.Restart == 'on-failure'
          - autoupdate_service.status.RestartUSec == '1h'
          # The burst caps the retries; the interval has to exceed the retry span
          # (3h) or the cap expires mid-burst and stops bounding anything.
          - autoupdate_service.status.StartLimitBurst == '4'
          - autoupdate_service.status.StartLimitIntervalUSec == '1d'
        fail_msg: "a failed update does not retry hourly under a bounded start limit"
        quiet: true

    # Starting the service would reboot the host (ExecStartPost), so drive the
    # ExecStopPost writer directly the way systemd would — with SERVICE_RESULT set
    # — to prove it records each outcome as the metric node_exporter scrapes.
    - name: Record a successful run via the metric hook
      ansible.builtin.command: /usr/local/sbin/autoupdate-metric.sh
      environment:
        SERVICE_RESULT: success
      changed_when: false
      become: true

    - name: Read the update outcome metric after the successful run
      ansible.builtin.slurp:
        src: "{{ autoupdate_textfile_dir }}/autoupdate.prom"
      register: autoupdate_metric_ok
      become: true

    - name: A successful run records autoupdate_success 1
      ansible.builtin.assert:
        that:
          - "'autoupdate_success 1' in (autoupdate_metric_ok.content | b64decode)"
          - "'autoupdate_last_run_timestamp_seconds ' in (autoupdate_metric_ok.content | b64decode)"
        fail_msg: "the update outcome metric did not report a successful run"
        quiet: true

    - name: Record a failed run via the metric hook
      ansible.builtin.command: /usr/local/sbin/autoupdate-metric.sh
      environment:
        SERVICE_RESULT: exit-code
      changed_when: false
      become: true

    - name: Read the update outcome metric after the failed run
      ansible.builtin.slurp:
        src: "{{ autoupdate_textfile_dir }}/autoupdate.prom"
      register: autoupdate_metric_fail
      become: true

    - name: A failed run records autoupdate_success 0
      ansible.builtin.assert:
        that:
          - "'autoupdate_success 0' in (autoupdate_metric_fail.content | b64decode)"
        fail_msg: "the update outcome metric did not report a failed run"
        quiet: true

    # No tier boots MicroOS. This pins the selector's transactional branch and
    # nothing else — the defaults template lazily, so shadowing the facts they
    # read resolves them as a MicroOS host would. No role task runs here.
    - name: The defaults update transactionally on MicroOS
      ansible.builtin.assert:
        that:
          - autoupdate_update_command == ['/usr/sbin/transactional-update --non-interactive dup']
          - autoupdate_masked_timers == ['transactional-update.timer']
        fail_msg: "the defaults do not run transactional-update on MicroOS"
        quiet: true
      vars:
        ansible_facts:
          distribution: openSUSE MicroOS
          os_family: Suse
