---
- name: Verify
  hosts: all
  vars_files:
    - ../../defaults/main.yml
  # What each image must end up running, selected on the platform's group rather
  # than derived from the role's ternary, which would only assert that ternary
  # back at itself. Not role defaults, so the vars_files above cannot outrank
  # them.
  vars:
    autoupdate_expected_command: >-
      {{ ['/usr/bin/apt-get update',
          '/usr/bin/apt-get --yes -o Dpkg::Options::=--force-confold'
          ' -o Dpkg::Options::=--force-confdef dist-upgrade']
         if 'debian' in group_names
         else ['/usr/bin/zypper --non-interactive dup --auto-agree-with-licenses'] }}
    autoupdate_expected_masked_timers: >-
      {{ ['apt-daily.timer', 'apt-daily-upgrade.timer']
         if 'debian' in group_names
         else [] }}
    # A package every image ships, so the holds hook can be driven through a real
    # lock rather than a hand-written .prom — the parse is the half of that script
    # worth testing, and each distribution reports its holds differently.
    autoupdate_held_package: bash
    autoupdate_hold_argv: >-
      {{ ['apt-mark', 'hold', autoupdate_held_package]
         if 'debian' in group_names
         else ['zypper', '--non-interactive', 'addlock', autoupdate_held_package] }}
    autoupdate_unhold_argv: >-
      {{ ['apt-mark', 'unhold', autoupdate_held_package]
         if 'debian' in group_names
         else ['zypper', '--non-interactive', 'removelock', autoupdate_held_package] }}
    # A package installed only for what it pulls in, then dropped: its dependency
    # is left auto-installed and required by nothing, which is the one class the
    # cleanup removes. Built this way rather than by flagging a package auto
    # because openSUSE has no command that sets that flag — the resolver owns it
    # — so install-then-drop is the only construction both distributions share.
    # Each pair is absent from its image, so the install really does pull the
    # dependency in; an image that later ships either fails the fixture assertion
    # below rather than quietly leaving the cleanup nothing to remove.
    autoupdate_cruft_parent: "{{ 'jq' if 'debian' in group_names else 'man' }}"
    autoupdate_cruft_package: "{{ 'libjq1' if 'debian' in group_names else 'groff' }}"
  tasks:
    # daemon_reload is a no-op that just makes the module gather and return the
    # timer's systemctl-show properties to assert against; it reads, not mutates.
    - name: Read the update timer's state
      ansible.builtin.systemd_service:
        name: autoupdate.timer
        daemon_reload: true
      register: autoupdate_timer
      become: true

    - name: The timer is enabled and fires on the configured schedule
      ansible.builtin.assert:
        that:
          - autoupdate_timer.status.ActiveState == 'active'
          - autoupdate_timer.status.UnitFileState == 'enabled'
          # converge sets a non-default autoupdate_oncalendar, so matching it here
          # proves the variable drives the rendered timer.
          - "'Wed *-*-* 04:00:00' in autoupdate_timer.status.TimersCalendar"
        fail_msg: "the update timer is not enabled for the configured schedule"
        quiet: true

    - name: Read the update service definition
      ansible.builtin.systemd_service:
        name: autoupdate.service
      register: autoupdate_service
      become: true

    # Not autoupdate_service.status.ExecStart: systemd_service parses systemctl
    # show into a flat map, so a property systemd repeats — one ExecStart= per
    # update command here — keeps only its last line, and the first would go
    # unasserted while reading as though it had been checked. Ask systemd for the
    # property directly, which prints every entry.
    - name: Read the update service's ExecStart lines
      ansible.builtin.command:
        argv:
          - systemctl
          - show
          - autoupdate.service
          - --property=ExecStart
      register: autoupdate_execstart
      changed_when: false
      become: true

    - name: The service runs each of this distribution's update commands
      ansible.builtin.assert:
        that:
          # The whole argv, not a substring of it: an appended argument — say
          # --download-only — would otherwise pass while the host quietly stopped
          # patching, exiting 0 and recording a success every week.
          - "('argv[]=' ~ item ~ ' ;') in autoupdate_execstart.stdout"
        fail_msg: "the service does not run `{{ item }}`"
        quiet: true
      loop: "{{ autoupdate_expected_command }}"

    - name: The service runs those commands and nothing else
      ansible.builtin.assert:
        that:
          # Counting them is the other half: matching each expected command
          # leaves a smuggled extra ExecStart= — which oneshot would run too —
          # entirely unasserted.
          - autoupdate_execstart.stdout | regex_findall('argv\\[\\]=') | length == autoupdate_expected_command | length
        fail_msg: "the service runs update commands beyond the expected ones"
        quiet: true

    # Read directly for the same reason as ExecStart above: the unit repeats
    # ExecStartPost=, and systemd_service keeps only the last of a repeated
    # property — which is the reboot, so the holds hook before it would go
    # unasserted while reading as though it had been checked.
    - name: Read the update service's ExecStartPost lines
      ansible.builtin.command:
        argv:
          - systemctl
          - show
          - autoupdate.service
          - --property=ExecStartPost
      register: autoupdate_execstartpost
      changed_when: false
      become: true

    - name: The service runs unattended and reboots
      ansible.builtin.assert:
        that:
          # A changed conffile otherwise prompts and hangs the unit until
          # TimeoutStartSec on a host with nobody at the console.
          - "'DEBIAN_FRONTEND=noninteractive' in autoupdate_service.status.Environment"
          # The reboot only fires because 102/103 count as success; drop this and
          # a reboot-recommended run exits non-zero and ExecStartPost is skipped.
          - autoupdate_service.status.SuccessExitStatus == '102 103'
          # Pinned to systemctl, not just to "reboot": handing the job to
          # rebootmgr is the plausible edit here, and the one the unit template
          # argues against — it exits 0 having never rebooted.
          - "'argv[]=/usr/bin/systemctl reboot ;' in autoupdate_execstartpost.stdout"
          - "'autoupdate-metric.sh' in autoupdate_service.status.ExecStopPost"
        fail_msg: "the service does not run non-interactively, accept 102/103, reboot, then record the outcome"
        quiet: true

    - name: The metric hooks run after the update and before the reboot
      ansible.builtin.assert:
        that:
          # Ignore-prefixed: systemd renders the `-` as ignore_errors=yes on the
          # entry, and without it a broken metric writer fails the unit and
          # strands the host on the pre-update kernel. The cleanup carries the
          # same prefix for more than the metric's sake — it is the hook that
          # uninstalls, so a solver problem there must not cost the host its
          # reboot onto the new kernel.
          - "'autoupdate-cleanup.sh ; ignore_errors=yes' in autoupdate_execstartpost.stdout"
          - "'autoupdate-holds.sh ; ignore_errors=yes' in autoupdate_execstartpost.stdout"
          # The whole list in order, not two membership tests: ordering is the
          # point of the placement — anything after `systemctl reboot` races
          # shutdown, which is the hazard ExecStopPost has to sync against — and
          # matching each entry on its own would leave a third hook appended after
          # the reboot entirely unasserted. Reading the property directly cost the
          # incidental "reboot is last" that the flattened one gave for free.
          - >-
            autoupdate_execstartpost.stdout | regex_findall('argv\\[\\]=(\\S+)')
            == ['/usr/local/sbin/autoupdate-cleanup.sh',
                '/usr/local/sbin/autoupdate-holds.sh',
                '/usr/bin/systemctl']
        fail_msg: "the metric hooks do not run ahead of the reboot, or failing one can fail the unit"
        quiet: true

    # The Debian platform is the only tier that can prove the takeover: no tier
    # boots MicroOS, and Tumbleweed ships no competing timer, so on that platform
    # the list is empty and this loops over nothing.
    - name: Read the distribution timers this role takes over
      ansible.builtin.systemd_service:
        name: "{{ item }}"
      loop: "{{ autoupdate_expected_masked_timers }}"
      register: autoupdate_distro_timers
      become: true

    - name: The distribution's own update timers are stopped and masked
      ansible.builtin.assert:
        that:
          - item.status.UnitFileState == 'masked'
          # Not merely masked: masking a running unit leaves it running, and the
          # two timers would then be armed together for the life of the boot.
          - item.status.ActiveState == 'inactive'
        fail_msg: "{{ item.item }} is not stopped and masked"
        quiet: true
      loop: "{{ autoupdate_distro_timers.results | default([]) }}"
      loop_control:
        label: "{{ item.item }}"

    # A mirror lag that aborts the commit must heal unattended rather than strand
    # the host for a week. The two intervals carry systemd's USec property names
    # but report a formatted duration, hence '1h' and '1d' rather than a count.
    - name: A failed update retries on an hourly cadence, three times over
      ansible.builtin.assert:
        that:
          - autoupdate_service.status.Restart == 'on-failure'
          - autoupdate_service.status.RestartUSec == '1h'
          # The burst caps the retries; the interval has to exceed the retry span
          # (3h) or the cap expires mid-burst and stops bounding anything.
          - autoupdate_service.status.StartLimitBurst == '4'
          - autoupdate_service.status.StartLimitIntervalUSec == '1d'
        fail_msg: "a failed update does not retry hourly under a bounded start limit"
        quiet: true

    # Starting the service would reboot the host (ExecStartPost), so drive the
    # ExecStopPost writer directly the way systemd would — with SERVICE_RESULT set
    # — to prove it records each outcome as the metric node_exporter scrapes.
    - name: Record a successful run via the metric hook
      ansible.builtin.command: /usr/local/sbin/autoupdate-metric.sh
      environment:
        SERVICE_RESULT: success
      changed_when: false
      become: true

    - name: Read the update outcome metric after the successful run
      ansible.builtin.slurp:
        src: "{{ autoupdate_textfile_dir }}/autoupdate.prom"
      register: autoupdate_metric_ok
      become: true

    - name: A successful run records autoupdate_success 1
      ansible.builtin.assert:
        that:
          - "'autoupdate_success 1' in (autoupdate_metric_ok.content | b64decode)"
          - "'autoupdate_last_run_timestamp_seconds ' in (autoupdate_metric_ok.content | b64decode)"
        fail_msg: "the update outcome metric did not report a successful run"
        quiet: true

    - name: Record a failed run via the metric hook
      ansible.builtin.command: /usr/local/sbin/autoupdate-metric.sh
      environment:
        SERVICE_RESULT: exit-code
      changed_when: false
      become: true

    - name: Read the update outcome metric after the failed run
      ansible.builtin.slurp:
        src: "{{ autoupdate_textfile_dir }}/autoupdate.prom"
      register: autoupdate_metric_fail
      become: true

    - name: A failed run records autoupdate_success 0
      ansible.builtin.assert:
        that:
          - "'autoupdate_success 0' in (autoupdate_metric_fail.content | b64decode)"
        fail_msg: "the update outcome metric did not report a failed run"
        quiet: true

    # The holds hook, driven directly the way ExecStartPost would, across the lock
    # being set and cleared. Only two states are read: the hook is stateless — it
    # rebuilds the file from what the package manager reports right then — so what
    # it writes for a host that has never held anything is byte-identical to what
    # it writes once the hold is released, and the released read is the one whose
    # state this scenario actually built. Nothing downstream trips over a lock left
    # behind by a failure here either, since the first thing this does is set one
    # and both hold commands are idempotent — so no block/always rescue.
    - name: Hold a package back from updates
      ansible.builtin.command:
        argv: "{{ autoupdate_hold_argv }}"
      changed_when: false
      become: true

    - name: Publish the holds metric with a package held
      ansible.builtin.command: /usr/local/sbin/autoupdate-holds.sh
      changed_when: false
      become: true

    - name: Read the holds metric with a package held
      ansible.builtin.slurp:
        src: "{{ autoupdate_textfile_dir }}/autoupdate-holds.prom"
      register: autoupdate_holds_one
      become: true

    - name: Release the held package
      ansible.builtin.command:
        argv: "{{ autoupdate_unhold_argv }}"
      changed_when: false
      become: true

    - name: Publish the holds metric after the hold is released
      ansible.builtin.command: /usr/local/sbin/autoupdate-holds.sh
      changed_when: false
      become: true

    - name: Read the holds metric after the hold is released
      ansible.builtin.slurp:
        src: "{{ autoupdate_textfile_dir }}/autoupdate-holds.prom"
      register: autoupdate_holds_cleared
      become: true

    - name: The holds hook publishes the lock being set and cleared
      ansible.builtin.assert:
        that:
          # The whole line, label and value: the package name is what the alert
          # puts in front of the operator, and a parse that dropped it would still
          # emit a series the rule fires on.
          - >-
            'autoupdate_package_hold{package="' ~ autoupdate_held_package ~ '"} 1'
            in (autoupdate_holds_one.content | b64decode)
          # Dropped, not zeroed. Not for the alert's sake — `== 1` means a 0 would
          # resolve it too — but for the metric's: a hook that carried cleared
          # holds forward as zeroes would grow a series per package ever locked, on
          # every host, forever. This is the assertion that pins the rebuild.
          - "'autoupdate_package_hold{' not in (autoupdate_holds_cleared.content | b64decode)"
          # An on-disk well-formedness check, and only that: the text parser drops
          # a family carrying no samples, so a header-only file and no file at all
          # are the same thing at scrape time. It proves the hook ran and wrote
          # something parseable, not that a silent writer would be noticed — that
          # blind spot is the one the README holds as accepted.
          - "'# TYPE autoupdate_package_hold gauge' in (autoupdate_holds_cleared.content | b64decode)"
        fail_msg: "the holds hook does not publish the held and released states as the alert reads them"
        quiet: true

    # The cleanup hook, driven directly the way ExecStartPost would, across a
    # package the two tasks below deliberately strand. Whether the arm uninstalls
    # is the half worth testing — the counts it publishes afterwards are the
    # package manager's own answer to the same question the removal asked.
    # Ahead of the install, so what follows builds the same state whatever the
    # image or an earlier run left: a dependency already installed is not pulled
    # in again, and one already flagged user-installed is not unneeded however it
    # got there — leaving the cleanup nothing to remove and the assertions below
    # asserting nothing. A no-op on both images as they ship.
    - name: Clear the dependency the fixture is about to strand
      ansible.builtin.package:
        name: "{{ autoupdate_cruft_package }}"
        state: absent
      become: true

    - name: Install a package for what it pulls in
      ansible.builtin.package:
        name: "{{ autoupdate_cruft_parent }}"
        state: present
      become: true

    # Plainly absent, with no autoremove or clean_deps: the dependency then stays
    # behind auto-installed and required by nothing, which is the state the
    # cleanup exists to clear.
    - name: Drop the package again, leaving its dependency unneeded
      ansible.builtin.package:
        name: "{{ autoupdate_cruft_parent }}"
        state: absent
      become: true

    - name: Read the installed packages before the cleanup
      ansible.builtin.package_facts:
      become: true

    - name: The dropped package left its dependency behind
      ansible.builtin.assert:
        that:
          - autoupdate_cruft_package in ansible_facts.packages
        fail_msg: >-
          {{ autoupdate_cruft_package }} is not installed, so the fixture built no cruft
          and the assertions below would pass against a hook that removes nothing
        quiet: true

    # Debian only, and the recount is why. openSUSE reaches both its counts through
    # the same parse the removal is driven from, so a parse that read nothing would
    # remove nothing and fail the assertions below; apt's recount is a second,
    # independent command, and a parse that stopped matching would publish a clean
    # zero for a host that had just failed to remove anything. So block dpkg and
    # assert the count comes back non-zero — which is also the contract the README
    # states, that a failed removal still publishes what it left behind.
    - name: A blocked removal publishes what it left behind
      when: "'debian' in group_names"
      become: true
      block:
        - name: Block dpkg so the removal fails
          ansible.builtin.copy:
            content: 'DPkg::Pre-Invoke {"false";};'
            dest: /etc/apt/apt.conf.d/99-molecule-block-dpkg
            owner: root
            group: root
            mode: "0644"

        - name: Run the cleanup hook with the removal blocked
          ansible.builtin.command: /usr/local/sbin/autoupdate-cleanup.sh
          register: autoupdate_cleanup_blocked
          changed_when: false
          # The hook exits with the removal's own code, which the unit ignores and
          # the journal keeps. A zero here would mean the block never bit and the
          # assertion below was reading an ordinary successful pass.
          failed_when: autoupdate_cleanup_blocked.rc == 0

        - name: Read the cleanup metric from the blocked run
          ansible.builtin.slurp:
            src: "{{ autoupdate_textfile_dir }}/autoupdate-cleanup.prom"
          register: autoupdate_cleanup_blocked_metric

        - name: The blocked run publishes a non-zero unneeded count
          ansible.builtin.assert:
            that:
              # Non-zero rather than the exact two (the stranded dependency and the
              # one only it requires): the arithmetic is apt's, and pinning it would
              # break on a dependency change that says nothing about this hook.
              - >-
                (autoupdate_cleanup_blocked_metric.content | b64decode)
                is search('autoupdate_uncleaned_packages\{class="unneeded"\} [1-9]')
            fail_msg: "a removal that failed published no packages left to remove"
            quiet: true
      always:
        # Unblocked here rather than after the assertion: `make verify` is
        # re-runnable by design, and a drop-in left behind by a failed assertion
        # would fail every later run for a reason that has nothing to do with them.
        - name: Unblock dpkg
          ansible.builtin.file:
            path: /etc/apt/apt.conf.d/99-molecule-block-dpkg
            state: absent

    - name: Run the cleanup hook
      ansible.builtin.command: /usr/local/sbin/autoupdate-cleanup.sh
      changed_when: false
      become: true

    - name: Read the installed packages after the cleanup
      ansible.builtin.package_facts:
      become: true

    - name: Read the cleanup metric
      ansible.builtin.slurp:
        src: "{{ autoupdate_textfile_dir }}/autoupdate-cleanup.prom"
      register: autoupdate_cleanup_metric
      become: true

    - name: The cleanup uninstalls the unneeded package and publishes both classes
      ansible.builtin.assert:
        that:
          - autoupdate_cruft_package not in ansible_facts.packages
          # The count recomputed after the removal, not before it: a hook that
          # published what it found on the way in would report this host as still
          # carrying the package it had just uninstalled.
          - >-
            'autoupdate_uncleaned_packages{class="unneeded"} 0'
            in (autoupdate_cleanup_metric.content | b64decode)
          # The orphaned count is asserted numeric rather than zero: an image is
          # free to ship a package its repositories no longer offer, and the
          # number is the tool's answer either way. It pins the sample's shape,
          # not its parse — no tier has an orphan to count, so a parse that read
          # nothing would publish the same 0 as a host with none. Accepted: the
          # openSUSE arm reads orphans through the parse the removal above proves,
          # leaving only `apt list '?obsolete'` unwitnessed, and building a
          # genuine orphan to witness it means hand-rolling a package no
          # repository offers.
          - >-
            (autoupdate_cleanup_metric.content | b64decode)
            is search('autoupdate_uncleaned_packages\{class="orphaned"\} [0-9]+')
          - >-
            '# TYPE autoupdate_uncleaned_packages gauge'
            in (autoupdate_cleanup_metric.content | b64decode)
        fail_msg: "the cleanup hook does not uninstall unneeded packages and publish what it left"
        quiet: true

    # No tier boots MicroOS. This pins the selector's transactional branch and
    # nothing else — the defaults template lazily, so shadowing the facts they
    # read resolves them as a MicroOS host would. No role task runs here.
    - name: The defaults update transactionally on MicroOS
      ansible.builtin.assert:
        that:
          - autoupdate_update_command == ['/usr/sbin/transactional-update --non-interactive dup']
          - autoupdate_masked_timers == ['transactional-update.timer']
        fail_msg: "the defaults do not run transactional-update on MicroOS"
        quiet: true
      vars:
        ansible_facts:
          distribution: openSUSE MicroOS
          os_family: Suse
