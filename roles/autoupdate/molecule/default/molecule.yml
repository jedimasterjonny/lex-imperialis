---
# Two platforms, one per distribution the role supports. Groups rather than
# facts, so verify can gate on group_names without recomputing the role's own
# selectors. The Debian platform is the only tier that exercises the timer
# takeover for real — no tier boots MicroOS, and Tumbleweed ships nothing
# competing.
platforms:
  - name: "lex-autoupdate-incus-${MOLECULE_RUN_ID:-local}"
    image: images:opensuse/tumbleweed/cloud
    groups:
      - opensuse
  - name: "lex-autoupdate-debian-${MOLECULE_RUN_ID:-local}"
    image: images:debian/13/cloud
    groups:
      - debian
