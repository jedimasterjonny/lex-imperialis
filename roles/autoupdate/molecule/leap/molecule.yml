---
platforms:
  - name: "lex-autoupdate-leap-${MOLECULE_RUN_ID:-local}"
    image: images:opensuse/16.0/cloud
provisioner:
  inventory:
    group_vars:
      all:
        # Leap is a point release, so it takes vendor patches rather than a
        # whole-system upgrade.
        autoupdate_expected_command: /usr/bin/zypper --non-interactive patch --auto-agree-with-licenses
