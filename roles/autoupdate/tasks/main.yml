---
# MicroOS's own transactional-update.timer runs a daily update and reboot, so it
# is stopped and masked before this role's timer is installed and the two are
# never armed together. Two tasks, and in this order: masking a running unit
# strands it at ActiveState=failed permanently, and the module masks before it
# stops, so one combined task lands in exactly that state.
- name: Take over the distribution's own update timer
  when: autoupdate_transactional | bool
  become: true
  block:
    - name: Stop the distribution's own update timer
      ansible.builtin.systemd_service:
        name: transactional-update.timer
        state: stopped

    - name: Mask the distribution's own update timer
      ansible.builtin.systemd_service:
        name: transactional-update.timer
        masked: true

- name: Install the update timer
  ansible.builtin.template:
    src: autoupdate.timer.j2
    dest: /etc/systemd/system/autoupdate.timer
    owner: root
    group: root
    mode: "0644"
  become: true

# autoupdate.service's ExecStopPost hook: records each run's outcome as a
# node_exporter textfile metric so a silently failing unattended update alerts.
- name: Install the update metric script
  ansible.builtin.template:
    src: autoupdate-metric.sh.j2
    dest: /usr/local/sbin/autoupdate-metric.sh
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Install the update service
  ansible.builtin.template:
    src: autoupdate.service.j2
    dest: /etc/systemd/system/autoupdate.service
    owner: root
    group: root
    mode: "0644"
  become: true

# daemon_reload picks up unit changes before enabling; it does not itself report
# changed, so the task stays idempotent.
- name: Enable and start the update timer
  ansible.builtin.systemd_service:
    name: autoupdate.timer
    enabled: true
    state: started
    daemon_reload: true
  become: true
