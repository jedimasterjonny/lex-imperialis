---
# A distribution that ships its own update timer runs a daily update and reboot,
# so those are stopped and masked before this role's timer is installed and the
# two are never armed together. Two tasks, and in this order: masking a running
# unit strands it at ActiveState=failed permanently, and the module masks before
# it stops, so one combined task lands in exactly that state. A distribution that
# competes with nothing has an empty list, and both tasks loop over nothing.
- name: Take over the distribution's own update timers
  become: true
  block:
    - name: Stop the distribution's own update timers
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        state: stopped
      loop: "{{ autoupdate_masked_timers }}"

    - name: Mask the distribution's own update timers
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        masked: true
      loop: "{{ autoupdate_masked_timers }}"

- name: Install the update timer
  ansible.builtin.template:
    src: autoupdate.timer.j2
    dest: /etc/systemd/system/autoupdate.timer
    owner: root
    group: root
    mode: "0644"
  become: true

# autoupdate.service's two metric hooks, both writing node_exporter textfiles:
# the ExecStopPost records each run's outcome so a silently failing unattended
# update alerts, and the ExecStartPost publishes the packages the run was told to
# leave behind, which a successful one hides.
- name: Install the update metric scripts
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/usr/local/sbin/{{ item }}"
    owner: root
    group: root
    mode: "0755"
  loop:
    - autoupdate-metric.sh
    - autoupdate-holds.sh
  become: true

- name: Install the update service
  ansible.builtin.template:
    src: autoupdate.service.j2
    dest: /etc/systemd/system/autoupdate.service
    owner: root
    group: root
    mode: "0644"
  become: true

# daemon_reload picks up unit changes before enabling; it does not itself report
# changed, so the task stays idempotent.
- name: Enable and start the update timer
  ansible.builtin.systemd_service:
    name: autoupdate.timer
    enabled: true
    state: started
    daemon_reload: true
  become: true
