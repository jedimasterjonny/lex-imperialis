---
# Domain the wildcard vhost serves. The real domain is sensitive topology, so
# it lives in the vault; this default keeps molecule self-contained.
caddy_domain: home.arpa

# Cloudflare API token for the DNS-01 challenge (vault-sourced). Empty keeps
# the wildcard vhost on plain HTTP, so molecule never reaches for ACME.
caddy_cloudflare_api_token: ""

# Render the *.{{ caddy_domain }} wildcard vhost. True for internal-service
# hosts whose backends register sites/*.caddy matcher snippets. A host serving
# only an explicit public site (sites-public/*.caddy) sets this false, so caddy
# never provisions a pointless wildcard cert.
caddy_wildcard: true

# Wildcard-vhost backends this repo does not deploy, so no role of their own
# drops a snippet for them: <subdomain> -> the upstream caddy proxies to. Their
# only reason to exist is a real cert — the fleet's wildcard is already issued,
# so fronting a LAN appliance with it beats its own untrusted self-signed one.
# insecure skips verification on the upstream hop, which is what an appliance
# serving that self-signed cert needs; it is a LAN hop to a known host, and the
# browser still gets a trusted cert.
#
#   caddy_proxied_hosts:
#     nas:
#       upstream: https://appliance.lan:5001
#       insecure: true
caddy_proxied_hosts: {}
