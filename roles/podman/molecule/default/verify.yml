---
- name: Verify
  hosts: all
  gather_facts: false
  # What this image must end up on, pinned here rather than read from the role,
  # so changing the role's default fails this instead of moving the goalposts.
  vars:
    podman_expected_runtime: crun
    podman_prune_fixture_users:
      - prunerootless
      - "{{ podman_prune_skip_user }}"
  tasks:
    # The guard, not the mount. An incus container cannot be given a block
    # device, so the store-on-a-device arm runs nowhere in CI — it is asserted
    # live on auspex instead.
    #
    # What this pins is narrow, and worth stating so it is not mistaken for more:
    # on the empty default this role leaves fstab alone. Dropping the `when:`
    # outright would not reach here — the mount of an empty src fails the converge
    # first, which is louder. What it does catch is a change that writes the entry
    # without mounting (`state: present`), or any later task that touches fstab:
    # a stray line is permanent drift on the three other hosts that run this role
    # and have no such device.
    - name: Read fstab
      ansible.builtin.slurp:
        path: /etc/fstab
      register: podman_fstab

    # By mount point, not substring: the journal's bind on the Debian platform
    # names /var/lib/containers as its source.
    - name: No container-store mount was written on the empty default
      ansible.builtin.assert:
        that:
          - (podman_fstab.content | b64decode) is not search('^\\S+\\s+/var/lib/containers\\s', multiline=True)
        fail_msg: "the role wrote a /var/lib/containers fstab entry with podman_storage_device unset"
        quiet: true

    # The journal arm, on the Debian platform with the vendor's volatile drop-in
    # staged. A journal file under the bind's source proves all three halves at
    # once: the drop-in outranks the vendor's, the bind is live, and the flush ran.
    - name: Find the persistent journal on the bind's source
      ansible.builtin.find:
        paths: /var/lib/containers/journal
        patterns: system.journal
        recurse: true
      register: podman_journal_files
      become: true
      when: "'debian' in group_names"

    - name: The journal persists onto the store's device despite the vendor's drop-in
      ansible.builtin.assert:
        that:
          - podman_journal_files.matched == 1
        fail_msg: "no system.journal under /var/lib/containers/journal: journald is not writing through the bind"
        quiet: true
      when: "'debian' in group_names"

    # What a real boot builds from fstab, so reload first: a mount made at
    # runtime has no fragment, and without one systemd turns the flush's
    # RequiresMountsFor into After= alone.
    - name: Read the boot ordering around the journal's bind
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        daemon_reload: true
      loop:
        - systemd-journal-flush.service
        - var-log-journal.mount
      register: podman_journal_units
      become: true
      when: "'debian' in group_names"

    # The flush requires the bind, so a bind that fails leaves journald volatile
    # rather than writing to the card; the bind requires the mount holding its
    # source, so it fails with the store's; and local-fs.target only wants it,
    # so a failure costs no boot. systemd adds the source requirement itself and
    # does not document it, so it is pinned here as systemd derived it — the
    # store's own mount is not exercisable, /var/lib/containers being no mount
    # point in an incus container.
    - name: The journal's bind is ordered for a boot with or without the device
      ansible.builtin.assert:
        that:
          - "'var-log-journal.mount' in podman_journal_flush['Requires'].split()"
          - "'/var/lib/containers/journal' in podman_journal_bind['RequiresMountsFor'].split()"
          - "'local-fs.target' in podman_journal_bind['WantedBy'].split()"
          - "'local-fs.target' not in podman_journal_bind['RequiredBy'] | default('') | split()"
        fail_msg: "the journal bind's boot ordering is wrong"
        quiet: true
      vars:
        podman_journal_flush: "{{ podman_journal_units.results[0].status }}"
        podman_journal_bind: "{{ podman_journal_units.results[1].status }}"
      when: "'debian' in group_names"

    # openSUSE keeps the default, so nothing may have moved there.
    - name: Probe for a journal bind on the default
      ansible.builtin.command: findmnt --mountpoint /var/log/journal
      register: podman_no_journal_bind
      changed_when: false
      failed_when: podman_no_journal_bind.rc not in [0, 1]
      when: "'debian' not in group_names"

    - name: The default leaves the journal where it was
      ansible.builtin.assert:
        that:
          - podman_no_journal_bind.rc == 1
        fail_msg: "/var/log/journal is a mount point with podman_storage_journal unset"
        quiet: true
      when: "'debian' not in group_names"

    # The Debian platform stands in for auspex, whose firmware command line
    # converge staged. What is pinned is the shape a Pi will still boot from —
    # one line, the staged parameters untouched — plus the append landing at the
    # end, which is what makes the enable outrank the firmware's disable: the
    # kernel runs the __setup handlers in command-line order and the last wins.
    - name: Read the kernel command line the role appended to
      ansible.builtin.slurp:
        path: /boot/firmware/cmdline.txt
      register: podman_cmdline
      become: true
      when: "'debian' in group_names"

    - name: The memory cgroup controller is enabled once, at the end of one line
      ansible.builtin.assert:
        that:
          - podman_cmdline_lines | length == 1
          # select|length, not list.count(): Jinja resolves .count() to
          # something that answers 0 for a list that plainly holds the value,
          # so the duplicate check would pass by never being true.
          - podman_cmdline_lines[0].split() | select('eq', 'cgroup_enable=memory') | list | length == 1
          - podman_cmdline_lines[0].endswith(' cgroup_enable=memory')
          - "'cgroup_disable=memory' in podman_cmdline_lines[0].split()"
          - "'root=PARTUUID=deadbeef-02' in podman_cmdline_lines[0].split()"
          - "'rootfstype=ext4' in podman_cmdline_lines[0].split()"
          - "'rootwait' in podman_cmdline_lines[0].split()"
        fail_msg: >-
          the kernel command line is not one line ending in a single
          cgroup_enable=memory with the staged parameters intact:
          {{ podman_cmdline_lines }}
        quiet: true
      vars:
        podman_cmdline_lines: "{{ (podman_cmdline.content | b64decode).splitlines() }}"
      when: "'debian' in group_names"

    # The other half of that guard: a host with no Pi firmware partition must end
    # up with no such file, so the task skipped rather than creating one.
    - name: Probe for a kernel command line where no firmware partition exists
      ansible.builtin.stat:
        path: /boot/firmware/cmdline.txt
      register: podman_no_cmdline
      when: "'debian' not in group_names"

    - name: The role wrote no kernel command line of its own
      ansible.builtin.assert:
        that:
          - not podman_no_cmdline.stat.exists
        fail_msg: "the role created /boot/firmware/cmdline.txt on a host with no Pi firmware partition"
        quiet: true
      when: "'debian' not in group_names"

    - name: Query the podman runtime
      ansible.builtin.command: podman info
      become: true
      register: podman_info
      changed_when: false

    - name: The netavark network backend is active
      ansible.builtin.assert:
        that:
          - "'netavark' in podman_info.stdout"
        fail_msg: "podman is not using the netavark network backend"
        quiet: true

    # podman info is YAML, so read the name out of it rather than
    # substring-matching the whole report.
    - name: The configured OCI runtime is the expected one
      ansible.builtin.assert:
        that:
          - (podman_info.stdout | from_yaml)['host']['ociRuntime']['name'] == podman_expected_runtime
        fail_msg: "podman is not configured for the {{ podman_expected_runtime }} OCI runtime"
        quiet: true

    # podman info reports only what is *configured* — a container records the
    # runtime it was created under, so nothing but starting one proves the runtime
    # works. The host filesystem is the rootfs, overlaid so the container cannot
    # write to it, which leaves the probe with no image to pull and renovate-pin.
    # --replace, as quadlet's own ExecStart does, so verify can be re-run.
    - name: Start a container under the configured runtime
      ansible.builtin.command: podman run --replace --name podman-runtime-probe --network=none --rootfs /:O /bin/true
      become: true
      changed_when: false

    - name: Read the runtime the probe container recorded
      ansible.builtin.command: podman inspect podman-runtime-probe
      become: true
      register: podman_probe_inspect
      changed_when: false

    - name: The container ran under the expected runtime
      ansible.builtin.assert:
        that:
          - (podman_probe_inspect.stdout | from_json)[0]['OCIRuntime'] == podman_expected_runtime
        fail_msg: "the probe container did not run under {{ podman_expected_runtime }}"
        quiet: true

    - name: Mark the journal before the healthcheck probe
      ansible.builtin.command: journalctl --quiet --lines=0 --show-cursor
      become: true
      register: podman_journal_mark
      changed_when: false

    # Runs via podman's transient timer, as a quadlet's healthcheck does.
    # sleep ignores SIGTERM as PID 1, so a stop would wait out its timeout.
    - name: Start a container with a healthcheck
      ansible.builtin.command: >-
        podman run --detach --replace --name podman-health-probe --network=none
        --stop-timeout 0 --health-cmd /bin/true --health-interval 1s
        --rootfs /:O sleep infinity
      become: true
      changed_when: false

    # Three runs, so the earlier runs' events would have reached the journal
    # before the read. Log is null until the first run finishes.
    - name: Wait for the probe's healthcheck to run three times
      ansible.builtin.command: podman inspect podman-health-probe
      become: true
      register: podman_health_probe
      changed_when: false
      until: (podman_health_probe.stdout | from_json)[0]['State']['Health']['Log'] | default([], true) | length >= 3
      retries: 15
      delay: 1

    # The probe's start event is the control: it proves podman's events reach
    # the journal under PODMAN_EVENT, so the absence of health_status cannot pass
    # vacuously.
    - name: Read the healthcheck events the runs left in the journal
      ansible.builtin.command:
        argv:
          - journalctl
          - --quiet
          - --output=cat
          - --after-cursor={{ podman_journal_mark.stdout.split() | last }}
          - PODMAN_EVENT=health_status
          - PODMAN_EVENT=start
      become: true
      register: podman_health_journal
      changed_when: false

    - name: Healthcheck runs leave no events in the journal
      ansible.builtin.assert:
        that:
          - podman_health_journal.stdout_lines | length == 1
          - "' container start ' in podman_health_journal.stdout"
        fail_msg: "expected only the probe's start event: {{ podman_health_journal.stdout_lines }}"
        quiet: true

    - name: Remove the healthcheck probe
      ansible.builtin.command: podman rm --force podman-health-probe
      become: true
      changed_when: false

    # aardvark-dns is only *recommended* by the podman package, so the role
    # installs it explicitly; podman info lists it under the backend's dns only
    # when present. netavark ships regardless, so it cannot stand in for this.
    - name: The aardvark-dns resolver is present for the network backend
      ansible.builtin.assert:
        that:
          - "'aardvark' in podman_info.stdout"
        fail_msg: "aardvark-dns is not present for the netavark backend"
        quiet: true

    # daemon_reload is a no-op that just makes the module gather and return the
    # timer's systemctl-show properties to assert against; it reads, not mutates.
    - name: Read the prune timer's state
      ansible.builtin.systemd_service:
        name: podman-image-prune.timer
        daemon_reload: true
      register: podman_prune_timer
      become: true

    # Anchor on the whole OnCalendar= spec rather than bare substrings:
    # TimersCalendar reads `{ OnCalendar=<spec> ; next_elapse=<resolved time> }`,
    # so 'Sat' and '06:10:00' can both be satisfied by the next_elapse half
    # whatever the spec says. Defect C17 — roles/podman_backup's scenario carries
    # the full account. A literal rather than a var: this timer is a static unit
    # file with the schedule baked in, so there is nothing to pass through.
    - name: The timer is enabled and fires at 06:10 on Saturdays
      ansible.builtin.assert:
        that:
          - podman_prune_timer.status.ActiveState == 'active'
          - podman_prune_timer.status.UnitFileState == 'enabled'
          - "'OnCalendar=Sat *-*-* 06:10:00' in podman_prune_timer.status.TimersCalendar"
        fail_msg: >-
          the prune timer is not enabled for Sat 06:10 — TimersCalendar is
          {{ podman_prune_timer.status.TimersCalendar | default('unset') }}
        quiet: true

    - name: Stage a probe build context
      ansible.builtin.file:
        path: /tmp/podman-prune-probe
        state: directory
        mode: "0755"

    # COPY only: the prune needs the image to exist, never to run.
    - name: Write the probe Containerfile
      ansible.builtin.copy:
        content: |
          FROM scratch
          COPY Containerfile /
        dest: /tmp/podman-prune-probe/Containerfile
        mode: "0644"

    # Tagged, so not dangling: only --all reclaims it, since no container uses
    # it. This is the regression guard the old dangling-only prune would fail.
    - name: Build a tagged image that no container uses
      ansible.builtin.command: podman build --tag podman-prune-probe:local /tmp/podman-prune-probe
      become: true
      changed_when: false

    - name: List the probe image before the prune
      ansible.builtin.command: podman images --quiet podman-prune-probe:local
      become: true
      register: podman_probe_before
      changed_when: false

    # Before the clean fire, not after: the fixture below is torn down only on
    # the happy path, so a verify that failed mid-way strands a store that would
    # fail this fire on every later attempt, with no way back but destroy.
    - name: Discard any prior fixture users
      ansible.builtin.user:
        name: "{{ item }}"
        state: absent
        remove: true
        force: true
      loop: "{{ podman_prune_fixture_users }}"
      become: true

    # Starting a oneshot unit blocks until it exits, so success means the
    # prune ran clean — no rootless store on the host now, so this is the
    # rootful path on its own.
    - name: Fire the prune service
      ansible.builtin.systemd_service:
        name: podman-image-prune.service
        state: started
      become: true

    - name: List the probe image after the prune
      ansible.builtin.command: podman images --quiet podman-prune-probe:local
      become: true
      register: podman_probe_after
      changed_when: false

    - name: The prune reclaimed the unused tagged image
      ansible.builtin.assert:
        that:
          - podman_probe_before.stdout_lines | length > 0
          - podman_probe_after.stdout_lines | length == 0
        quiet: true

    # Enumeration is the half this tier can prove, and the half that could
    # silently regress: a store created after converge must still be found. What
    # happens next is deliberately not asserted — whether a container can run
    # rootless podman at all varies by host, so the outcome is green on a runner
    # that manages it and a reported skip on one denied newuidmap. Reclaim from a
    # rootless store is proven on a real host instead.
    - name: Create users holding a rootless store
      ansible.builtin.user:
        name: "{{ item }}"
        home: /home/{{ item }}
      loop: "{{ podman_prune_fixture_users }}"
      become: true

    - name: Give the users a rootless store
      ansible.builtin.file:
        path: /home/{{ item }}/.local/share/containers
        state: directory
        owner: "{{ item }}"
        group: "{{ item }}"
        mode: "0700"
      loop: "{{ podman_prune_fixture_users }}"
      become: true

    # failed_when, because the outcome is the host-dependent half.
    - name: Fire the prune service over the rootless store
      ansible.builtin.systemd_service:
        name: podman-image-prune.service
        state: started
      become: true
      failed_when: false

    # daemon_reload as the read trick, as with the timer above.
    - name: Read the prune service's result
      ansible.builtin.systemd_service:
        name: podman-image-prune.service
        daemon_reload: true
      become: true
      register: podman_prune_rootless

    # Scoped to this invocation, not the unit's whole history: verify is
    # re-runnable against a live instance, where an earlier run's line would
    # otherwise satisfy the assertion on its own.
    - name: Read what the prune service logged
      ansible.builtin.command:
        argv:
          - journalctl
          - _SYSTEMD_INVOCATION_ID={{ podman_prune_rootless.status.InvocationID }}
          - --no-pager
      become: true
      register: podman_prune_log
      changed_when: false

    # The store was created after converge, so no static list could have named
    # it: the run naming this user is proof the enumeration reached them.
    - name: The rootless store was found by enumeration
      ansible.builtin.assert:
        that:
          - "'podman-image-prune: prunerootless' in podman_prune_log.stdout"
        fail_msg: "the prune did not reach the rootless store"
        quiet: true

    # The skip line alone would pass a skip that logged and then pruned anyway.
    - name: The skipped account's store was skipped, not pruned
      ansible.builtin.assert:
        that:
          - "'podman-image-prune: skipped ' ~ podman_prune_skip_user ~ ', the account Ansible connects as' in podman_prune_log.stdout"
          - "'podman-image-prune: ' ~ podman_prune_skip_user not in podman_prune_log.stdout"
        fail_msg: "the prune did not skip {{ podman_prune_skip_user }}'s store"
        quiet: true

    # force, because PAMName=login started a user manager for the fixture and
    # logind holds it for UserStopDelaySec (10s) after the session ends — inside
    # which userdel's busy check refuses the removal.
    - name: Remove the rootless stores
      ansible.builtin.user:
        name: "{{ item }}"
        state: absent
        remove: true
        force: true
      loop: "{{ podman_prune_fixture_users }}"
      become: true

    # Leaves no failed unit behind, so the scenario does not end sitting on the
    # state SystemdUnitFailed alerts on.
    - name: The prune succeeds again once the store is gone
      ansible.builtin.systemd_service:
        name: podman-image-prune.service
        state: started
      become: true
