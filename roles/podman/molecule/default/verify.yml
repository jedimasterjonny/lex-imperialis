---
- name: Verify
  hosts: all
  gather_facts: false
  # What this image must end up on, pinned here rather than read from the role,
  # so changing the role's default fails this instead of moving the goalposts.
  vars:
    podman_expected_runtime: crun
  tasks:
    # The guard, not the mount. An incus container cannot be given a block
    # device, so the store-on-a-device arm runs nowhere in CI — it is asserted
    # live on auspex instead.
    #
    # What this pins is narrow, and worth stating so it is not mistaken for more:
    # on the empty default this role leaves fstab alone. Dropping the `when:`
    # outright would not reach here — the mount of an empty src fails the converge
    # first, which is louder. What it does catch is a change that writes the entry
    # without mounting (`state: present`), or any later task that touches fstab:
    # a stray line is permanent drift on the three other hosts that run this role
    # and have no such device.
    - name: Read fstab
      ansible.builtin.slurp:
        path: /etc/fstab
      register: podman_fstab

    - name: No container-store mount was written on the empty default
      ansible.builtin.assert:
        that:
          - "'/var/lib/containers' not in (podman_fstab.content | b64decode)"
        fail_msg: "the role wrote a /var/lib/containers fstab entry with podman_storage_device unset"
        quiet: true

    - name: Query the podman runtime
      ansible.builtin.command: podman info
      become: true
      register: podman_info
      changed_when: false

    - name: The netavark network backend is active
      ansible.builtin.assert:
        that:
          - "'netavark' in podman_info.stdout"
        fail_msg: "podman is not using the netavark network backend"
        quiet: true

    # podman info is YAML, so read the name out of it rather than
    # substring-matching the whole report.
    - name: The configured OCI runtime is the expected one
      ansible.builtin.assert:
        that:
          - (podman_info.stdout | from_yaml)['host']['ociRuntime']['name'] == podman_expected_runtime
        fail_msg: "podman is not configured for the {{ podman_expected_runtime }} OCI runtime"
        quiet: true

    # podman info reports only what is *configured* — a container records the
    # runtime it was created under, so nothing but starting one proves the runtime
    # works. The host filesystem is the rootfs, overlaid so the container cannot
    # write to it, which leaves the probe with no image to pull and renovate-pin.
    # --replace, as quadlet's own ExecStart does, so verify can be re-run.
    - name: Start a container under the configured runtime
      ansible.builtin.command: podman run --replace --name podman-runtime-probe --network=none --rootfs /:O /bin/true
      become: true
      changed_when: false

    - name: Read the runtime the probe container recorded
      ansible.builtin.command: podman inspect podman-runtime-probe
      become: true
      register: podman_probe_inspect
      changed_when: false

    - name: The container ran under the expected runtime
      ansible.builtin.assert:
        that:
          - (podman_probe_inspect.stdout | from_json)[0]['OCIRuntime'] == podman_expected_runtime
        fail_msg: "the probe container did not run under {{ podman_expected_runtime }}"
        quiet: true

    # aardvark-dns is only *recommended* by the podman package, so the role
    # installs it explicitly; podman info lists it under the backend's dns only
    # when present. netavark ships regardless, so it cannot stand in for this.
    - name: The aardvark-dns resolver is present for the network backend
      ansible.builtin.assert:
        that:
          - "'aardvark' in podman_info.stdout"
        fail_msg: "aardvark-dns is not present for the netavark backend"
        quiet: true

    # daemon_reload is a no-op that just makes the module gather and return the
    # timer's systemctl-show properties to assert against; it reads, not mutates.
    - name: Read the prune timer's state
      ansible.builtin.systemd_service:
        name: podman-image-prune.timer
        daemon_reload: true
      register: podman_prune_timer
      become: true

    # Anchor on the whole OnCalendar= spec rather than bare substrings:
    # TimersCalendar reads `{ OnCalendar=<spec> ; next_elapse=<resolved time> }`,
    # so 'Sat' and '06:00:00' can both be satisfied by the next_elapse half
    # whatever the spec says. Defect C17 — roles/podman_backup's scenario carries
    # the full account. A literal rather than a var: this timer is a static unit
    # file with the schedule baked in, so there is nothing to pass through.
    - name: The timer is enabled and fires at 06:00 on Saturdays
      ansible.builtin.assert:
        that:
          - podman_prune_timer.status.ActiveState == 'active'
          - podman_prune_timer.status.UnitFileState == 'enabled'
          - "'OnCalendar=Sat *-*-* 06:00:00' in podman_prune_timer.status.TimersCalendar"
        fail_msg: >-
          the prune timer is not enabled for Sat 06:00 — TimersCalendar is
          {{ podman_prune_timer.status.TimersCalendar | default('unset') }}
        quiet: true

    - name: Stage a probe build context
      ansible.builtin.file:
        path: /tmp/podman-prune-probe
        state: directory
        mode: "0755"

    # COPY only: the prune needs the image to exist, never to run.
    - name: Write the probe Containerfile
      ansible.builtin.copy:
        content: |
          FROM scratch
          COPY Containerfile /
        dest: /tmp/podman-prune-probe/Containerfile
        mode: "0644"

    # Tagged, so not dangling: only --all reclaims it, since no container uses
    # it. This is the regression guard the old dangling-only prune would fail.
    - name: Build a tagged image that no container uses
      ansible.builtin.command: podman build --tag podman-prune-probe:local /tmp/podman-prune-probe
      become: true
      changed_when: false

    - name: List the probe image before the prune
      ansible.builtin.command: podman images --quiet podman-prune-probe:local
      become: true
      register: podman_probe_before
      changed_when: false

    # Before the clean fire, not after: the fixture below is torn down only on
    # the happy path, so a verify that failed mid-way strands a store that would
    # fail this fire on every later attempt, with no way back but destroy.
    - name: Discard any prior fixture user
      ansible.builtin.user:
        name: prunerootless
        state: absent
        remove: true
        force: true
      become: true

    # Starting a oneshot unit blocks until it exits, so success means the
    # prune ran clean — no rootless store on the host now, so this is the
    # rootful path on its own.
    - name: Fire the prune service
      ansible.builtin.systemd_service:
        name: podman-image-prune.service
        state: started
      become: true

    - name: List the probe image after the prune
      ansible.builtin.command: podman images --quiet podman-prune-probe:local
      become: true
      register: podman_probe_after
      changed_when: false

    - name: The prune reclaimed the unused tagged image
      ansible.builtin.assert:
        that:
          - podman_probe_before.stdout_lines | length > 0
          - podman_probe_after.stdout_lines | length == 0
        quiet: true

    # Enumeration is the half this tier can prove, and the half that could
    # silently regress: a store created after converge must still be found. What
    # happens next is deliberately not asserted — whether a container can run
    # rootless podman at all varies by host, so the outcome is green on a runner
    # that manages it and a reported skip on one denied newuidmap. Reclaim from a
    # rootless store is proven on a real host instead.
    - name: Create a user holding a rootless store
      ansible.builtin.user:
        name: prunerootless
        home: /home/prunerootless
      become: true

    - name: Give the user a rootless store
      ansible.builtin.file:
        path: /home/prunerootless/.local/share/containers
        state: directory
        owner: prunerootless
        group: prunerootless
        mode: "0700"
      become: true

    # failed_when, because the outcome is the host-dependent half.
    - name: Fire the prune service over the rootless store
      ansible.builtin.systemd_service:
        name: podman-image-prune.service
        state: started
      become: true
      failed_when: false

    # daemon_reload as the read trick, as with the timer above.
    - name: Read the prune service's result
      ansible.builtin.systemd_service:
        name: podman-image-prune.service
        daemon_reload: true
      become: true
      register: podman_prune_rootless

    # Scoped to this invocation, not the unit's whole history: verify is
    # re-runnable against a live instance, where an earlier run's line would
    # otherwise satisfy the assertion on its own.
    - name: Read what the prune service logged
      ansible.builtin.command:
        argv:
          - journalctl
          - _SYSTEMD_INVOCATION_ID={{ podman_prune_rootless.status.InvocationID }}
          - --no-pager
      become: true
      register: podman_prune_log
      changed_when: false

    # The store was created after converge, so no static list could have named
    # it: the run naming this user is proof the enumeration reached them.
    - name: The rootless store was found by enumeration
      ansible.builtin.assert:
        that:
          - "'podman-image-prune: prunerootless' in podman_prune_log.stdout"
        fail_msg: "the prune did not reach the rootless store"
        quiet: true

    # force, because PAMName=login started a user manager for the fixture and
    # logind holds it for UserStopDelaySec (10s) after the session ends — inside
    # which userdel's busy check refuses the removal.
    - name: Remove the rootless store
      ansible.builtin.user:
        name: prunerootless
        state: absent
        remove: true
        force: true
      become: true

    # Leaves no failed unit behind, so the scenario does not end sitting on the
    # state SystemdUnitFailed alerts on.
    - name: The prune succeeds again once the store is gone
      ansible.builtin.systemd_service:
        name: podman-image-prune.service
        state: started
      become: true
