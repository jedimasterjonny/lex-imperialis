---
# Two platforms, one per distribution the role supports. Groups rather than
# facts, so verify can gate on group_names without gathering.
#
# podman mounts overlays for its storage, which incus only permits in a
# nested-container-capable instance. verify starts a container to prove the OCI
# runtime works, and the CI runner's AppArmor denies a nested runtime's sysctl
# fd-reopen, so drop the profile — the instances are throwaway.
platforms:
  - name: "lex-podman-incus-${MOLECULE_RUN_ID:-local}"
    image: images:opensuse/tumbleweed/cloud
    groups:
      - opensuse
    config:
      security.nesting: "true"
      raw.lxc: lxc.apparmor.profile=unconfined
  - name: "lex-podman-debian-${MOLECULE_RUN_ID:-local}"
    image: images:debian/13/cloud
    groups:
      - debian
    config:
      security.nesting: "true"
      raw.lxc: lxc.apparmor.profile=unconfined
# One source for the account the prune skips, read by converge as the input and
# by verify as the fixture. The role's default resolves to root here, which the
# prune passes over before the name check, so it would test no skip.
provisioner:
  inventory:
    group_vars:
      all:
        podman_prune_skip_user: pruneautomation
