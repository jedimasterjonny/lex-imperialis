---
# Distro-derived, not a tunable: crun is packaged for Tumbleweed and for the
# Tumbleweed-based MicroOS. Anything else — Leap — falls back to runc, which
# podman hard-requires and so always has. On MicroOS a package installs into the
# next snapshot, so the image must already ship crun before this role runs there.
podman_runtime: "{{ 'crun' if ansible_facts['distribution'] in ['openSUSE Tumbleweed', 'openSUSE MicroOS'] else 'runc' }}"

# aardvark-dns is netavark's DNS resolver. zypper only recommends it, and the
# zypper module skips recommends, so without naming it here containers on a
# podman network cannot resolve one another.
# A runtime's package is named for the runtime, so podman_runtime installs itself.
podman_packages:
  - podman
  - aardvark-dns
  - "{{ podman_runtime }}"
