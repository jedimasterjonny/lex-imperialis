# Must sort after the vendor's 40-rpi-volatile-storage.conf: journald merges
# every journald.conf.d in one lexical order by file name, whichever directory
# it sits in, and the last word wins.
[Journal]
Storage=persistent
# journald's own ceiling, and the cap every other fleet host runs at: about nine
# months at the ~15 MB a day measured on auspex.
SystemMaxUse=4G
