---
# Before the install, not after it: mounting over a populated /var/lib/containers
# shadows whatever is already there, and the package creates that directory. The
# module makes the mount point when absent, writes the fstab entry and mounts
# now, so podman is installed onto the device rather than beside it. Skipped
# entirely where podman_storage_device is empty, which is every host but auspex.
- name: Mount the container store's device
  ansible.posix.mount:
    path: /var/lib/containers
    src: "{{ podman_storage_device }}"
    fstype: ext4
    opts: "{{ podman_storage_options }}"
    state: mounted
  when: podman_storage_device | length > 0
  become: true

# The Raspberry Pi firmware prepends cgroup_disable=memory to whatever this file
# holds, so auspex boots without the memory controller: cgroup.controllers reads
# `cpuset cpu io pids`, every container_memory_* series cadvisor exports is 0,
# and no quadlet on the host could take a MemoryMax=. A later
# cgroup_enable=memory undoes it — parse_args walks the command line left to
# right and the two __setup handlers are exact inverses on the same static key,
# so whichever comes last wins, and the firmware's copy always comes first.
# cgroup_memory=1, which the Pi documentation pairs with it, is not a kernel
# parameter at all and would land in PID 1's environment instead; the real one is
# cgroup.memory=, and it only takes nosocket/nokmem/nobpf.
#
# Guarded on the file rather than a fact-derived default: what gates this is the
# Pi firmware's boot partition existing, which no fact reports. Same shape as the
# NetworkManager guard below — every other host has no such file and skips.
- name: Detect the Raspberry Pi firmware kernel command line
  ansible.builtin.stat:
    path: /boot/firmware/cmdline.txt
  register: podman_pi_cmdline

# Appended, never templated: the file is the imager's and carries the host's
# root=. The negative lookahead is what makes this idempotent — a line already
# holding the parameter matches nothing, and backrefs leaves a file it did not
# match completely alone rather than appending a line of its own. That last part
# is the dangerous one: the firmware reads only the first line, so a second line
# silently drops every parameter on it, root= included, and a Pi that will not
# boot has no console to say why. validate catches it from the other side.
- name: Enable the memory cgroup controller
  ansible.builtin.lineinfile:
    path: /boot/firmware/cmdline.txt
    regexp: '^(?!.*cgroup_enable=memory)(.*\broot=\S+.*)$'
    line: '\1 cgroup_enable=memory'
    backrefs: true
    validate: "awk '/root=/ { found = 1 } END { exit !(NR == 1 && found) }' %s"
  when: podman_pi_cmdline.stat.exists
  become: true

- name: Install podman
  ansible.builtin.package:
    name: "{{ podman_packages }}"
    state: present
  become: true
  # The check is what costs: on a transactional host the package module answers
  # it inside a root snapshot (roles/CLAUDE.md). Absent the fact, this just runs.
  when: podman_packages | difference(ansible_facts['packages'] | default({}) | list) | length > 0

# netavark reapplies its rules when firewalld reloads, so published ports and
# container networking survive a reload; the shipped unit is disabled.
- name: Enable the netavark firewalld-reload listener
  ansible.builtin.systemd_service:
    name: netavark-firewalld-reload.service
    enabled: true
    state: started
  become: true

# podman/netavark manage the container bridges themselves; NetworkManager must
# not. Otherwise deleting the last bridge — a run that stops every container, as
# podman_backup does — fires an NM event that unmounts the _netdev NFS shares
# mid-run. Skipped where NetworkManager is absent (the molecule containers).
- name: Detect NetworkManager
  ansible.builtin.stat:
    path: /etc/NetworkManager/conf.d
  register: podman_nm_confd

- name: Leave podman's bridges unmanaged by NetworkManager
  ansible.builtin.template:
    src: networkmanager-podman.conf.j2
    dest: /etc/NetworkManager/conf.d/podman.conf
    owner: root
    group: root
    mode: "0644"
  become: true
  when: podman_nm_confd.stat.exists
  notify: Reload NetworkManager for podman

- name: Create the quadlet directory
  ansible.builtin.file:
    path: /etc/containers/systemd
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

# Created rather than assumed: libcontainers-common supplies it on openSUSE, but
# neither Debian's podman nor its golang-github-containers-common ships or creates
# it — measured, the drop-in below failed outright on a live install.
- name: Create the containers.conf drop-in directory
  ansible.builtin.file:
    path: /etc/containers/containers.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

# Must outrank libcontainers-common's 00-suse-containers.conf, which pins
# runtime = "runc": podman reads the directory in lexical order, last write wins.
# Belt and braces on Debian, whose podman Depends: crun | runc and so reports
# runtime=crun before this lands — but it is the same assertion the role makes
# everywhere else, and verify pins it.
- name: Set podman's OCI runtime
  ansible.builtin.template:
    src: containers-runtime.conf.j2
    dest: /etc/containers/containers.conf.d/10-runtime.conf
    owner: root
    group: root
    mode: "0644"
  become: true

- name: Install the prune script
  ansible.builtin.copy:
    src: podman-image-prune.sh
    dest: /usr/local/sbin/podman-image-prune.sh
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Install the prune service and timer
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: /etc/systemd/system/{{ item }}
    owner: root
    group: root
    mode: "0644"
  loop:
    - podman-image-prune.service
    - podman-image-prune.timer
  become: true

- name: Enable and start the prune timer
  ansible.builtin.systemd_service:
    name: podman-image-prune.timer
    enabled: true
    state: started
    daemon_reload: true
  become: true
