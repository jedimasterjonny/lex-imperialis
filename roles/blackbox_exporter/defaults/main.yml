---
# Where blackbox.yml is rendered, and bind-mounted read-only into the container.
blackbox_exporter_config_dir: /etc/blackbox_exporter

# Address the exporter binds and serves /probe and /metrics on. Loopback by
# default so only the co-located scraper reaches it, never the LAN — the exporter
# proxies to an arbitrary target= parameter, so it must not be exposed. Must match
# the scraping role's blackbox address (prometheus_blackbox_address).
blackbox_exporter_listen_address: 127.0.0.1:9115

# Prober modules rendered into blackbox.yml. The http modules probe over IPv4.
blackbox_exporter_modules:
  http_2xx:
    prober: http
    timeout: 5s
    http:
      follow_redirects: true
      preferred_ip_protocol: ip4
  # For a service whose endpoint is auth-walled and so answers 401, not 200: the
  # 401 is itself proof the daemon is up and serving, which is all the probe needs
  # to establish. Accepting it keeps the service's credentials out of the exporter
  # — the alternative is copying them onto every host that probes it.
  http_2xx_or_401:
    prober: http
    timeout: 5s
    http:
      follow_redirects: true
      preferred_ip_protocol: ip4
      valid_status_codes: [200, 401]
  # For a target whose whole job is to redirect — the www and .co.uk aliases that
  # 301 to the canonical site, Uptime Kuma's root that 302s to its dashboard. It
  # asserts the redirect and stops there: following it would only re-probe a
  # destination that has its own http_2xx target, and the exporter logs a
  # warning for every redirect it follows — five such targets at 15s was 40k
  # journal lines a week on the Pi. Any redirect status is accepted: the claim is
  # that the alias redirects, not with which code (the edge rules answer 301,
  # Kuma 302). The TLS expiry it reports is the alias's own certificate, where a
  # followed probe reported the destination's.
  http_3xx:
    prober: http
    timeout: 5s
    http:
      follow_redirects: false
      preferred_ip_protocol: ip4
      valid_status_codes: [301, 302, 307, 308]
  # A bare TCP connect, for a host that serves the fleet something other than
  # HTTP. Its one use is the NAS's NFS port: the NAS runs no exporter and, since
  # Prometheus moved off it, nothing on the fleet notices it going away — the old
  # arrangement had the TSDB die with the host and the Watchdog deadman page.
  # NFS is what the fleet actually depends on it for, so that is what is probed.
  # A TCP probe measures no certificate, so probe_ssl_earliest_cert_expiry stays
  # 0 — which ProbeSSLCertExpiringSoon is already guarded against.
  tcp_connect:
    prober: tcp
    timeout: 5s
    tcp:
      preferred_ip_protocol: ip4
  # A TCP connect that also reads the peer's SSH banner. Its one use is
  # rogue-trader's storage box gateway, where tcp_connect would assert nothing:
  # that listener is socket-activated, so the kernel completes the handshake from
  # systemd's backlog before the proxy is execed at all. A bare connect therefore
  # succeeds while the proxy fails to start, fails to resolve the box, or is
  # refused by it — which is every failure the probe exists to catch. Reading the
  # banner walks the whole path instead: socket bound, proxy activated, upstream
  # resolved, box reachable, bytes forwarded both ways.
  # `send` after the expect is upstream's own ssh_banner idiom, and it is here for
  # manners rather than for the check: the target is a third party's appliance
  # probed every 60s, and identifying the client beats leaving 1,440 aborted
  # pre-auth handshakes a day on it. `^SSH-` rather than `^SSH-2.0-` so a server
  # version bump on an endpoint we do not control cannot turn the probe red.
  tcp_ssh_banner:
    prober: tcp
    timeout: 5s
    tcp:
      preferred_ip_protocol: ip4
      query_response:
        - expect: "^SSH-"
        - send: "SSH-2.0-blackbox_ssh_check"
