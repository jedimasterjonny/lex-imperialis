---
- name: Create the config directory
  ansible.builtin.file:
    path: "{{ blackbox_exporter_config_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Deploy the blackbox config
  ansible.builtin.template:
    src: blackbox.yml.j2
    dest: "{{ blackbox_exporter_config_dir }}/blackbox.yml"
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Restart blackbox-exporter

- name: Install the blackbox-exporter container unit
  ansible.builtin.template:
    src: blackbox-exporter.container.j2
    dest: /etc/containers/systemd/blackbox-exporter.container
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Restart blackbox-exporter

# Restart-on-change runs at flush; this generates the quadlet unit and asserts it
# is up even on a converge where nothing changed and no handler fired.
- name: Apply pending unit changes
  ansible.builtin.meta: flush_handlers

- name: Start blackbox-exporter
  ansible.builtin.systemd_service:
    name: blackbox-exporter
    state: started
  become: true
