---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    - name: Wait for blackbox_exporter to be ready
      ansible.builtin.uri:
        url: http://127.0.0.1:9115/-/healthy
        status_code: 200
      register: blackbox_exporter_ready
      until: blackbox_exporter_ready.status == 200
      retries: 30
      delay: 2

    - name: Read the config the exporter actually loaded
      ansible.builtin.uri:
        url: http://127.0.0.1:9115/config
        return_content: true
      register: blackbox_exporter_loaded_config

    # /config is the parsed config the exporter is running, not the file on disk:
    # finding the module here proves the mounted config loaded, not merely that it
    # was written.
    # Match the delimited YAML key, not a bare substring: 'http_2xx' alone is also
    # satisfied by 'http_2xx_sentinel', so it couldn't catch the real module being
    # dropped.
    - name: The http_2xx module is loaded
      ansible.builtin.assert:
        that:
          - "'http_2xx:' in blackbox_exporter_loaded_config.content"
        fail_msg: the running blackbox_exporter did not load the http_2xx module

    # The module exists to probe an auth-walled endpoint, which answers 401 rather
    # than 200. No such endpoint exists in this scenario, so assert on the config
    # the exporter parsed instead. Parse it rather than substring-match: '401'
    # appears in the module's own name, so a bare match would still pass with
    # valid_status_codes dropped — the very regression this guards.
    - name: The http_2xx_or_401 module is loaded and accepts a 401
      ansible.builtin.assert:
        that:
          - "'http_2xx_or_401' in blackbox_exporter_loaded_modules"
          - 401 in blackbox_exporter_loaded_modules.http_2xx_or_401.http.valid_status_codes
          - 200 in blackbox_exporter_loaded_modules.http_2xx_or_401.http.valid_status_codes
        fail_msg: >-
          the running blackbox_exporter did not load the http_2xx_or_401 module, or
          loaded it without both 200 and 401 among its valid_status_codes
      vars:
        blackbox_exporter_loaded_modules: >-
          {{ (blackbox_exporter_loaded_config.content | from_yaml).modules }}

    # side_effect added this module; finding it in the LOADED config proves the
    # restart handler applied the change. The exporter reads its config only at
    # start, so a changed file with no restart leaves the old modules serving.
    - name: The side-effect config change reached the running exporter
      ansible.builtin.assert:
        that:
          - "'http_2xx_sentinel:' in blackbox_exporter_loaded_config.content"
        fail_msg: >-
          The running blackbox_exporter did not pick up the config change — the
          restart handler did not fire.

    # Probe the exporter's own endpoint through the module: a self-contained 2xx
    # with no external dependency, exercising the http_2xx prober end to end.
    - name: Probe a known-good target through the http_2xx module
      ansible.builtin.uri:
        url: "http://127.0.0.1:9115/probe?target=http://127.0.0.1:9115/-/healthy&module=http_2xx"
        return_content: true
      register: blackbox_exporter_probe

    - name: The probe reports success
      ansible.builtin.assert:
        that:
          - "'probe_success 1' in blackbox_exporter_probe.content"
        fail_msg: the http_2xx probe of a known-good target did not succeed

    # The checks above prove the exporter works; they can't prove its capability
    # set is minimal. Assert the posture directly so a regression that widens the
    # caps or drops the restriction fails here, not silently in production.
    - name: Read blackbox-exporter's security posture
      ansible.builtin.command: podman inspect blackbox-exporter
      become: true
      register: blackbox_exporter_inspect
      changed_when: false

    # This image sets no USER, so the container runs as root — which is what makes
    # EffectiveCaps meaningful here. A non-root container's effective set is empty
    # whatever the drop says, so asserting on it would be a check that cannot fail;
    # asserted alongside BoundingCaps, which reflects DropCapability=all directly.
    - name: Blackbox keeps no capabilities and bars privilege escalation
      vars:
        blackbox_exporter: "{{ blackbox_exporter_inspect.stdout | from_json | first }}"
      ansible.builtin.assert:
        that:
          - "blackbox_exporter.BoundingCaps | default([], true) | sort == []"
          - "blackbox_exporter.EffectiveCaps | default([], true) | sort == []"
          - "'no-new-privileges' in (blackbox_exporter.HostConfig.SecurityOpt | default([], true))"
        fail_msg: "blackbox-exporter's capability or no-new-privileges posture has regressed"
        quiet: true

    # The inquisition's `unpinned` class reads exactly this, and a quadlet whose
    # Image lost its digest is a container that silently drifts on the next pull.
    - name: The quadlet pins its image by digest
      ansible.builtin.command: grep -E '^Image=.*@sha256:[0-9a-f]{64}$' /etc/containers/systemd/blackbox-exporter.container
      become: true
      register: blackbox_exporter_pin
      changed_when: false
      failed_when: blackbox_exporter_pin.rc != 0
