---
# A path-mode backup with no paths would render an empty sources list, which the
# script treats as a legitimate no-op (podman-volumes mode reaches it when a host
# has no volumes) and exits 0 — silently backing up nothing while the metric
# reports success. Fail at converge instead.
- name: A path-mode backup must configure at least one source path
  ansible.builtin.assert:
    that:
      - restic_backup_podman_volumes or (restic_backup_paths | length > 0)
    fail_msg: >-
      restic_backup_paths is empty and restic_backup_podman_volumes is false —
      nothing would be backed up.
    quiet: true

- name: A backup must configure a repository password
  ansible.builtin.assert:
    that:
      - restic_backup_password | length > 0
    fail_msg: >-
      restic_backup_password is empty — the repository would be readable by
      anything that can reach the share, and by the off-site mirror.
    quiet: true

- name: Install restic
  community.general.zypper:
    name: "{{ restic_backup_package }}"
    state: present
  become: true
  # The check is what costs: on a transactional host the package module answers
  # it inside a root snapshot (roles/CLAUDE.md). Absent the fact, this just runs.
  when: restic_backup_package not in ansible_facts['packages'] | default({})

- name: Create the password directory
  ansible.builtin.file:
    path: "{{ restic_backup_password_file | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  become: true

- name: Install the repository password
  ansible.builtin.copy:
    content: "{{ restic_backup_password }}"
    dest: "{{ restic_backup_password_file }}"
    owner: root
    group: root
    mode: "0600"
  become: true
  no_log: true

- name: Install the backup and metric scripts
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: root
    group: root
    mode: "0755"
  loop:
    - src: restic-backup.sh.j2
      dest: "{{ restic_backup_script_dir }}/{{ restic_backup_name }}-backup.sh"
    - src: restic-backup-metric.sh.j2
      dest: "{{ restic_backup_script_dir }}/{{ restic_backup_name }}-backup-metric.sh"
  # Consumed by restic-backup-metric.sh.j2, the shared run-metric template
  # symlinked in from node_exporter; restic-backup.sh.j2 ignores them. Every name
  # derives from restic_backup_name, so podman/home each get their own family.
  vars:
    run_metric_textfile_dir: "{{ restic_backup_textfile_dir }}"
    run_metric_name: "{{ restic_backup_name }}_backup"
    run_metric_file: "{{ restic_backup_name }}-backup"
    run_metric_description: "{{ restic_backup_name }} backup"
  become: true

# The restore script — the inverse of the backup, for disaster recovery — only
# makes sense for podman volumes (it quiesces quadlets and wipes each volume
# before restoring); a plain path backup restores by hand with restic restore.
- name: Install the restore script
  ansible.builtin.template:
    src: restic-restore.sh.j2
    dest: "{{ restic_backup_script_dir }}/{{ restic_backup_name }}-restore.sh"
    owner: root
    group: root
    mode: "0755"
  become: true
  when: restic_backup_podman_volumes

- name: Install the backup service and timer
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "/etc/systemd/system/{{ item.dest }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - src: restic-backup.service.j2
      dest: "{{ restic_backup_name }}-backup.service"
    - src: restic-backup.timer.j2
      dest: "{{ restic_backup_name }}-backup.timer"
  become: true

- name: Enable and start the backup timer
  ansible.builtin.systemd_service:
    name: "{{ restic_backup_name }}-backup.timer"
    enabled: true
    state: started
    daemon_reload: true
  become: true
