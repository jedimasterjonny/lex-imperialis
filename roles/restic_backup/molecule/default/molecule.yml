---
# Two platforms, one per distribution the role deploys to: auspex runs the
# podman_backup consumer on Debian. The role branches on nothing — the package
# name is the same on both — so the second platform proves the package module
# and the script on that distribution, no more.
platforms:
  # Incus rejects underscores in instance names, so the label is hyphenated even
  # though the role is restic_backup. Generic (path) mode needs no podman, so no
  # nested-container config — unlike the podman_backup consumer's scenario.
  - name: "lex-restic-backup-incus-${MOLECULE_RUN_ID:-local}"
    image: images:opensuse/tumbleweed/cloud
    groups:
      - opensuse
  - name: "lex-restic-backup-debian-${MOLECULE_RUN_ID:-local}"
    image: images:debian/13/cloud
    groups:
      - debian
# The engine has no schedule of its own — every consumer passes one — so one
# source here, read by converge as the input and by verify as the expectation.
provisioner:
  inventory:
    group_vars:
      all:
        restic_backup_oncalendar: "Thu *-*-* 02:00:00"
