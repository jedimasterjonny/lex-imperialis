---
- name: Verify
  hosts: all
  gather_facts: false
  vars:
    # Matches restic_backup_root in converge.yml and the engine defaults.
    restic_backup_repo_root: /var/tmp/backup
    restic_backup_textfile_dir: /var/lib/node_exporter/textfile_collector
    restic_backup_script: /usr/local/sbin/probe-backup.sh
    restic_backup_metric_script: /usr/local/sbin/probe-backup-metric.sh
    restic_backup_probe_content: "lex-imperialis restic backup probe\n"
    # Matches restic_backup_timeout_start_sec in the engine defaults, as systemd
    # renders it back.
    restic_backup_timeout: 1h
    # The share stand-in's fstab mount unit, as systemd names it from the path.
    restic_backup_mount_unit: var-tmp-backup.mount
  tasks:
    - name: Confirm restic is installed and runnable
      ansible.builtin.command: restic version
      register: restic_backup_restic
      changed_when: false

    # The repo password is the only thing standing between the share (which
    # carries every host's repos, and is mirrored to a third party) and anyone
    # who can read it. Pin its mode, and pin that the scripts actually use it —
    # a reintroduced --insecure-no-password would silently unlock the repo.
    - name: Stat the repository password file
      ansible.builtin.stat:
        path: /etc/restic/password
      register: restic_backup_password_stat
      become: true

    - name: The repository password is installed 0600 root
      ansible.builtin.assert:
        that:
          - restic_backup_password_stat.stat.exists
          - restic_backup_password_stat.stat.mode == '0600'
          - restic_backup_password_stat.stat.pw_name == 'root'
        fail_msg: "/etc/restic/password is missing or not 0600 root"
        quiet: true

    - name: Stat the backup script
      ansible.builtin.stat:
        path: "{{ restic_backup_script }}"
      register: restic_backup_script_stat

    - name: The backup script is installed and executable
      ansible.builtin.assert:
        that:
          - restic_backup_script_stat.stat.exists
          - restic_backup_script_stat.stat.executable
        fail_msg: "{{ restic_backup_script }} is missing or not executable"
        quiet: true

    # Generic mode installs no restore script — that is podman-volumes only.
    - name: Stat the restore script
      ansible.builtin.stat:
        path: /usr/local/sbin/probe-restore.sh
      register: restic_backup_restore_stat

    - name: Generic mode installs no restore script
      ansible.builtin.assert:
        that:
          - not restic_backup_restore_stat.stat.exists
        fail_msg: "a path backup should not install a restore script"
        quiet: true

    # daemon_reload is a no-op that just makes the module gather and return the
    # timer's systemctl-show properties to assert against; it reads, not mutates.
    - name: Read the backup timer's state
      ansible.builtin.systemd_service:
        name: probe-backup.timer
        daemon_reload: true
      register: restic_backup_timer
      become: true

    # Anchor on the whole OnCalendar= spec rather than bare substrings:
    # TimersCalendar reads `{ OnCalendar=<spec> ; next_elapse=<resolved time> }`,
    # so 'Thu' and '02:00:00' can both be satisfied by the next_elapse half
    # whatever the spec says. Defect C17 — roles/podman_backup's scenario carries
    # the full account. The schedule comes from the scenario's group_vars, the one
    # source converge renders from.
    - name: The timer is enabled and fires on the configured schedule
      ansible.builtin.assert:
        that:
          - restic_backup_timer.status.ActiveState == 'active'
          - restic_backup_timer.status.UnitFileState == 'enabled'
          - >-
            'OnCalendar=' ~ restic_backup_oncalendar
            in restic_backup_timer.status.TimersCalendar
        fail_msg: >-
          the backup timer is not enabled for {{ restic_backup_oncalendar }} —
          TimersCalendar is {{ restic_backup_timer.status.TimersCalendar | default('unset') }}
        quiet: true

    # Type=oneshot leaves the start timeout disabled unless the unit sets one, so
    # unset means infinity rather than the manager's 90s default. With `hard` NFS
    # that lets a wedged call hold the service in activating indefinitely — in
    # podman-volumes mode with the quiesced containers stopped — and nothing
    # catches it:
    # SystemdUnitFailed excludes these units by regex, and a unit stuck in
    # activating never reaches failed to begin with.
    - name: Read the backup service's state
      ansible.builtin.systemd_service:
        name: probe-backup.service
        daemon_reload: true
      register: restic_backup_service
      become: true

    - name: The backup service bounds a single run
      ansible.builtin.assert:
        that:
          - restic_backup_service.status.TimeoutStartUSec != 'infinity'
          - restic_backup_service.status.TimeoutStartUSec == restic_backup_timeout
        fail_msg: >-
          the backup service's start timeout is
          {{ restic_backup_service.status.TimeoutStartUSec }}, want {{ restic_backup_timeout }}
        quiet: true

    # The other half of the podman-volumes ordering (asserted in podman_backup's
    # scenario): generic mode has nothing to quiesce, so it must not pay that
    # ordering. Guards the template conditional — dropped, every path-mode backup
    # would start waiting on multi-user.target for nothing.
    - name: Generic mode is not ordered after the container units
      ansible.builtin.assert:
        that:
          - "'multi-user.target' not in restic_backup_service.status.After"
        fail_msg: >-
          the generic-mode backup service is ordered after multi-user.target — that
          ordering belongs to podman-volumes mode, which has units to quiesce
        quiet: true

    # The script derives the repo from $(hostname); match it the same way.
    - name: Determine the host's repo path
      ansible.builtin.command: hostname
      register: restic_backup_hostname
      changed_when: false

    - name: Set the repo path
      ansible.builtin.set_fact:
        restic_backup_repo: "{{ restic_backup_repo_root }}/{{ restic_backup_hostname.stdout }}-probe-backup"

    # Starting a oneshot unit blocks until it exits, so success means the backup
    # ran clean.
    - name: Fire the backup service
      ansible.builtin.systemd_service:
        name: probe-backup.service
        state: started
      become: true

    - name: Restore the latest snapshot to a scratch directory
      ansible.builtin.command: "restic --password-file /etc/restic/password --repo {{ restic_backup_repo }} restore latest --target /var/tmp/restore"
      changed_when: false
      become: true

    - name: Read the probe file back from the restore
      ansible.builtin.slurp:
        src: /var/tmp/restore/var/tmp/probe-src/probe.txt
      register: restic_backup_restored
      become: true

    - name: The probe data round-trips through restic
      ansible.builtin.assert:
        that:
          - (restic_backup_restored.content | b64decode) == restic_backup_probe_content
        fail_msg: "the probe data did not round-trip through the backup"
        quiet: true

    # The successful run above triggered ExecStopPost, which should have recorded
    # the outcome metric node_exporter scrapes.
    - name: Read the outcome metric after the successful run
      ansible.builtin.slurp:
        src: "{{ restic_backup_textfile_dir }}/probe-backup.prom"
      register: restic_backup_metric_ok
      become: true

    - name: A successful run records probe_backup_success 1
      ansible.builtin.assert:
        that:
          - "'probe_backup_success 1' in (restic_backup_metric_ok.content | b64decode)"
          - "'probe_backup_last_run_timestamp_seconds ' in (restic_backup_metric_ok.content | b64decode)"
        fail_msg: "the outcome metric did not report a successful run"
        quiet: true

    # Drive the writer the way systemd would on a failed run; ExecStart failure
    # can't be forced in a container, so invoke the hook with SERVICE_RESULT set.
    - name: Simulate a failed run's ExecStopPost
      ansible.builtin.command: "{{ restic_backup_metric_script }}"
      environment:
        SERVICE_RESULT: exit-code
      changed_when: false
      become: true

    - name: Read the outcome metric after the simulated failure
      ansible.builtin.slurp:
        src: "{{ restic_backup_textfile_dir }}/probe-backup.prom"
      register: restic_backup_metric_fail
      become: true

    - name: A failed run records probe_backup_success 0
      ansible.builtin.assert:
        that:
          - "'probe_backup_success 0' in (restic_backup_metric_fail.content | b64decode)"
        fail_msg: "the outcome metric did not report a failed run"
        quiet: true

    # An interrupted ad-hoc restic leaves a lock behind — a killed `restic ls` is
    # enough — and restic does not skip a dead process's lock when taking its own.
    # The exclusive forget --prune is refused and every scheduled run fails until
    # the lock is cleared by hand, with the snapshot itself already saved. Plant one
    # the way reality does, by killing a restic mid-lock, and assert the run clears
    # it rather than tripping over it. restic writes the lock as <id>-tmp-<n> and
    # renames it into place; a kill between the two leaves a stray tmp file that is
    # no lock and that unlock does not clear, so wait for the rename.
    - name: Plant a stale lock from a killed restic
      ansible.builtin.shell: |
        set -u
        locks={{ restic_backup_repo | quote }}/locks
        has_lock() { [ -n "$(find "$locks" -maxdepth 1 -type f ! -name '*-tmp-*' -print -quit 2>/dev/null)" ]; }
        restic --password-file /etc/restic/password \
            --repo {{ restic_backup_repo | quote }} backup /usr >/dev/null 2>&1 &
        pid=$!
        for _ in $(seq 1 200); do
            has_lock && break
            sleep 0.1
        done
        kill -9 "$pid" 2>/dev/null
        wait "$pid" 2>/dev/null
        # Fail loudly rather than leave the assertion below proving nothing: a lock
        # that never appeared, or that the killed run tidied up, is not a test.
        has_lock
      changed_when: true
      become: true

    # Starting a oneshot blocks until it exits, so a stale lock the engine failed to
    # clear fails this task outright — which is the regression this guards.
    - name: Fire the backup service with a stale lock in the repository
      ansible.builtin.systemd_service:
        name: probe-backup.service
        state: started
      become: true

    - name: Read the outcome metric after the stale-lock run
      ansible.builtin.slurp:
        src: "{{ restic_backup_textfile_dir }}/probe-backup.prom"
      register: restic_backup_metric_stale_lock
      become: true

    - name: List the locks the stale-lock run left behind
      ansible.builtin.find:
        paths: "{{ restic_backup_repo }}/locks"
        file_type: file
      register: restic_backup_locks_after
      become: true

    - name: A stale lock neither fails the run nor survives it
      ansible.builtin.assert:
        that:
          - "'probe_backup_success 1' in (restic_backup_metric_stale_lock.content | b64decode)"
          - restic_backup_locks_after.files | length == 0
        fail_msg: >-
          a stale lock failed the run, or was left in place:
          {{ restic_backup_locks_after.files | map(attribute='path') | list }}
        quiet: true

    # Assert the integrity check is wired into the installed script, then that the
    # role's invocation is a real gate, not a no-op: the same check must reject a
    # repo whose data is gone. Corrupt a copy, not the live repo, so a standalone
    # `make verify` re-run still starts sound.
    - name: Read the installed backup script
      ansible.builtin.slurp:
        src: "{{ restic_backup_script }}"
      register: restic_backup_script_content
      become: true

    - name: The backup script runs a restic check with a read-data slice
      ansible.builtin.assert:
        that:
          - "'restic check' in (restic_backup_script_content.content | b64decode)"
          - "'--read-data-subset' in (restic_backup_script_content.content | b64decode)"
        fail_msg: "the backup script does not run restic check with a read-data slice"
        quiet: true

    - name: The backup script unlocks the repo by password file, never empty
      ansible.builtin.assert:
        that:
          - "'RESTIC_PASSWORD_FILE=' in (restic_backup_script_content.content | b64decode)"
          - "'--insecure-no-password' not in (restic_backup_script_content.content | b64decode)"
        fail_msg: "the backup script does not use a password file, or reintroduces --insecure-no-password"
        quiet: true

    - name: Discard any prior corrupt copy
      ansible.builtin.file:
        path: "{{ restic_backup_repo }}-corrupt"
        state: absent
      become: true

    - name: Copy the scratch repo to corrupt in isolation
      ansible.builtin.command: "cp -a {{ restic_backup_repo }} {{ restic_backup_repo }}-corrupt"
      changed_when: true
      become: true

    - name: Remove the copy's data to corrupt it
      ansible.builtin.file:
        path: "{{ restic_backup_repo }}-corrupt/data"
        state: absent
      become: true

    - name: Run the integrity check against the corrupt copy
      ansible.builtin.command: "restic --password-file /etc/restic/password --repo {{ restic_backup_repo }}-corrupt check"
      register: restic_backup_corrupt_check
      changed_when: false
      failed_when: false
      become: true

    - name: A corrupt repo fails the integrity check
      ansible.builtin.assert:
        that:
          - restic_backup_corrupt_check.rc != 0
        fail_msg: "restic check passed a repo with its data removed"
        quiet: true

    # The share is _netdev and the quiesce itself can unmount it mid-run, so the
    # engine must refuse to write when the repository root is not mounted.
    # Unmounted, the root is the empty directory the bind mount covers — exactly
    # where an unguarded mkdir -p creates a shadow repo that restic init's, backs
    # up into, and reports as a success while the real repo silently stops
    # receiving snapshots. Run last, and remount, so a standalone `make verify`
    # re-run still starts from a mounted share.
    #
    # Unmounted with its fstab entry intact, because that is the state the
    # NetworkManager dispatcher leaves a share in (roles/nfs). The unit's
    # RequiresMountsFor= then makes the fstab mount unit a hard requirement, so
    # systemd remounts the share before the run, which lands in the repository
    # as it should — on every fleet host, whose fstab generator gives that unit
    # a fragment (scholam, systemd 261: Requires=nfs-astropath.mount). The incus
    # Tumbleweed image ships no such generator, so there the unit has no
    # fragment, RequiresMountsFor= can pull nothing in, and the run reaches the
    # script's own guard and is refused. Both are worth asserting, per platform
    # as the convention has it, with the fragment's presence asserted alongside
    # so an image that changes turns the run red rather than re-routing it.
    # Either way the root filesystem under the mount must stay empty.
    - name: Unmount the share stand-in
      ansible.posix.mount:
        path: "{{ restic_backup_repo_root }}"
        state: unmounted
      become: true

    - name: Read whether the stand-in's mount unit has an fstab fragment
      ansible.builtin.systemd_service:
        name: "{{ restic_backup_mount_unit }}"
      register: restic_backup_mount_unit_state
      become: true

    # ignore_errors, not failed_when: false — the guard's run is meant to fail,
    # and failed_when would clear the very flag the assertion below reads.
    - name: Fire the backup service with the repository root unmounted
      ansible.builtin.systemd_service:
        name: probe-backup.service
        state: started
      register: restic_backup_unmounted_run
      ignore_errors: true
      become: true

    - name: Read the outcome metric after the unmounted run
      ansible.builtin.slurp:
        src: "{{ restic_backup_textfile_dir }}/probe-backup.prom"
      register: restic_backup_metric_unmounted
      become: true

    - name: Read whether the share came back under the run
      ansible.builtin.command: "mountpoint -q {{ restic_backup_repo_root }}"
      register: restic_backup_remounted
      changed_when: false
      failed_when: false

    # Unmount again before looking: a remounted share now covers the directory
    # a shadow repo would sit in.
    - name: Unmount the share stand-in again
      ansible.posix.mount:
        path: "{{ restic_backup_repo_root }}"
        state: unmounted
      become: true

    - name: List anything the unmounted run left on the root filesystem
      ansible.builtin.find:
        paths: "{{ restic_backup_repo_root }}"
        file_type: any
        hidden: true
      register: restic_backup_shadow
      become: true

    - name: Nothing landed on the root filesystem beneath the mount
      ansible.builtin.assert:
        that:
          - restic_backup_shadow.files | length == 0
        fail_msg: >-
          the backup wrote to an unmounted repository root:
          {{ restic_backup_shadow.files | map(attribute='path') | list }}
        quiet: true

    - name: The guard refuses an unmounted root
      ansible.builtin.assert:
        that:
          - restic_backup_mount_unit_state.status.FragmentPath | default('') | length == 0
          - restic_backup_unmounted_run is failed
          - "'probe_backup_success 0' in (restic_backup_metric_unmounted.content | b64decode)"
          - restic_backup_remounted.rc != 0
        fail_msg: the unmounted run was not refused, or the image now generates a mount unit from fstab
        quiet: true
      when: "'debian' not in group_names"

    - name: RequiresMountsFor brings the share back before the run
      ansible.builtin.assert:
        that:
          - restic_backup_mount_unit_state.status.FragmentPath | default('') | length > 0
          - restic_backup_unmounted_run is not failed
          - "'probe_backup_success 1' in (restic_backup_metric_unmounted.content | b64decode)"
          - restic_backup_remounted.rc == 0
        fail_msg: "the share was not remounted for the run (mountpoint rc {{ restic_backup_remounted.rc }})"
        quiet: true
      when: "'debian' in group_names"

    - name: Remount the share stand-in
      ansible.posix.mount:
        path: "{{ restic_backup_repo_root }}"
        src: /var/tmp/backup-store
        fstype: none
        opts: bind
        state: mounted
      become: true

    - name: Clear the failed state the unmounted run left
      ansible.builtin.command: systemctl reset-failed probe-backup.service
      changed_when: true
      become: true
