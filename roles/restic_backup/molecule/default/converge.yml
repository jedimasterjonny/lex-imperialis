---
- name: Converge
  hosts: all
  vars:
    # Exercise the engine in generic (path) mode: a probe identity backing up a
    # seeded source directory. The podman_backup consumer's scenario covers
    # podman-volumes mode.
    restic_backup_name: probe
    restic_backup_description: a probe directory
    # Local stand-in for the astropath NFS share — mounting it is the nfs role's
    # job, not this role's.
    restic_backup_root: /var/tmp/backup
    # Throwaway repo password. The role rejects an empty one, so every scenario
    # must set it; live hosts take theirs from a host-scoped vault var.
    restic_backup_password: molecule-probe-repo-password
    restic_backup_paths:
      - /var/tmp/probe-src
  pre_tasks:
    # The engine refuses to write to an unmounted repository root, so the stand-in
    # must be a real mountpoint. A bind mount models the share exactly: unmount it
    # and the empty directory underneath is where a shadow repo would land.
    - name: Create the share stand-in's backing directory
      ansible.builtin.file:
        path: /var/tmp/backup-store
        state: directory
        owner: root
        group: root
        mode: "0755"
      become: true

    - name: Mount the share stand-in
      ansible.posix.mount:
        path: /var/tmp/backup
        src: /var/tmp/backup-store
        fstype: none
        opts: bind
        state: mounted
      become: true

    - name: Create the probe source directory
      ansible.builtin.file:
        path: /var/tmp/probe-src
        state: directory
        owner: root
        group: root
        mode: "0755"
      become: true

    - name: Seed the probe source with data
      ansible.builtin.copy:
        content: "lex-imperialis restic backup probe\n"
        dest: /var/tmp/probe-src/probe.txt
        owner: root
        group: root
        mode: "0644"
      become: true
  roles:
    - role: restic_backup
