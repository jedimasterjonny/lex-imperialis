---
# Apex domain homepage serves at; follows caddy_domain wherever the vault sets it.
homepage_domain: "{{ caddy_domain | default('home.arpa') }}"

# Front the apex with TLS: the caddy global acme_dns issues the cert via DNS-01
# before any A record points here. Molecule sets it false to stay on plain HTTP
# with no ACME.
homepage_tls: true

# Dashboard title, rendered into the managed settings.yaml.
homepage_title: Homepage

# Presentation, rendered into settings.yaml. statusStyle: dot reduces a
# siteMonitor result to a coloured dot rather than printing the response time on
# every tile.
homepage_theme: dark
homepage_color: slate
homepage_header_style: boxed
homepage_status_style: dot

# The dashboard's own content, one variable per managed config file, serialised
# as-is into services.yaml, widgets.yaml and bookmarks.yaml. Empty here because a
# dashboard is a host's spec, not a role's: the fleet's groups, tiles and
# bookmarks live in the play, as prometheus's probe targets do. A host that sets
# none gets an empty dashboard rather than the examples homepage ships, which is
# what declaring no content should mean.
homepage_services: []
homepage_widgets: []
homepage_bookmarks: []

# Per-group layout, keyed by the group names in homepage_services. Key order is
# significant — homepage lays the groups out in the order this declares them — so
# it is rendered order-preserving rather than sorted.
homepage_layout: {}

# Container timezone, carried for uniformity and nothing more: the dashboard is
# rendered client-side, so its clock follows the viewer's browser, and homepage's
# own log lines are ISO-8601 Z. Nothing here consumes it, so nothing asserts it.
homepage_timezone: Europe/London

# Least-privilege host id the container drops to (PUID/PGID). Avoids 1000, which
# the cloud image's default user holds.
homepage_uid: 3010

# Widget credentials, keyed by the bare name the config files reference — the
# role adds the HOMEPAGE_VAR_ prefix homepage matches on. Delivered as a 0600
# EnvironmentFile rather than rendered into the dashboard, because homepage
# substitutes {{HOMEPAGE_VAR_<NAME>}} in any config file at read time: a service
# widget's key therefore reaches the container without a secret ever landing in
# the mode-0644 /etc/homepage/*.yaml. Empty here for the same reason the content
# vars are — whose API a dashboard talks to is a host's spec, not a role's.
homepage_secrets: {}
