---
# renovate's image manager bumps the tag.
homepage_image: ghcr.io/gethomepage/homepage:v2.3.0@sha256:f820276654539cdc2cf0169f28188d135919a7984fad76d83d8d5ff1383f3705

# The config files Ansible owns: rendered to /etc/homepage and each mounted
# read-only over the seeded config volume, from this one list. Not a tunable —
# the set is the role's config-as-code contract, and a name here without a
# matching template is a converge failure, not a no-op.
homepage_configs:
  - settings.yaml
  - services.yaml
  - widgets.yaml
  - bookmarks.yaml
