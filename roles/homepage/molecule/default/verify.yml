---
- name: Verify
  hosts: all
  gather_facts: false
  vars_files:
    - ../../defaults/main.yml
  tasks:
    # Reached through caddy with the apex Host header: homepage has no published
    # port, only the caddy network. A 200 here proves the dashboard's own Host
    # validation allows the proxy vhost. Redirects are left unfollowed: the auth
    # gate (off by default) answers the root with a 307 to /auth/signin, and
    # following it would let the sign-in page's 200 pass as if the dashboard
    # were served.
    - name: Wait for homepage to answer through the proxy
      ansible.builtin.uri:
        url: http://127.0.0.1/
        headers:
          Host: "{{ homepage_domain }}"
        follow_redirects: none
        return_content: true
      register: homepage_page
      until: homepage_page.status == 200
      retries: 30
      delay: 2

    # caddy stamps these on every response. molecule runs homepage_tls:false, so
    # HSTS is not asserted.
    - name: The security headers are set on the proxied response
      ansible.builtin.assert:
        that:
          - homepage_page.x_content_type_options | default('') == 'nosniff'
          - homepage_page.referrer_policy | default('') == 'strict-origin-when-cross-origin'
        fail_msg: "a security header is missing from the proxied response"
        quiet: true

    # The single-file mounts are the config-as-code contract: Ansible renders each
    # config and podman mounts it read-only on top of the seeded config volume.
    # The content is applied client-side, so it never reaches the served HTML —
    # read the files from inside the container instead. Each fixture token is
    # present only if that mount landed over the volume rather than being
    # shadowed by the container's own seeded skeleton.
    - name: Read the mounted configs from inside the container
      ansible.builtin.command: "podman exec homepage cat /app/config/{{ item.file }}"
      become: true
      register: homepage_config_files
      changed_when: false
      loop:
        - file: settings.yaml
          token: Adeptus Molecularum
        - file: services.yaml
          token: Astropath
        - file: widgets.yaml
          token: greeting
        - file: bookmarks.yaml
          token: Lexicanum
      loop_control:
        label: "{{ item.file }}"

    - name: Every managed config is mounted over the config volume
      ansible.builtin.assert:
        that:
          - item.item.token in item.stdout
        fail_msg: "the managed {{ item.item.file }} is not mounted at /app/config/{{ item.item.file }}"
        quiet: true
      loop: "{{ homepage_config_files.results }}"
      loop_control:
        label: "{{ item.item.file }}"

    # homepage orders the dashboard's groups by the order settings.yaml declares
    # them, so the renderer must not sort the layout keys. converge declares Fleet
    # before Archive precisely because sorting would swap them.
    - name: The layout keeps the declared group order rather than an alphabetical one
      vars:
        settings: "{{ (homepage_config_files.results | selectattr('item.file', 'eq', 'settings.yaml') | first).stdout }}"
      ansible.builtin.assert:
        that:
          - settings.index('Fleet:') < settings.index('Archive:')
        fail_msg: the rendered layout has been sorted, which reorders the dashboard's groups
        quiet: true

    # A non-zero exit fails the task, proving the health endpoint answers and its
    # loopback Host is allowed.
    - name: The healthcheck passes
      ansible.builtin.command: podman healthcheck run homepage
      become: true
      changed_when: false

    # The healthcheck proves the cap set is sufficient; it can't prove it is
    # minimal. Assert the posture directly so a regression that re-widens the
    # caps or drops the restriction fails here, not silently in production.
    - name: Read the container's security posture
      ansible.builtin.command: podman inspect homepage
      register: homepage_posture
      changed_when: false
      become: true

    - name: The container keeps only its required capabilities and bars privilege escalation
      vars:
        container: "{{ homepage_posture.stdout | from_json | first }}"
      ansible.builtin.assert:
        that:
          - "container.EffectiveCaps | default([], true) | sort == ['CAP_CHOWN', 'CAP_SETGID', 'CAP_SETUID']"
          - "'no-new-privileges' in (container.HostConfig.SecurityOpt | default([], true))"
        fail_msg: "homepage's capability or no-new-privileges posture has regressed"
        quiet: true

    # Same reasoning as the capabilities: the 200 through caddy proves the apex is
    # allowed, not that the check is on — HOMEPAGE_ALLOWED_HOSTS=* would serve that
    # 200 too. Reaching the container on its own network address sends an unlisted
    # Host, so the dashboard root must 400.
    - name: An unlisted Host is refused on the dashboard root
      vars:
        container: "{{ homepage_posture.stdout | from_json | first }}"
      ansible.builtin.uri:
        url: "http://{{ container.NetworkSettings.Networks.caddy.IPAddress }}:3000/"
        follow_redirects: none
        status_code: 400
