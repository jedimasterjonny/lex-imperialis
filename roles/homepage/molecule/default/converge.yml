---
- name: Converge
  hosts: all
  vars:
    # No real domain or ACME in the container: serve the apex over plain HTTP.
    homepage_tls: false
    # A distinctive title so "the title is served" proves the mounted settings.yaml
    # is read: the default "Homepage" is also the app's built-in fallback, so it
    # matches even when the single-file mount is broken.
    homepage_title: Adeptus Molecularum
    # A fixture credential, to prove the widget-secret path end to end: the
    # value must reach the container's environment and must not appear in any
    # of the mode-0644 configs, which carry only the placeholder.
    homepage_secrets:
      MOLECULE_TOKEN: adeptus-molecularum-fixture-token
    # One distinctive token per managed config, so verify can prove each single-file
    # mount landed rather than being shadowed by the container's seeded skeleton.
    homepage_services:
      - Fleet:
          - Astropath:
              description: Molecule fixture
              href: http://localhost/
              siteMonitor: http://localhost/
              # Nothing answers on 8989 here, so the tile renders a widget error
              # — which is fine: what is under test is that the placeholder is
              # what lands in services.yaml, not that the API call succeeds.
              widget:
                type: sonarr
                url: http://localhost:8989
                key: !unsafe "{{HOMEPAGE_VAR_MOLECULE_TOKEN}}"
      - Archive:
          - Scriptorum:
              description: Molecule fixture
              href: http://localhost/
    homepage_widgets:
      - greeting:
          text_size: xl
          text: Adeptus Molecularum
    homepage_bookmarks:
      - Codex:
          - Lexicanum:
              - abbr: LX
                href: http://localhost/
    # Declared in an order alphabetical sorting would reverse, so a dumper that
    # sorts the layout keys — silently reordering the dashboard's groups — fails
    # verify instead of shipping.
    homepage_layout:
      Fleet:
        style: row
        columns: 1
      Archive:
        style: row
        columns: 1
  tasks:
    - name: Apply the podman role
      ansible.builtin.include_role:
        name: podman

    # Homepage sits behind caddy on its network and registers a public site
    # block, so caddy must be up first to own the network and serve the proxy.
    - name: Apply the caddy role
      ansible.builtin.include_role:
        name: caddy

    - name: Apply the homepage role
      ansible.builtin.include_role:
        name: homepage
