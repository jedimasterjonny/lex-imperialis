---
# Holds the managed dashboard configs, each mounted read-only on top of the
# homepage-config volume, which keeps whatever the container seeds beside them.
# Owned by root, not the container's PUID: the mode-0644 files are
# world-readable, so the container reads them over the :ro binds regardless of
# host owner (as sibling wordpress mounts its config-as-code).
- name: Create the config directory
  ansible.builtin.file:
    path: /etc/homepage
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

# no_log because one of these carries a vault value: the Discord channel the
# alertmanager bookmark points at. Without it --diff prints the URL in full on
# every check run, and arbites logs its own applies. It costs the diff on the
# other configs too — the loop is one task — which is the price of not printing
# the one. The 0644 above is deliberate and stays: the container reads these over
# :ro binds as PUID, not root, and the role creates no host group to narrow to.
- name: Provision the dashboard configs
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/homepage/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ homepage_configs }}"
  become: true
  no_log: true
  notify: Restart homepage

# The widget credentials, kept out of the mode-0644 configs above: homepage
# substitutes {{HOMEPAGE_VAR_<NAME>}} in any config file with the environment, so
# the dashboard holds only the placeholder and the value arrives here at 0600 —
# exactly as roles/arr delivers arr_api_keys. Rendered unconditionally so
# dropping a credential empties the file rather than stranding the old value.
- name: Deploy the widget credentials environment file
  ansible.builtin.template:
    src: env.j2
    dest: /etc/homepage/env
    owner: root
    group: root
    mode: "0600"
  become: true
  no_log: true
  notify: Restart homepage

# A full public site block (not a sites/ wildcard snippet), imported as a
# top-level site and certified through the global acme_dns.
- name: Register the caddy public site block
  ansible.builtin.template:
    src: homepage.caddy.j2
    dest: /etc/caddy/sites-public/homepage.caddy
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Restart caddy for homepage

- name: Install the homepage container unit
  ansible.builtin.template:
    src: homepage.container.j2
    dest: /etc/containers/systemd/homepage.container
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Restart homepage

- name: Apply pending unit changes
  ansible.builtin.meta: flush_handlers

- name: Start homepage
  ansible.builtin.systemd_service:
    name: homepage
    state: started
  become: true
