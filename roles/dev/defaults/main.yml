---
# Developer tooling for the workstation.
dev_packages:
  # Compiles bootstrap/*.bu; the pre-commit butane hook calls it on PATH.
  - butane
  - direnv
  - fzf
  - gh
  - git
  - git-filter-repo
  - go
  # Provides /usr/bin/promtool for the alert-rule pre-commit hooks; the whole
  # prometheus server rides along, as it is one package. See README.
  - golang-github-prometheus-prometheus
  - hugo
  # Shared libraries the headless Chrome under ~/.cache/puppeteer links against;
  # puppeteer fetches the browser itself, but not these, and it exits on the
  # first missing one. Not pulled in by anything else on a headless workstation.
  - libXcomposite1
  - libXdamage1
  - libXrandr2
  - libatk-1_0-0
  - libatk-bridge-2_0-0
  - libatspi0
  - make
  - neovim
  - opentofu
  - python3
  - python3-pip
  - python3-uv
  - ripgrep

# Claude Code installs per-user via the native installer; the owner is the
# target and the binary lands under their ~/.local.
dev_user: jonny
dev_user_home: "/home/{{ dev_user }}"
dev_claude_bin: "{{ dev_user_home }}/.local/bin/claude"

# npm's global prefix and the file it is read from. See README.
dev_npm_prefix: "{{ dev_user_home }}/.local"
dev_npmrc: "{{ dev_user_home }}/.npmrc"

# Working directory of the boot-start Remote Control session, whose workspace
# trust the role pre-seeds. The one-time interactive login is in the README.
dev_remote_control_workdir: "{{ dev_user_home }}"

# The owner's Claude Code config; the role seeds workspace trust into its projects
# map so the boot session clears the trust gate instead of crash-looping.
dev_claude_config: "{{ dev_user_home }}/.claude.json"
