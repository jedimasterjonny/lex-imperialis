---
- name: Verify
  hosts: all
  gather_facts: false
  vars_files:
    - ../../defaults/main.yml
    - ../../vars/main.yml
  tasks:
    # The python3-* entries are a Provides of a versioned rpm (python313-*),
    # which is the name package_facts records — so resolve through rpm instead.
    # One call takes the whole list; its non-zero exit is the assertion.
    - name: Every developer package resolves to an installed provider
      ansible.builtin.command:
        argv: "{{ ['rpm', '--query', '--whatprovides'] + dev_packages }}"
      changed_when: false

    - name: Python 3 and pip are usable
      ansible.builtin.command: python3 -m pip --version
      changed_when: false

    - name: Gated npm is usable when enabled
      ansible.builtin.command: npm --version
      changed_when: false
      when: dev_npm | bool

    - name: OpenTofu is usable
      ansible.builtin.command: tofu version
      changed_when: false

    - name: Butane is usable
      ansible.builtin.command: butane --version
      changed_when: false

    # No version assertion, unlike tflint below — the pin is deliberately not
    # enforced for promtool (README).
    - name: Promtool is usable
      ansible.builtin.command: promtool --version
      changed_when: false

    # converge seeds a shadow at /usr/local/bin, which outranks the package's
    # /usr/bin — so the task above would happily have run that instead. Its
    # absence is what makes the pair meaningful, and it is the same stat/assert
    # shape as the superseded sudoers drop-in below.
    - name: Stat the superseded hand-installed promtool
      ansible.builtin.stat:
        path: /usr/local/bin/promtool
      register: dev_shadow_promtool
      become: true

    - name: The superseded hand-installed promtool is gone
      ansible.builtin.assert:
        that:
          - not dev_shadow_promtool.stat.exists
        fail_msg: "/usr/local/bin/promtool survives and shadows the packaged binary"
        quiet: true

    # The role masks the prometheus.service that rides along with promtool, so
    # this asserts role-enforced state, not upstream's preset default.
    - name: Read the bundled prometheus server unit state
      ansible.builtin.systemd_service:
        name: prometheus.service
      register: dev_prometheus_unit
      become: true

    - name: The bundled prometheus server is masked and not running
      ansible.builtin.assert:
        that:
          - dev_prometheus_unit.status.UnitFileState | default('absent') == 'masked'
          - dev_prometheus_unit.status.ActiveState | default('absent') == 'inactive'
        fail_msg: >-
          prometheus.service is
          {{ dev_prometheus_unit.status.UnitFileState | default('absent') }} /
          {{ dev_prometheus_unit.status.ActiveState | default('absent') }},
          not masked / inactive
        quiet: true

    - name: The Google Cloud CLI is usable
      ansible.builtin.command: gcloud version
      changed_when: false

    # Bare tflint (PATH-resolved), matching how the pre-commit gate and Makefile
    # invoke it — proves the version the gate will actually run, not just the file
    # the role installs.
    - name: Query the tflint version
      ansible.builtin.command: tflint --version
      register: dev_tflint_verify
      changed_when: false

    - name: Verify tflint is the pinned version
      ansible.builtin.assert:
        that:
          - dev_tflint_wanted in dev_tflint_verify.stdout_lines
        fail_msg: "tflint is not the pinned {{ dev_tflint_version }}"
        quiet: true
      vars:
        dev_tflint_wanted: "TFLint version {{ dev_tflint_version | regex_replace('^v', '') }}"

    - name: Stat the Claude Code binary
      ansible.builtin.stat:
        path: "{{ dev_claude_bin }}"
      become: true
      register: dev_claude_stat

    - name: Claude Code is installed for the owner
      ansible.builtin.assert:
        that:
          - dev_claude_stat.stat.exists
          - dev_claude_stat.stat.executable
        fail_msg: "claude binary missing or not executable at {{ dev_claude_bin }}"

    - name: Stat the stowed git and nvim configs
      ansible.builtin.stat:
        path: "{{ item }}"
      become: true
      loop:
        - "{{ dev_user_home }}/.gitconfig"
        - "{{ dev_user_home }}/.config/nvim/init.lua"
      register: dev_dotfiles

    - name: Git and nvim configs are stow symlinks
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.islnk
        fail_msg: "{{ item.item }} is not a stow symlink"
        quiet: true
      loop: "{{ dev_dotfiles.results }}"
      loop_control:
        label: "{{ item.item }}"

    # The legacy %wheel NOPASSWD drop-in is removed unconditionally, so its
    # absence is verified outside the gate that guards the owner's drop-in.
    - name: Stat the superseded sudoers drop-in
      ansible.builtin.stat:
        path: /etc/sudoers.d/wheel-nopasswd
      become: true
      register: dev_legacy_sudoers

    - name: The superseded wheel-wide sudoers drop-in is gone
      ansible.builtin.assert:
        that:
          - not dev_legacy_sudoers.stat.exists
        fail_msg: "/etc/sudoers.d/wheel-nopasswd should have been removed"
        quiet: true

    - name: Verify the owner's passwordless sudo
      when: dev_passwordless_sudo | bool
      block:
        - name: Stat the owner's sudoers drop-in
          ansible.builtin.stat:
            path: "/etc/sudoers.d/wheel-{{ dev_user }}-nopasswd"
          become: true
          register: dev_owner_sudoers

        - name: The owner drop-in is installed root:root 0440
          ansible.builtin.assert:
            that:
              - dev_owner_sudoers.stat.exists
              - dev_owner_sudoers.stat.mode == '0440'
              - dev_owner_sudoers.stat.pw_name == 'root'
              - dev_owner_sudoers.stat.gr_name == 'root'
            fail_msg: "wheel-{{ dev_user }}-nopasswd missing or not root:root 0440"
            quiet: true

        # Functional proof the drop-in's NOPASSWD is the last match and wins over
        # common's own-password %wheel rule: the owner sudoes with no password.
        - name: The owner sudoes without a password
          ansible.builtin.command: sudo -n true
          become: true
          become_user: "{{ dev_user }}"
          changed_when: false

    - name: Verify the Remote Control service
      when: dev_remote_control | bool
      block:
        # Enablement is the default.target.wants symlink `systemctl --user enable`
        # drops, so a pure stat proves the boot contract without the session
        # needing the owner's credentials (absent in CI, provisioned only by a
        # one-time interactive /login on the real host). The role lingers the user
        # manager, installs and enables the unit, but deliberately never starts it.
        - name: Stat the linger marker, user unit, and enable symlink
          ansible.builtin.stat:
            path: "{{ item }}"
          become: true
          loop:
            - "/var/lib/systemd/linger/{{ dev_user }}"
            - "{{ dev_user_home }}/.config/systemd/user/claude-remote-control.service"
            - "{{ dev_user_home }}/.config/systemd/user/default.target.wants/claude-remote-control.service"
          register: dev_remote_control_files

        - name: Linger is on and the user unit is installed and enabled
          ansible.builtin.assert:
            that:
              - item.stat.exists
            fail_msg: "missing: {{ item.item }}"
            quiet: true
          loop: "{{ dev_remote_control_files.results }}"
          loop_control:
            label: "{{ item.item }}"

        - name: Read the owner's Claude config
          ansible.builtin.slurp:
            src: "{{ dev_claude_config }}"
          become: true
          register: dev_claude_config_verify

        - name: Remote Control workspace is pre-trusted and onboarded
          ansible.builtin.assert:
            that:
              - dev_claude_config_project.hasTrustDialogAccepted | default(false) | bool
              - dev_claude_config_project.hasCompletedProjectOnboarding | default(false) | bool
            fail_msg: "workspace trust not seeded for {{ dev_remote_control_workdir }}"
            quiet: true
          vars:
            dev_claude_config_project: "{{ (dev_claude_config_verify.content | b64decode | from_json).projects[dev_remote_control_workdir] | default({}) }}"

        # converge seeded a pre-existing config, so the role reached it via its
        # recursive-merge branch. Pre-existing state — the owner's OAuth token and
        # an unrelated project's trust — must survive the workspace-trust seeding.
        - name: Pre-existing config state survives the recursive merge
          ansible.builtin.assert:
            that:
              - dev_claude_config_all.oauthAccount.accountUuid | default('') == 'molecule-sentinel'
              - dev_claude_config_all.projects['/opt/unrelated-molecule-project'].hasTrustDialogAccepted | default(false) | bool
            fail_msg: "the trust seeding clobbered pre-existing Claude config state"
            quiet: true
          vars:
            dev_claude_config_all: "{{ dev_claude_config_verify.content | b64decode | from_json }}"
