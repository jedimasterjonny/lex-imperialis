---
- name: Install developer tooling
  community.general.zypper:
    name: "{{ dev_packages }}"
    state: present
  become: true

# The package puts promtool at /usr/bin, but /usr/local/bin outranks that on PATH
# and the pre-commit hooks resolve it bare, so a copy hand-installed before this
# role provisioned promtool would silently keep winning and the provisioning would
# be a no-op. Removed like the superseded sudoers drop-in below: a no-op on a host
# that never carried one.
- name: Remove the superseded hand-installed promtool
  ansible.builtin.file:
    path: /usr/local/bin/promtool
    state: absent
  become: true

# promtool ships only inside the whole prometheus package, so installing it also
# drops a prometheus.service. openSUSE's `disable *` preset default leaves that
# dormant, but dormant-by-upstream-default is not the same as dormant by this
# role's doing: mask it, so neither a stray enable nor a preset that someday ships
# enabled can stand a server up on the host holding .vault_pass and fleet-wide
# root. Two tasks in this order, as autoupdate does: the module masks before it
# stops, so one combined task strands a running unit at ActiveState=failed. The
# stat gates on the unit existing, which also keeps a first --check run -- taken
# before the package is installed -- from fatalling on the absent unit.
- name: Stat the prometheus server unit bundled with promtool
  ansible.builtin.stat:
    path: /usr/lib/systemd/system/prometheus.service
  register: dev_prometheus_unit
  become: true

- name: Neutralise the prometheus server bundled with promtool
  when: dev_prometheus_unit.stat.exists
  become: true
  block:
    - name: Stop the bundled prometheus server
      ansible.builtin.systemd_service:
        name: prometheus.service
        state: stopped

    - name: Mask the bundled prometheus server
      ansible.builtin.systemd_service:
        name: prometheus.service
        masked: true

- name: Provision the owner's npm toolchain
  become: true
  block:
    - name: Install npm
      community.general.zypper:
        name: npm
        state: present

    # no_log because lineinfile returns the whole file as its diff, and `npm login`
    # stores a registry token here. See README.
    - name: Set the owner's npm global prefix
      ansible.builtin.lineinfile:
        path: "{{ dev_npmrc }}"
        regexp: ^prefix=
        line: "prefix={{ dev_npm_prefix }}"
        create: true
        owner: "{{ dev_user }}"
        group: users
        mode: "0600"
      no_log: true

    # No zypper package and no self-update, so the pin drives the install as
    # tflint's does; the version is what gives it teeth, since `state: present`
    # alone is satisfied by any installed copy. HOME is what points npm at the
    # npmrc above, so that prefix is where this lands. See README.
    #
    # Skipped in check mode: the module resolves npm as it loads, before it consults
    # check mode, so a dry run taken before the install above lands would abort the
    # play. Costs this package's drift reporting on a --check, which the Makefile
    # already calls best-effort.
    - name: Install firebase-tools at the pinned version
      community.general.npm:
        name: firebase-tools
        version: "{{ dev_firebase_tools_version }}"
        global: true
        state: present
      become: true
      become_user: "{{ dev_user }}"
      environment:
        HOME: "{{ dev_user_home }}"
      when: not ansible_check_mode

- name: Ensure curl is present for the Claude Code installer
  community.general.zypper:
    name: curl
    state: present
  become: true

- name: Ensure unzip is present for the tflint installer
  community.general.zypper:
    name: unzip
    state: present
  become: true

# gcloud has no openSUSE package, so it comes from Google's own repo. The signing
# key must reach the RPM keyring to verify the package itself; the repo add's
# auto_import_keys covers only the metadata's zypp keyring, and autorefresh is off
# so a Google-repo outage can't fail an unrelated zypper run. ansible.builtin.rpm_key
# is avoided: its rpm 4.20 librpm binding aborts parsing this key ("Unable to parse
# PGP key armor"), so import through rpmkeys, keyed to a present-check on the key's
# short id (3e1ba8d5) for idempotence.
- name: Import the Google Cloud package-signing key
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      rpm -q gpg-pubkey-3e1ba8d5 >/dev/null 2>&1 && exit 0
      key="$(mktemp)"
      trap 'rm -f "$key"' EXIT
      curl -fsSL https://packages.cloud.google.com/yum/doc/rpm-package-key.gpg -o "$key"
      rpmkeys --import "$key"
      echo imported
  become: true
  register: dev_gcloud_key_import
  changed_when: "'imported' in dev_gcloud_key_import.stdout"

- name: Add the Google Cloud CLI repository
  community.general.zypper_repository:
    name: google-cloud-cli
    repo: https://packages.cloud.google.com/yum/repos/cloud-sdk-el9-x86_64
    auto_import_keys: true
    autorefresh: false
    state: present
  become: true

- name: Install the Google Cloud CLI
  community.general.zypper:
    name: google-cloud-cli
    state: present
  become: true

# tflint has no zypper package, and does not self-update, so a version check
# (not creates:) drives idempotence and picks up renovate bumps. The upstream
# script checksum-verifies the download, and is fetched at the pinned tag rather
# than master so the code piped into root's shell moves only when the pin does.
- name: Check the installed tflint version
  ansible.builtin.command: /usr/local/bin/tflint --version
  register: dev_tflint_installed
  changed_when: false
  failed_when: false
  check_mode: false

- name: Install tflint at the pinned version
  ansible.builtin.shell:
    cmd: set -o pipefail && curl -fsSL https://raw.githubusercontent.com/terraform-linters/tflint/{{ dev_tflint_version }}/install_linux.sh | bash
  become: true
  environment:
    TFLINT_VERSION: "{{ dev_tflint_version }}"
  vars:
    dev_tflint_wanted: "TFLint version {{ dev_tflint_version | regex_replace('^v', '') }}"
  # stdout_lines (exact line match), not stdout (substring), so pin 0.63.1 is not
  # falsely satisfied by an installed 0.63.10.
  when: dev_tflint_wanted not in dev_tflint_installed.stdout_lines
  changed_when: true

# sudoers.d loads in sorted lexical order and the last match wins, so this
# drop-in must sort after common's `wheel` file for its NOPASSWD to override that
# file's own-password `%wheel` rule — `wheel-<owner>-` sorts after `wheel`.
# validate keeps a broken policy from ever reaching disk and locking out sudo.
- name: Grant the owner passwordless sudo on the workstation
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/wheel-{{ dev_user }}-nopasswd"
    content: |
      ## The workstation owner runs any command without a password, overriding
      ## common's own-password %wheel rule (this file sorts after wheel).
      {{ dev_user }} ALL=(ALL:ALL) NOPASSWD: ALL
    owner: root
    group: root
    mode: "0440"
    validate: /usr/sbin/visudo -cf %s
  become: true

# Retire the hand-rolled %wheel NOPASSWD drop-in this supersedes; a no-op on any
# host that never carried it.
- name: Remove the superseded wheel-wide passwordless sudo drop-in
  ansible.builtin.file:
    path: /etc/sudoers.d/wheel-nopasswd
    state: absent
  become: true

# The native installer self-updates in the background, so it runs once and
# never again — creates guards re-runs. HOME is set explicitly because
# become_user does not reliably export it for the script.
- name: Install Claude Code with the native installer
  ansible.builtin.shell:
    cmd: set -o pipefail && curl -fsSL https://claude.ai/install.sh | bash
    creates: "{{ dev_claude_bin }}"
  become: true
  become_user: "{{ dev_user }}"
  environment:
    HOME: "{{ dev_user_home }}"

- name: Deploy the owner's git and nvim dotfiles
  ansible.builtin.include_role:
    name: stow
  vars:
    stow_user: "{{ dev_user }}"
    stow_user_home: "{{ dev_user_home }}"
    stow_packages:
      - git
      - nvim

# Remote Control runs under the owner's own `systemd --user` manager, not a
# system unit: on the SELinux-enforcing fleet PID 1 (init_t) cannot read or exec
# the claude binary under the owner's home (home_bin_t), so a system service
# restart-storms with 203/EXEC. The user manager runs in the owner's unconfined
# domain, where the binary execs.
- name: Configure the Claude Code Remote Control session
  become: true
  become_user: "{{ dev_user }}"
  block:
    - name: Enable lingering so the owner's user manager runs at boot
      ansible.builtin.command:
        cmd: loginctl enable-linger {{ dev_user }}
        creates: "/var/lib/systemd/linger/{{ dev_user }}"
      become: true
      become_user: root

    - name: Create the owner's user systemd unit directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ dev_user }}"
        group: users
        mode: "0755"
      loop:
        - "{{ dev_user_home }}/.config/systemd/user"
        - "{{ dev_user_home }}/.config/systemd/user/default.target.wants"

    - name: Render the Claude Code Remote Control user unit
      ansible.builtin.template:
        src: claude-remote-control.service.j2
        dest: "{{ dev_user_home }}/.config/systemd/user/claude-remote-control.service"
        owner: "{{ dev_user }}"
        group: users
        mode: "0644"

    # Enabled only, never started here: enablement is just the
    # default.target.wants symlink the lingering user manager pulls in at boot.
    # Dropping it in directly rather than via `systemctl --user enable` means the
    # role needs no running user manager at converge — nothing to race, no bus to
    # reach. The session needs the owner's claude.ai credentials from a one-time
    # interactive /login (absent in molecule), so the role never starts it;
    # starting it credential-less would crash-loop. There is deliberately no
    # restart handler, so applying a change never tears down a live remote session
    # — edits take effect at the next restart or boot.
    - name: Enable the Claude Code Remote Control user service for boot
      ansible.builtin.file:
        src: ../claude-remote-control.service
        dest: "{{ dev_user_home }}/.config/systemd/user/default.target.wants/claude-remote-control.service"
        state: link

    # Claude refuses to run in an untrusted directory, so without this the boot
    # session exits "Workspace not trusted" and Restart=always crash-loops the
    # unit. Seed the per-directory trust keys (an interactively trusted project
    # carries both) into the owner's app-managed ~/.claude.json for the workdir.
    # The when-guard writes only when a key is missing, so once seeded a converge
    # skips it — no churn, no clobber of Claude's live writes; an absent file is
    # created minimal and Claude merges its own state on first run. no_log keeps
    # the owner's stored OAuth token (same file) out of --diff.
    - name: Stat the owner's Claude Code config
      ansible.builtin.stat:
        path: "{{ dev_claude_config }}"
      register: dev_claude_config_stat

    - name: Read the owner's Claude Code config when present
      ansible.builtin.slurp:
        src: "{{ dev_claude_config }}"
      register: dev_claude_config_slurp
      when: dev_claude_config_stat.stat.exists
      no_log: true

    - name: Trust the Remote Control workspace in the owner's Claude config
      ansible.builtin.copy:
        dest: "{{ dev_claude_config }}"
        content: "{{ dev_claude_config_existing | combine(dev_claude_trust_patch, recursive=true) | to_nice_json }}\n"
        mode: "0600"
      vars:
        dev_claude_config_existing: >-
          {{ (dev_claude_config_slurp.content | b64decode | from_json)
             if dev_claude_config_stat.stat.exists else {} }}
        dev_claude_config_project: "{{ dev_claude_config_existing.projects[dev_remote_control_workdir] | default({}) }}"
        # A templated YAML key is not rendered, so build the patch as a Jinja
        # literal where the workdir is the key expression.
        dev_claude_trust_patch: >-
          {{ {'projects': {dev_remote_control_workdir: {'hasTrustDialogAccepted': true,
             'hasCompletedProjectOnboarding': true}}} }}
      when: >-
        not (dev_claude_config_project.hasTrustDialogAccepted | default(false) | bool
             and dev_claude_config_project.hasCompletedProjectOnboarding | default(false) | bool)
      no_log: true
