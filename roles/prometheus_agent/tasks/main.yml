---
# Agent mode refuses to start with no remote_write, so an unset URL is a
# crash-looping container whose cause is three layers down in a container log.
# Fail here instead, before anything is written.
- name: A remote-write endpoint is configured
  ansible.builtin.assert:
    that:
      - prometheus_agent_remote_write_url | length > 0
    fail_msg: >-
      prometheus_agent_remote_write_url is empty. Agent mode keeps no local TSDB
      and refuses to start without at least one remote_write endpoint — set it to
      the receiving Prometheus's /api/v1/write.
    quiet: true

- name: Create the config directory
  ansible.builtin.file:
    path: "{{ prometheus_agent_config_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Deploy the agent config
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: "{{ prometheus_agent_config_dir }}/prometheus.yml"
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Restart prometheus-agent

- name: Install the prometheus-agent container unit
  ansible.builtin.template:
    src: prometheus-agent.container.j2
    dest: /etc/containers/systemd/prometheus-agent.container
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Restart prometheus-agent

# Restart-on-change runs at flush; this generates the quadlet unit and asserts it
# is up even on a converge where nothing changed and no handler fired.
- name: Apply pending unit changes
  ansible.builtin.meta: flush_handlers

- name: Start prometheus-agent
  ansible.builtin.systemd_service:
    name: prometheus-agent
    state: started
  become: true
