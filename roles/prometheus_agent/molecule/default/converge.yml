---
- name: Converge
  hosts: all
  tasks:
    - name: Apply the podman role
      ansible.builtin.include_role:
        name: podman

    - name: Apply the prometheus_agent role
      ansible.builtin.include_role:
        name: prometheus_agent
      vars:
        # Nothing listens here. The agent buffers to its WAL and retries, which is
        # exactly its behaviour against an unreachable receiver — verify asserts
        # the endpoint is configured and the remote-storage machinery is running,
        # not that a write succeeded.
        prometheus_agent_remote_write_url: http://127.0.0.1:19291/api/v1/write
        prometheus_agent_node_targets:
          - localhost:9100
        prometheus_agent_cadvisor_targets:
          - localhost:8080
        # Nothing listens on 9093 either; the target need only be discovered for
        # the scrape job to register, which verify asserts.
        prometheus_agent_alertmanager_targets:
          - localhost:9093
        # Exercises the blackbox job template. No exporter runs on 9115 here, so
        # the target registers (down) but need only be discovered — verify asserts
        # the job registered and carries its module, not that the probe succeeded.
        prometheus_agent_probe_targets:
          - module: http_2xx
            targets:
              - https://example.com
