---
# No podman.socket task: cadvisor no longer reads the podman API, so nothing in
# the fleet needs that socket enabled. It is left as the host found it rather than
# disabled here — podman's host configuration belongs to roles/podman, not to a
# consumer of it.

# As root, like cadvisor: the file is root's own, so its dropped caps don't matter.
- name: Check whether the host's DMI system UUID is readable
  ansible.builtin.stat:
    path: /sys/class/dmi/id/product_uuid
  become: true
  register: cadvisor_dmi_uuid

- name: Install the cadvisor container unit
  ansible.builtin.template:
    src: cadvisor.container.j2
    dest: /etc/containers/systemd/cadvisor.container
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Restart cadvisor

- name: Apply pending unit changes
  ansible.builtin.meta: flush_handlers

- name: Start cadvisor
  ansible.builtin.systemd_service:
    name: cadvisor
    state: started
  become: true
