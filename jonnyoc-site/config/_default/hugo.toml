baseURL = "https://jonnyoc.uk/"
defaultContentLanguage = "en"

enableRobotsTXT = true

buildDrafts = false
buildFuture = false

[imaging]
  anchor = 'Center'

# Must stay present and empty: deleting it restores Hugo's built-in tags and
# categories, publishing two empty term-list pages.
[taxonomies]

[sitemap]
  changefreq = 'daily'
  filename = 'sitemap.xml'
  priority = 0.5

# No content, so no feed: RSS here renders an empty index.xml and links it from
# the home page's head.
[outputs]
  home = ["HTML"]
