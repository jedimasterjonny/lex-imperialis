---
name: Set up the dev venv
description: >-
  Python, uv and a .venv installed from requirements-dev.txt — the layout the
  make targets activate. Runs after actions/checkout.

runs:
  using: composite
  steps:
    - name: Set up Python
      id: python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
      with:
        python-version: "3.14"

    # uv resolves and installs this set an order of magnitude faster than pip,
    # and owns the wheel cache setup-python's cache: pip used to hold.
    - name: Set up uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        enable-cache: true
        cache-dependency-glob: requirements*.txt

    # The venv is built against setup-python's interpreter, not a uv-managed
    # download, so the python under test stays the one pinned above.
    - name: Install dev tooling
      shell: bash
      run: |
        uv venv .venv --python '${{ steps.python.outputs.python-path }}'
        uv pip install --python .venv/bin/python -r requirements-dev.txt
