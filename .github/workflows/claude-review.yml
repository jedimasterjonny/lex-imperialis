---
name: Claude review

# "on" is quoted so yamllint's truthy rule does not read it as a boolean.
"on":
  pull_request:
    types: [opened, labeled, ready_for_review, reopened]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A review that has started has already spent the quota, so let it finish
  # rather than cancelling it. Several triggers share a ref, so more than one
  # run per PR is possible; a second queues and then declines. A third would
  # evict the queued one, which nothing re-fires — tolerable only because the
  # renovate path emits `opened` plus exactly one `labeled`.
  cancel-in-progress: false

jobs:
  review:
    name: review
    # Label-gated, drafts and forks excluded. The `labeled` clause stops a
    # second, unrelated label re-running a review upstream would only decline.
    # See the README.
    if: >-
      contains(github.event.pull_request.labels.*.name, 'review')
      && (github.event.action != 'labeled' || github.event.label.name == 'review')
      && github.event.pull_request.draft == false
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # Higher than the molecule tiers' 20: the skill fans out to a triage agent,
    # a summariser, four parallel reviewers and a validator per finding, and a
    # timeout costs the quota without posting anything.
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      issues: read
      # Mints the Claude App token the action comments with. See the README.
      id-token: write
    outputs:
      # The action's own verdict on whether Claude ran. Empty when it
      # short-circuits without starting — the workflow-file-differs refusal in
      # the README — which the job's status alone cannot be told apart from a
      # review that ran and found nothing. review-outcome needs that apart.
      conclusion: ${{ steps.claude.outputs.conclusion }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Review the pull request
        id: claude
        uses: anthropics/claude-code-action@e2a4b761cd77a1138a5b41410eda9b28581f9bcd # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_OAUTH_TOKEN }}
          allowed_bots: "renovate[bot]"
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          # A URL, not the `owner/repo/pull/N` form upstream's example uses:
          # the skill feeds this straight to `gh pr view`/`gh pr comment`, and
          # gh's parser reads that form as a *branch name* and finds nothing.
          #
          # The override is repeated here, not just in --append-system-prompt,
          # because the skill delegates its skip-this-PR decision to a subagent
          # that does not inherit the session system prompt. This is the user
          # turn the orchestrator relays onward, so it is the copy that reaches
          # the decision. See the README.
          prompt: |
            /code-review:code-review --comment https://github.com/${{ github.repository }}/pull/${{ github.event.pull_request.number }}

            This pull request was routed here deliberately by a label. Review it
            even though it is automated and even if the diff looks trivial.
          # All of these are load-bearing, --comment above included; see the
          # README for why each is.
          claude_args: >-
            --allowedTools "mcp__github_inline_comment__create_inline_comment"
            --disallowedTools "Bash(git push:*),Bash(gh pr merge:*),Bash(gh pr review:*),Bash(gh api:*)"
            --append-system-prompt "A label routed this pull request here
            deliberately: review it even though it is automated and even if the
            diff looks trivial. For a version bump, assess any release notes in
            the pull request body against how this repository uses the
            dependency."

  request-signoff:
    name: request sign-off
    needs: review
    # Fires even when the review failed or returned early — see the README.
    # GitHub refuses a review request from the PR's own author, so this fires on
    # renovate's PRs and quietly skips the owner's own branches.
    if: >-
      !cancelled()
      && needs.review.result != 'skipped'
      && github.event.pull_request.user.login != github.repository_owner
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Request review from the owner
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --add-reviewer "$GITHUB_REPOSITORY_OWNER"

  review-outcome:
    name: review outcome
    needs: review
    # Upstream posts its summary at its own discretion: #497 got a "no issues
    # found" comment, #485 and #491 got nothing from runs that spent four
    # minutes doing the work. Silence then reads exactly like a review that
    # never fired, so record the outcome rather than leaving it to be inferred.
    # Gated on the action's own conclusion, not the job's status: a PR that
    # edits this workflow gets a green eleven-second review job that never
    # started Claude, and "no findings" there would be a claim about a review
    # that did not happen. A failed review is carried by its own check for the
    # same reason. Not gated on the PR's author, unlike the sign-off above —
    # the ambiguity is the same on the owner's own labelled PRs.
    if: ${{ !cancelled() && needs.review.outputs.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Say so when the review posted nothing
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # Findings land as review comments on the diff, the summary as an
          # issue comment, so both lists are needed — checking only one would
          # label a PR that got inline findings "no findings". The app's login
          # is `claude` through GraphQL and `claude[bot]` through REST.
          authors=$(
            gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json comments \
              --jq '.comments[].author.login'
            gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/comments" --paginate \
              --jq '.[].user.login'
          )
          if printf '%s\n' "$authors" | grep -qiE '^claude(\[bot\])?$'; then
            echo "Review posted its own comment; nothing to add."
            exit 0
          fi
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" \
            --body "Claude reviewed this and posted no findings — [run]($RUN_URL)."
