---
name: molecule

# "on" is quoted so yamllint's truthy rule does not read it as a boolean.
# Two tiers, routed by the scenarios a role ships: incus runs free on the GitHub
# runner on the Tumbleweed image (default); the full-VM tier runs on a billable
# Hetzner VM (Hetzner Cloud cannot nest KVM, so the VM is the real machine).
# discover gates each to the roles a PR actually touches. No push:main — a
# post-merge tier would bill a Hetzner VM on every merge; see README.md for what
# catches a break instead.
"on":
  pull_request:
    # types replaces the default set, so opened/synchronize/reopened must stay;
    # ready_for_review is the addition, re-firing the run when the PR leaves draft.
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

# Per-ref, not global: different PRs run side by side; a re-push supersedes its
# own in-flight run (the hetzner teardown backstop still fires on cancel). Within
# a run, the matrix legs are already parallel and use distinct VM names.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  discover:
    name: discover
    # Draft PRs skip every tier (lint still runs); molecule-gate below reports
    # green off the skipped needs. Non-PR events carry no draft flag, so they run.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    outputs:
      incus: ${{ steps.set.outputs.incus }}
      hetzner: ${{ steps.set.outputs.hetzner }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # Emit one matrix per tier from the PR diff. A changed role runs its own
      # tiers; shared infra (anything outside roles/) is exercised via the motd
      # harness. The incus tier is free, so any shared change runs it; the
      # billable hetzner VM validates real-machine behaviour, so a toolchain-only
      # bump (requirements-dev.txt, the Makefile or the pre-commit hook set) stays
      # on the free incus tier.
      - name: Determine roles and tiers
        id: set
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then
            roles=$(find roles -mindepth 1 -maxdepth 1 -type d -printf '%f\n')
            shared=""
          else
            # Drop *.md before deriving roles/tiers: a role's README is its only
            # non-code top-level file, so a doc-only edit must not bill a hetzner
            # VM (or run any molecule tier). git diff runs on its own line so a
            # real git failure aborts under set -e instead of yielding an empty diff.
            all_changed=$(git diff --name-only "$BASE_SHA...$HEAD_SHA")
            changed=$(printf '%s\n' "$all_changed" | grep -vE '\.md$' || true)
            roles=$(printf '%s\n' "$changed" | sed -n 's#^roles/\([^/]*\)/.*#\1#p')
            # Non-role paths that still warrant molecule, in two groups: the fleet
            # code an apply executes (plays, inventory, bootstrap, ansible.cfg),
            # which arbites runs as root within ~15 min of a merge and
            # which no role matrix covers; and the harness and toolchain the tiers
            # themselves run on. Everything else (terraform/, jonnyoc-site/, docs)
            # yields no tiers, so molecule-gate reports green on those PRs instead
            # of blocking on a check that never runs.
            shared=$(printf '%s\n' "$changed" | grep -E \
              -e '^playbooks/' \
              -e '^inventory/' \
              -e '^bootstrap/' \
              -e '^ansible\.cfg$' \
              -e '^molecule/' \
              -e '^bin/.*\.sh$' \
              -e '^requirements(-dev)?\.txt$' \
              -e '^Makefile$' \
              -e '^\.pre-commit-config\.yaml$' \
              -e '^\.github/workflows/molecule\.yml$' \
              -e '^\.github/actions/' \
              || true)
          fi

          # An engine role is exercised by its consumers' scenarios, not its own:
          # restic_backup by home_backup and podman_backup, stow by common and dev.
          # A PR touching only the engine otherwise runs the engine's scenario green
          # while neither consumer is ever converged — renaming one of its variables
          # is enough — and arbites applies main as root within ~15 min. The consumers
          # are read out of the tree rather than listed here; the script says why, and
          # aborts rather than narrowing the matrix if it cannot read the graph. A
          # no-op for workflow_dispatch, which already selects every role.
          roles=$(printf '%s\n' "$roles" | bin/expand-role-consumers.sh)

          incus_cand="$roles"
          hetzner_cand="$roles"
          if [ -n "$shared" ]; then
            incus_cand=$(printf '%s\nmotd' "$roles")
            if printf '%s\n' "$shared" | grep -qvE '^(requirements-dev\.txt|Makefile|\.pre-commit-config\.yaml)$'; then
              hetzner_cand=$(printf '%s\nmotd' "$roles")
            fi
          fi

          tier_matrix() {  # $1: candidate roles  $2: scenario whose molecule.yml gates the tier
            local out="" r
            for r in $(printf '%s\n' "$1" | sort -u); do
              if [ -n "$r" ] && [ -f "roles/$r/molecule/$2/molecule.yml" ]; then
                out="${out}${r}"$'\n'
              fi
            done
            printf '%s' "$out" | jq -R -s -c 'split("\n") | map(select(length > 0))'
          }
          incus=$(tier_matrix "$incus_cand" default)
          hetzner=$(tier_matrix "$hetzner_cand" hetzner)
          {
            echo "incus=$incus"
            echo "hetzner=$hetzner"
          } >> "$GITHUB_OUTPUT"
          echo "incus: $incus  hetzner: $hetzner"

  incus:
    name: incus (${{ matrix.role }})
    needs: discover
    if: needs.discover.outputs.incus != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        role: ${{ fromJSON(needs.discover.outputs.incus) }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up the dev venv
        uses: ./.github/actions/venv

      # The dev-host preseed pins a btrfs pool; GitHub runners are ext4, so init
      # with --auto and a dir pool — the storage driver is irrelevant to the test.
      # The connection plugin runs incus as the runner user, so grant it socket
      # access via the incus-admin group and enter that group with sg.
      - name: Set up incus
        run: |
          sudo apt-get update
          sudo apt-get install -y incus
          sudo incus admin init --auto --storage-backend=dir
          # Docker (preinstalled on the runner) defaults FORWARD to DROP, which
          # blocks incus container NAT; the runner also has no IPv6 egress.
          sudo iptables -P FORWARD ACCEPT
          sudo incus network set incusbr0 ipv6.address none
          sudo usermod -aG incus-admin "$USER"

      # No MOLECULE_RUN_ID: each incus leg gets its own ephemeral runner, so the
      # stable instance name can't collide; only Hetzner's shared account needs one.
      - name: Run the incus molecule scenario
        env:
          ROLE: ${{ matrix.role }}
        run: sg incus-admin -c "make test ROLE=$ROLE"

  hetzner:
    name: hetzner (${{ matrix.role }})
    needs: discover
    if: needs.discover.outputs.hetzner != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        role: ${{ fromJSON(needs.discover.outputs.hetzner) }}
    # Distinct VM + SSH-key names per run and role, so concurrent legs and runs
    # never collide; create and destroy read the same name, including the
    # cancellation backstop below.
    env:
      MOLECULE_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up the dev venv
        uses: ./.github/actions/venv

      # HCLOUD_TOKEN is the CI test-project token (a repo secret scoped to a
      # throwaway Hetzner project with no production server), so this job never
      # decrypts the vault — closing the one PR-triggered path that otherwise would.
      # The make target reads HCLOUD_TOKEN straight from the environment here, only
      # falling back to the vault for local runs.
      - name: Run the hetzner molecule scenario
        env:
          ROLE: ${{ matrix.role }}
          HCLOUD_TOKEN: ${{ secrets.MOLECULE_HCLOUD_TOKEN }}
        run: make test-hetzner ROLE="$ROLE"

      # Backstop for cancellation (timeout/manual/supersede), where molecule is
      # killed before its own --destroy=always teardown and would orphan a
      # billable VM. Success and failure both already tear down.
      - name: Tear down the Hetzner server
        if: cancelled()
        env:
          ROLE: ${{ matrix.role }}
          HCLOUD_TOKEN: ${{ secrets.MOLECULE_HCLOUD_TOKEN }}
        run: make destroy-hetzner ROLE="$ROLE"

  # Fixed-name summary check for branch protection: the per-role matrix job names
  # vary per PR and can't be required directly. Runs on every PR (if: always()),
  # so skipped tiers on a non-fleet PR still report this check as passing.
  # But a tier that discover put work in and that then never ran must not report
  # green — that is a required check waving an untested fleet change through to an
  # unattended root apply (as terraform-gate guards its skipped plan). Hence the
  # third clause: a tier whose matrix is non-empty yet whose job is skipped fails
  # the gate. It is qualified on discover having succeeded, because a skipped
  # discover (draft PR) emits an empty output that would otherwise read as in-scope.
  molecule-gate:
    name: molecule-gate
    if: always()
    needs: [discover, incus, hetzner]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any tier failed, was cancelled, or was skipped in scope
        if: >-
          contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
          || (needs.discover.result == 'success'
              && ((needs.discover.outputs.incus != '[]' && needs.incus.result == 'skipped')
                  || (needs.discover.outputs.hetzner != '[]' && needs.hetzner.result == 'skipped')))
        run: |
          echo "A molecule tier failed, was cancelled, or was skipped while in scope."
          exit 1
