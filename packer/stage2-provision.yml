---
# Stage 2: boot stage 1's snapshot as an ordinary server, install what the fleet
# roles need, and strip the machine identity.
#
# NOT idempotent, by design. It runs once, on a throwaway server, to produce a
# snapshot.
- name: Provision the MicroOS ContainerHost image
  hosts: all
  remote_user: root
  # Cannot be true at the start: the kvm-and-xen image ships ZERO python
  # packages, and fact gathering needs an interpreter. Gathered explicitly once
  # the bootstrap below has put one on the box.
  gather_facts: false
  # stow and restic_backup are here because common and podman_backup/home_backup
  # reach them through an include_role, so they never appear in
  # playbooks/rogue-trader.yml's roles list.
  vars_files:
    - ../roles/common/defaults/main.yml
    - ../roles/firewalld/defaults/main.yml
    - ../roles/nfs/defaults/main.yml
    - ../roles/podman/defaults/main.yml
    - ../roles/restic_backup/defaults/main.yml
    - ../roles/stow/defaults/main.yml
    - ../roles/wireguard_client/defaults/main.yml
  vars:
    # Not dereferenceable before Gather facts below: podman_packages resolves its
    # runtime from ansible_facts['distribution'].
    #
    # Deliberately not a delta against the image's SBOM: a package that already
    # ships is a no-op here, where one missed is not merely a slow converge --
    # zypper stages into a new snapshot on MicroOS, so a role that installs a
    # package and uses it in the next task fails against a running system that
    # does not have it yet.
    microos_packages: >-
      {{ common_packages + firewalld_packages + podman_packages + wireguard_client_packages
         + [nfs_package, restic_backup_package, stow_package] }}
    # astropath stays literal: share names live in playbooks/rogue-trader.yml's
    # nfs_shares, out of a vars_files' reach. Baked because / is read-only at run
    # time, so roles/nfs can create neither the root nor the directory under it.
    microos_nfs_points:
      - "{{ nfs_mount_root }}"
      - "{{ nfs_mount_root }}/astropath"

  tasks:
    # ansible.cfg points at inventory/, so a bare ansible-playbook run of this
    # file would target the fleet -- and this play ends by deleting the machine
    # id, the host keys and root's authorized_keys. The alias comes from the
    # provisioner's host_alias in microos.pkr.hcl. Asserted rather than narrowed
    # in hosts:, which would silently match nothing and yield an unprovisioned
    # snapshot from a green build.
    - name: Refuse to run outside the packer build
      ansible.builtin.assert:
        that:
          - inventory_hostname == 'packer-microos'
        fail_msg: >-
          This play strips machine identity and must only run against packer's
          build server, not {{ inventory_hostname }}.
        success_msg: Packer build server confirmed.

    # raw, because there is no interpreter yet for a module to run against.
    # python3-base is a Provides: of the versioned python313-base, so it
    # resolves without pinning a Python version that moves under a rolling
    # distro.
    - name: Bootstrap a Python interpreter
      ansible.builtin.raw: transactional-update --non-interactive pkg install python3-base
      changed_when: true

    # --no-block, and not detached: raw ignores async and fails the task on the
    # non-zero return a torn-down session produces, while a backgrounded
    # subshell, nohup and systemd-run are all killed as the task returns, so the
    # box never reboots at all. systemd owns the job instead, and returns rc 0
    # immediately. Test any change to this on a cold-start box -- one that
    # already has Python cannot fail it, however it is written.
    - name: Reboot into the snapshot carrying Python
      ansible.builtin.raw: systemctl --no-block reboot
      changed_when: true

    - name: Wait for the box to come back with an interpreter
      ansible.builtin.wait_for_connection:
        delay: 15
        timeout: 600

    # Fails the build if the bootstrap above left no interpreter to discover.
    - name: Gather facts
      ansible.builtin.setup:

    # The one assumption the whole move rests on: that community.general.zypper
    # detects MicroOS (read-only root plus /usr/sbin/transactional-update) and
    # transparently wraps zypper in transactional-update. Exercising it here
    # means a failure lands on a throwaway server rather than on rogue-trader.
    - name: Install the packages the fleet roles need
      community.general.zypper:
        name: "{{ microos_packages }}"
        state: present

    # --continue extends the snapshot the install above just created, rather
    # than branching a second one off the still-running old root, which would
    # ship the mount points and lose every package. Made here rather than in
    # stage 1's writable window because rescue is Debian and sets no SELinux
    # xattr at all: run inside a transaction on a booted MicroOS the policy
    # labels them default_t, which is what rogue-trader carries today and what
    # the mount and the restic service expect. One transaction for all of them,
    # not one each: mkdir -p takes the lot, where a loop would chain a snapshot
    # per directory.
    - name: Create the NFS mount points
      ansible.builtin.command:
        argv: >-
          {{ ['transactional-update', '--non-interactive', '--continue', 'run', 'mkdir', '-p']
             + microos_nfs_points }}
      changed_when: true

    # transactional-update stages into a new snapshot; nothing above is live
    # until the server boots into it.
    - name: Reboot into the new snapshot
      ansible.builtin.reboot:
        reboot_timeout: 600

    # rpm, not package_facts: python3-firewall and python3-selinux resolve
    # through a Provides of a versioned name, which is what package_facts would
    # record, so a name check would fail an install that in fact worked. One call
    # takes the whole list; its non-zero exit is the assertion.
    - name: Confirm every package survived into the booted snapshot
      ansible.builtin.command:
        argv: "{{ ['rpm', '--query', '--whatprovides'] + microos_packages }}"
      changed_when: false

    - name: Stat the NFS mount points
      ansible.builtin.stat:
        path: "{{ item }}"
        # Off by default, and the context is the point of the assert below.
        get_selinux_context: true
      loop: "{{ microos_nfs_points }}"
      register: microos_nfs_stat

    # Both halves matter and fail differently: a missing directory stops the
    # mount, and one carrying no label -- what stage 1's rescue window would
    # have produced -- mounts and then denies the service that reads it.
    #
    # selinux_context is a [user, role, type, range] list, so membership is an
    # exact match on the type field. The default() guards are not decoration:
    # fail_msg is templated during argument finalisation, before any `that:`
    # runs, so an absent key there fails the task with a Jinja error instead of
    # the message it exists to print.
    - name: Refuse a snapshot whose NFS mount points are missing or unlabelled
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.isdir
          - "'default_t' in (item.stat.selinux_context | default([]))"
        fail_msg: >-
          {{ item.item }} is missing, or carries
          {{ item.stat.selinux_context | default('no SELinux label') }} rather
          than default_t.
        success_msg: "{{ item.item }} present and labelled."
      loop: "{{ microos_nfs_stat.results }}"
      loop_control:
        label: "{{ item.item }}"

    # The import is the assertion: both packages resolve through a Provides, so
    # only running the thing the module runs says the binding is really there.
    # An ImportError names whichever of the two is missing.
    - name: Confirm the python bindings the fleet's modules import are usable
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - import firewall, selinux
      changed_when: false

    # Ignition runs in the initrd, which mounts only the x-initrd.mount fstab
    # entries; without this a first-boot write under /home lands on the
    # read-only snapshot and takes the whole config down with it. The worked
    # example is in packer/README.md.
    #
    # A lookahead rather than a changed-guard, so an image that one day ships
    # the option itself does not fail the build. The readback after the final
    # reboot is the guard, and it catches a regexp that matched nothing equally
    # well.
    - name: Mount /home from the initrd, where Ignition writes
      ansible.builtin.replace:
        path: /etc/fstab
        regexp: '^(\S+\s+/home\s+btrfs\s+(?!.*x-initrd\.mount)\S+)'
        replace: '\1,x-initrd.mount'

    # Ignition generated the machine id and the host keys at stage 1's first
    # boot, into the image's first snapshot, and every transactional-update
    # since branched a new snapshot off it -- so the strip below, which reaches
    # only the booted snapshot, leaves the build server's private host keys in
    # that snapshot's predecessors, one `transactional-update rollback` away
    # from being served by every host built from the image. A freshly built
    # image has no rollback history worth keeping, so the predecessors go.
    #
    # snapper refuses to delete snapshot 0, the mounted snapshot and the btrfs
    # default subvolume, so the filter below is what stops the delete erroring,
    # not what keeps the booted snapshot alive.
    - name: List the snapshots the build has accumulated
      ansible.builtin.command:
        argv:
          - snapper
          - --machine-readable
          - csv
          - --no-headers
          - list
          - --columns
          - number,default,active
      changed_when: false
      register: microos_snapshots

    - name: Delete every snapshot but the booted one
      ansible.builtin.command:
        argv:
          - snapper
          - delete
          - --sync
          - "{{ item.split(',') | first }}"
      loop: "{{ microos_snapshots.stdout_lines | select('match', '[1-9][0-9]*,no,no$') }}"
      changed_when: true

    # Deleting the snapshot Ignition first booted into is the one step here that
    # could plausibly cost the image its bootability, and packer powers the
    # server off rather than rebooting it, so the build would never find out.
    # Cheap to prove: a reboot creates no snapshot, and the identity it
    # regenerates is stripped below anyway.
    - name: Reboot to prove the pruned snapshot tree still boots
      ansible.builtin.reboot:
        reboot_timeout: 600

    # Read back from the fstab as the kernel's own parser sees it, after a
    # reboot -- so a malformed edit that still contains the string cannot pass.
    # Deliberately not `systemctl show home.mount -p Options`: that reports the
    # options the filesystem is *mounted* with, which on a booted MicroOS does
    # carry x-initrd.mount, but only because the initrd honoured it -- circular,
    # where the fstab read is direct.
    - name: Confirm /home carries the initrd mount option
      ansible.builtin.command:
        argv:
          - findmnt
          - --fstab
          - --noheadings
          - --output
          - OPTIONS
          - /home
      register: microos_home_mount
      changed_when: false
      failed_when: "'x-initrd.mount' not in microos_home_mount.stdout"

    # Everything below strips the machine's identity and must stay LAST, after
    # the reboot above: a reboot regenerates the machine id and the host keys,
    # so clearing them any earlier bakes one identity into every server built
    # from this snapshot. There is no cloud-init state to clear on this variant.
    #
    # /var/lib/systemd/random-seed is deliberately not among these: the builder
    # shuts the server down gracefully before snapshotting, and
    # systemd-random-seed.service's ExecStop rewrites the file on the way out,
    # so removing it here would be theatre. The kernel credits no entropy from a
    # seed file, so a shared one does not make the RNG predictable.

    # Removed, not emptied. The gate that runs Ignition is openSUSE's initrd
    # firstboot-detect, which fires only when the file is absent, carries
    # systemd's not-yet-set marker word, or a firstboot karg is set -- an empty
    # file satisfies none of those, so emptying it would leave a snapshot with
    # no users and no keys, and nothing here would have said so.
    - name: Remove the machine id
      ansible.builtin.file:
        path: /etc/machine-id
        state: absent

    - name: Find the SSH host keys
      ansible.builtin.find:
        paths: /etc/ssh
        patterns: ssh_host_*
      register: microos_host_keys

    - name: Remove the SSH host keys
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ microos_host_keys.files }}"
      loop_control:
        label: "{{ item.path }}"

    # The build's own journal, which the two strips above do not reach: it lives
    # on /var, a separate subvolume, so it is outside both the snapshot prune and
    # the readback below -- and it is keyed by a machine id the image otherwise
    # keeps no trace of, so nothing named it. 8 MB of this build ships without
    # this: the kernel command line, the build server's reverse-DNS name, and
    # sshd's accepted-key records for the throwaway build key.
    #
    # The directory itself stays. journald's Storage=auto keeps a persistent
    # journal only where /var/log/journal exists, so removing it would quietly
    # send every host built from this image to a volatile /run journal instead.
    #
    # What this guarantees is that the build's log *history* does not ship, not
    # that the directory is empty in the snapshot: journald goes on logging until
    # the builder powers the server off, and re-creates its own directory to do
    # it. Nothing running inside the box can assert on the state after its own
    # shutdown.
    - name: Find the build's journal
      ansible.builtin.find:
        paths: /var/log/journal
        file_type: directory
      register: microos_journal

    - name: Remove the build's journal
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ microos_journal.files }}"
      loop_control:
        label: "{{ item.path }}"

    # A readback rather than a comment: it is what makes the "must stay LAST"
    # ordering above enforceable. It walks the whole of /.snapshots rather than
    # taking the prune on trust -- what has to hold of the image is that no copy
    # of the identity survives anywhere in the btrfs tree, and only a read of
    # the tree says so. /etc is walked as well, so the readback still covers the
    # booted snapshot if /.snapshots ever stops exposing it.
    - name: Read back the stripped identity
      ansible.builtin.find:
        paths:
          - /etc
          - /.snapshots
        patterns: machine-id,ssh_host_*
        recurse: true
      register: microos_identity_left

    - name: Read back the emptied journal
      ansible.builtin.find:
        paths: /var/log/journal
        file_type: directory
      register: microos_journal_left

    - name: Refuse a snapshot that still carries a machine identity
      ansible.builtin.assert:
        that:
          - microos_identity_left.files | length == 0
          - microos_journal_left.files | length == 0
        fail_msg: >-
          The snapshot still carries
          {{ (microos_identity_left.files + microos_journal_left.files)
             | map(attribute='path') | join(', ') }};
          every server built from it would ship that identity or its logs.
        success_msg: Machine id, host keys and the build's journal absent.

    # Genuinely last: this is the key the play's own SSH connection authenticated
    # with, so nothing may run after it. Safe today because the ControlPersist
    # master is already open and the hcloud builder powers off through the API
    # rather than over SSH -- but a task added below would depend on both.
    #
    # Ignition wrote it at stage 1's first boot, and rogue-trader's production
    # config declares only the ansible user, so nothing later removes it: without
    # this the snapshot ships root-authorised for a key thrown away with the build.
    - name: Remove the build identity's authorised keys
      ansible.builtin.file:
        path: /root/.ssh
        state: absent
